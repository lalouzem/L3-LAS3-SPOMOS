@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F172A;--card:#1E293B;--ink:#F1F5F9;--muted:#94A3B8;--line:#334155;--pri:#60A5FA;--pri-soft:#1E3A8A;--on-pri:#0F172A;--ok:#4ADE80;--bar:#334155;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F172A;--card:#1E293B;--ink:#F1F5F9;--muted:#94A3B8;--line:#334155;--pri:#60A5FA;--pri-soft:#1E3A8A;--on-pri:#0F172A;--ok:#4ADE80;--bar:#334155;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--la);-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.45rem;margin:6px 0 4px}
.lead{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.tot{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.tot div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;flex:1;min-width:90px}
.tot b{display:block;font-size:1.25rem;color:var(--pri)}
.tot span{font-size:.78rem;color:var(--muted)}
.grid{display:grid;gap:12px}
.card{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:inherit}
.card:active{transform:scale(.99)}
.em{font-size:2rem;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--pri-soft);border-radius:14px;flex:none}
.bd{flex:1;min-width:0}
.bd h2{font-size:1.02rem;margin:0 0 2px}
.bd p{margin:0 0 8px;font-size:.82rem;color:var(--muted)}
.bar{height:7px;background:var(--bar);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.mt{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-top:5px}
.go{background:var(--pri);color:var(--on-pri);font-weight:700;border-radius:10px;padding:9px 12px;font-size:.85rem;flex:none}
.foot{margin-top:22px;font-size:.8rem;color:var(--muted);text-align:center}

.lockc{display:block;background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:14px}
.lockh{display:flex;gap:14px;align-items:center}
.lockh .cm{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}
.codeform{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.code{min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:600 16px/1.2 var(--la);letter-spacing:.12em;text-transform:uppercase;width:12em;max-width:100%}
.code::placeholder{letter-spacing:normal;text-transform:none;font-weight:400;color:var(--muted)}
.vbtn{min-height:44px;padding:8px 18px;border:0;border-radius:999px;background:var(--pri);color:var(--on-pri);font:700 15px var(--la)}
.cerr{margin:8px 0 0;color:#B5473C;font-size:.85rem;min-height:1.1em}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:4px}</style>
</head>
<body>

<div class="grid" id="grid"></div>
<p class="foot">Objectif affiché : 80 % de bonnes réponses par unité (16/20).<br><button class="reset" id="relock">Verrouiller de nouveau les matières</button></p>
</div>
