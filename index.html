<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#1E40AF">
<title>Révisions L3 SPMOS</title>
<style>
:root{--paper:#F5F7FA;--card:#FFFFFF;--ink:#1E293B;--muted:#64748B;--line:#E2E8F0;--pri:#1E40AF;--pri-soft:#EFF6FF;--on-pri:#FFFFFF;--ok:#15803D;--bar:#CBD5E1;
--la:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F172A;--card:#1E293B;--ink:#F1F5F9;--muted:#94A3B8;--line:#334155;--pri:#60A5FA;--pri-soft:#1E3A8A;--on-pri:#0F172A;--ok:#4ADE80;--bar:#334155;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F172A;--card:#1E293B;--ink:#F1F5F9;--muted:#94A3B8;--line:#334155;--pri:#60A5FA;--pri-soft:#1E3A8A;--on-pri:#0F172A;--ok:#4ADE80;--bar:#334155;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--la);-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.45rem;margin:6px 0 4px}
.lead{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.tot{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.tot div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;flex:1;min-width:90px}
.tot b{display:block;font-size:1.25rem;color:var(--pri)}
.tot span{font-size:.78rem;color:var(--muted)}
.grid{display:grid;gap:12px}
.card{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:inherit}
.card:active{transform:scale(.99)}
.em{font-size:2rem;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--pri-soft);border-radius:14px;flex:none}
.bd{flex:1;min-width:0}
.bd h2{font-size:1.02rem;margin:0 0 2px}
.bd p{margin:0 0 8px;font-size:.82rem;color:var(--muted)}
.bar{height:7px;background:var(--bar);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.mt{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-top:5px}
.go{background:var(--pri);color:var(--on-pri);font-weight:700;border-radius:10px;padding:9px 12px;font-size:.85rem;flex:none}
.foot{margin-top:22px;font-size:.8rem;color:var(--muted);text-align:center}

.backup{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.backup button{font:inherit;font-size:.9rem;font-weight:700;color:var(--pri);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
#backup-status{color:var(--muted);font-size:.85rem;margin:0 0 12px}
#backup-status:empty{margin:0}
</style>
</head>
<body>
<div class="wrap">
<h1>Révisions L3 SPMOS</h1>
<p class="lead">8 matières. Fiches courtes + 20 questions par unité, correction immédiate, examen de chapitre. Ta progression est enregistrée sur cet appareil.</p>
<div class="tot" id="tot"></div>
<div class="backup">
  <button type="button" id="export-progress">Exporter mes réponses</button>
  <button type="button" id="import-progress">Importer mes réponses</button>
  <input type="file" id="backup-file" accept=".json,application/json" hidden>
</div>
<p id="backup-status" role="status"></p>
<div class="grid" id="grid"></div>
<p class="foot">Objectif affiché : 80 % de bonnes réponses par unité (16/20).</p>
</div>
<script>
(function(){
"use strict";
var C=[{"file": "grh.html", "key": "grh", "title": "GRH et management d’équipe", "sub": "M. Mananga · Droit du travail appliqué au management des ressources humaines", "emoji": "👥", "units": 23, "q": 460, "ids": ["1.1", "1.2", "1.3", "1.4", "2.1", "2.2", "2.3", "2.4", "3.1", "3.2", "4.1", "4.2", "4.3", "4.4", "5.1", "5.2", "5.3", "6.1", "6.2", "6.3", "7.1", "7.2", "7.3"]}, {"file": "ergonomie.html", "key": "ergonomie", "title": "Les bases de l’ergonomie", "sub": "Chantal Lebert et Christelle Lemaitre · Sessions 1 et 2", "emoji": "🪑", "units": 59, "q": 1180, "ids": ["1.1", "1.2", "1.3", "1.4", "1.5", "2.1", "2.2", "2.3", "3.1", "3.2", "3.3", "4.1", "4.2", "4.3", "4.4", "4.5", "4.6", "4.7", "4.8", "4.9", "4.10", "4.11", "4.12", "4.13", "4.14", "4.15", "6.1", "6.2", "6.3", "6.4", "6.5", "6.6", "6.7", "6.8", "6.9", "6.10", "6.11", "7.1", "7.2", "7.3", "7.4", "7.5", "8.1", "8.2", "8.3", "8.4", "8.5", "8.6", "9.1", "9.2", "9.3", "9.4", "9.5", "9.6", "9.7", "9.8", "9.9", "9.10", "9.11"]}, {"file": "ethique.html", "key": "ethique", "title": "Éthique et déontologie", "sub": "Cours 1 et 2 · de la réflexion éthique à la déontologie", "emoji": "⚖️", "units": 41, "q": 820, "ids": ["1.1", "1.2", "1.3", "2.1", "2.2", "2.3", "2.4", "2.5", "2.6", "2.7", "2.8", "3.1", "3.2", "3.3", "3.4", "3.5", "4.1", "4.2", "4.3", "4.4", "4.5", "4.6", "4.7", "4.8", "4.9", "5.1", "5.2", "5.3", "5.4", "5.5", "5.6", "5.7", "5.8", "6.1", "6.2", "6.3", "6.4", "6.5", "6.6", "6.7", "6.8"]}, {"file": "schemas.html", "key": "schemas", "title": "Schémas régionaux de santé", "sub": "Planification sanitaire · ARS, SROS, PRS, accès aux soins", "emoji": "🗺️", "units": 48, "q": 960, "ids": ["1.1", "1.2", "1.3", "1.4", "1.5", "1.6", "2.1", "2.2", "2.3", "2.4", "2.5", "2.6", "2.7", "3.1", "3.2", "3.3", "3.4", "4.1", "4.2", "4.3", "4.4", "4.5", "4.6", "4.7", "4.8", "4.9", "5.1", "5.2", "5.3", "5.4", "5.5", "5.6", "6.1", "6.2", "6.3", "6.4", "7.1", "7.2", "7.3", "8.1", "8.2", "8.3", "8.4", "8.5", "9.1", "9.2", "9.3", "9.4"]}, {"file": "qualite.html", "key": "qualite", "title": "Évaluation de la qualité", "sub": "Services à la personne · ESSMS, processus, référentiel HAS", "emoji": "✅", "units": 50, "q": 1000, "ids": ["1.1", "1.2", "1.3", "1.4", "1.5", "1.6", "2.1", "2.2", "2.3", "2.4", "3.1", "3.2", "3.3", "3.4", "3.5", "3.6", "3.7", "3.8", "4.1", "4.2", "4.3", "4.4", "4.5", "4.6", "4.7", "4.8", "4.9", "5.1", "5.2", "5.3", "5.4", "5.5", "5.6", "5.7", "5.8", "5.9", "6.1", "6.2", "6.3", "6.4", "6.5", "6.6", "6.7", "6.8", "6.9", "7.1", "7.2", "7.3", "7.4", "7.5"]}, {"file": "marketing.html", "key": "marketing", "title": "Marketing social", "sub": "Comportements de santé et marketing social · Cours 1", "emoji": "📣", "units": 19, "q": 380, "ids": ["1.1", "1.2", "2.1", "2.2", "2.3", "2.4", "2.5", "2.6", "2.7", "2.8", "2.9", "2.10", "2.11", "3.1", "3.2", "3.3", "3.4", "3.5", "3.6"]}, {"file": "data.html", "key": "data", "title": "La donnée au quotidien", "sub": "Introduction à la Data Science et aux données de santé · Cours 1 à 5", "emoji": "📊", "units": 133, "q": 2660, "ids": ["1.1", "1.2", "1.3", "1.4", "1.5", "1.6", "2.1", "2.2", "2.3", "2.4", "2.5", "2.6", "2.7", "3.1", "3.2", "3.3", "3.4", "3.5", "3.6", "3.7", "3.8", "3.9", "3.10", "4.1", "4.2", "4.3", "4.4", "4.5", "4.6", "4.7", "5.1", "5.2", "5.3", "5.4", "5.5", "5.6", "6.1", "6.2", "6.3", "6.4", "6.5", "6.6", "6.7", "7.1", "7.2", "7.3", "7.4", "8.1", "8.2", "8.3", "8.4", "8.5", "8.6", "8.7", "8.8", "9.1", "9.2", "9.3", "9.4", "9.5", "9.6", "9.7", "10.1", "10.2", "10.3", "10.4", "10.5", "10.6", "10.7", "10.8", "10.9", "10.10", "11.1", "11.2", "11.3", "11.4", "11.5", "11.6", "12.1", "12.2", "12.3", "12.4", "12.5", "12.6", "12.7", "12.8", "13.1", "13.2", "13.3", "13.4", "13.5", "13.6", "14.1", "14.2", "14.3", "14.4", "14.5", "14.6", "14.7", "14.8", "14.9", "14.10", "14.11", "14.12", "15.1", "15.2", "15.3", "16.1", "17.1", "17.2", "17.3", "17.4", "17.5", "17.6", "17.7", "18.1", "18.2", "18.3", "18.4", "18.5", "18.6", "18.7", "18.8", "18.9", "19.1", "20.1", "20.2", "20.3", "20.4", "20.5", "20.6", "20.7", "20.8"]}, {"file": "regime.html", "key": "regime", "title": "Régime juridique des structures", "sub": "Création, croissance, consolidation, difficultés et fin · sociétés et associations", "emoji": "⚖️", "units": 71, "q": 1420, "ids": ["1.1", "1.2", "1.3", "1.4", "1.5", "1.6", "1.7", "1.8", "2.1", "2.2", "2.3", "2.4", "2.5", "2.6", "2.7", "2.8", "2.9", "2.10", "3.1", "3.2", "3.3", "3.4", "3.5", "3.6", "3.7", "3.8", "3.9", "4.1", "4.2", "4.3", "4.4", "4.5", "4.6", "4.7", "4.8", "4.9", "4.10", "4.11", "4.12", "5.1", "5.2", "5.3", "5.4", "5.5", "5.6", "5.7", "5.8", "5.9", "5.10", "6.1", "6.2", "6.3", "6.4", "6.5", "6.6", "7.1", "7.2", "7.3", "7.4", "7.5", "8.1", "8.2", "8.3", "8.4", "8.5", "8.6", "8.7", "8.8", "8.9", "8.10", "8.11"]}];
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
function renderProgress(){
var tu=0,tq=0,tw=0,html="";
C.forEach(function(m){
  var S={u:{}};
  try{var v=JSON.parse(localStorage.getItem("l3-"+m.key+"-v2")||"null"); if(v&&v.u) S=v;}catch(e){}
  var worked=m.ids.filter(function(id){return S.u[id]!=null;}).length;
  var done=m.ids.filter(function(id){return S.u[id]!=null&&S.u[id]>=16;}).length;
  tu+=m.units; tq+=m.q; tw+=worked;
  var pct=m.units?Math.round(100*worked/m.units):0;
  html+='<a class="card" href="'+esc(m.file)+'"><div class="em">'+m.emoji+'</div><div class="bd"><h2>'+esc(m.title)+'</h2><p>'+esc(m.sub)+'</p><div class="bar"><i style="width:'+pct+'%"></i></div><div class="mt"><span>'+worked+'/'+m.units+' unités travaillées</span><span>'+done+' à 80 %+</span></div></div><div class="go">Ouvrir</div></a>';
});
document.getElementById("grid").innerHTML=html;
document.getElementById("tot").innerHTML='<div><b>'+C.length+'</b><span>matières</span></div><div><b>'+tu+'</b><span>unités</span></div><div><b>'+tq+'</b><span>questions</span></div><div><b>'+tw+'/'+tu+'</b><span>travaillées</span></div>';
}
renderProgress();

const storageKeys = C.map(m => "l3-" + m.key + "-v2");
const backupFile = document.getElementById("backup-file");
const status = document.getElementById("backup-status");
const isRecord = value => value !== null && typeof value === "object" && !Array.isArray(value);
const validScores = scores => isRecord(scores) && Object.entries(scores).every(
  ([key, score]) => !["__proto__", "constructor", "prototype"].includes(key) &&
    Number.isSafeInteger(score) && score >= 0
);
const validProgress = progress => isRecord(progress) && validScores(progress.u) &&
  (progress.c === undefined || validScores(progress.c));

function mergeScores(current, incoming) {
  const scores = {...current};
  for (const [key, score] of Object.entries(incoming || {})) {
    scores[key] = Math.max(Object.hasOwn(scores, key) ? scores[key] : 0, score);
  }
  return scores;
}

document.getElementById("export-progress").addEventListener("click", () => {
  try {
    const progress = {};
    for (const key of storageKeys) {
      const saved = localStorage.getItem(key);
      if (saved !== null) progress[key] = JSON.parse(saved);
    }
    const blob = new Blob([JSON.stringify({format:"revisions-l3", version:1, progress}, null, 2)],
      {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "revisions-l3-sauvegarde-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    status.textContent = "Sauvegarde prête à transférer.";
  } catch {
    status.textContent = "Impossible d’exporter la progression.";
  }
});

document.getElementById("import-progress").addEventListener("click", () => backupFile.click());
backupFile.addEventListener("change", async () => {
  const file = backupFile.files[0];
  backupFile.value = "";
  if (!file) return;

  let progress;
  try {
    const backup = JSON.parse(await file.text());
    if (backup?.format !== "revisions-l3" || backup.version !== 1 || !isRecord(backup.progress) ||
      !Object.values(backup.progress).every(validProgress)) throw new Error();
    progress = backup.progress;
  } catch {
    status.textContent = "Ce fichier n’est pas une sauvegarde valide de Révisions L3.";
    return;
  }

  const written = [];
  try {
    const changes = storageKeys.filter(key => Object.hasOwn(progress, key)).map(key => {
      const previous = localStorage.getItem(key);
      const current = JSON.parse(previous) || {};
      const incoming = progress[key];
      return [key, previous, JSON.stringify({
        ...current,
        u: mergeScores(current.u, incoming.u),
        c: mergeScores(current.c, incoming.c)
      })];
    });
    for (const [key, previous, next] of changes) {
      localStorage.setItem(key, next);
      written.push([key, previous]);
    }
    renderProgress();
    status.textContent = changes.length
      ? "Progression importée. Les meilleurs scores ont été conservés."
      : "Cette sauvegarde ne contient aucune progression pour les matières affichées.";
  } catch {
    for (const [key, previous] of written.reverse()) {
      if (previous === null) localStorage.removeItem(key);
      else localStorage.setItem(key, previous);
    }
    status.textContent = "Impossible d’enregistrer la progression importée.";
  }
});

if("serviceWorker" in navigator&&location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").catch(function(){});}
})();
</script>
</body>
</html>
