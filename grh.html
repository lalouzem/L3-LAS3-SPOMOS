 vient pas réellement travailler."], ["qcm", "Le salaire est…", ["La contrepartie du travail effectué", "Un cadeau de l’employeur", "Une indemnité de l’État"], "Précisé à l’oral."], ["qcm", "Avec le salaire, quelles charges sont dues ?", ["Charges salariales et charges patronales", "Aucune", "Uniquement la TVA"], "Précisé à l’oral."], ["vf", "Vrai ou faux ? Un emploi fictif remplit la condition de prestation de travail.", ["Faux", "Vrai"], "Faux : il n’y a pas de travail réellement effectué."], ["trou", "Complète : la prestation de travail est faite pour ______.", ["autrui", "soi-même", "l’État"], "Prestation de travail pour autrui."], ["cas", "Cas pratique : un bénévole aide chaque samedi une association, sans être payé. Contrat de travail ?", ["Non : pas de rémunération", "Oui, car il travaille", "Oui, s’il reçoit des ordres"], "La rémunération manque."], ["cas", "Cas pratique : une personne est payée par une mairie mais ne vient jamais travailler. Qu’en dire ?", ["C’est un emploi fictif : pas de prestation de travail", "C’est un CDI normal", "C’est du bénévolat"], "L’enseignant évoque les affaires d’emplois fictifs."], ["qcm", "Que fournit la personne qui effectue une prestation de travail ?", ["Le travail demandé et les résultats attendus", "Seulement sa présence", "Seulement un diplôme"], "Précisé à l’oral."], ["vf", "Vrai ou faux ? Le lien de subordination s’apprécie en fonction de plusieurs éléments.", ["Vrai", "Faux"], "Vrai : direction et contrôle, horaires, intégration dans une organisation."], ["qcm", "Quel élément manque si la personne travaille et est payée, mais sans recevoir aucun ordre ?", ["Le lien de subordination", "La rémunération", "La prestation"], "Sans subordination, pas de contrat de travail."], ["qcm", "Combien d’éléments doivent être réunis pour un contrat de travail ?", ["Les 3", "Un seul", "Deux sur trois"], "Les trois éléments sont nécessaires."], ["vf", "Vrai ou faux ? La rémunération doit être versée avec les charges sociales correspondantes.", ["Vrai", "Faux"], "Vrai : charges salariales et patronales."], ["cas", "Cas pratique : en examen, « Quels sont les éléments du contrat de travail ? ». Réponse attendue ?", ["Prestation de travail, rémunération, lien de subordination juridique", "CDI, temps plein, écrit", "Offre, promesse, acceptation"], "Question de cours typique."], ["trou", "Complète : le lien de subordination ______ est le critère déterminant.", ["juridique", "économique", "familial"], "Lien de subordination juridique."], ["qcm", "La personne embauchée doit…", ["Venir réellement travailler et faire le travail demandé", "Seulement signer le contrat", "Seulement être disponible"], "C’est la prestation de travail."], ["vf", "Vrai ou faux ? Le salaire est la contrepartie du travail effectué.", ["Vrai", "Faux"], "Vrai."]]}, {"id": "5.3", "title": "Le lien de subordination juridique", "fiche": [["def", "**Lien de subordination** : le pouvoir de l’employeur de donner des directives, et l’obligation du salarié de les exécuter."], ["t", [["Élément d’appréciation", "Signification"], ["Direction et contrôle", "Obéissance aux directives"], ["Détermination des horaires", "C’est l’employeur qui les fixe"], ["Intégration dans une organisation", "Pas de choix pour le salarié"]]], ["warn", "Les ordres doivent être **légaux** et **en lien avec le contrat** : sinon, le salarié peut refuser (ex. repeindre la maison du directeur)."]], "qs": [["qcm", "Qu’est-ce que le lien de subordination ?", ["Le pouvoir de l’employeur de donner des directives et l’obligation du salarié de les exécuter", "L’obligation de payer le salaire", "Le droit de grève"], "Définition donnée à l’oral."], ["qcm", "Quels éléments permettent d’apprécier le lien de subordination ?", ["Direction et contrôle, horaires fixés par l’employeur, intégration dans une organisation", "Diplôme, âge, salaire", "Contrat écrit, CDI, période d’essai"], "Les trois éléments d’appréciation."], ["qcm", "Qui fixe les horaires dans le cadre du lien de subordination ?", ["L’employeur", "Le salarié", "Le CSE"], "C’est un indice de subordination."], ["vf", "Vrai ou faux ? Le salarié doit exécuter tous les ordres de l’employeur, même illégaux.", ["Faux", "Vrai"], "Faux : les ordres doivent être légaux et liés au contrat."], ["cas", "Cas pratique : le directeur demande aux agents d’entretien de repeindre sa maison le week-end. Peuvent-ils refuser ?", ["Oui : l’ordre est sans lien avec leur contrat", "Non : ils doivent obéir", "Seulement s’ils sont fatigués"], "Exemple de l’enseignant : ce n’est pas leur travail."], ["cas", "Cas pratique : un directeur fait venir des salariés à Roissy pour porter ses bagages pendant leur temps de travail. Qu’en dire ?", ["Ordre sans lien avec leur contrat : ils peuvent refuser", "C’est normal", "C’est une prestation de travail classique"], "Les directives doivent être en lien avec le travail."], ["qcm", "À quelles conditions l’employeur peut-il donner un ordre ?", ["Il doit être légal et en lien avec le contrat de travail", "Il doit être écrit", "Il doit être validé par le CSE"], "Conclusion de l’enseignant."], ["vf", "Vrai ou faux ? Le lien de subordination est le critère déterminant du contrat de travail.", ["Vrai", "Faux"], "Vrai."], ["qcm", "« Intégration dans une organisation » signifie…", ["Le salarié n’a pas le choix de l’organisation dans laquelle il travaille", "Le salarié choisit ses collègues", "Le salarié dirige l’équipe"], "Il s’intègre à une communauté de salariés."], ["trou", "Complète : direction et ______ : obéissance aux directives.", ["contrôle", "rémunération", "formation"], "Premier élément d’appréciation."], ["cas", "Cas pratique : un salarié refuse de fausser des factures sur ordre de son chef. A-t-il raison ?", ["Oui : un ordre illégal peut être refusé", "Non : il doit obéir", "Seulement avec l’accord du CSE"], "Les directives doivent être légales."], ["qcm", "Quel adjectif accompagne « lien de subordination » dans le cours ?", ["Juridique", "Économique", "Moral"], "Lien de subordination juridique."], ["vf", "Vrai ou faux ? Un prestataire qui fixe librement ses horaires et ne reçoit aucun ordre est en subordination.", ["Faux", "Vrai"], "Faux : les indices de subordination manquent."], ["qcm", "Pourquoi les salariés de l’exemple s’exécutaient-ils ?", ["« Monsieur le directeur me l’a demandé »", "Ils étaient payés double", "Le CSE l’imposait"], "Ils confondaient pouvoir de direction et ordres personnels."], ["cas", "Cas pratique : l’employeur impose un horaire de 9 h à 17 h. Qu’est-ce que cela illustre ?", ["Un indice du lien de subordination", "Une faute de l’employeur", "Une clause illégale"], "La fixation des horaires par l’employeur est un indice."], ["qcm", "Que doit faire le directeur s’il veut repeindre sa maison ?", ["Faire appel à une entreprise", "Demander aux salariés", "Demander au CSE"], "Réponse de l’enseignant."], ["vf", "Vrai ou faux ? Les directives doivent être en lien avec le travail et le contrat.", ["Vrai", "Faux"], "Vrai."], ["qcm", "Combien d’éléments d’appréciation du lien de subordination le cours cite-t-il ?", ["3", "1", "5"], "Direction et contrôle, horaires, intégration."], ["cas", "Cas pratique : en examen, un salarié demande s’il doit accepter une tâche personnelle demandée par son patron. Que répondre ?", ["Il peut refuser : l’ordre doit être lié au contrat et légal", "Il doit accepter", "Il doit démissionner"], "Format mini cas pratique de l’examen."], ["qcm", "Que se passe-t-il si une directive est illégale ?", ["Le salarié est en droit de refuser de l’exécuter", "Le salarié est licencié s’il refuse", "Le contrat est annulé"], "C’est la limite du pouvoir de direction."]]}]}]}, {"n": 2, "title": "Cours n° 2 : les pouvoirs du chef d’entreprise", "chapitres": [{"n": 6, "title": "Les pouvoirs du chef d’entreprise", "unites": [{"id": "6.1", "title": "Introduction : les trois pouvoirs", "fiche": [["def", "Le pouvoir de l’employeur est affirmé par l’**arrêt Brinon** (Cass. soc., 31 mai 1956) ; il repose sur le **droit de propriété** et la **liberté d’entreprendre**."], ["t", [["Pouvoir", "Contenu"], ["Direction", "Gérer l’entreprise « en bon père de famille » (aujourd’hui « raisonnablement »)"], ["Réglementaire (normatif)", "Édicter des règles internes : règlement intérieur, notes de service"], ["Disciplinaire", "Sanctionner un agissement jugé fautif"]]], ["warn", "Ces pouvoirs s’exercent toujours dans le respect des droits fondamentaux et des libertés des salariés."]], "qs": [["qcm", "Quels sont les trois pouvoirs du chef d’entreprise ?", ["Direction, réglementaire (normatif), disciplinaire", "Législatif, exécutif, judiciaire", "Recrutement, formation, licenciement"], "Ce sont les trois pouvoirs vus en cours n° 2."], ["qcm", "Quel arrêt affirme le pouvoir de l’employeur ?", ["L’arrêt Brinon (1956)", "L’arrêt du 21 septembre 2017", "L’arrêt du 11 septembre 2019"], "Cass. soc., 31 mai 1956 : l’employeur est seul juge des décisions de gestion."], ["qcm", "Sur quoi repose le pouvoir de l’employeur ?", ["Le droit de propriété et la liberté d’entreprendre", "Le vote des salariés", "L’avis du CSE"], "Fondements donnés dans le cours."], ["qcm", "Que recouvre le pouvoir de direction ?", ["La gestion de l’entreprise", "Les sanctions", "Le règlement intérieur"], "Gérer l’entreprise « comme un bon père de famille »."], ["qcm", "Le pouvoir réglementaire (normatif) permet…", ["D’édicter des règles internes (règlement intérieur, notes de service)", "De sanctionner un salarié", "De fixer les impôts"], "Pour de bonnes relations entre salariés et entreprise."], ["qcm", "Le pouvoir disciplinaire permet…", ["De prononcer des sanctions après un agissement jugé fautif", "De recruter", "D’écrire le règlement intérieur"], "C’est le troisième pouvoir."], ["vf", "Vrai ou faux ? Les pouvoirs de l’employeur s’exercent dans le respect des droits et libertés des salariés.", ["Vrai", "Faux"], "Vrai : c’est leur limite."], ["qcm", "Par quoi l’expression « en bon père de famille » a-t-elle été remplacée en 2014 ?", ["« Raisonnablement »", "« Équitablement »", "« Librement »"], "Modification du Code civil."], ["trou", "Complète : l’arrêt Brinon date de ______.", ["1956", "1981", "2016"], "31 mai 1956."], ["vf", "Vrai ou faux ? Selon l’arrêt Brinon, l’employeur est seul juge des décisions de gestion de son entreprise.", ["Vrai", "Faux"], "Vrai."], ["cas", "Cas pratique : un employeur réorganise les services de son EHPAD. Quel pouvoir exerce-t-il ?", ["Le pouvoir de direction", "Le pouvoir disciplinaire", "Le pouvoir réglementaire"], "Gérer l’organisation relève de la direction."], ["cas", "Cas pratique : un employeur rédige une note sur le port des équipements de sécurité. Quel pouvoir ?", ["Le pouvoir réglementaire (normatif)", "Le pouvoir de direction seul", "Le pouvoir disciplinaire"], "Les notes de service relèvent du pouvoir normatif."], ["cas", "Cas pratique : un employeur adresse un avertissement à un salarié souvent en retard. Quel pouvoir ?", ["Le pouvoir disciplinaire", "Le pouvoir de direction", "Le pouvoir réglementaire"], "Sanctionner relève du pouvoir disciplinaire."], ["qcm", "Pourquoi la gestion de l’entreprise nécessite-t-elle ces pouvoirs ?", ["Pour organiser les objectifs et faire respecter règles et contrôles", "Pour réduire les salaires", "Pour éviter les impôts"], "Introduction du cours."], ["vf", "Vrai ou faux ? Le règlement intérieur relève du pouvoir disciplinaire.", ["Faux", "Vrai"], "Faux : il relève du pouvoir réglementaire, même s’il fixe l’échelle des sanctions."], ["qcm", "Combien de pouvoirs le cours attribue-t-il au chef d’entreprise ?", ["3", "2", "4"], "Direction, réglementaire, disciplinaire."], ["qcm", "Quel autre nom pour le pouvoir réglementaire ?", ["Le pouvoir normatif", "Le pouvoir exécutif", "Le pouvoir de contrôle"], "Il crée des normes internes."], ["cas", "Cas pratique : un employeur interdit à ses salariés de se marier entre eux. Que dire ?", ["C’est contraire aux libertés des salariés", "C’est son pouvoir de direction", "C’est valable s’il l’écrit"], "Les pouvoirs ne peuvent pas porter atteinte aux libertés fondamentales."], ["trou", "Complète : le pouvoir de l’employeur repose sur le droit de ______ et la liberté d’entreprendre.", ["propriété", "grève", "réunion"], "Fondement du pouvoir patronal."], ["qcm", "Quelle juridiction a rendu l’arrêt Brinon ?", ["La Cour de cassation (chambre sociale)", "Le Conseil d’État", "Le conseil de prud’hommes"], "Cass. soc., 31 mai 1956."]]}, {"id": "6.2", "title": "Le pouvoir normatif : le règlement intérieur", "fiche": [["def", "**Règlement intérieur** : document écrit établi **unilatéralement** par l’employeur, **obligatoire dès 50 salariés** (loi Pacte 2019 ; 12 mois pour l’établir)."], ["t", [["Formalité", "Contenu"], ["Consultation", "Avis du CSE"], ["Contrôle", "2 exemplaires à l’inspection du travail"], ["Dépôt", "Greffe du conseil de prud’hommes"], ["Publicité", "Affichage sur les lieux de travail"], ["Entrée en vigueur", "1 mois après dépôt et publicité"]]], ["li", ["Contenu **exclusif** : santé-sécurité, discipline, nature et échelle des sanctions, participation au maintien de la sécurité.", "Rappelle les droits de la défense et les textes sur le harcèlement moral, sexuel et les agissements sexistes.", "Interdit : clauses contraires aux lois, discriminatoires, restrictions injustifiées des libertés."]], ["warn", "Laïcité : secteur public seulement. Dans le privé : **clause de neutralité**, justifiée et proportionnée."]], "qs": [["qcm", "Qui établit le règlement intérieur ?", ["L’employeur, unilatéralement", "Le CSE", "Les salariés par vote"], "Il est établi à l’initiative de l’employeur."], ["qcm", "À partir de quel effectif est-il obligatoire ?", ["50 salariés", "20 salariés", "11 salariés"], "Seuil relevé de 20 à 50 par la loi Pacte du 22 mai 2019."], ["qcm", "Combien de temps l’entreprise a-t-elle pour l’établir après avoir atteint le seuil ?", ["12 mois", "1 mois", "3 ans"], "12 mois après le franchissement du seuil."], ["qcm", "Qui donne son avis sur le règlement intérieur ?", ["Le CSE", "L’Urssaf", "Le médecin du travail"], "Il est soumis pour avis au CSE."], ["qcm", "En combien d’exemplaires est-il envoyé à l’inspection du travail ?", ["2", "1", "3"], "Contrôle administratif."], ["qcm", "Où est-il déposé ?", ["Au greffe du conseil de prud’hommes", "À la mairie", "À l’Urssaf"], "Formalité de dépôt."], ["qcm", "Quand entre-t-il en vigueur ?", ["1 mois après les formalités de dépôt et de publicité", "Immédiatement", "1 an après"], "Délai d’un mois."], ["vf", "Vrai ou faux ? Une modification du règlement intérieur suit les mêmes formalités.", ["Vrai", "Faux"], "Vrai."], ["qcm", "Que contient exclusivement le règlement intérieur ?", ["Santé-sécurité, discipline, échelle des sanctions, participation à la sécurité", "Les salaires et primes", "Les horaires de chaque salarié"], "Contenu limité par la loi (art. L.1321-1)."], ["qcm", "Quelle sanction figure dans l’échelle prévue au règlement intérieur ?", ["La mise à pied disciplinaire", "La retenue sur salaire", "L’amende"], "Les sanctions pécuniaires sont interdites."], ["vf", "Vrai ou faux ? Le règlement intérieur peut interdire le mariage entre salariés.", ["Faux", "Vrai"], "Faux : clause contraire aux libertés individuelles."], ["qcm", "Le principe de laïcité s’applique…", ["Dans le secteur public", "Dans toutes les entreprises privées", "Uniquement dans les associations"], "Dans le privé, on parle de clause de neutralité."], ["qcm", "Une clause de neutralité dans le privé doit être…", ["Justifiée et proportionnée", "Toujours interdite", "Imposée par la loi"], "Elle peut restreindre la manifestation des convictions sous conditions."], ["qcm", "Qui contrôle le règlement intérieur ?", ["L’inspecteur du travail et les juges (prud’hommes)", "Le CSE seul", "Personne"], "Deux contrôles possibles."], ["cas", "Cas pratique : un salarié conteste une sanction fondée sur une clause illégale du règlement intérieur. Que peut faire le conseil de prud’hommes ?", ["Écarter la clause contraire à la loi", "Rien, le règlement s’impose", "Modifier le règlement entier"], "Contrôle par les juges à l’occasion d’un litige."], ["qcm", "Que peut exiger l’inspecteur du travail ?", ["Le retrait ou la modification des clauses illégales, par décision motivée", "La fermeture de l’entreprise", "Le licenciement du directeur"], "Sa décision peut faire l’objet d’un recours."], ["qcm", "Les notes de service sur l’hygiène, la sécurité et la discipline…", ["Suivent les mêmes règles que le règlement intérieur", "Ne sont soumises à rien", "Doivent être votées par les salariés"], "Elles sont assimilées au règlement intérieur."], ["qcm", "En cas d’urgence pour la santé ou la sécurité, une note de service…", ["S’applique immédiatement, communiquée en même temps au CSE et à l’inspection", "Attend 1 mois", "Est interdite"], "Art. L.1321-5."], ["qcm", "Qu’est-ce que le règlement de fonctionnement ?", ["Le document qui règle les relations entre un établissement et ses usagers (loi 2002-2)", "Le règlement des salariés", "Les statuts d’une association"], "C’est un outil de la loi du 2 janvier 2002."], ["trou", "Complète : on parle de « l’assistance par un ______ » (et non « un collège ») dans les droits de la défense.", ["collègue", "avocat", "syndicat"], "Correction des notes : le salarié peut être assisté par un collègue."]]}, {"id": "6.3", "title": "Le pouvoir disciplinaire de l’employeur", "fiche": [["def", "**Sanction** (art. L.1331-1) : toute mesure, **autre qu’une observation verbale**, prise après un agissement jugé fautif, qui affecte ou non la présence, la carrière, la fonction ou la rémunération."], ["t", [["Sanction", "À retenir"], ["Avertissement", "Faute bien déterminée ; LRAR ou main propre"], ["Mutation, rétrogradation", "Le salarié peut refuser ; licenciement possible si la faute est justifiée"], ["Mise à pied disciplinaire", "Contrat suspendu, sans salaire ; durée fixée au règlement intérieur"], ["Mise à pied conservatoire", "PAS une sanction : écarte le salarié en attendant la décision"], ["Licenciement disciplinaire", "Faute simple, grave ou lourde"]]], ["li", ["Procédure : convocation (LRAR ou main propre, 5 jours ouvrables avant pour un licenciement) → entretien → notification motivée **2 jours ouvrables à 1 mois** après.", "**Prescription** : 2 mois après la connaissance des faits ; sanction de plus de 3 ans non invocable.", "Interdits : sanctions pécuniaires (3 750 € d’amende), discrimination, double sanction."]], ["warn", "Contrôle des salariés : pas d’atteinte à la vie privée. Mails professionnels présumés professionnels, sauf objet « personnel ». Courrier papier nominatif : jamais ouvert. Depuis le RGPD (2018), plus de déclaration à la CNIL : registre, information des salariés, consultation du CSE."]], "qs": [["qcm", "Qu’est-ce qu’une sanction disciplinaire ?", ["Toute mesure, autre qu’une observation verbale, prise après un agissement jugé fautif", "Toute remarque orale", "Uniquement le licenciement"], "Définition de l’art. L.1331-1."], ["vf", "Vrai ou faux ? La mise à pied conservatoire est une sanction.", ["Faux", "Vrai"], "Faux : elle écarte temporairement le salarié avant la décision."], ["qcm", "Pendant une mise à pied disciplinaire…", ["Le contrat est suspendu et le salarié n’est pas payé", "Le salarié est payé double", "Le contrat est rompu"], "Sa durée est prévue par le règlement intérieur."], ["qcm", "Le salarié peut-il refuser une mutation disciplinaire ?", ["Oui ; l’employeur peut alors le licencier si la faute est justifiée", "Non, jamais", "Oui, et il ne risque rien"], "Même règle pour la rétrogradation."], ["qcm", "Quelle sanction est interdite ?", ["La retenue sur salaire", "L’avertissement", "La mise à pied disciplinaire"], "Les sanctions pécuniaires sont interdites."], ["trou", "Complète : infliger une sanction pécuniaire est puni d’une amende de ______ €.", ["3 750", "45 000", "1 500"], "Sanction pénale de l’employeur."], ["vf", "Vrai ou faux ? Une même faute peu }
function pick(i){
  const c = cur, q = Q(c.list[c.idx]), ok = i === 0;
  app.querySelectorAll(".opt").forEach(b => { b.disabled = true; const k = +b.dataset.pick; if (k === 0) b.classList.add("ok"); else if (k === i) b.classList.add("ko"); });
  c.res.push({it:c.list[c.idx], ok, pick:i}); c.idx++;
  const last = c.idx >= c.list.length;
  $("fb").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}">${ok ? "Bonne réponse" : "Mauvaise réponse"}</div><div class="expl">${esc(q.e)}</div><div class="toolbar"><button class="btn solid" data-next>${last ? "Voir mon résultat" : "Question suivante"}</button></div>`;
}
let lastWrong = null;
function end(){
  const c = cur, n = c.res.length, ok = c.res.filter(r => r.ok).length, pct = Math.round(ok / n * 100);
  if (c.kind === "u" && !c.err) S.u[c.ref] = Math.max(S.u[c.ref] || 0, ok);
  if (c.kind === "c") S.c[c.ref] = Math.max(S.c[c.ref] || 0, ok);
  save();
  const wrong = c.res.filter(r => !r.ok); lastWrong = wrong.map(r => r.it);
  let nextU = null;
  if (c.kind === "u") { const i = UNITS.findIndex(U => U.id === c.ref); nextU = UNITS.slice(i + 1).find(ready); }
  setView("end", "Résultat");
  let h = `<div class="end"><p class="score">${ok}/${n}</p><p class="meta">${pct} % de bonnes réponses${pct >= 80 ? " : objectif atteint" : " : objectif 80 %"}</p>
<div class="toolbar">${wrong.length ? `<button class="btn solid" data-errs>Refaire mes ${wrong.length} erreur${wrong.length > 1 ? "s" : ""}</button>` : ""}<button class="btn" data-again>Recommencer</button>${nextU ? `<button class="btn" data-fiche="${esc(nextU.id)}">Unité suivante</button>` : ""}<button class="btn" data-home>Sommaire</button></div></div>`;
  if (wrong.length) {
    h += `<h2>Correction</h2>`;
    wrong.forEach(r => { const q = Q(r.it); h += `<div class="corr"><div class="qtxt">${esc(q.p)}</div><div class="cbad">Ta réponse : ${esc(q.o[r.pick])}</div><div class="cgood">Bonne réponse : ${esc(q.o[0])}</div><div class="expl">${esc(q.e)}</div></div>`; });
  }
  app.innerHTML = h;
  cur.done = true;
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.fiche) return fiche(uById(d.fiche));
  if (d.quiz) return quizUnit(uById(d.quiz));
  if (d.exam) return examChap(CHAPS.find(C => C.key === d.exam));
  if ("pick" in d) return pick(+d.pick);
  if ("next" in d) return renderQ();
  if ("errs" in d) { const k = cur.kind, r = cur.ref; start(k, r, shuffle(lastWrong)); cur.err = true; return; }
  if ("again" in d) { return cur.kind === "u" ? quizUnit(uById(cur.ref)) : examChap(CHAPS.find(C => C.key === cur.ref)); }
  if ("home" in d) return home();
  if ("reset" in d) {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirmer : tout effacer"; setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = "Effacer ma progression"; } }, 4000); return; }
    S = {u:{}, c:{}}; save(); return home();
  }
});
$("homeBtn").addEventListener("click", home);
home();
})();
</script>
</body>
</html>
