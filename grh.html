<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRH et management d’équipe — Révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Open+Sans:wght@400;600;700&display=swap">
<style>
:root{--paper:#F5F7FA;--card:#FFFFFF;--ink:#1E293B;--muted:#64748B;--line:#E2E8F0;--pri:#1E40AF;--pri-soft:#EFF6FF;--on-pri:#FFFFFF;
--acc:#D97706;--acc-soft:#FEF3C7;--ok:#15803D;--ok-soft:#DCFCE7;--ko:#B91C1C;--ko-soft:#FEE2E2;--def:#0B6E79;--def-bg:#E0F5F7;--eg:#2E7D32;
--la:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ti:"Comfortaa","Open Sans",system-ui,sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F172A;--card:#1E293B;--ink:#F1F5F9;--muted:#94A3B8;--line:#334155;--pri:#60A5FA;--pri-soft:#1E3A8A;--on-pri:#0F172A;--acc:#F59E0B;--acc-soft:#451A03;--ok:#4ADE80;--ok-soft:#14532D;--ko:#F87171;--ko-soft:#7F1D1D;--def:#7FE3EA;--def-bg:#123A40;--eg:#81C784;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F172A;--card:#1E293B;--ink:#F1F5F9;--muted:#94A3B8;--line:#334155;--pri:#60A5FA;--pri-soft:#1E3A8A;--on-pri:#0F172A;--acc:#F59E0B;--acc-soft:#451A03;--ok:#4ADE80;--ok-soft:#14532D;--ko:#F87171;--ko-soft:#7F1D1D;--def:#7FE3EA;--def-bg:#123A40;--eg:#81C784;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--la)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,.score{font-family:var(--ti)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.home{border:0;background:none;color:var(--pri);font-weight:700;padding:6px 0}
body[data-view="home"] .home{visibility:hidden}
.hint{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 64px}
h1{font-size:clamp(23px,5.5vw,30px);line-height:1.25;margin:4px 0 6px;color:var(--pri)}
.lead{color:var(--muted);margin:0 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--pri);background:transparent;color:var(--pri);font-weight:600;text-decoration:none}
.btn.solid{background:var(--pri);color:var(--on-pri)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px}
.btn.danger{border-color:var(--ko);color:var(--ko)}
.btn.danger.armed{background:var(--ko);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--ti);font-size:22px;color:var(--pri)}
.stat span{font-size:12px;color:var(--muted)}
.lesson{margin:22px 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.chap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.chap h2{font-size:17px;margin:0 0 4px}
.chapbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px}
.units{list-style:none;margin:0;padding:0}
.unit{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.uid{flex:none;min-width:38px;height:28px;padding:0 6px;border-radius:8px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:13px}
.unit.done .uid{background:var(--ok);color:var(--card)}
.unit.soon{opacity:.55}
.ub{flex:1;min-width:0}
.ut{font-weight:600;line-height:1.35}
.um{font-size:13px;color:var(--muted)}
.ua{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.meta{color:var(--muted);font-size:14px}
.fiche h2{font-size:20px;margin:0 0 10px}
.def{background:var(--def-bg);border-left:4px solid var(--def);border-radius:10px;padding:10px 12px;margin:10px 0}
.def::before{content:"À mémoriser";display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--def);margin-bottom:2px}
.eg{border-left:4px solid var(--eg);padding:6px 12px;margin:10px 0;color:var(--ink)}
.eg::before{content:"Exemple";display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--eg)}
.warn{background:var(--acc-soft);border-radius:10px;padding:8px 12px;margin:10px 0}
.fiche ul{margin:8px 0;padding-left:20px}.fiche li{margin:4px 0}
.tblw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--pri-soft);color:var(--pri)}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin:0 0 6px}
.lg{padding:2px 8px;border-radius:6px;font-weight:600}
.lg.d{background:var(--def-bg);color:var(--def)}.lg.e{border:1px solid var(--eg);color:var(--eg)}.lg.w{background:var(--acc-soft)}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.bar h1{font-size:20px;margin:0}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--pri-soft);color:var(--pri);margin:0 6px 8px 0}
.tag.cas{background:var(--acc-soft);color:var(--acc)}
.qtxt{font-size:17px;font-weight:600;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{min-height:50px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:15px;line-height:1.4;text-align:left}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ko{border-color:var(--ko);background:var(--ko-soft)}
.fb{margin-top:12px}
.verdict{font-weight:700;font-size:17px;font-family:var(--ti)}
.verdict.good{color:var(--ok)}.verdict.bad{color:var(--ko)}
.expl{margin-top:6px;font-size:15px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:10px 12px}
.end{text-align:center}
.score{font-size:52px;font-weight:700;color:var(--pri);margin:6px 0 0}
.corr{padding:12px 0;border-bottom:1px solid var(--line)}
.corr .qtxt{font-size:15px}
.cbad{color:var(--ko);font-size:14px}.cgood{color:var(--ok);font-size:14px}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>

<script>
(function(){
"use strict";
const M = {"key": "grh", "title": "GRH et management d’équipe", "sub": "M. Mananga · Droit du travail appliqué au management des ressources humaines", "lecons": [{"n": 1, "title": "Cours n° 1 : les processus de recrutement", "chapitres": [{"n": 1, "title": "Le recrutement : cadre juridique", "unites": [{"id": "1.1", "title": "Recrutement et libertés individuelles", "fiche": [["def", "L’employeur est en **position de force** face au candidat (il dispose de l’outil de travail). Le Code du travail encadre donc le recrutement : les informations demandées doivent avoir un **lien direct avec l’emploi** et servir uniquement à apprécier la capacité à l’occuper."], ["li", ["Informer **au préalable** le candidat des méthodes et techniques de recrutement (et de leur finalité).", "Pas de collecte d’informations personnelles sans information préalable du candidat.", "Place du **CSE** (ancien comité d’entreprise) : il est informé des recrutements.", "Respect des règles de la **CNIL** : conserver en sécurité les données des candidats."]], ["eg", "Méthodes possibles : entretien avec un psychologue du travail, analyse de l’écriture, tests."], ["warn", "Questions interdites : santé, origines, religion, projet de fonder une famille. Le candidat peut refuser d’y répondre. Jamais de décision fondée sur un motif discriminatoire (art. L.1132-1)."]], "qs": [["qcm", "Pourquoi le Code du travail encadre-t-il le recrutement ?", ["L’employeur est en position de force face au candidat", "Le candidat est en position de force face à l’employeur", "Pour obliger l’employeur à embaucher", "Pour fixer les salaires d’embauche"], "L’employeur dispose de l’outil de travail : le droit encadre le recrutement pour éviter sa « toute-puissance »."], ["qcm", "Les informations demandées à un candidat doivent…", ["Avoir un lien direct avec l’emploi et servir à apprécier sa capacité à l’occuper", "Couvrir toute sa vie personnelle", "Porter sur ses projets familiaux", "Être validées par la CNIL avant l’entretien"], "C’est la règle centrale : seules les informations liées aux compétences requises pour le poste sont admises."], ["vf", "Vrai ou faux ? L’employeur peut utiliser une méthode de recrutement sans en informer le candidat.", ["Faux", "Vrai"], "Faux : il doit informer le candidat au préalable des méthodes et techniques employées, et de leur finalité."], ["qcm", "Quel organisme veille à la protection des données personnelles des candidats ?", ["La CNIL", "Le CSE", "L’Urssaf", "La DREETS"], "La CNIL (Commission nationale de l’informatique et des libertés) protège nos données personnelles, notamment face à l’employeur."], ["qcm", "Que signifie CNIL ?", ["Commission nationale de l’informatique et des libertés", "Commission nationale de l’inspection du travail", "Conseil national de l’insertion et du logement"], "CNIL = Commission nationale de l’informatique et des libertés."], ["vf", "Vrai ou faux ? Le CSE, s’il existe, peut s’interroger sur la manière dont l’employeur recrute.", ["Vrai", "Faux"], "Vrai : le CSE a sa place dans le recrutement et doit être informé des recrutements faits dans l’entreprise."], ["qcm", "Quelle question d’entretien est autorisée ?", ["« Avez-vous déjà utilisé un logiciel de paie ? »", "« Avez-vous une maladie ? »", "« Quelle est votre religion ? »", "« Comptez-vous fonder une famille ? »"], "Seules les questions qui relient les compétences du candidat au poste sont admises. Santé, religion et projet familial sont interdits."], ["vf", "Vrai ou faux ? Un candidat peut refuser de répondre à une question sans lien avec le poste.", ["Vrai", "Faux"], "Vrai : si une question n’a pas de lien avec le travail, le candidat a le droit de ne pas y répondre."], ["qcm", "Le candidat mentionne lui-même une information personnelle dans son CV. Le recruteur…", ["Peut s’y attarder, mais ne peut jamais fonder sa décision sur un motif discriminatoire", "N’a jamais le droit d’en parler", "Peut s’en servir pour écarter le candidat"], "Le recruteur peut en parler, mais l’article L.1132-1 interdit toute décision fondée sur un motif discriminatoire."], ["trou", "Complète : l’employeur doit conserver en ______ les informations recueillies sur les candidats.", ["sécurité", "libre accès", "affichage"], "Règle CNIL : les données des candidats doivent être conservées en sécurité."], ["qcm", "Quelles méthodes de recrutement sont citées dans le cours ?", ["Entretien avec un psychologue du travail, analyse de l’écriture, tests", "Uniquement l’entretien d’embauche", "Enquête auprès de l’entourage du candidat"], "Plusieurs méthodes existent, à condition d’en informer le candidat au préalable."], ["vf", "Vrai ou faux ? Avant de faire passer des tests, l’employeur doit en indiquer la finalité au candidat.", ["Vrai", "Faux"], "Vrai : le candidat est informé au préalable des méthodes et de leur finalité."], ["qcm", "Le CSE est l’ancien…", ["Comité d’entreprise", "Conseil de prud’hommes", "Comité de direction"], "CSE = Comité social et économique, qui a remplacé le comité d’entreprise."], ["qcm", "Quel article interdit de fonder une décision d’embauche sur un motif discriminatoire ?", ["L.1132-1 du Code du travail", "R.1221-9 du Code du travail", "L.1237-3 du Code du travail"], "L’article L.1132-1 liste les motifs de discrimination interdits."], ["trou", "Complète : l’employeur est libre de recruter toute personne de son choix ; il est le seul ______ des besoins de l’entreprise.", ["juge", "employé", "témoin"], "C’est le principe de liberté de recrutement ; le droit l’encadre pour éviter les abus."], ["cas", "Cas pratique : en entretien, le recruteur demande à Léa si elle a des problèmes de santé. Que peut-elle faire ?", ["Ne pas répondre : la question n’a pas de lien avec l’emploi", "Répondre obligatoirement, sinon le refus est légal", "Fournir un certificat médical"], "La santé fait partie des questions interdites. Léa peut refuser de répondre ; l’aptitude relève des services de santé au travail."], ["cas", "Cas pratique : une clinique fait passer un test de personnalité sans prévenir les candidats. Est-ce régulier ?", ["Non : les candidats doivent être informés au préalable de la méthode et de sa finalité", "Oui : l’employeur est libre de ses méthodes", "Oui, si le CSE donne son accord"], "Toute méthode ou technique de recrutement doit être annoncée au candidat avant d’être utilisée."], ["qcm", "Pourquoi le recruteur peut-il demander « Avez-vous déjà travaillé en EHPAD ? » ?", ["La question est liée aux compétences requises pour le poste", "Toutes les questions sont permises en entretien", "Le CSE l’impose"], "La question porte sur l’expérience professionnelle : elle a un lien direct avec l’emploi."], ["vf", "Vrai ou faux ? Le CSE doit être informé des recrutements qui se font dans l’entreprise.", ["Vrai", "Faux"], "Vrai : c’est une des règles du recrutement vues en cours."], ["qcm", "Des informations personnelles sur un candidat peuvent être collectées…", ["Seulement si le candidat a été informé au préalable du principe", "Librement, sans prévenir", "Uniquement par le CSE"], "Pas de collecte d’informations personnelles sans information préalable du candidat."]]}, {"id": "1.2", "title": "Le libre choix de l’employeur et ses limites", "fiche": [["def", "L’employeur choisit librement son collaborateur, mais cette liberté est limitée par **l’interdiction des discriminations** et **l’interdiction du débauchage** (déloyal)."], ["def", "**Discrimination** : traiter une personne différemment en raison d’éléments extérieurs à ses compétences (origine, nationalité, orientation sexuelle, opinions…)."], ["li", ["**Différences autorisées** : justifiées objectivement (ex. ancienneté ; âge ou sexe dans le secteur artistique).", "**Testing** : CV identiques sauf le nom et le prénom ; il met en évidence une discrimination.", "Pas de **discrimination positive** en droit français, mais des mesures temporaires pour l’égalité des chances (femmes, personnes handicapées)."]], ["warn", "Débauchage : embaucher le salarié d’un concurrent reste en principe libre ; c’est le débauchage **déloyal** (manœuvres, désorganisation) qui est sanctionné, avec responsabilité solidaire du nouvel employeur (art. L.1237-3)."]], "qs": [["qcm", "La liberté de l’employeur de choisir ses salariés est limitée par…", ["L’interdiction des discriminations et du débauchage déloyal", "L’avis obligatoire du CSE", "L’accord de France Travail"], "Le cours cite deux limites : l’interdiction des discriminations à l’embauche et l’interdiction du débauchage."], ["qcm", "Selon le cours, qu’est-ce qu’une discrimination ?", ["Traiter une personne différemment en raison d’éléments extérieurs à ses compétences", "Choisir le candidat le plus compétent", "Payer selon l’ancienneté"], "La discrimination repose sur des éléments sans rapport avec les compétences : origine, nationalité, opinions…"], ["qcm", "Lequel n’est PAS un motif de discrimination ?", ["L’absence de l’expérience requise pour le poste", "L’origine", "Les opinions politiques", "L’orientation sexuelle"], "Écarter un candidat qui n’a pas l’expérience requise repose sur ses compétences : ce n’est pas discriminatoire."], ["vf", "Vrai ou faux ? Un salaire d’embauche inférieur à celui d’un salarié présent depuis 30 ans est une discrimination.", ["Faux", "Vrai"], "Faux : l’écart s’explique objectivement par l’ancienneté. C’est une différence autorisée."], ["qcm", "Dans quel cas l’âge peut-il être un critère d’embauche ?", ["Dans le domaine artistique (cinéma, mannequinat)", "Pour un poste de comptable", "Jamais, sans aucune exception"], "L’âge, normalement interdit, peut être un critère dans certains cas comme le secteur artistique."], ["qcm", "Qu’est-ce que le débauchage ?", ["Aller chercher un salarié dans une autre entreprise", "Licencier un salarié", "Refuser un candidat"], "Le débauchage consiste à attirer le salarié d’une autre entreprise, souvent avec un meilleur salaire."], ["qcm", "En droit en vigueur, qu’est-ce qui est sanctionné ?", ["Le débauchage déloyal ou abusif", "Toute embauche d’un salarié venant d’un concurrent", "La publication d’une offre d’emploi"], "La liberté du travail permet de changer d’employeur ; seuls les manœuvres déloyales et la désorganisation du concurrent sont sanctionnées."], ["trou", "Complète : en cas de débauchage déloyal, le nouvel employeur peut être tenu ______ responsable du préjudice (art. L.1237-3).", ["solidairement", "seul", "exceptionnellement"], "Le nouvel employeur répond solidairement du préjudice causé à l’ancien employeur."], ["qcm", "À quoi sert le testing ?", ["À mettre en évidence une discrimination à l’embauche", "À tester les compétences du candidat", "À évaluer sa personnalité"], "On envoie des CV équivalents qui ne diffèrent que par un critère : les écarts de réponse révèlent une discrimination."], ["qcm", "Dans l’exemple de testing du cours, qu’est-ce qui change entre les deux CV ?", ["Le nom et le prénom", "Les compétences", "Les diplômes"], "Les compétences restent identiques : seuls le nom et le prénom changent. Le CV anonyme obtient un entretien, l’autre non."], ["vf", "Vrai ou faux ? Une offre peut préciser « recherche une femme de moins de 30 ans » pour un poste de secrétaire.", ["Faux", "Vrai"], "Faux : sexe et âge sont des mentions discriminatoires, sauf exception comme le secteur artistique."], ["vf", "Vrai ou faux ? Dans le secteur artistique, une offre peut viser un sexe ou un âge.", ["Vrai", "Faux"], "Vrai : c’est une différence autorisée (cinéma, mannequinat)."], ["vf", "Vrai ou faux ? Le droit français admet la discrimination positive fondée sur l’origine.", ["Faux", "Vrai"], "Faux : pas de discrimination positive en droit français ; seules des mesures temporaires pour l’égalité des chances sont admises."], ["qcm", "Quelles mesures temporaires sont admises pour rétablir l’égalité des chances ?", ["Des mesures en faveur des femmes ou des personnes handicapées", "Des quotas selon l’origine", "Des salaires plus élevés selon la religion"], "Exemple : mesures en faveur des femmes (art. L.1142-4) ou des personnes handicapées : ce sont des différences autorisées."], ["qcm", "Selon M. Mananga, comment le recrutement doit-il se faire ?", ["De manière objective, en fonction des compétences", "Selon l’intuition du recruteur", "Selon l’âge des candidats"], "Sinon, c’est de la discrimination."], ["qcm", "Quels domaines de l’entreprise sont concernés par la discrimination ?", ["Notamment la classification et la qualification (formations)", "Uniquement le recrutement", "Uniquement le licenciement"], "Le cours cite la classification et la qualification parmi les domaines concernés."], ["cas", "Cas pratique : un directeur écarte un candidat de 58 ans, « trop vieux pour l’équipe ». Que dire ?", ["C’est une discrimination liée à l’âge, interdite", "C’est une différence autorisée", "C’est légal si le poste est fatigant"], "L’âge est un motif interdit ; « trop vieux pour l’équipe » repose sur un stéréotype, pas sur les compétences."], ["cas", "Cas pratique : une clinique propose un meilleur salaire à un infirmier d’un concurrent, qui accepte librement. Est-ce interdit ?", ["Non en principe (liberté du travail), sauf manœuvres déloyales", "Oui, tout débauchage est interdit", "Oui, sauf accord du CSE"], "Le cours parle d’interdiction du débauchage ; le droit en vigueur ne sanctionne que le débauchage déloyal ou abusif."], ["trou", "Complète : le libre choix de l’employeur est encadré par l’interdiction des ______ à l’embauche.", ["discriminations", "promotions", "formations"], "C’est la première limite au libre choix de l’employeur."], ["qcm", "Une différence de traitement est autorisée si elle repose sur…", ["Une justification objective (ancienneté, exigence du poste…)", "La préférence personnelle du recruteur", "L’origine du candidat"], "Les différences autorisées reposent sur des éléments objectifs, comme l’ancienneté."]]}, {"id": "1.3", "title": "Les moyens de recrutement", "fiche": [["t", [["Recrutement", "Caractère"], ["Interne (un salarié change de poste)", "Obligatoire : diffuser l’offre en interne"], ["Externe (candidat extérieur)", "Facultatif"]]], ["def", "L’offre d’emploi doit être **en français** (loi Toubon), **sans mention discriminatoire** (âge, sexe, nationalité, domicile…) et **sans mensonge**."], ["li", ["Diffusion par tout moyen de publicité (affichage, presse…), avec **affichage obligatoire** dans l’entreprise.", "Déclaration de l’offre à France Travail : **plus obligatoire** depuis la loi du 18 janvier 2005.", "Pôle emploi est devenu France Travail le 1er janvier 2024."]], ["eg", "Mentions admises : « permis requis » (qualité liée au poste) ; « RQTH appréciée » (obligation d’emploi de 6 % de travailleurs handicapés dès 20 salariés)."], ["warn", "On diffuse en interne même si aucun salarié n’a les compétences : les salariés évoluent au cours de leur carrière."]], "qs": [["qcm", "La diffusion de l’offre d’emploi en interne est…", ["Obligatoire", "Facultative", "Interdite"], "L’employeur a l’obligation de diffuser l’offre en interne : cela permet l’évolution professionnelle des salariés."], ["qcm", "La diffusion de l’offre en externe est…", ["Facultative", "Obligatoire", "Interdite"], "Le recrutement externe est une option."], ["qcm", "Pourquoi diffuser en interne même si aucun salarié n’a les compétences ?", ["Les salariés évoluent (cours du soir…) : cela permet l’évolution professionnelle", "Pour retarder le recrutement", "Parce que le CSE l’exige"], "Même sans compétences aujourd’hui, un salarié peut avoir évolué ; l’offre interne lui donne sa chance."], ["qcm", "Qu’est-ce que le recrutement interne ?", ["Choisir un candidat déjà présent dans l’entreprise, qui change de poste", "Recruter un candidat extérieur", "Passer par une agence d’intérim"], "Dans les deux cas, interne ou externe, l’offre doit expliciter les compétences recherchées."], ["vf", "Vrai ou faux ? L’offre d’emploi doit être diffusée en français.", ["Vrai", "Faux"], "Vrai : c’est une des trois caractéristiques de l’offre (loi Toubon, reprise dans le Code du travail)."], ["qcm", "Quelle loi impose l’usage du français ?", ["La loi Toubon", "La loi Travail", "La loi de cohésion sociale de 2005"], "La loi Toubon impose d’utiliser le français au maximum."], ["qcm", "Quelle mention est interdite dans une offre ?", ["« 25-35 ans »", "« Permis B requis »", "« RQTH appréciée »", "« Expérience en EHPAD souhaitée »"], "L’âge est une mention discriminatoire. Les autres mentions sont liées au poste ou admises."], ["vf", "Vrai ou faux ? « Permis requis » est une mention discriminatoire.", ["Faux", "Vrai"], "Faux : c’est une qualité supplémentaire liée au poste."], ["qcm", "La mention « RQTH appréciée » vise…", ["Les travailleurs en situation de handicap", "Les jeunes diplômés", "Les seniors"], "RQTH = reconnaissance de la qualité de travailleur handicapé ; la mention est admise."], ["trou", "Complète : les entreprises d’au moins 20 salariés doivent employer au moins ___ % de travailleurs handicapés.", ["6", "10", "2"], "Obligation d’emploi de 6 % de l’effectif, d’où l’intérêt de la mention « RQTH appréciée »."], ["vf", "Vrai ou faux ? L’employeur doit déclarer son offre à France Travail.", ["Faux", "Vrai"], "Faux : ce n’est plus obligatoire depuis la loi du 18 janvier 2005."], ["qcm", "Depuis quelle loi la déclaration de l’offre n’est-elle plus obligatoire ?", ["Loi du 18 janvier 2005", "Loi du 18 janvier 2008", "Loi du 8 août 2016"], "Certaines notes indiquent 2008 : c’est une erreur, la bonne date est le 18 janvier 2005 (loi de cohésion sociale)."], ["qcm", "Depuis quand Pôle emploi s’appelle-t-il France Travail ?", ["Le 1er janvier 2024", "Le 18 janvier 2005", "Le 1er janvier 2017"], "Pôle emploi est devenu France Travail le 1er janvier 2024."], ["qcm", "Quelles sont les 3 caractéristiques de l’offre d’emploi ?", ["En français, sans mention discriminatoire, sans mensonge", "En anglais, avec photo, avec salaire", "Validée par l’Urssaf, la CNIL et le CSE"], "Ce sont les trois règles vues en cours."], ["qcm", "Comment peut-on diffuser une offre ?", ["Par tout moyen de publicité, avec un affichage obligatoire dans l’entreprise", "Uniquement sur le site de France Travail", "Uniquement par courrier"], "Affichage, presse… et affichage obligatoire en interne."], ["vf", "Vrai ou faux ? En interne comme en externe, l’offre doit expliciter les compétences recherchées.", ["Vrai", "Faux"], "Vrai : c’est précisé dans le cours."], ["cas", "Cas pratique : un EHPAD publie l’offre « jeune aide-soignante dynamique ». Problème ?", ["Oui : mentions discriminatoires (âge et sexe)", "Non : c’est un critère de compétence", "Non, puisque l’offre est en français"], "« Jeune » vise l’âge et « aide-soignante » au seul féminin vise le sexe : l’offre doit être neutre."], ["cas", "Cas pratique : une association publie une offre uniquement sur LinkedIn, sans affichage interne. Problème ?", ["Oui : la diffusion en interne est obligatoire", "Non : seule la diffusion externe compte", "Non : l’interne est facultative"], "L’affichage dans l’entreprise est obligatoire, la diffusion externe n’est qu’une option."], ["cas", "Cas pratique : une offre annonce un salaire bien supérieur à celui réellement prévu. Problème ?", ["Oui : l’offre ne doit contenir aucun mensonge", "Non : c’est un argument d’attractivité", "Non, si le CSE est d’accord"], "L’absence de mensonge est une des trois caractéristiques de l’offre."], ["qcm", "Quelle mention est admise dans une offre ?", ["« Expérience en gestion de la paie exigée »", "« Nationalité française exigée »", "« Moins de 40 ans »"], "L’expérience est liée au poste ; nationalité et âge sont des mentions discriminatoires."]]}, {"id": "1.4", "title": "La promesse d’embauche", "fiche": [["def", "**Promesse d’embauche** : offre **ferme et définitive** ; c’est un engagement **unilatéral** de l’employeur (le candidat ne s’engage à rien)."], ["li", ["Preuve : par **écrit**, ou par témoins si elle est orale. Le plus sûr reste l’écrit.", "Rétractation sans **motif légitime** (ex. l’entreprise a pris feu) : l’employeur engage sa responsabilité.", "Promesse acceptée : le contrat est formé ; sa rupture est un **licenciement**."]], ["t", [["Depuis 2017", "Offre de contrat", "Promesse unilatérale"], ["Contenu", "Emploi, rémunération, date d’entrée + volonté d’être lié", "Droit d’opter accordé au candidat ; il ne manque que son consentement"], ["Rétractation avant acceptation", "Pas de contrat ; dommages-intérêts si avant la fin du délai", "Sans effet : le contrat se forme"], ["Rupture après acceptation", "Licenciement", "Licenciement"]]], ["warn", "Enregistrement à l’insu : preuve déloyale ; depuis le 22 décembre 2023, le juge peut l’admettre si elle est indispensable et proportionnée."]], "qs": [["qcm", "Qu’est-ce qui constitue une promesse d’embauche ?", ["Une offre ferme et définitive", "Un simple entretien", "Une candidature spontanée"], "Une offre ferme et définitive est une promesse d’embauche : elle engage l’employeur."], ["vf", "Vrai ou faux ? Dans la promesse d’embauche, le candidat s’engage autant que l’employeur.", ["Faux", "Vrai"], "Faux : c’est une promesse unilatérale, seul l’employeur s’engage."], ["qcm", "Comment prouver une promesse faite par téléphone ?", ["Par un écrit ou par des témoins", "Par un enregistrement fait à l’insu du recruteur", "C’est impossible"], "Seuls les écrits font preuve, ou des témoins pour un appel."], ["qcm", "Que dire d’un enregistrement réalisé à l’insu de l’employeur ?", ["C’est une preuve déloyale, que le juge peut admettre depuis 2023 si elle est indispensable et proportionnée", "C’est toujours une preuve valable", "C’est une preuve obligatoire"], "Le cours la dit interdite ; depuis l’arrêt du 22 décembre 2023, elle n’est plus automatiquement écartée."], ["trou", "Complète : pour prouver une promesse, le plus sûr reste d’obtenir un ______.", ["écrit", "témoin", "appel"], "L’écrit est la preuve la plus sûre."], ["qcm", "L’employeur se rétracte sans motif légitime :", ["Il engage sa responsabilité envers le salarié", "Rien ne se passe", "Le candidat lui doit une indemnité"], "Sauf motif légitime, la rétractation engage la responsabilité de l’employeur."], ["qcm", "Quel est un exemple de motif légitime de rétractation ?", ["L’entreprise a pris feu", "Un candidat moins cher s’est présenté", "Le recruteur a changé d’avis"], "Exemple donné en cours : l’incendie de l’entreprise."], ["qcm", "Une fois la promesse acceptée, la rupture par l’employeur s’analyse en…", ["Un licenciement", "Une démission", "Une rupture conventionnelle"], "La promesse acceptée forme le contrat : le rompre, c’est licencier."], ["qcm", "Depuis quand distingue-t-on offre et promesse unilatérale de contrat de travail ?", ["Deux arrêts de la Cour de cassation du 21 septembre 2017", "Un arrêt du 22 décembre 2023", "La loi du 18 janvier 2005"], "Les arrêts du 21 septembre 2017 (chambre sociale) ont précisé la notion de promesse d’embauche."], ["qcm", "Que contient l’offre de contrat de travail ?", ["L’emploi, la rémunération, la date d’entrée et la volonté d’être lié en cas d’acceptation", "Seulement l’intitulé du poste", "Seulement le salaire"], "Ces éléments précis distinguent l’offre d’une simple annonce."], ["qcm", "Dans la promesse unilatérale, que manque-t-il pour former le contrat ?", ["Le consentement du candidat", "Le salaire", "La date d’entrée"], "Tout est déterminé : l’employeur accorde au candidat le droit d’opter."], ["vf", "Vrai ou faux ? La rétractation d’une offre avant son acceptation empêche la conclusion du contrat.", ["Vrai", "Faux"], "Vrai ; mais si elle intervient avant la fin du délai laissé au candidat, elle engage la responsabilité de l’employeur."], ["qcm", "Une offre est retirée avant la fin du délai laissé au candidat. Conséquence ?", ["L’employeur engage sa responsabilité (dommages-intérêts)", "Le contrat est quand même formé", "Aucune conséquence"], "Pas de contrat, mais réparation du préjudice."], ["vf", "Vrai ou faux ? Révoquer une promesse unilatérale pendant le délai d’option empêche la formation du contrat.", ["Faux", "Vrai"], "Faux : la révocation est sans effet, le contrat se forme si le candidat accepte."], ["qcm", "Après acceptation, qu’il s’agisse d’une offre ou d’une promesse :", ["Le contrat est formé : sa rupture est un licenciement", "Aucun contrat n’existe", "Seul le candidat peut encore renoncer sans conséquence"], "Dans les deux cas, le contrat est formé après acceptation."], ["cas", "Cas pratique : une clinique fait à Paul une offre précise (poste, salaire, date) avec 8 jours pour répondre, puis la retire 2 jours après, avant sa réponse. Conséquence ?", ["Pas de contrat, mais la clinique engage sa responsabilité (dommages-intérêts)", "Le contrat est formé : c’est un licenciement", "Aucune conséquence pour la clinique"], "Offre retirée avant acceptation et avant la fin du délai : pas de contrat, mais faute de l’employeur."], ["cas", "Cas pratique : la clinique avait accordé à Paul le droit d’opter (promesse unilatérale) puis l’a révoquée ; Paul accepte dans le délai. Conséquence ?", ["Le contrat est formé : sa rupture est un licenciement", "Aucun contrat n’est formé", "Paul doit des dommages-intérêts"], "La révocation pendant le délai d’option est sans effet."], ["cas", "Cas pratique : Sarah a accepté par écrit une offre ferme ; l’employeur annule. Que lui répondre ?", ["Le contrat est formé : l’annulation est un licenciement qu’elle peut contester", "Elle ne peut rien faire", "Elle doit démissionner"], "Une fois l’offre acceptée, la rupture s’analyse en licenciement."], ["trou", "Complète : la promesse d’embauche est une promesse ______ du côté de l’employeur.", ["unilatérale", "bilatérale", "collective"], "Seul l’employeur s’engage."], ["qcm", "Quel élément ne fait PAS partie d’une offre de contrat de travail ?", ["L’avis du CSE", "L’emploi proposé", "La rémunération", "La date d’entrée en fonction"], "L’offre précise l’emploi, la rémunération et la date d’entrée ; l’avis du CSE n’en fait pas partie."]]}]}, {"n": 2, "title": "Les formalités d’embauche", "unites": [{"id": "2.1", "title": "Les priorités d’embauche des salariés en interne", "fiche": [["def", "**Principe** : les salariés en interne ne sont **pas prioritaires**. L’employeur décide, de manière objective, de reprendre le poste ou de mettre en place une évolution."], ["t", [["Catégorie prioritaire", "Justification"], ["Travailleurs de nuit (pour un poste de jour)", "Travail pénible"], ["Salariés à temps partiel", "Temps de travail précaire"], ["Salariés déclarés inaptes par le médecin du travail", "Inaptitude constatée"]]], ["warn", "La priorité ne joue que si les compétences sont en adéquation avec les missions du poste qui se libère."]], "qs": [["vf", "Vrai ou faux ? En principe, les salariés en interne sont prioritaires pour un poste qui se libère.", ["Faux", "Vrai"], "Faux : le principe est l’absence de priorité, sauf pour trois catégories."], ["qcm", "Qui décide de reprendre un poste ou de mettre en place une évolution ?", ["L’employeur, de manière objective", "Le CSE", "Le salarié le plus ancien"], "C’est l’employeur qui décide, objectivement."], ["qcm", "Combien de catégories de salariés bénéficient d’une priorité ?", ["3", "1", "5"], "Travailleurs de nuit, salariés à temps partiel, salariés déclarés inaptes."], ["qcm", "Quels salariés sont prioritaires pour un poste de jour qui se libère ?", ["Les travailleurs de nuit", "Les cadres", "Les apprentis"], "Le travail de nuit est pénible : ces salariés sont prioritaires pour passer de jour."], ["qcm", "Quelle est la justification de la priorité des travailleurs de nuit ?", ["Le travail est pénible", "Leur ancienneté", "Leur salaire plus bas"], "Pénibilité du travail de nuit."], ["qcm", "Quelle est la justification de la priorité des salariés à temps partiel ?", ["Leur temps de travail est précaire", "Leur travail est pénible", "Leur inaptitude"], "Le temps partiel est une situation précaire."], ["qcm", "Quelle est la troisième catégorie prioritaire ?", ["Les salariés déclarés inaptes à leur poste par le médecin du travail", "Les stagiaires", "Les intérimaires"], "Suite à des problèmes de santé, l’inaptitude est constatée par le médecin du travail."], ["trou", "Complète : l’inaptitude au poste est constatée par le ______.", ["médecin du travail", "employeur", "CSE"], "Seul le médecin du travail constate l’inaptitude."], ["vf", "Vrai ou faux ? La priorité ne joue que si les compétences sont en adéquation avec les missions proposées.", ["Vrai", "Faux"], "Vrai : c’est la condition posée par le cours."], ["qcm", "Lequel n’est PAS une catégorie prioritaire ?", ["Le salarié le plus ancien", "Le travailleur de nuit", "Le salarié à temps partiel", "Le salarié déclaré inapte"], "L’ancienneté ne donne pas, à elle seule, de priorité d’embauche."], ["cas", "Cas pratique : un poste d’aide-soignant de jour se libère. Karim, aide-soignant de nuit, postule et a les compétences. Que doit faire l’employeur ?", ["Lui donner une suite favorable : il est prioritaire", "Choisir librement un candidat externe", "Attendre l’avis du CSE"], "Travailleur de nuit + compétences adaptées = priorité pour le poste de jour."], ["cas", "Cas pratique : Julie, à temps partiel, postule à un poste à temps complet qui correspond à ses compétences. Que doit faire l’employeur ?", ["Lui donner une suite favorable : elle est prioritaire", "Recruter librement à l’extérieur", "Lui proposer un CDD"], "Les salariés à temps partiel sont prioritaires (temps de travail précaire)."], ["cas", "Cas pratique : Marc, déclaré inapte à son poste, postule à un poste administratif adapté qu’il sait occuper. Que doit faire l’employeur ?", ["Lui donner une suite favorable", "Refuser sans motif", "Lui demander de démissionner d’abord"], "Le salarié déclaré inapte fait partie des trois catégories prioritaires."], ["cas", "Cas pratique : Léo, travailleur de nuit, postule à un poste de jour sans avoir les compétences requises. L’employeur doit-il le prendre ?", ["Non : la priorité suppose l’adéquation des compétences", "Oui, quoi qu’il arrive", "Oui, si Léo est ancien"], "La priorité ne s’applique que si les compétences correspondent aux missions."], ["qcm", "Hors de ces 3 catégories, comment évolue un salarié en interne ?", ["Par une décision objective de l’employeur (évolution, primes…)", "Par un vote des salariés", "Par tirage au sort"], "L’employeur décide objectivement de mettre en place une évolution."], ["vf", "Vrai ou faux ? Un salarié à temps partiel n’a aucune priorité pour un poste qui se libère.", ["Faux", "Vrai"], "Faux : il fait partie des trois catégories prioritaires."], ["qcm", "Ces priorités concernent…", ["Un poste qui se libère dans l’entreprise", "Tous les postes de toutes les entreprises", "Uniquement les CDD"], "Elles jouent pour un poste qui se libère dans l’entreprise."], ["trou", "Complète : les travailleurs de nuit sont prioritaires pour occuper un poste de ______ qui se libère.", ["jour", "nuit", "direction"], "La priorité permet de quitter le travail de nuit, pénible."], ["vf", "Vrai ou faux ? L’employeur choisit de manière objective de reprendre le poste ou de mettre en place une évolution.", ["Vrai", "Faux"], "Vrai : c’est le principe posé par le cours."], ["qcm", "Quel est le point commun entre les 3 catégories prioritaires ?", ["Une situation de travail difficile ou précaire", "Une ancienneté minimale", "Un diplôme commun"], "Pénibilité (nuit), précarité (temps partiel) et inaptitude : le droit protège ces situations."]]}, {"id": "2.2", "title": "La déclaration préalable à l’embauche (DPAE)", "fiche": [["def", "**DPAE** : déclaration faite par **l’employeur**, à **l’Urssaf**, par **voie électronique**, au plus tôt **8 jours avant** l’embauche et au plus tard **avant la prise de poste**."], ["t", [["L’Urssaf la transmet à…", "Pour…"], ["France Travail", "Arrêter l’indemnisation chômage"], ["La DREETS", "L’inspection du travail en relève"], ["Les services de santé au travail", "Organiser la visite d’embauche (VIP)"]]], ["eg", "Le salarié peut demander le récépissé de DPAE ou se renseigner auprès de l’Urssaf pour vérifier qu’il est bien déclaré."], ["warn", "Absence volontaire de DPAE = travail dissimulé (voir chapitre 3)."]], "qs": [["qcm", "Que signifie DPAE ?", ["Déclaration préalable à l’embauche", "Demande provisoire d’autorisation d’emploi", "Déclaration de prise d’activité effective"], "DPAE = déclaration préalable à l’embauche."], ["qcm", "Qui doit faire la DPAE ?", ["L’employeur", "Le salarié", "Le médecin du travail"], "C’est une obligation de l’employeur."], ["qcm", "À quel organisme la DPAE est-elle adressée ?", ["L’Urssaf", "La DREETS", "La CNIL"], "L’employeur l’adresse à l’Urssaf, qui la transmet ensuite."], ["qcm", "Quand faire la DPAE ?", ["Au plus tôt 8 jours avant l’embauche, au plus tard avant la prise de poste", "Dans les 8 jours après l’embauche", "Dans le mois qui suit l’embauche"], "Elle doit toujours précéder la prise de poste."], ["qcm", "Comment la DPAE doit-elle être faite ?", ["Par voie électronique", "Par courrier recommandé", "Oralement"], "Ces formalités doivent être réalisées par voie électronique."], ["qcm", "À qui l’Urssaf transmet-elle la DPAE ?", ["France Travail, la DREETS et les services de santé au travail", "La CNIL et le CSE", "Uniquement l’employeur"], "Ce sont les trois destinataires cités en cours."], ["qcm", "Pourquoi France Travail reçoit-il la DPAE ?", ["Pour arrêter l’indemnisation chômage de la personne embauchée", "Pour verser le salaire", "Pour contrôler le CSE"], "La personne a retrouvé un emploi : son indemnisation s’arrête."], ["qcm", "Pourquoi la DREETS reçoit-elle la DPAE ?", ["L’inspection du travail en relève", "Elle verse les cotisations", "Elle organise la formation"], "La DREETS est l’administration dont relève l’inspection du travail."], ["qcm", "Pourquoi les services de santé au travail reçoivent-ils la DPAE ?", ["Pour organiser la visite d’embauche (VIP)", "Pour signer le contrat", "Pour fixer le salaire"], "La DPAE déclenche l’organisation de la visite d’information et de prévention."], ["vf", "Vrai ou faux ? L’Urssaf collecte les cotisations sociales puis les redistribue aux organismes sociaux.", ["Vrai", "Faux"], "Vrai : c’est son rôle, rappelé en cours."], ["vf", "Vrai ou faux ? Le salarié peut contacter l’Urssaf pour vérifier qu’il est bien déclaré.", ["Vrai", "Faux"], "Vrai : il peut se rapprocher de l’Urssaf."], ["trou", "Complète : la DPAE donne lieu à un ______ que le salarié peut demander à son employeur.", ["récépissé", "diplôme", "bulletin d’adhésion"], "Le récépissé prouve la déclaration."], ["vf", "Vrai ou faux ? La DPAE peut être faite un mois après la prise de poste.", ["Faux", "Vrai"], "Faux : elle doit être faite avant la prise de poste."], ["cas", "Cas pratique : Inès commence lundi ; l’employeur fait la DPAE le lundi suivant. Problème ?", ["Oui : la DPAE doit être faite avant la prise de poste", "Non : l’employeur a 8 jours après l’embauche", "Non, si un contrat est signé"], "Les 8 jours se comptent avant l’embauche, pas après."], ["cas", "Cas pratique : Thomas doute d’être déclaré par son employeur. Que lui conseiller ?", ["Demander le récépissé de DPAE ou se renseigner auprès de l’Urssaf", "Saisir la CNIL", "Attendre la fin de la période d’essai"], "Ce sont les deux moyens indiqués en cours."], ["qcm", "L’absence volontaire de DPAE expose l’employeur à…", ["Une condamnation pour travail dissimulé", "Aucune sanction", "Une simple remarque du CSE"], "Omettre la DPAE, c’est dissimuler un emploi salarié (chapitre 3)."], ["vf", "Vrai ou faux ? L’employeur adresse directement la DPAE à France Travail.", ["Faux", "Vrai"], "Faux : il l’adresse à l’Urssaf, qui la transmet à France Travail."], ["qcm", "Au plus tôt, combien de jours avant l’embauche peut-on faire la DPAE ?", ["8 jours", "15 jours", "30 jours"], "La DPAE se fait dans les 8 jours qui précèdent l’embauche."], ["vf", "Vrai ou faux ? La DPAE permet aux services de santé au travail d’organiser la visite d’embauche.", ["Vrai", "Faux"], "Vrai : c’est l’une des raisons de sa transmission."], ["cas", "Cas pratique : une association envoie la DPAE d’un éducateur par courrier papier. Est-ce conforme ?", ["Non : la DPAE se fait par voie électronique", "Oui", "Oui, si le courrier est recommandé"], "Les formalités doivent être réalisées par voie électronique."]]}, {"id": "2.3", "title": "La visite d’information et de prévention (VIP)", "fiche": [["def", "Depuis la **loi Travail** (8 août 2016, applicable au 1er janvier 2017), la visite médicale d’embauche est remplacée par la **VIP**, réalisée par un **professionnel de santé** (médecin, infirmier…)."], ["t", [["Salarié", "Délai de la visite"], ["Cas général", "Dans les 3 mois après la prise effective du poste"], ["Travailleur de nuit, moins de 18 ans", "Avant l’affectation"], ["Poste à risques", "Examen médical d’aptitude avant l’affectation"]]], ["li", ["Buts : rechercher une infection dangereuse, vérifier l’aptitude au poste, proposer des adaptations du poste."]], ["warn", "Ce n’est pas à l’employeur de juger si le salarié est en assez bonne santé. Le délai « avant l’embauche ou à la fin de la période d’essai » est celui de l’ancienne visite."]], "qs": [["qcm", "Par quoi la visite médicale d’embauche a-t-elle été remplacée ?", ["La visite d’information et de prévention (VIP)", "Un questionnaire en ligne", "Rien : elle a été supprimée"], "La VIP est dispensée par un professionnel de santé au moment de l’embauche."], ["qcm", "Quelle loi a créé la VIP ?", ["La loi Travail (8 août 2016, applicable au 1er janvier 2017)", "La loi Toubon", "La loi du 18 janvier 2005"], "La loi Travail a remplacé la visite médicale d’embauche par la VIP."], ["qcm", "Qui peut réaliser la VIP ?", ["Un professionnel de santé (médecin, infirmier…)", "L’employeur", "Le CSE"], "Avant la loi Travail, c’était le médecin du travail ; aujourd’hui, un infirmier peut la faire."], ["qcm", "Dans quel délai a lieu la VIP pour un salarié sans situation particulière ?", ["Dans les 3 mois après la prise effective du poste", "Obligatoirement avant l’embauche", "Dans l’année qui suit l’embauche"], "Délai de droit commun : 3 mois à compter de la prise de poste."], ["qcm", "Pour quels salariés la VIP doit-elle avoir lieu avant l’affectation ?", ["Les travailleurs de nuit et les moins de 18 ans", "Les cadres", "Les salariés en CDI"], "Ces salariés passent la visite avant d’être affectés à leur poste."], ["qcm", "Que passent les salariés affectés à un poste à risques ?", ["Un examen médical d’aptitude avant l’affectation", "Aucune visite", "Une VIP dans l’année"], "Pour les postes à risques, un examen d’aptitude précède l’affectation."], ["vf", "Vrai ou faux ? C’est à l’employeur de juger si le salarié est en assez bonne santé pour son poste.", ["Faux", "Vrai"], "Faux : ce rôle revient aux professionnels de santé au travail."], ["qcm", "Quels sont les buts de la visite selon le cours ?", ["Rechercher une infection dangereuse, vérifier l’aptitude, proposer des adaptations du poste", "Fixer le salaire", "Vérifier le CV du salarié"], "Ce sont les trois buts listés en cours."], ["trou", "Complète : « avant l’embauche ou au plus tard à la fin de la période d’essai » est le délai de l’______ visite médicale d’embauche.", ["ancienne", "nouvelle", "future"], "Depuis la loi Travail, le délai de droit commun est de 3 mois."], ["vf", "Vrai ou faux ? Avant la loi Travail, la visite était assurée par le médecin du travail.", ["Vrai", "Faux"], "Vrai : aujourd’hui, elle peut l’être par un infirmier."], ["cas", "Cas pratique : Nadia, 17 ans, est embauchée comme apprentie. Quand doit avoir lieu sa VIP ?", ["Avant son affectation", "Dans les 3 mois", "Elle n’en a pas besoin"], "Les salariés de moins de 18 ans passent la VIP avant l’affectation."], ["cas", "Cas pratique : Paul commence le 1er mars sur un poste de jour sans risque particulier. Date limite de sa VIP ?", ["Le 1er juin (3 mois)", "Le 1er mars", "Le 31 décembre"], "Délai de droit commun : 3 mois à compter de la prise de poste."], ["cas", "Cas pratique : un infirmier est embauché pour travailler de nuit. Quand passe-t-il la VIP ?", ["Avant son affectation", "Dans les 3 mois", "Jamais"], "Le travail de nuit impose une visite avant l’affectation."], ["qcm", "Que peut proposer la visite à l’employeur ?", ["Des adaptations du poste de travail", "Une baisse de salaire", "Un licenciement"], "Elle peut proposer d’adapter le poste."], ["vf", "Vrai ou faux ? La visite médicale d’embauche est toujours obligatoire dans sa forme d’origine.", ["Faux", "Vrai"], "Faux : elle n’est plus obligatoire depuis la loi Travail ; la VIP l’a remplacée."], ["qcm", "Que signifie VIP ?", ["Visite d’information et de prévention", "Visite d’inspection préalable", "Validation d’intégration professionnelle"], "VIP = visite d’information et de prévention."], ["cas", "Cas pratique : un employeur exige un certificat médical pour juger lui-même de l’aptitude d’un candidat. Que dire ?", ["Ce n’est pas à l’employeur de juger : c’est le rôle de la santé au travail", "C’est son droit", "C’est une obligation légale"], "L’aptitude relève des professionnels de santé au travail, pas de l’employeur."], ["trou", "Complète : pour un poste à risques, examen médical d’______ avant l’affectation.", ["aptitude", "embauche", "sortie"], "Ces salariés bénéficient d’un suivi renforcé."], ["qcm", "Qui organise la visite grâce à la DPAE ?", ["Les services de santé au travail", "L’Urssaf", "France Travail"], "L’Urssaf leur transmet la DPAE pour organiser la visite."], ["vf", "Vrai ou faux ? La VIP peut être réalisée par une infirmière.", ["Vrai", "Faux"], "Vrai : par un professionnel de santé, médecin ou infirmier."]]}, {"id": "2.4", "title": "La remise d’un écrit au salarié", "fiche": [["def", "Contrat écrit **facultatif** pour un **CDI à temps complet**, **obligatoire** pour tous les autres contrats (CDD, temps partiel…). Sans écrit, le salarié est **présumé en CDI à temps complet**."], ["li", ["Fondement : directive CE de 1991 et art. **R.1221-9** du Code du travail (et non R.1231-9).", "Remise : contrat, lettre d’embauche ou bulletin de paie…", "Mise à jour : directive (UE) 2019/1152 ; depuis le 1er novembre 2023, remise d’un ou plusieurs écrits sur les éléments essentiels de la relation de travail."]], ["eg", "Prouver la relation de travail : bulletins de paie, plannings, mails, récépissé de DPAE, témoignages (souvent des élus du CSE)."], ["warn", "Meilleure preuve selon l’enseignant : l’**attestation de travail**, datée du jour par l’employeur."]], "qs": [["qcm", "Pour quel contrat l’écrit n’est-il pas obligatoire ?", ["Le CDI à temps complet", "Le CDD", "Le contrat à temps partiel"], "Le CDI à temps complet est la norme ; tous les autres contrats exigent un écrit."], ["qcm", "Sans contrat écrit, le salarié est présumé…", ["En CDI à temps complet", "En CDD", "Stagiaire"], "L’absence d’écrit fait présumer un CDI à temps complet."], ["vf", "Vrai ou faux ? Un CDD peut être conclu oralement.", ["Faux", "Vrai"], "Faux : tout contrat autre que le CDI à temps complet doit être écrit."], ["qcm", "Quand il est obligatoire, le contrat écrit peut être…", ["Sur papier ou numérique", "Uniquement sur papier", "Uniquement devant notaire"], "Précisé à l’oral : papier ou numérique, peu importe."], ["qcm", "D’où vient la règle du CDI à temps complet comme norme, selon l’enseignant ?", ["Du droit du travail mis en place à partir de 1981", "De la loi Travail de 2016", "De la loi de 2005"], "Depuis 1981, le CDI à temps complet est la norme, les autres contrats sont des exceptions."], ["qcm", "Comment prouver la relation de travail sans contrat écrit ?", ["Bulletins de paie, plannings, mails, récépissé de DPAE, témoignages", "C’est impossible", "Uniquement avec l’accord de l’employeur"], "Le salarié peut prouver par tout moyen."], ["qcm", "Quelle est la meilleure preuve d’emploi selon l’enseignant ?", ["Une attestation de travail datée du jour par l’employeur", "Un ancien contrat de CDI", "Une carte de visite"], "Elle prouve que le salarié fait toujours partie de l’effectif à cette date."], ["vf", "Vrai ou faux ? L’employeur doit remettre un bulletin de paie à chaque fin de mois, ou selon la régularité pratiquée.", ["Vrai", "Faux"], "Vrai : c’est une obligation de l’employeur."], ["qcm", "Qui rédige souvent les attestations de témoignage ?", ["Les élus du CSE ou les représentants syndicaux", "Le médecin du travail", "L’Urssaf"], "En pratique, ce sont souvent eux, sans que cela pose problème."], ["qcm", "Sur quoi repose l’obligation de remettre un écrit ?", ["La directive CE de 1991 et l’article R.1221-9 du Code du travail", "La loi Toubon", "L’article L.1132-1"], "Ce sont les deux fondements vus en cours."], ["trou", "Complète : la référence exacte est l’article R.______ du Code du travail.", ["1221-9", "1231-9", "1132-1"], "« R.1231-9 » est une coquille de certaines notes."], ["qcm", "Par quoi la directive de 1991 a-t-elle été remplacée ?", ["La directive (UE) 2019/1152", "La loi Travail", "Une directive de 2005"], "Directive relative à des conditions de travail transparentes et prévisibles."], ["qcm", "Depuis le 1er novembre 2023, l’employeur doit remettre…", ["Un ou plusieurs écrits précisant les éléments essentiels de la relation de travail", "Rien de plus qu’avant", "Un contrat notarié"], "Obligation issue de la transposition de la directive 2019/1152 (art. R.1221-34 et suivants)."], ["qcm", "Quel document peut servir d’écrit remis au salarié ?", ["Le contrat, la lettre d’embauche ou le bulletin de paie", "La carte Vitale", "Le badge d’accès"], "Ce sont les documents cités en cours."], ["cas", "Cas pratique : Sofia travaille en CDD sans contrat écrit. Que peut-elle revendiquer ?", ["La qualité de salariée en CDI à temps complet", "Rien du tout", "Une prime de précarité doublée"], "Sans écrit, le contrat est présumé être un CDI à temps complet."], ["cas", "Cas pratique : un banquier exige un CDI pour un prêt. Quel document est le plus fiable selon l’enseignant ?", ["Une attestation de travail datée du jour", "Le CDI signé à l’embauche", "Un bulletin de paie de l’an dernier"], "Le CDI indique la date d’entrée mais pas de sortie ; l’attestation prouve l’emploi actuel."], ["cas", "Cas pratique : Tom n’a pas de contrat et son employeur nie l’avoir embauché. Que lui conseiller ?", ["Réunir plannings, mails, bulletins de paie et témoignages", "Abandonner : sans contrat, rien n’est possible", "Fournir uniquement son CV"], "La relation de travail se prouve par tout moyen."], ["vf", "Vrai ou faux ? En pratique, la plupart des employeurs font signer un écrit, même pour un CDI à temps complet.", ["Vrai", "Faux"], "Vrai : précisé à l’oral."], ["qcm", "Pourquoi un CDI signé n’est-il pas une preuve parfaite d’un emploi actuel ?", ["Il indique la date d’entrée mais pas celle de sortie", "Il est toujours faux", "Il n’est jamais signé"], "On peut présenter le CDI d’un emploi déjà quitté."], ["vf", "Vrai ou faux ? L’absence d’écrit amène la question du travail dissimulé.", ["Vrai", "Faux"], "Vrai : c’est le lien fait par le cours avec la partie 3."]]}]}, {"n": 3, "title": "La question du travail dissimulé", "unites": [{"id": "3.1", "title": "Les pratiques interdites", "fiche": [["t", [["Pratique interdite", "Définition du cours"], ["Dissimulation d’emploi", "Ne pas déclarer volontairement un salarié, ou déclarer moins d’heures que la réalité"], ["Marchandage", "Fourniture de main-d’œuvre à but lucratif qui cause un préjudice au salarié"], ["Prêt illicite de main-d’œuvre", "Pratique visant à éviter d’appliquer les lois françaises (ex. SMIC)"], ["Emploi d’un étranger sans titre", "Faire travailler un étranger sans autorisation de travail"]]], ["li", ["Être déclaré protège le salarié (accidents du travail, retraite).", "Étranger extracommunautaire : vérifier le titre de séjour auprès de la préfecture, au moins 2 jours ouvrables avant l’embauche.", "Ces pratiques privent l’État de cotisations et portent atteinte à la dignité des personnes."]], ["warn", "Au sens strict, ces 4 pratiques relèvent du **travail illégal** ; le travail dissimulé n’en est qu’une forme."]], "qs": [["qcm", "Qu’est-ce que la dissimulation d’emploi ?", ["Ne pas déclarer volontairement un salarié, ou déclarer moins d’heures que la réalité", "Embaucher un salarié en CDD", "Recruter sans offre d’emploi"], "Définition du cours : absence volontaire de déclaration, ou sous-déclaration des heures."], ["cas", "Cas pratique : un salarié travaille à temps plein mais l’employeur ne le déclare qu’à temps partiel. Qu’en dire ?", ["C’est de la dissimulation d’emploi", "C’est légal si le salarié est d’accord", "C’est un simple oubli sans conséquence"], "Déclarer moins d’heures que la réalité permet d’éviter une partie des charges sociales : c’est de la dissimulation d’emploi."], ["qcm", "Qu’est-ce que le marchandage ?", ["Une fourniture de main-d’œuvre à but lucratif qui cause un préjudice au salarié", "Une négociation de salaire", "Une vente de matériel"], "Définition du cours (art. L.8231-1 du Code du travail)."], ["qcm", "À quoi vise le prêt illicite de main-d’œuvre, selon le cours ?", ["À éviter d’appliquer les lois françaises, comme le SMIC", "À former les salariés", "À remplacer un salarié malade"], "Exemple : appliquer le salaire minimum polonais à un salarié français."], ["cas", "Cas pratique : un constructeur met un ouvrier français à disposition de sa filiale polonaise et lui verse le salaire minimum polonais pour produire des voitures vendues en France. Qu’en dire ?", ["C’est une pratique interdite (marchandage) si le but est de moins le payer", "C’est légal : la filiale est en Pologne", "C’est de l’intérim autorisé"], "L’exemple du cours : le stratagème pour moins payer le salarié est sanctionné."], ["vf", "Vrai ou faux ? Selon l’enseignant, les marchandages se voient encore beaucoup aujourd’hui.", ["Faux", "Vrai"], "Faux : ils ne se voient quasiment plus, grâce à la généralisation de la législation européenne."], ["qcm", "Quelle obligation a l’employeur pour un étranger extracommunautaire ?", ["Vérifier l’authenticité du titre de séjour auprès de la préfecture", "Demander l’accord du CSE", "Prévenir France Travail"], "Obligation légale de vérification auprès de la préfecture."], ["trou", "Complète : la vérification du titre de séjour se fait au moins ___ jours ouvrables avant l’embauche.", ["2", "8", "15"], "Art. R.5221-41 du Code du travail."], ["qcm", "Pourquoi le travailleur étranger sans titre ne proteste-t-il pas ?", ["Il a peur de perdre son travail et d’être expulsé", "Il est mieux payé", "Il est protégé par le CSE"], "C’est pour cela que la loi a été renforcée."], ["qcm", "Pourquoi ces pratiques sont-elles interdites ?", ["Elles privent l’État de recettes et portent atteinte à la dignité des personnes", "Elles coûtent trop cher aux salariés", "Elles sont mal vues par les clients"], "Raisons données à l’oral par l’enseignant."], ["qcm", "Que permet au salarié le fait d’être déclaré à l’Urssaf ?", ["D’être couvert (accidents du travail) et de cotiser pour sa retraite", "D’avoir un salaire plus élevé", "D’éviter la période d’essai"], "La déclaration ouvre la protection sociale."], ["vf", "Vrai ou faux ? Au sens strict, les 4 pratiques interdites relèvent du travail illégal.", ["Vrai", "Faux"], "Vrai : le travail dissimulé n’est qu’une des formes du travail illégal."], ["qcm", "Combien de pratiques interdites le cours présente-t-il ?", ["4", "2", "6"], "Dissimulation d’emploi, marchandage, prêt illicite de main-d’œuvre, emploi d’un étranger sans titre."], ["cas", "Cas pratique : une chaîne de restauration emploie des travailleurs sans papiers, non déclarés et payés sous le SMIC. Qu’en dire ?", ["Pratiques interdites : emploi d’étrangers sans titre et dissimulation d’emploi", "C’est légal si les salariés acceptent", "C’est seulement une faute morale"], "Exemple cité en cours : lors du contrôle, l’entreprise a voulu les licencier du jour au lendemain."], ["trou", "Complète : le prêt illicite de main-d’œuvre vise à éviter d’appliquer les règles françaises, comme le ______.", ["SMIC", "CSE", "DPAE"], "Payer moins que le SMIC est l’objectif de ces montages."], ["vf", "Vrai ou faux ? L’intérim est un cas autorisé de prêt de main-d’œuvre.", ["Vrai", "Faux"], "Vrai : le prêt illicite est celui fait en dehors des cas autorisés comme l’intérim (art. L.8241-1)."], ["qcm", "Selon l’enseignant, marchandage et prêt illicite de main-d’œuvre…", ["Recouvrent en pratique la même chose", "N’ont aucun rapport", "Sont autorisés depuis 2017"], "Le Code du travail les distingue toutefois (L.8231-1 et L.8241-1)."], ["qcm", "Dans quel secteur le cours dit-il qu’on retrouve aussi l’emploi de travailleurs sans papiers ?", ["Le bâtiment", "L’enseignement", "La banque"], "Exemple donné à l’oral."], ["cas", "Cas pratique : une association oublie volontairement de déclarer un animateur embauché pour l’été. Qu’encourt-elle ?", ["Les sanctions du travail dissimulé", "Rien, c’est un emploi saisonnier", "Un simple rappel à l’ordre"], "L’absence volontaire de déclaration est une dissimulation d’emploi."], ["qcm", "Quel article définit l’emploi d’un étranger sans titre ?", ["L.8251-1 du Code du travail", "L.1132-1", "R.1221-9"], "L.8251-1 vise l’étranger sans titre l’autorisant à travailler en France."]]}, {"id": "3.2", "title": "Les sanctions du travail dissimulé", "fiche": [["t", [["Sanctions", "Contenu"], ["Pénales", "3 ans d’emprisonnement et 45 000 € d’amende (225 000 € pour une personne morale)"], ["Civiles", "Payer rémunérations, indemnités et charges dues ; 6 mois de salaire forfaitaires au salarié ; redressement des cotisations"], ["Administratives", "Impôts et cotisations rétroactifs ; restitution des aides publiques ; interdiction des marchés publics pendant 5 ans"]]], ["def", "**Soumissionner** = répondre à un appel d’offres. **Redressement** : l’Urssaf réclame les cotisations éludées, avec pénalités."], ["eg", "L’ILIS lance un appel d’offres pour des travaux : une entreprise qui a dissimulé des salariés peut être exclue des marchés publics jusqu’à 5 ans."]], "qs": [["qcm", "Quelles sont les sanctions pénales du travail dissimulé (personne physique) ?", ["3 ans d’emprisonnement et 45 000 € d’amende", "1 an et 15 000 €", "5 ans et 100 000 €"], "Sanctions vues en cours ; l’employeur peut passer devant le tribunal correctionnel."], ["qcm", "Quelle amende maximale pour une personne morale ?", ["225 000 €", "45 000 €", "1 000 000 €"], "Le quintuple de l’amende des personnes physiques."], ["qcm", "Quelle indemnité forfaitaire est due au salarié victime ?", ["6 mois de salaire", "1 mois de salaire", "2 ans de salaire"], "C’est une sanction civile."], ["qcm", "Quel type de sanction est l’interdiction de soumissionner aux marchés publics ?", ["Administrative", "Pénale", "Civile"], "Elle peut durer 5 ans."], ["trou", "Complète : l’interdiction de soumissionner aux marchés publics peut durer ___ ans.", ["5", "2", "10"], "Un important manque à gagner pour l’entreprise."], ["qcm", "Que signifie « soumissionner » ?", ["Répondre à un appel d’offres", "Se soumettre à un contrôle", "Payer une amende"], "Les entreprises soumissionnent pour obtenir un marché public."], ["qcm", "Qu’est-ce que le redressement ?", ["L’Urssaf réclame les cotisations éludées et des pénalités", "Le salarié redresse son contrat", "Une remise de dette"], "Le redressement forfaitaire de cotisations est une sanction civile."], ["qcm", "Lequel est une sanction civile ?", ["Le paiement des rémunérations, indemnités et charges dues", "3 ans d’emprisonnement", "L’exclusion des marchés publics"], "Les sanctions civiles portent sur ce qui est dû aux victimes."], ["qcm", "Lequel est une sanction administrative ?", ["La restitution des aides publiques", "L’indemnité de 6 mois de salaire", "L’emprisonnement"], "Les sanctions administratives touchent les impôts, cotisations et aides publiques."], ["vf", "Vrai ou faux ? Les impôts dus sont payés rétroactivement, avec des pénalités de retard.", ["Vrai", "Faux"], "Vrai : sanction administrative."], ["vf", "Vrai ou faux ? Aucun employeur n’a jamais été condamné pénalement pour travail dissimulé.", ["Faux", "Vrai"], "Faux : des employeurs ont déjà été condamnés devant le tribunal correctionnel."], ["qcm", "Combien de types de sanctions le cours présente-t-il ?", ["3 : pénales, civiles, administratives", "2 : pénales et civiles", "1 : l’amende"], "Ce sont les trois familles de sanctions."], ["qcm", "Pourquoi les marchés publics sont-ils recherchés par les entreprises ?", ["Ils paient bien, même s’ils paient parfois en retard", "Ils sont sans contrôle", "Ils sont réservés aux associations"], "D’où le poids de l’exclusion pendant 5 ans."], ["cas", "Cas pratique : l’entreprise choisie pour les travaux de l’ILIS employait des salariés non déclarés. Que risque-t-elle en plus des sanctions pénales et civiles ?", ["L’interdiction de répondre aux marchés publics jusqu’à 5 ans", "Aucune autre sanction", "La fermeture définitive automatique"], "Exemple donné à l’oral."], ["cas", "Cas pratique : un salarié non déclaré pendant un an demande ce qu’il peut obtenir. Que lui répondre ?", ["Une indemnité forfaitaire de 6 mois de salaire, en plus des sommes dues", "Rien, faute de contrat", "Seulement un certificat de travail"], "Les sanctions civiles protègent le salarié victime."], ["trou", "Complète : sanctions pénales : ___ ans d’emprisonnement.", ["3", "1", "7"], "Et 45 000 € d’amende."], ["vf", "Vrai ou faux ? Ces sanctions sont celles du travail dissimulé ; chaque infraction de travail illégal a ses propres sanctions.", ["Vrai", "Faux"], "Vrai : précision du droit en vigueur."], ["qcm", "Que doit payer l’employeur, pour le passé, au titre des sanctions civiles ?", ["Rémunérations, indemnités et charges des heures ou salariés non déclarés", "Uniquement une amende à l’État", "Rien si le salarié est parti"], "Précisé à l’oral."], ["qcm", "Que se passe-t-il pour les aides publiques reçues ?", ["L’employeur doit les restituer ou ne les reçoit plus", "Il les garde", "Elles sont doublées"], "Restitution ou non-attribution des aides publiques."], ["qcm", "Devant quelle juridiction l’employeur peut-il être traduit au pénal ?", ["Le tribunal correctionnel", "Le conseil de prud’hommes", "Le tribunal de commerce"], "Précisé à l’oral."]]}]}, {"n": 4, "title": "La période d’essai", "unites": [{"id": "4.1", "title": "Finalités et conditions de la période d’essai", "fiche": [["def", "La période d’essai **ne se présume pas** : elle doit être **écrite** (contrat, mail…). Elle n’est **pas obligatoire**."], ["li", ["Pour l’employeur : évaluer les compétences du salarié (« à 80 % » pour lui, selon l’enseignant).", "Pour le salarié : vérifier que le poste correspond à ses attentes.", "Pas de contrat écrit, ou contrat muet : **pas de période d’essai**."]], ["def", "CDD puis CDI : pas d’essai si **même poste** et CDD **au moins aussi long** que l’essai ; sinon, la durée du CDD est déduite (art. L.1243-11)."], ["eg", "Essai de 2 mois, CDD de cuisinier de 1 mois, puis CDI de cuisinier : il reste 1 mois d’essai. Avec 3 mois de CDD : plus d’essai."]], "qs": [["vf", "Vrai ou faux ? La période d’essai se présume, même sans écrit.", ["Faux", "Vrai"], "Faux : elle ne se présume pas, elle doit être écrite."], ["vf", "Vrai ou faux ? La période d’essai est obligatoire.", ["Faux", "Vrai"], "Faux : c’est une possibilité, pas une obligation."], ["qcm", "À quoi sert la période d’essai pour l’employeur ?", ["Évaluer les compétences du salarié dans son travail", "Fixer son salaire définitif", "Le former gratuitement"], "Vérifier ce que le candidat a affirmé en entretien."], ["qcm", "À quoi sert la période d’essai pour le salarié ?", ["Vérifier que le poste correspond à ses attentes", "Négocier une prime", "Éviter les cotisations"], "Exemple du directeur parti puis revenu chez son ancien employeur."], ["qcm", "Pas de contrat écrit et aucune notification : y a-t-il une période d’essai ?", ["Non", "Oui, de 2 mois", "Oui, de 1 mois"], "Sans écrit, pas de période d’essai."], ["qcm", "Sans contrat écrit, comment l’employeur peut-il mettre un salarié à l’essai ?", ["En la lui notifiant par écrit (courrier, mail…)", "Oralement suffit", "C’est impossible"], "Précisé à l’oral : notification par tout moyen écrit."], ["qcm", "Quand un salarié passe de CDD en CDI, la durée du CDD…", ["Est déduite de la période d’essai (même poste)", "Est ignorée", "Double la période d’essai"], "Art. L.1243-11 du Code du travail."], ["cas", "Cas pratique : essai de 3 mois, CDD de 2 mois sur le même poste. Combien reste-t-il d’essai en CDI ?", ["1 mois", "3 mois", "Aucun"], "3 − 2 = 1 mois."], ["cas", "Cas pratique : cuisinier en CDD 3 mois, puis CDI de cuisinier avec un essai de 2 mois. Combien d’essai ?", ["Aucun", "2 mois", "1 mois"], "Le CDD a duré au moins autant que l’essai : il n’en reste plus."], ["cas", "Cas pratique : CDD de cuisinier, puis CDI de directeur. L’employeur peut-il imposer un essai ?", ["Oui : ce n’est pas le même poste", "Non, jamais", "Seulement de 24 heures"], "Première condition non remplie : poste différent."], ["qcm", "Quelles sont les deux conditions pour ne pas subir d’essai après un CDD ?", ["Même poste et CDD au moins aussi long que l’essai", "Même salaire et même horaire", "Accord du CSE et de l’Urssaf"], "Précisé à l’oral."], ["trou", "Complète : selon l’enseignant, la période d’essai sert « à ___ % » à l’employeur.", ["80", "50", "100"], "Mais elle sert aussi au salarié."], ["vf", "Vrai ou faux ? Si le contrat ne mentionne pas de période d’essai, il n’y en a pas.", ["Vrai", "Faux"], "Vrai : selon le cours de M. Mananga."], ["cas", "Cas pratique : un directeur quitte son poste pour un « poste idéal » qui s’avère problématique. Que peut-il faire pendant l’essai ?", ["Mettre fin à la période d’essai", "Rien, il est engagé", "Demander un licenciement"], "L’essai permet aussi au salarié de partir si le poste ne lui convient pas."], ["qcm", "Si l’employeur estime que le salarié ne fait pas l’affaire pendant l’essai…", ["La période d’essai prend fin et le salarié perd son travail", "Il doit le garder 1 an", "Il doit le reclasser"], "C’est la finalité même de l’essai."], ["vf", "Vrai ou faux ? Un salarié peut être embauché sans période d’essai.", ["Vrai", "Faux"], "Vrai : la période d’essai est facultative."], ["qcm", "Sous quelle forme la période d’essai doit-elle figurer ?", ["Par écrit (contrat, mail, document…)", "Oralement", "Sur l’affichage interne"], "Elle ne se présume pas."], ["qcm", "Quel article prévoit la déduction de la durée du CDD ?", ["L.1243-11", "L.1221-25", "R.1221-9"], "Art. L.1243-11 du Code du travail."], ["cas", "Cas pratique : Lucas a fait 1 mois de CDD d’aide-soignant ; on lui propose un CDI d’aide-soignant avec 2 mois d’essai. Que lui répondre ?", ["Il reste 1 mois d’essai à faire", "Il doit refaire 2 mois", "Il n’a aucun essai"], "La durée du CDD est déduite."], ["qcm", "La période d’essai sert à l’employeur à vérifier…", ["Ce que le candidat a affirmé en entretien", "Son casier judiciaire", "Sa situation familiale"], "« Montrez-nous que vous savez le faire. »"]]}, {"id": "4.2", "title": "Période d’essai et période probatoire", "fiche": [["t", [["", "Période d’essai", "Période probatoire"], ["Qui ?", "Salarié qui entre dans l’entreprise", "Salarié déjà en CDI qui change de poste (promotion, nouvelle affectation)"], ["Finalités", "Évaluer le salarié ; vérifier que le poste lui convient", "Les mêmes"], ["Si non concluante", "Rupture : le salarié part", "Retour au poste d’origine"]]], ["li", ["C’est l’employeur qui fixe la durée de la période probatoire ; le salarié reste payé.", "Même poste sur un autre site : pas de période probatoire.", "Après un échec, le salarié perd la rémunération et les avantages du nouveau poste.", "Reclassement après inaptitude : ni essai ni probatoire ; l’employeur doit former."]], ["warn", "Prévoir la période probatoire **par écrit** : sinon, le salarié peut négocier son retour en gardant les avantages."]], "qs": [["vf", "Vrai ou faux ? Période d’essai et période probatoire sont la même chose.", ["Faux", "Vrai"], "Faux : mêmes finalités, mais la probatoire concerne un salarié déjà en CDI qui change de poste."], ["qcm", "À qui s’applique la période probatoire ?", ["À un salarié déjà en CDI qui change de poste", "À un nouveau salarié", "À un stagiaire"], "Promotion sociale ou nouvelle affectation."], ["qcm", "Que se passe-t-il si la période probatoire n’est pas concluante ?", ["Le salarié retrouve son poste d’origine", "Il est licencié", "Il démissionne"], "On ne le licencie pas : il revient sur son poste."], ["qcm", "Qui décide de la durée de la période probatoire ?", ["L’employeur", "Le CSE", "La loi : 2 mois"], "C’est l’employeur qui la fixe."], ["vf", "Vrai ou faux ? Pendant la période probatoire, le salarié continue d’être rémunéré.", ["Vrai", "Faux"], "Vrai : réponse de l’enseignant à une question d’étudiant."], ["cas", "Cas pratique : cuisinier en CDI depuis 20 ans, promu directeur de la restauration. L’employeur peut-il prévoir une période probatoire ?", ["Oui : c’est un nouveau poste", "Non, jamais", "Il doit prévoir une période d’essai"], "Exemple donné en cours."], ["cas", "Cas pratique : un salarié passe de Lille à Maubeuge pour le même poste. Période probatoire ?", ["Non : pas de changement de poste", "Oui, toujours", "Oui, de 4 mois"], "La probatoire suppose un changement de poste."], ["cas", "Cas pratique : un salarié quitte son entreprise pour une autre. On parle de…", ["Période d’essai", "Période probatoire", "Reclassement"], "Le nouvel employeur ne le connaît pas."], ["cas", "Cas pratique : CDD plus court que la période d’essai, puis CDI. Le salarié est en…", ["Période d’essai (pour le temps restant)", "Période probatoire", "Aucune période"], "Il n’était pas encore en CDI : ce n’est pas une probatoire."], ["cas", "Cas pratique : un cuisinier promu directeur échoue et revient. Garde-t-il son salaire et sa voiture de directeur ?", ["Non : il retrouve les conditions de son poste d’origine", "Oui, toujours", "Oui, pendant 1 an"], "Il ne garde pas les avantages du poste de directeur."], ["qcm", "Sur un poste de reclassement après inaptitude…", ["Aucune période d’essai ni probatoire ; l’employeur doit former le salarié", "Une période probatoire est obligatoire", "Une période d’essai de 2 mois s’applique"], "Précisé à l’oral."], ["qcm", "Pourquoi prévoir la période probatoire par écrit ?", ["Pour éviter qu’un salarié revienne en gardant les avantages du poste supérieur", "Parce que la loi l’impose à peine de nullité", "Pour la rendre plus longue"], "Exemple du chef de service revenu avec le salaire de directeur."], ["trou", "Complète : si la période d’essai n’est pas concluante, le salarié part ; si la période ______ ne l’est pas, il retrouve son poste.", ["probatoire", "d’essai", "de prévenance"], "C’est la différence clé."], ["qcm", "Quelles sont les finalités de la période probatoire ?", ["Les mêmes que la période d’essai", "Fixer un nouveau salaire", "Sanctionner le salarié"], "Évaluer les compétences et permettre au salarié de vérifier que le poste lui convient."], ["vf", "Vrai ou faux ? Une promotion sociale peut donner lieu à une période probatoire.", ["Vrai", "Faux"], "Vrai : c’est le cas typique."], ["qcm", "« Je ne vous connais pas, je vous mets à l’essai ; si vous ne faites pas l’affaire, vous rentrez chez vous. » Il s’agit de…", ["La période d’essai", "La période probatoire", "Le délai de prévenance"], "Exemple donné à l’oral."], ["cas", "Cas pratique : Marie, infirmière en CDI, devient cadre de santé avec une période probatoire. Ça ne marche pas. Que se passe-t-il ?", ["Elle redevient infirmière", "Elle est licenciée", "Elle garde le poste de cadre"], "Retour au poste d’origine."], ["vf", "Vrai ou faux ? Un salarié reclassé après inaptitude peut être mis en période d’essai.", ["Faux", "Vrai"], "Faux : ni essai ni probatoire sur un poste de reclassement."], ["qcm", "Quel est le point commun entre essai et probatoire ?", ["Leurs finalités", "Le sort du salarié en cas d’échec", "Les salariés concernés"], "Les finalités sont identiques."], ["qcm", "Un chef de service promu directeur sans période probatoire écrite revient à son poste. Qu’a-t-il obtenu en négociant ?", ["Garder le salaire et les avantages de directeur", "Une indemnité de licenciement", "Une rétrogradation de salaire"], "Exemple de l’enseignant."]]}, {"id": "4.3", "title": "Durée, renouvellement et prolongation (CDI)", "fiche": [["t", [["Catégorie", "Durée maximale", "Avec renouvellement"], ["Ouvriers et employés", "2 mois", "4 mois au total"], ["Agents de maîtrise et techniciens", "3 mois", "6 mois au total"], ["Cadres", "4 mois", "8 mois au total"]]], ["def", "**Renouvellement** : une seule fois, si un **accord de branche étendu** le prévoit, s’il figure au contrat et avec l’**accord exprès** du salarié, annoncé avant la fin du premier essai."], ["li", ["**Prolongation** : possible en cas d’absence (maladie, accident du travail, fermeture) : l’essai est suspendu puis reprend.", "Accord **étendu** : un arrêté ministériel l’applique à toutes les entreprises de la branche.", "Secteur social et médico-social : pas de renouvellement (pas d’accord le prévoyant)."]], ["warn", "Depuis 2017, l’accord d’entreprise prime en général sur l’accord de branche, sauf domaines réservés, dont le renouvellement de l’essai."]], "qs": [["qcm", "Durée maximale de la période d’essai d’un ouvrier ou employé en CDI ?", ["2 mois", "3 mois", "4 mois"], "2 mois, 4 avec renouvellement."], ["qcm", "Durée maximale pour un agent de maîtrise ou technicien ?", ["3 mois", "2 mois", "4 mois"], "3 mois, 6 avec renouvellement."], ["qcm", "Durée maximale pour un cadre ?", ["4 mois", "3 mois", "6 mois"], "4 mois, 8 avec renouvellement."], ["qcm", "Durée totale maximale pour un cadre, renouvellement compris ?", ["8 mois", "6 mois", "12 mois"], "4 + 4 mois."], ["qcm", "À quelle condition le
