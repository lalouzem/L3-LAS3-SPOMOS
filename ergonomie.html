<style>
:root{--paper:#F5F7FA;--card:#FFFFFF;--ink:#1E293B;--muted:#64748B;--line:#E2E8F0;--pri:#1E40AF;--pri-soft:#EFF6FF;--on-pri:#FFFFFF;
--acc:#D97706;--acc-soft:#FEF3C7;--ok:#15803D;--ok-soft:#DCFCE7;--ko:#B91C1C;--ko-soft:#FEE2E2;--def:#0B6E79;--def-bg:#E0F5F7;--eg:#2E7D32;
--la:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ti:"Comfortaa","Open Sans",system-ui,sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F172A;--card:#1E293B;--ink:#F1F5F9;--muted:#94A3B8;--line:#334155;--pri:#60A5FA;--pri-soft:#1E3A8A;--on-pri:#0F172A;--acc:#F59E0B;--acc-soft:#451A03;--ok:#4ADE80;--ok-soft:#14532D;--ko:#F87171;--ko-soft:#7F1D1D;--def:#7FE3EA;--def-bg:#123A40;--eg:#81C784;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F172A;--card:#1E293B;--ink:#F1F5F9;--muted:#94A3B8;--line:#334155;--pri:#60A5FA;--pri-soft:#1E3A8A;--on-pri:#0F172A;--acc:#F59E0B;--acc-soft:#451A03;--ok:#4ADE80;--ok-soft:#14532D;--ko:#F87171;--ko-soft:#7F1D1D;--def:#7FE3EA;--def-bg:#123A40;--eg:#81C784;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--la)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,.score{font-family:var(--ti)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.home{border:0;background:none;color:var(--pri);font-weight:700;padding:6px 0}
body[data-view="home"] .home{visibility:hidden}
.hint{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 64px}
h1{font-size:clamp(23px,5.5vw,30px);line-height:1.25;margin:4px 0 6px;color:var(--pri)}
.lead{color:var(--muted);margin:0 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--pri);background:transparent;color:var(--pri);font-weight:600;text-decoration:none}
.btn.solid{background:var(--pri);color:var(--on-pri)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px}
.btn.danger{border-color:var(--ko);color:var(--ko)}
.btn.danger.armed{background:var(--ko);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--ti);font-size:22px;color:var(--pri)}
.stat span{font-size:12px;color:var(--muted)}
.lesson{margin:22px 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.chap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.chap h2{font-size:17px;margin:0 0 4px}
.chapbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px}
.units{list-style:none;margin:0;padding:0}
.unit{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.uid{flex:none;min-width:38px;height:28px;padding:0 6px;border-radius:8px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:13px}
.unit.done .uid{background:var(--ok);color:var(--card)}
.unit.soon{opacity:.55}
.ub{flex:1;min-width:0}
.ut{font-weight:600;line-height:1.35}
.um{font-size:13px;color:var(--muted)}
.ua{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.meta{color:var(--muted);font-size:14px}
.fiche h2{font-size:20px;margin:0 0 10px}
.def{background:var(--def-bg);border-left:4px solid var(--def);border-radius:10px;padding:10px 12px;margin:10px 0}
.def::before{content:"À mémoriser";display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--def);margin-bottom:2px}
.eg{border-left:4px solid var(--eg);padding:6px 12px;margin:10px 0;color:var(--ink)}
.eg::before{content:"Exemple";display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--eg)}
.warn{background:var(--acc-soft);border-radius:10px;padding:8px 12px;margin:10px 0}
.fiche ul{margin:8px 0;padding-left:20px}.fiche li{margin:4px 0}
.tblw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--pri-soft);color:var(--pri)}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin:0 0 6px}
.lg{padding:2px 8px;border-radius:6px;font-weight:600}
.lg.d{background:var(--def-bg);color:var(--def)}.lg.e{border:1px solid var(--eg);color:var(--eg)}.lg.w{background:var(--acc-soft)}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.bar h1{font-size:20px;margin:0}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--pri-soft);color:var(--pri);margin:0 6px 8px 0}
.tag.cas{background:var(--acc-soft);color:var(--acc)}
.qtxt{font-size:17px;font-weight:600;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{min-height:50px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:15px;line-height:1.4;text-align:left}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ko{border-color:var(--ko);background:var(--ko-soft)}
.fb{margin-top:12px}
.verdict{font-weight:700;font-size:17px;font-family:var(--ti)}
.verdict.good{color:var(--ok)}.verdict.bad{color:var(--ko)}
.expl{margin-top:6px;font-size:15px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:10px 12px}
.end{text-align:center}
.score{font-size:52px;font-weight:700;color:var(--pri);margin:6px 0 0}
.corr{padding:12px 0;border-bottom:1px solid var(--line)}
.corr .qtxt{font-size:15px}
.cbad{color:var(--ko);font-size:14px}.cgood{color:var(--ok);font-size:14px}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>

(function(){
"use strict";
const M = {"key": "ergonomie", "title": "Les bases de l’ergonomie", "sub": "Chantal Lebert et Christelle Lemaitre · Sessions 1 et 2", "lecons": [{"n": 1, "title": "Session 1 : l’ergonomie et le travail", "chapitres": [{"n": 1, "title": "Qu’est-ce que l’ergonomie ?", "unites": [{"id": "1.1", "title": "Objets ergonomiques ou non ?", "fiche": [["t", [["Objet", "Avantages", "Limites"], ["Ordinateur portable", "Déplaçable, alternance des postures, léger, autonome, touches souples", "Pas adapté au travail fixe : flexion des cervicales et des poignets, petit écran, souris intégrée sollicitant les doigts"], ["Souris verticale ou centrale", "Limite la rotation du poignet et de l’avant-bras, soulage l’épaule, existe pour gauchers", "Volumineuse (petites mains), temps d’adaptation ; la centrale prend la place devant le clavier (porte-document)"]]], ["def", "Un objet n’est jamais ergonomique **en soi** : tout dépend de l’**usage**, de l’**utilisateur** et de la **situation de travail**."]], "qs": [["qcm", "Selon le cours, un objet est-il ergonomique en soi ?", ["Non : cela dépend de l’usage, de l’utilisateur et de la situation", "Oui, s’il porte l’étiquette « ergonomique »", "Oui, s’il est cher"], "Message central de l’introduction du cours."], ["qcm", "Quel est un avantage de l’ordinateur portable ?", ["Il permet l’alternance des postures", "Il évite la flexion des cervicales", "Il a un grand écran"], "Facile à déplacer, il permet de changer de posture."], ["qcm", "Quelle est une limite de l’ordinateur portable pour un travail fixe ?", ["La flexion des cervicales", "Son poids élevé", "Son bruit important"], "L’écran bas oblige à fléchir la nuque."], ["vf", "Vrai ou faux ? L’ordinateur portable est adapté au travail « fixe » prolongé.", ["Faux", "Vrai"], "Faux : c’est l’une de ses limites."], ["qcm", "Quel est l’avantage principal de la souris verticale ?", ["Elle limite la rotation du poignet et de l’avant-bras", "Elle est plus petite", "Elle ne demande aucune adaptation"], "Le bras reste en position neutre."], ["qcm", "Quelle est une limite de la souris verticale ?", ["Elle est volumineuse : attention aux petites mains", "Elle n’existe pas pour les gauchers", "Elle sollicite davantage l’épaule"], "Elle demande aussi un temps d’adaptation."], ["qcm", "Pourquoi la souris centrale demande-t-elle un porte-document ?", ["Elle prend la place devant le clavier", "Elle est trop lourde", "Elle remplace l’écran"], "Le porte-document surélève l’écran et libère la place."], ["vf", "Vrai ou faux ? La souris ergonomique existe aussi pour les gauchers.", ["Vrai", "Faux"], "Vrai : c’est un des avantages cités."], ["qcm", "La souris verticale compare le « bras tordu » au…", ["Bras en position neutre", "Bras tendu", "Bras levé"], "Illustration du diaporama."], ["qcm", "Quelle limite concerne la souris intégrée de l’ordinateur portable ?", ["La sollicitation fine des doigts", "Le bruit", "Le poids"], "Elle sollicite finement les doigts."], ["trou", "Complète : un objet n’est jamais ergonomique « ______ ».", ["en soi", "à vie", "sans écran"], "Tout dépend du contexte d’utilisation."], ["cas", "Cas pratique : une secrétaire travaille 7 h par jour sur un portable posé sur son bureau et a mal à la nuque. Pourquoi ?", ["Le portable impose une flexion des cervicales en travail fixe", "Le portable est trop lourd", "La souris est trop grande"], "Pour un travail fixe, il faut rehausser l’écran (support, écran externe)."], ["cas", "Cas pratique : un salarié aux petites mains a du mal avec sa nouvelle souris verticale. Qu’en dire ?", ["C’est une limite connue : elle est volumineuse", "Il doit forcer", "La souris est défectueuse"], "Un objet « ergonomique » ne convient pas à tout le monde."], ["qcm", "Quel avantage du portable concerne l’énergie ?", ["Son autonomie", "Sa durée de vie plus longue", "Sa puissance supérieure"], "Le portable est autonome ; sa durée de vie est en revanche plus faible."], ["vf", "Vrai ou faux ? L’ordinateur portable a une durée de vie plus faible qu’un fixe.", ["Vrai", "Faux"], "Vrai : c’est une des limites citées."], ["qcm", "Quelle partie du corps la souris verticale soulage-t-elle aussi ?", ["L’épaule", "Le genou", "Le dos"], "Elle limite les sollicitations de l’épaule."], ["qcm", "L’ordinateur portable entraîne une flexion…", ["Des cervicales et des poignets", "Des genoux", "Des chevilles"], "Deux limites posturales citées."], ["cas", "Cas pratique : un fournisseur vante une chaise « 100 % ergonomique pour tous ». Comment réagir ?", ["Douter : l’ergonomie dépend de l’utilisateur et de l’usage", "L’acheter pour tous", "Refuser toute chaise réglable"], "Aucun objet ne convient à tous dans toutes les situations."], ["qcm", "Que faut-il analyser avant de dire qu’un objet est ergonomique ?", ["L’usage, l’utilisateur et la situation de travail", "Son prix", "Sa couleur"], "Ce sont les trois éléments à prendre en compte."], ["vf", "Vrai ou faux ? La souris verticale demande un temps d’adaptation.", ["Vrai", "Faux"], "Vrai."]]}, {"id": "1.2", "title": "Origine de l’ergonomie", "fiche": [["def", "**Ergonomie** vient du grec **ergon** (travail) et **nomos** (loi) : la **science du travail**."], ["li", ["Mot employé dès **1857** par le Polonais Wojciech Jastrzębowski.", "Repris en **1949** au Royaume-Uni par K. F. H. Murrell (création de l’Ergonomics Research Society)."]]], "qs": [["qcm", "D’où vient le mot « ergonomie » ?", ["Du grec ergon (travail) et nomos (loi)", "Du latin ergo (donc) et nomen (nom)", "De l’anglais ergonomics uniquement"], "Ergon = travail, nomos = loi."], ["qcm", "Que signifie « ergon » ?", ["Travail", "Loi", "Homme"], "Ergon = travail."], ["qcm", "Que signifie « nomos » ?", ["Loi", "Travail", "Corps"], "Nomos = loi, règle."], ["trou", "Complète : l’ergonomie est la science du ______.", ["travail", "sport", "commerce"], "Ergon + nomos."], ["qcm", "Qui emploie le mot dès 1857 ?", ["Wojciech Jastrzębowski", "Alain Wisner", "Aristote"], "Un Polonais, dès 1857."], ["qcm", "Qui reprend le terme en 1949 au Royaume-Uni ?", ["K. F. H. Murrell", "Léonard de Vinci", "François Daniellou"], "Lors de la création de l’Ergonomics Research Society."], ["qcm", "En quelle année le mot apparaît-il pour la première fois selon le cours ?", ["1857", "1949", "1956"], "Chez Jastrzębowski."], ["qcm", "Quelle société est créée en 1949 ?", ["L’Ergonomics Research Society", "L’OMS", "L’INRS"], "Au Royaume-Uni."], ["vf", "Vrai ou faux ? Le mot ergonomie est d’origine grecque.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? « Nomos » signifie travail.", ["Faux", "Vrai"], "Faux : nomos = loi ; ergon = travail."], ["qcm", "De quel pays était Jastrzębowski ?", ["La Pologne", "Le Royaume-Uni", "La France"], "Polonais."], ["qcm", "Dans quel pays le terme est-il repris en 1949 ?", ["Le Royaume-Uni", "Les États-Unis", "La France"], "Par K. F. H. Murrell."], ["trou", "Complète : ergonomie = ergon (______) + nomos (loi).", ["travail", "homme", "mouvement"], "Étymologie."], ["cas", "Cas pratique : en examen, « Donnez l’étymologie du mot ergonomie ». Réponse attendue ?", ["Ergon (travail) + nomos (loi) : la science du travail", "Ergo (donc) + nomie (nom)", "Ergon (énergie) + nomos (mesure)"], "Question de cours classique."], ["qcm", "Combien d’années séparent les deux dates clés du mot ?", ["92 ans (1857-1949)", "50 ans", "10 ans"], "1857 puis 1949."], ["vf", "Vrai ou faux ? Murrell a créé l’Ergonomics Research Society en 1949.", ["Vrai", "Faux"], "Vrai."], ["qcm", "« La science du travail » est la traduction de…", ["Ergonomie", "Économie", "Physiologie"], "Ergon + nomos."], ["qcm", "Quelle paire est correcte ?", ["1857 : Jastrzębowski ; 1949 : Murrell", "1857 : Murrell ; 1949 : Jastrzębowski", "1857 : Wisner ; 1949 : Aristote"], "Ordre chronologique du cours."], ["vf", "Vrai ou faux ? Le mot ergonomie est apparu au XXIe siècle.", ["Faux", "Vrai"], "Faux : dès 1857."], ["qcm", "L’ergonomie étudie donc les « lois » du…", ["Travail", "Marché", "Langage"], "Ergon = travail."]]}, {"id" ividu) / système de travail (collectif)", "Connaissances / intervention", "Passé / futur"], "Deux pôles : individu et collectif."], ["qcm", "Que représente l’axe horizontal ?", ["Connaissances / intervention", "Individu / collectif", "Santé / économie"], "Laboratoire d’un côté, terrain de l’autre."], ["qcm", "Le pôle « intervention » correspond à…", ["Terrain, performances, démarche, évaluation", "Laboratoires, fonctions humaines", "Lois et règlements"], "Pôle 2 de l’axe horizontal."], ["qcm", "Le pôle « connaissances » correspond à…", ["Laboratoires, fonctions humaines, méthodes, validation", "Terrain et démarche", "Organisation du collectif"], "Pôle 1 de l’axe horizontal."], ["vf", "Vrai ou faux ? Les disciplines de l’ergonomie ont évolué avec la transformation des organisations du travail.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : la médecine du travail est associée au mot-clé « ______ ».", ["postes", "aptitudes", "comportements"], "Sciences techniques."], ["cas", "Cas pratique : un ergonome analyse le stress d’une équipe et les relations entre collègues. Quelles disciplines mobilise-t-il surtout ?", ["Psychologie et sociologie", "Physiologie seule", "Hygiène industrielle seule"], "Sciences humaines : comportements."], ["cas", "Cas pratique : un ergonome mesure l’effort de soulèvement d’une aide-soignante. Quelle discipline ?", ["La physiologie", "La sociologie", "La gestion"], "Sciences de la vie : aptitudes physiques."], ["cas", "Cas pratique : un ergonome revoit les plannings et la répartition des tâches. Quelle famille de sciences ?", ["Les sciences de l’organisation (gestion)", "La physiologie", "La médecine"], "Mot-clé : organisation."], ["qcm", "Combien de familles de sciences le schéma présente-t-il ?", ["4", "2", "6"], "Vie, humaines, techniques, politiques."], ["vf", "Vrai ou faux ? L’ergonomie relève d’une seule discipline : la médecine du travail.", ["Faux", "Vrai"], "Faux : elle est pluridisciplinaire."], ["qcm", "Que place le schéma au cent ice cités."], ["qcm", "La sécurité, pour l’ergonome, c’est notamment…", ["La prévention des accidents", "La vidéosurveillance", "Le gardiennage"], "Sécurité = prévention des accidents."], ["trou", "Complète : l’ergonome étudie des situations de travail des ______.", ["professionnels", "clients", "actionnaires"], "Il part du travail réel."], ["vf", "Vrai ou faux ? L’ergonome cherche à valoriser les capacités des professionnels.", ["Vrai", "Faux"], "Vrai."], ["qcm", "Quel organisme cité en cours emploie des ergonomes ?", ["La CARSAT", "La CNIL", "L’Urssaf"], "Caisse d’assurance retraite et de la santé au travail."], ["cas", "Cas pratique : une clinique fait appel à un ergonome car les aides-soignantes ont mal au dos. Que va-t-il faire d’abord ?", ["Étudier leurs situations de travail réelles", "Leur imposer une ceinture lombaire", "Changer tout le mobilier sans analyse"], "Il part de l’analyse des situations."], ["cas", "Cas pratique : un ergonome propose un aménagement très coûteux qui ruinerait l’entreprise. Qu’oublie-t-il ?", ["Les objectifs économiques de l’entreprise", "La santé des salariés", "La sécurité"], "Il doit en tenir compte."], ["qcm", "Lequel n’est PAS un volet des conditions de travail cité ?", ["Le chiffre d’affaires", "La santé", "La pénibilité", "Le bien-être"], "Les quatre volets : sécurité, santé, pénibilité, bien-être."], ["qcm", "L’ergonome travaille…", ["Avec les professionnels et leurs compétences", "Contre les salariés", "Sans contact avec le terrain"], "Démarche participative."], ["vf", "Vrai ou faux ? Un ergonome peut exercer en indépendant.", ["Vrai", "Faux"], "Vrai."], ["qcm", "Que signifie « interne » comme lieu d’exercice ?", ["Ergonome salarié de l’entreprise", "Ergonome stagiaire", "Ergonome à l’hôpital uniquement"], "Il travaille au sein de la structure."], ["trou", "Complète : l’objectif est d’améliorer les conditions de travail en termes de sécurité, santé, pénibilité ou ______.", ["bien-être", "rentabilité", "discipline"], "Quatr HM doit être…", ["Utilisable et utile", "Belle et chère", "Complexe et complète"], "Intuitive pour les novices, rapide pour les experts, avec les fonctions utiles."], ["qcm", "Que signifie IHM ?", ["Interface Homme/Machine", "Indice d’hygiène médicale", "Institut d’hospitalisation mobile"], "Domaine d’intervention."], ["qcm", "En conception architecturale, l’ergonome…", ["Prend en compte les contraintes des locaux dès la conception", "Choisit la couleur des murs", "Gère le chantier"], "Agir avant la construction."], ["qcm", "Quelle action relève de l’organisation du travail ?", ["La répartition de la charge de travail", "Le choix d’une souris", "La pose d’un sol"], "Liste d’actions du cours."], ["qcm", "Qu’est-ce que la conduite de changement participative ?", ["Changer l’organisation avec l’ensemble des professionnels", "Imposer un changement sans concertation", "Licencier pour réorganiser"], "Nouvelle organisation ou process avec les professionnels."], ["qcm", "Pour un objet connecté (pilulier, canne…), que faut-il analyser ?", ["L’usage et l’usager : qui ? pour quoi faire ?", "Seulement le prix", "Seulement la batterie"], "Message clé du domaine IHM."], ["qcm", "Quel problème architectural est cité en cours ?", ["Efforts de poussée dus au sol en PVC", "Couleur des rideaux", "Parking trop grand"], "Ex. : brancard poussé dans un couloir."], ["cas", "Cas pratique : une auxiliaire de crèche donne le biberon assise sur un tabouret très bas. Quel domaine ?", ["Santé / travail (charge physique)", "IHM", "Ergo-marketing"], "Exemple photo du cours."], ["cas", "Cas pratique : un agent n’a qu’une main fonctionnelle et reçoit un clavier adapté. Quel domaine ?", ["Handicap", "Architecture", "Management"], "Adaptation du poste à la personne."], ["cas", "Cas pratique : un hôpital conçoit un nouveau service et consulte un ergonome sur la largeur des couloirs. Quel domaine ?", ["Conception architecturale", "Fiabilité humaine", "Ergo-marketing"], "Contraintes des locaux dès la con "], "Approche globale."], ["trou", "Complète : l’Homme est engagé dans un rapport à la production, à ______ et aux autres hommes.", ["soi-même", "l’argent", "la loi"], "Triple rapport."], ["qcm", "Lequel des 4 pôles désigne les salariés ?", ["Les opérateurs", "Les effets", "Les déterminants"], "Opérateurs = ceux qui réalisent le travail."], ["qcm", "Les « conditions de réalisation » désignent…", ["Les moyens, l’environnement et l’organisation dans lesquels se fait l’activité", "Le salaire uniquement", "Le diplôme"], "Composante de la formule."], ["vf", "Vrai ou faux ? Pour l’ergonome, le travail se limite aux résultats produits.", ["Faux", "Vrai"], "Faux : activité + conditions + résultats."], ["cas", "Cas pratique : un aide-soignant aime son métier mais souffre de tensions avec ses collègues. Quel rapport est touché ?", ["Le rapport aux autres hommes", "Le rapport à la production seulement", "Aucun"], "Le triple rapport inclut les autres."], ["qcm", "Que place le schéma au centre du cercle ?", ["Le travail", "L’entreprise", "Le salaire"], "Entouré de quatre pôles."], ["qcm", "Le rapport « à soi-même » renvoie à…", ["Ce que le travail apporte ou coûte à la personne", "Le contrat", "La hiérarchie"], "Santé, sens, développement."], ["qcm", "Combien d’éléments composent la formule du travail ?", ["3", "2", "4"], "Activité, conditions de réalisation, résultats."]]}, {"id": "3.2", "title": "Quels liens entre l’homme et le travail ?", "fiche": [["def", "Le schéma place le **travail réel** (tâche + activité) au centre, à côté du **travail prescrit**."], ["t", [["Au-dessus : les déterminants", "Au-dessous : les effets"], ["L’opérateur et l’entreprise", "Sur l’opérateur et sur l’entreprise"], ["« Existe-t-il un lien entre le travail réel et ce déterminant ? »", "« Existe-t-il un lien entre cet effet et le travail réel ? »"]]], ["eg", "Ce schéma est repris dans le **schéma à 5 cases** (voir 4.10)."]], "qs": [["qcm", "Que place le schéma au centre ?", ["Le travail réel (tâche .", ["Faux", "Vrai"], "Faux : il apprend, gère, décide et donne du sens."], ["qcm", "Que fait le travailleur selon l’ergonome ?", ["Il apprend en agissant", "Il applique seulement des consignes", "Il attend les ordres"], "Il utilise ce qu’il apprend pour agir."], ["qcm", "Face aux contraintes, le travailleur…", ["Les gère", "Les ignore", "Les fuit"], "Il gère les contraintes qui s’imposent à lui."], ["qcm", "Que peut modifier le travailleur ?", ["Les conditions de réalisation de son travail", "Son contrat seul", "Le règlement intérieur"], "Pour mieux atteindre les objectifs."], ["qcm", "Que signifie « ressentir et projeter des intentions » ?", ["Le sens au travail", "La paie", "La discipline"], "Dimension subjective du travail."], ["qcm", "Combien de verbes résument le point de vue de l’ergonome ?", ["4 : apprendre, gérer, décider, ressentir", "2", "6"], "Les quatre capacités du travailleur."], ["trou", "Complète : le travailleur apprend en ______ et utilise ce qu’il apprend pour agir.", ["agissant", "dormant", "lisant"], "Apprentissage par l’action."], ["cas", "Cas pratique : une aide-soignante change l’ordre de ses tâches pour éviter de réveiller un patient. Qu’illustre ce choix ?", ["Elle décide et modifie ses conditions de réalisation", "Elle désobéit", "Elle commet une faute"], "Le travailleur n’est pas un exécutant."], ["cas", "Cas pratique : un agent trouve une astuce pour porter moins lourd et la réutilise. Quelle capacité ?", ["Il apprend en agissant et réutilise ce qu’il apprend", "Il suit une consigne", "Il ressent du sens"], "Apprentissage par l’action."], ["cas", "Cas pratique : une éducatrice se sent utile auprès des jeunes. Quelle dimension ?", ["Le sens au travail", "La gestion des contraintes", "L’apprentissage"], "Ressentir et projeter des intentions."], ["qcm", "Pourquoi ce point de vue est-il important pour l’ergonome ?", ["Il s’appuie sur les compétences des travailleurs", "Il veut les remplacer", "Il veut les contrôler"], "Cohérent avec la valo aux : la co-conception vient après la restitution du diagnostic."]]}, {"id": "4.2", "title": "Se situer dans une démarche ergonomique", "fiche": [["li", ["Analyser et **reformuler la demande**.", "Analyser le fonctionnement de la structure.", "Structurer la conduite du projet.", "Choisir les situations de travail, les analyser et **poser des hypothèses** (étape mise en avant).", "**Éprouver les hypothèses** par des observations systématiques (confrontation au terrain).", "Établir le diagnostic.", "Restituer au **groupe de pilotage**, qui définit le plan d’actions.", "Accompagner la mise en place du plan."]], ["warn", "Les hypothèses prennent la forme d’un **questionnement**, vérifié ensuite sur le terrain."]], "qs": [["qcm", "Que fait l’ergonome avec la demande ?", ["Il l’analyse et la reformule", "Il l’applique telle quelle", "Il la refuse"], "Première étape de la démarche."], ["qcm", "Sous quelle forme pose-t-on les hypothèses ?", ["Sous la forme d’un questionnement", "Sous la forme d’une sanction", "Sous la forme d’un budget"], "Étape mise en avant par le cours."], ["qcm", "Comment éprouver les hypothèses ?", ["Par des observations systématiques sur le terrain", "Par un vote", "Par une enquête de satisfaction client"], "Confrontation du questionnement à la réalité."], ["qcm", "À qui restitue-t-on le diagnostic ?", ["Au groupe de pilotage", "Aux clients", "À l’inspection du travail"], "Il définit le plan d’actions."], ["qcm", "Qui définit le plan d’actions / d’améliorations ?", ["Le groupe de pilotage", "L’ergonome seul", "Le salarié observé"], "Après la restitution."], ["qcm", "Quelle étape le cours met-il en avant ?", ["Choisir les situations, les analyser et poser des hypothèses", "Faire le budget", "Rédiger le contrat"], "Observations plus fines du travail."], ["qcm", "Que fait l’ergonome après le plan d’actions ?", ["Il accompagne sa mise en place", "Il s’en va", "Il recommence l’analyse de la demande"], "Dernière étape."], ["vf", "Vrai ou faux ? L’ergonome a ", "Cas pratique : un directeur veut sauter l’analyse et passer directement aux solutions. Que lui répondre ?", ["Il faut comprendre le travail réel avant de transformer", "C’est une bonne idée", "L’ergonome décidera seul"], "Sans analyse, pas de diagnostic fiable."]]}, {"id": "4.4", "title": "Analyser la situation de travail", "fiche": [["def", "Analyser la situation de travail, c’est **mettre en relation** : les **déterminants** (opérateur, entreprise), le **travail réel** (tâche et activité), le **travail prescrit** et les **effets** (sur l’opérateur, sur l’entreprise)."]], "qs": [["qcm", "Qu’est-ce qu’analyser la situation de travail ?", ["Mettre en relation déterminants, travail réel, travail prescrit et effets", "Observer un seul geste", "Lire la fiche de poste"], "Définition du cours."], ["qcm", "Quels sont les déterminants à mettre en relation ?", ["L’opérateur et l’entreprise", "Le client et le fournisseur", "Le CSE et l’Urssaf"], "Deux familles de déterminants."], ["qcm", "Que comprend le travail réel ?", ["La tâche et l’activité", "Le contrat et le salaire", "Le règlement intérieur"], "Selon le schéma du cours."], ["qcm", "Sur qui s’observent les effets ?", ["Sur l’opérateur et sur l’entreprise", "Uniquement sur les clients", "Uniquement sur l’État"], "Deux types d’effets."], ["vf", "Vrai ou faux ? Analyser une situation de travail se limite à observer l’opérateur.", ["Faux", "Vrai"], "Faux : il faut relier déterminants, prescrit, réel et effets."], ["trou", "Complète : analyser, c’est mettre en ______ les déterminants, le travail et les effets.", ["relation", "concurrence", "attente"], "Définition."], ["qcm", "Combien d’éléments sont mis en relation ?", ["4 : déterminants, travail réel, travail prescrit, effets", "2", "6"], "Les quatre ensembles du schéma."], ["cas", "Cas pratique : l’ergonome relève l’âge des agents, l’état des chariots, la procédure officielle et les arrêts maladie. Que fait-il ?", ["Il analyse la situation de travail dans son ensemble ai"], "Faux : c’est l’activité."], ["cas", "Cas pratique : « Préparer 60 plateaux repas par heure ». Est-ce une tâche ou une activité ?", ["Une tâche (prescrite)", "Une activité", "Un effet"], "C’est un objectif fixé."], ["cas", "Cas pratique : la fiche de poste d’une aide-soignante liste les toilettes à faire avant 10 h. Qu’est-ce ?", ["La tâche", "L’activité", "Un déterminant de l’opérateur"], "Objectifs définis par l’organisation."], ["qcm", "À qui la tâche est-elle assignée ?", ["À la personne qui travaille", "Au client", "Au CSE"], "Définition."], ["qcm", "Pourquoi dit-on « plus ou moins » prescrits ?", ["Certains objectifs sont précis, d’autres laissent une marge", "Parce qu’ils sont facultatifs", "Parce qu’ils sont secrets"], "La prescription n’est jamais totale."], ["trou", "Complète : outils, habits, protections et planning sont des ______ mis à disposition.", ["moyens", "effets", "déterminants de l’opérateur"], "Moyens techniques et organisationnels."], ["qcm", "Comprendre la tâche est…", ["Un préalable à l’analyse de l’activité", "Inutile", "La dernière étape"], "Voir 4.7."], ["cas", "Cas pratique : un hôpital fournit des gants et une procédure de tri du linge. Qu’est-ce ?", ["Les moyens et la tâche prescrite", "L’activité réelle", "Les effets"], "Moyens mis à disposition pour la tâche."], ["vf", "Vrai ou faux ? Les organisateurs du travail définissent la tâche.", ["Vrai", "Faux"], "Vrai."], ["qcm", "Tâche et activité forment ensemble…", ["Le travail réel (selon le schéma)", "Le contrat", "Le règlement intérieur"], "Schéma à 5 cases."], ["qcm", "Quelle phrase décrit une tâche ?", ["« Évacuer séparément les déchets et le linge sale »", "« J’ai regroupé les sacs dans le chariot qui roule »", "« Je suis épuisé ce soir »"], "Les autres décrivent l’activité ou un effet."]]}, {"id": "4.6", "title": "L’activité", "fiche": [["def", "**L’activité** : la **mobilisation de l’ensemble de la personne** et de ses facultés pour réaliser les tâches et atteindre les objectifs, avec les moyens mis à disposition. **« Comment je le fais, dans quelles conditions. »**"], ["eg", "Mme X, aux admissions : décroche le téléphone, vérifie le fichier, saisit nom et prénom après ses codes, sélectionne à la souris, complète le dossier papier, se lève pour le classer… et finit sa journée exténuée."]], "qs": [["qcm", "Qu’est-ce que l’activité ?", ["Comment je fais mon travail, dans quelles conditions", "Ce que l’on me demande de faire", "Le contrat de travail"], "Formule du cours."], ["qcm", "L’activité mobilise…", ["L’ensemble de la personne et de ses facultés", "Uniquement les mains", "Uniquement le cerveau"], "Définition."], ["qcm", "Dans quel but la personne mobilise-t-elle ses facultés ?", ["Réaliser les tâches et atteindre les objectifs fixés", "Se divertir", "Contester la hiérarchie"], "Avec les moyens mis à disposition."], ["vf", "Vrai ou faux ? L’activité correspond au travail réel.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : l’activité, c’est ______ je le fais, dans quelles conditions.", ["comment", "pourquoi", "quand"], "Formule à retenir."], ["qcm", "Dans l’exemple de Mme X, quelle est la tâche ?", ["L’identification des dossiers patients", "Décrocher le téléphone", "Être exténuée"], "La suite décrit l’activité."], ["qcm", "Dans l’exemple de Mme X, lequel est un élément de l’activité ?", ["Elle se lève pour classer le dossier", "L’identification des dossiers patients", "Le planning prévisionnel"], "Description de ce qu’elle fait réellement."], ["qcm", "Comment Mme X termine-t-elle sa journée ?", ["Avec le sentiment d’être exténuée", "Reposée", "En retard"], "Un effet de son activité."], ["qcm", "Le sentiment d’épuisement de Mme X est…", ["Un effet sur l’opérateur", "Un déterminant de l’entreprise", "Une tâche"], "Conséquence de l’activité."], ["vf", "Vrai ou faux ? L’activité ne concerne que les gestes physiques.", ["Faux", "Vrai"], "Faux : elle mobilise toute la personne (mental, cognitif, physique)."], ["cas", "Cas pratique : u u cours."]]}, {"id": "4.7", "title": "L’analyse de l’activité", "fiche": [["def", "**Comprendre la tâche est un préalable** à l’analyse de l’activité."], ["li", ["Connaître les tâches des professionnels observés en situation réelle.", "Se mettre d’accord sur le contenu du travail à réaliser.", "Avoir une **représentation commune** de l’activité.", "**Délimiter le périmètre** : poste ou situation de travail."]]], "qs": [["qcm", "Que faut-il comprendre avant d’analyser l’activité ?", ["La tâche", "Les salaires", "Le règlement intérieur"], "C’est un préalable."], ["qcm", "Quel est un objectif de l’analyse de l’activité ?", ["Avoir une représentation commune de l’activité", "Choisir un coupable", "Réduire les effectifs"], "Objectifs du cours."], ["qcm", "Que signifie « délimiter le champ d’action » ?", ["Circonscrire le périmètre : poste ou situation de travail", "Interdire certains gestes", "Fixer les horaires"], "Objectif de l’analyse."], ["qcm", "Sur quoi se met-on d’accord ?", ["Le contenu du travail à réaliser", "Le salaire", "Les congés"], "Objectif du cours."], ["qcm", "Où observe-t-on les professionnels ?", ["En situation réelle de travail", "En réunion uniquement", "Sur leur CV"], "Connaître les tâches en situation réelle."], ["vf", "Vrai ou faux ? On peut analyser l’activité sans connaître la tâche.", ["Faux", "Vrai"], "Faux : comprendre la tâche est un préalable."], ["trou", "Complète : comprendre la tâche est un ______ à l’analyse de l’activité.", ["préalable", "obstacle", "résultat"], "Ordre logique."], ["qcm", "Combien d’objectifs le cours donne-t-il à l’analyse de l’activité ?", ["4", "2", "7"], "Connaître, s’accorder, représentation commune, délimiter."], ["cas", "Cas pratique : l’ergonome commence par lire les fiches de poste et les procédures. Que fait-il ?", ["Il comprend la tâche avant d’observer l’activité", "Il perd son temps", "Il fait l’évaluation finale"], "Préalable à l’analyse."], ["cas", "Cas pratique : l’ergonome choisit d’observer uniquemen ion"], ["Travail prescrit (tâche)", "Ce que demande l’organisation officielle : résultats à atteindre et conditions d’exécution"], ["Travail réel (activité)", "Ce qui est effectivement réalisé, avec les conditions et moyens réellement mis en œuvre"]]], ["def", "Il y a **toujours un écart**, parfois considérable, entre prescrit et réel : souvent **ignoré, méconnu, voire nié**."], ["li", ["Cet écart a des origines multiples, que l’ergonomie met en évidence.", "Il se traduit par les **déterminants de l’activité**."]]], "qs": [["qcm", "Qu’est-ce que le travail prescrit ?", ["Ce que demande l’organisation officielle (résultats et conditions d’exécution)", "Ce qui est réellement fait", "Le salaire prévu"], "Prescrit = tâche."], ["qcm", "Qu’est-ce que le travail réel ?", ["Ce qui est effectivement réalisé, avec les moyens réellement mis en œuvre", "La fiche de poste", "Le contrat"], "Réel = activité."], ["vf", "Vrai ou faux ? Il existe toujours un écart entre travail prescrit et travail réel.", ["Vrai", "Faux"], "Vrai : parfois considérable."], ["qcm", "Comment cet écart est-il souvent traité dans l’entreprise ?", ["Ignoré, méconnu, voire nié", "Toujours mesuré", "Toujours sanctionné"], "Constat du cours."], ["qcm", "Comment l’écart se traduit-il ?", ["Par des déterminants de l’activité", "Par des primes", "Par des sanctions"], "Les déterminants expliquent l’écart."], ["qcm", "Que cherche à faire l’ergonomie face à cet écart ?", ["Mettre en évidence ses origines multiples", "Le supprimer par des sanctions", "L’ignorer"], "Rôle de l’ergonome."], ["trou", "Complète : travail prescrit = ______ ; travail réel = activité.", ["tâche", "effet", "déterminant"], "Correspondance à retenir."], ["cas", "Cas pratique : prescrit : 60 plateaux repas par heure ; réel : 60 plateaux en 1 h 30. Qu’observe-t-on ?", ["Un écart entre prescrit et réel", "Une faute de l’agent", "Un travail conforme"], "Exemple 3 du cours."], ["cas", "Cas pratique : prescrit : livraison des draps à 17 h ; réel : c te : l’écart se traduit par les ______ de l’activité.", ["déterminants", "effets", "objectifs"], "Lien avec 4.9."]]}, {"id": "4.9", "title": "Les déterminants et les effets de l’activité", "fiche": [["def", "**Déterminants** : ce qui influence le travail réel (les **causes**), côté individu et côté entreprise. **Effets** : les conséquences, sur les hommes et sur l’entreprise ; ce sont des **contraintes** ou des **ressources**."], ["t", [["Déterminants", "Exemples"], ["Internes aux salariés (peu de marge de manœuvre)", "Sexe, âge, ancienneté, santé globale et instantanée, fatigue, formation, expérience"], ["Internes à l’entreprise", "Contexte social et économique, environnement physico-chimique, matériels, image de l’entreprise"]]], ["t", [["Effets", "Exemples"], ["Sur les hommes", "Douleurs, dégradations irréversibles, perte de sens, changement de la population employée"], ["Sur l’entreprise", "Efficacité, qualité, retards, rebuts"]]]], "qs": [["qcm", "Que sont les déterminants de l’activité ?", ["Ce qui influence le travail réel : les causes", "Les conséquences du travail", "Les sanctions"], "Côté individu et côté entreprise."], ["qcm", "Que sont les effets de l’activité ?", ["Les conséquences sur les hommes et l’entreprise", "Les causes du travail réel", "Les objectifs prescrits"], "Ils sont des contraintes ou des ressources."], ["qcm", "Lequel est un déterminant interne au salarié ?", ["L’ancienneté", "Le contexte économique", "L’image de l’entreprise"], "Facteurs internes aux salariés."], ["qcm", "Lequel est un déterminant interne à l’entreprise ?", ["L’environnement physico-chimique", "La fatigue", "L’âge"], "Facteurs internes à l’entreprise."], ["qcm", "Sur quels déterminants a-t-on très peu de marge de manœuvre ?", ["Les facteurs internes aux salariés", "Les matériels", "L’organisation du travail"], "Âge, sexe, santé… on ne les change pas."], ["qcm", "Lequel est un effet sur les hommes ?", ["La perte de sens du travail", "Les rebuts", "Les retards de livraiso , ["Le travail défini à l’avance : quantités, qualité, procédures, consignes", "Ce que fait vraiment l’opérateur", "Les douleurs"], "Défini à l’avance."], ["qcm", "Que contient la case « travail réel » ?", ["La tâche (ce qu’il fait) et l’activité (comment il le fait)", "Les consignes", "Le salaire"], "Selon le schéma."], ["qcm", "Lequel est un effet positif sur l’opérateur ?", ["L’acquisition de compétences", "L’absentéisme", "Les malfaçons"], "Effets positifs sur l’opérateur."], ["qcm", "Lequel est un effet négatif sur l’opérateur ?", ["Le stress", "La perte de clientèle", "La mauvaise image"], "Effets négatifs sur l’opérateur."], ["qcm", "Lequel est un effet positif sur l’entreprise ?", ["L’amélioration de l’image de marque", "La fatigue", "La démotivation"], "Effets positifs sur l’entreprise."], ["qcm", "Lequel est un effet négatif sur l’entreprise ?", ["L’absentéisme", "La reconnaissance individuelle", "La promotion"], "Effets négatifs sur l’entreprise."], ["vf", "Vrai ou faux ? Les effets peuvent être positifs.", ["Vrai", "Faux"], "Vrai : ex. relations sociales enrichissantes, chiffre d’affaires."], ["trou", "Complète : le schéma à 5 ______ résume l’analyse de l’activité.", ["cases", "étapes", "pouvoirs"], "Synthèse du cours."], ["cas", "Cas pratique : une procédure de désinfection en 7 étapes. Quelle case ?", ["Travail prescrit", "Travail réel", "Effets sur l’entreprise"], "Consignes et procédures."], ["cas", "Cas pratique : des coûts liés aux accidents du travail. Quelle case ?", ["Effets négatifs sur l’entreprise", "Déterminants — opérateur", "Travail prescrit"], "Désorganisation et coûts."], ["cas", "Cas pratique : l’organisation du temps de travail en 12 h. Quelle case ?", ["Déterminants — entreprise", "Effets sur l’opérateur", "Travail réel"], "Organisation du temps de travail."], ["cas", "Cas pratique : un salarié reçoit une promotion grâce à ses nouvelles compétences. Quelle case ?", ["Effets positifs sur l’opérateur", "Déterminants — entreprise", "Travail prescrit"], "Promotion et compétences."], ["qcm", "« Les objectifs personnels » de l’opérateur sont…", ["Un déterminant opérateur", "Un effet sur l’entreprise", "Le travail prescrit"], "Case déterminants — opérateur."], ["qcm", "« L’organisation des flux » est…", ["Un déterminant entreprise", "Un effet sur l’opérateur", "Une tâche"], "Case déterminants — entreprise."], ["vf", "Vrai ou faux ? Le travail prescrit est défini à l’avance.", ["Vrai", "Faux"], "Vrai."], ["qcm", "Combien de cases compte le schéma ?", ["5", "3", "7"], "Déterminants (×2), travail réel, travail prescrit, effets."], ["cas", "Cas pratique : en examen, on te donne une situation et on te demande de remplir le schéma. Par quoi commencer ?", ["Identifier le prescrit, le réel, puis les déterminants et les effets", "Écrire uniquement les effets", "Proposer directement des solutions"], "Méthode d’analyse."]]}, {"id": "4.11", "title": "Exemples prescrit / réel / déterminants", "fiche": [["t", [["Situation", "Prescrit", "Réel", "Déterminants"], ["Agent de logistique", "Évacuer séparément déchets et linge sale", "Tout dans le chariot qui roule le mieux", "Chariot défectueux"], ["Assistant au domicile", "Aider à habiller une personne âgée « active »", "Plus de temps : la personne est devenue « passive »", "Dégradation de l’état de la personne"], ["Agent de production", "60 plateaux repas par heure", "60 plateaux en 1 h 30", "Menus modifiés, ingrédients ou matériel manquants, collègue absent"], ["Éducateur en ESAT", "Draps livrés à 17 h", "Commande pas prête", "Conflit dans l’atelier, gestion fournisseur/client"]]]], "qs": [["qcm", "Agent de logistique : quel est le travail prescrit ?", ["Évacuer séparément les déchets hôteliers et le linge sale", "Tout regrouper dans un chariot", "Réparer le chariot"], "Exemple 1."], ["qcm", "Agent de logistique : quel est le travail réel ?", ["Il regroupe tout dans le chariot qui roule le mieux", "Il trie parfaitement", "Il refuse de travailler"], "Exemple 1."], ["qcm", "Agent de logistique : quel est le déterminant ?", ["Le chariot défectueux", "La fatigue de l’agent", "Le menu du jour"], "Exemple 1."], ["qcm", "Assistant au domicile : pourquoi faut-il plus de temps ?", ["La personne âgée est devenue « passive »", "L’assistant est lent", "Le planning est faux"], "Dégradation de l’état de la personne."], ["qcm", "Agent de production : combien de plateaux sont prescrits par heure ?", ["60", "30", "90"], "Exemple 3 (EHPAD)."], ["qcm", "Agent de production : combien de temps faut-il réellement pour 60 plateaux ?", ["1 h 30", "1 h", "2 h 30"], "Écart prescrit/réel."], ["qcm", "Lequel n’est PAS un déterminant de l’exemple des plateaux ?", ["La couleur des plateaux", "La modification des menus", "L’absence d’un collègue", "Le manque de matériel"], "Les autres sont cités en cours."], ["qcm", "Éducateur en ESAT : pourquoi la commande n’est-elle pas prête ?", ["Une situation de débordement (conflit interpersonnel) dans l’atelier", "Une panne de machine", "Une grève"], "Exemple 4."], ["qcm", "Éducateur en ESAT : quels déterminants ?", ["Gestion humaine interne de l’ESAT ; gestion fournisseur/client", "Chariot défectueux", "Ingrédients manquants"], "Exemple 4."], ["vf", "Vrai ou faux ? Dans ces exemples, l’écart prescrit/réel s’explique par des déterminants.", ["Vrai", "Faux"], "Vrai : jamais par une simple « mauvaise volonté »."], ["trou", "Complète : prescrit : livraison des draps à ___ h.", ["17", "12", "8"], "Exemple de l’ESAT."], ["cas", "Cas pratique : une cuisine centrale prévoit 100 repas en 2 h, mais un four est en panne : 2 h 45 nécessaires. Déterminant ?", ["La panne du four (matériel)", "La lenteur des cuisiniers", "Le client"], "Même logique que l’exemple 3."], ["cas", "Cas pratique : une infirmière doit passer 5 min par patient, mais un patient anxieux demande 20 min. Déterminant ?", ["L’état du patient", "Le règlement intérieur", "La couleur des murs"], "Même logique que l’exemple 2."], ["qcm", "Dans quelle structure travaille l’agent de production de l’exemple ?", ["Pour un EHPAD (plateaux repas)", "Pour une école", "Pour une banque"], "Exemple 3."], ["qcm", "ESAT signifie un établissement…", ["Qui accueille des travailleurs en situation de handicap", "De santé mentale uniquement", "D’enseignement supérieur"], "Établissement et service d’aide par le travail."], ["vf", "Vrai ou faux ? Dans l’exemple 1, l’agent a fait une faute grave.", ["Faux", "Vrai"], "Faux : il s’adapte à un chariot défectueux."], ["qcm", "Quel exemple montre l’influence de l’état d’une autre personne sur l’activité ?", ["L’assistant au domicile", "L’agent de logistique", "L’agent de production"], "La personne âgée devenue passive."], ["qcm", "Que montrent ces 4 exemples ?", ["Le réel s’écarte du prescrit à cause de déterminants variés", "Les salariés trichent", "Les procédures sont inutiles"], "Message des exemples."], ["trou", "Complète : l’agent regroupe tout dans le chariot qui ______ le mieux.", ["roule", "brille", "coûte"], "Exemple 1."], ["cas", "Cas pratique : en examen, « analysez cette situation ». Quelle grille utiliser ?", ["Prescrit / réel / déterminants (et effets)", "Avantages / inconvénients du salarié", "Coût / délai / profit"], "Grille des exemples du cours."]]}, {"id": "4.12", "title": "Régulations et compromis", "fiche": [["def", "Le **système de production** est instable (variations, pannes, aléas) et **l’homme est variable** (biologie, vieillissement, apprentissage) : il fait donc des **régulations**."], ["li", ["Rôle de l’ergonome : **augmenter les marges de manœuvre**, pour faire face aux imprévus et aux urgences.", "Objectif : un **équilibre santé** (physique, mentale) **/ production** (quantité, qualité)."]], ["t", [["Balance", "Éléments"], ["Ressources", "Reconnaissance, collectif, soutien social, valeur travail, salaire, évolution"], ["Contraintes", "Charges physique et mentale, sens du travail, isolement, harcèlement, risques, horaires"]]]], "qs": [["qcm", "Pourquoi l’homme effectue-t-il des régulations ?", ["Pour faire face à la variabilité des situations", "Pour désobéir", "Pour ralentir volontairement"], "Le système et l’homme varient."], ["qcm", "Quelles instabilités présente le système de production ?", ["Variations de production, pannes, aléas, dysfonctionnements", "Aucune", "Seulement les grèves"], "Selon le cours."], ["qcm", "La variabilité de l’homme vient du fait qu’il…", ["Est soumis à des systèmes biologiques, vieillit et apprend", "Est toujours identique", "Ne change jamais"], "Variabilité propre au vivant."], ["qcm", "Quel est l’un des rôles de l’ergonome ?", ["Augmenter les marges de manœuvre", "Réduire les pauses", "Supprimer les régulations"], "Plus de flexibilité face aux imprévus."], ["qcm", "À quoi servent les marges de manœuvre ?", ["Faire face aux imprévus, situations changeantes ou urgences", "Travailler moins", "Éviter les contrôles"], "Flexibilité."], ["qcm", "Quel équilibre est recherché ?", ["Santé (physique et mentale) / production (quantité et qualité)", "Salaire / horaires", "Clients / fournisseurs"], "Objectif de l’ergonomie."], ["qcm", "Lequel est une ressource ?", ["Le soutien social", "L’isolement", "Le harcèlement"], "Côté ressources de la balance."], ["qcm", "Lequel est une contrainte ?", ["La charge mentale", "La reconnaissance", "Le collectif"], "Côté contraintes."], ["vf", "Vrai ou faux ? La « production » s’entend au sens large : missions et objectifs à atteindre.", ["Vrai", "Faux"], "Vrai : aussi dans le soin ou le social."], ["vf", "Vrai ou faux ? L’homme apprend : c’est une source de variabilité.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : l’activité est faite de régulations et de ______.", ["compromis", "sanctions", "primes"], "Titre de l’unité."], ["cas", "Cas pratique : une machine tombe en panne et l’agent réorganise son travail pour tenir le délai. Qu’illustre ce cas ?", ["Une régulation face à un aléas", "Une faute", "Un travail prescrit"], "Régulation."], ["cas", "Cas pratique : un agent vieillissant change sa façon de soulever les charges. Qu’illustre ce cas ?", ["La variabilité de l’homme et sa régulation", "Le travail prescrit", "Une sanction"], "Il vieillit et s’adapte."], ["cas", "Cas pratique : la direction impose un planning si serré qu’aucun imprévu n’est gérable. Que dira l’ergonome ?", ["Il faut redonner des marges de manœuvre", "C’est parfait", "Il faut supprimer les pauses"], "Rôle de l’ergonome."], ["qcm", "Quel élément de la balance est « l’évolution » ?", ["Une ressource", "Une contrainte", "Un effet négatif"], "Côté ressources."], ["qcm", "Quel élément de la balance sont « les horaires » ?", ["Une contrainte", "Une ressource", "Un déterminant positif"], "Côté contraintes."], ["vf", "Vrai ou faux ? Le salaire est cité comme une ressource.", ["Vrai", "Faux"], "Vrai."], ["qcm", "La santé visée par l’équilibre est…", ["Physique et mentale", "Uniquement physique", "Uniquement financière"], "Objectif."], ["trou", "Complète : l’ergonome cherche à augmenter les ______ de manœuvre.", ["marges", "heures", "primes"], "Rôle clé."], ["qcm", "Selon le cours, le sens du travail peut être…", ["Une contrainte quand il fait défaut", "Toujours une ressource", "Sans importance"], "Il est placé côté contraintes."]]}, {"id": "4.13", "title": "Ce qu’il faut retenir", "fiche": [["def", "Entre **prescrit** et **réel**, il y a un **écart**. L’activité met en jeu des **régulations** (physique, mentale, sociale) et une **marge de manœuvre**."], ["t", [["Effets", "Positifs", "Négatifs"], ["Sur les opérateurs", "Santé, motivation, coopération", "Accidents, stress, atteinte à la santé"], ["Sur l’entreprise", "Qualité, efficacité, fiabilité", "Défauts, retards, dysfonctionnements"]]], ["warn", "Le sens des effets dépend de l’**équilibre entre contraintes et ressources**."]], "qs": [["qcm", "Qu’existe-t-il entre le travail prescrit et le travail réel ?", ["Un écart", "Une égalité parfaite", "Un contrat"], "Message central."], ["qcm", "Quels types de régulation l’activité met-elle en jeu ?", ["Physique, mentale et sociale", "Uniquement physique", "Financière"], "Selon la synthèse."], ["qcm", "Lequel est un effet positif sur les opérateurs ?", ["La coopération", "Les retards", "Les défauts"], "Santé, motivation, coopération."], ["qcm", "Lequel est un effet négatif sur les opérateurs ?", ["Les accidents", "La fiabilité", "La qualité"], "Accidents, stress, atteinte à la santé."], ["qcm", "Lequel est un effet positif sur l’entreprise ?", ["La fiabilité du système", "Le stress", "Les dysfonctionnements"], "Qualité, efficacité, fiabilité."], ["qcm", "Lequel est un effet négatif sur l’entreprise ?", ["Les retards", "La motivation", "La coopération"], "Défauts, retards, dysfonctionnements."], ["qcm", "De quoi dépend le sens positif ou négatif des effets ?", ["De l’équilibre entre contraintes et ressources", "Du hasard", "Du salaire seul"], "Message clé."], ["vf", "Vrai ou faux ? Une marge de manœuvre fait partie de la situation de travail.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Les effets sont toujours négatifs.", ["Faux", "Vrai"], "Faux : ils peuvent être positifs."], ["trou", "Complète : l’activité met en jeu des processus de ______.", ["régulation", "sanction", "recrutement"], "Synthèse."], ["cas", "Cas pratique : une équipe soudée gère bien les imprévus et reste motivée. Quel équilibre ?", ["Les ressources compensent les contraintes", "Les contraintes dominent", "Il n’y a pas d’écart"], "Effets positifs."], ["cas", "Cas pratique : isolement, surcharge et pas de reconnaissance ; les arrêts maladie augmentent. Quel équilibre ?", ["Les contraintes dépassent les ressources", "Les ressources dominent", "Équilibre parfait"], "Effets négatifs."], ["qcm", "Quelle régulation est « sociale » ?", ["S’entraider avec un collègue", "Changer de posture", "Mémoriser une procédure"], "Les régulations sociales passent par le collectif."], ["qcm", "Quelle régulation est « mentale » ?", ["Réorganiser l’ordre de ses tâches", "Se baisser", "Pousser un chariot"], "Réflexion, anticipation."], ["qcm", "Quelle régulation est « physique » ?", ["Changer de posture pour soulager son dos", "Planifier sa journée", "Demander de l’aide"], "Le corps s’adapte."], ["vf", "Vrai ou faux ? Ce schéma synthétise toute la partie 4.", ["Vrai", "Faux"], "Vrai : du prescrit au réel, régulations, effets."], ["trou", "Complète : effets positifs sur l’entreprise : qualité, efficacité, ______.", ["fiabilité", "stress", "retards"], "Synthèse."], ["qcm", "Que se passe-t-il quand les marges de manœuvre sont trop faibles ?", ["Les effets négatifs augmentent", "Rien", "La production augmente toujours"], "Moins de régulation possible."], ["cas", "Cas pratique : en examen, « Que faut-il retenir de l’analyse du travail ? ». Réponse ?", ["Écart prescrit/réel, régulations, marges de manœuvre, effets selon contraintes et ressources", "Le salaire et les horaires", "La liste des pathologies"], "Synthèse attendue."], ["qcm", "« Atteinte à la santé » est un effet…", ["Négatif sur les opérateurs", "Positif sur l’entreprise", "Négatif sur l’entreprise"], "Effets sur les opérateurs."]]}, {"id": "4.14", "title": "Les observations", "fiche": [["def", "Observer les situations de travail **dans leur globalité** pour comprendre le travail réel. Les observations permettent de **relever des faits précis** et d’**émettre des hypothèses** (questionnement)."], ["li", ["L’opérateur ; outils, machines, matériaux ; espaces de travail et de circulation.", "Organisation du travail ; ambiances physiques (bruit, éclairage, vibrations, poussières).", "Ce que fait l’opérateur ; communications et coopérations.", "Variations de l’activité dans le temps ; signes de dysfonctionnement ; récupérations par l’opérateur."]]], "qs": [["qcm", "Pourquoi observer les situations de travail ?", ["Pour comprendre finement le travail réel", "Pour surveiller les salariés", "Pour les sanctionner"], "Accéder au fonctionnement réel."], ["qcm", "Que permettent les observations ?", ["Relever des faits précis et émettre des hypothèses", "Fixer les salaires", "Rédiger le contrat"], "Deux apports."], ["qcm", "À quelle étape de la démarche se rattachent-elles ?", ["L’analyse des situations de travail", "L’analyse de la demande", "Le suivi"], "Étape 3."], ["qcm", "Lequel fait partie de ce qu’il faut regarder ?", ["Les ambiances physiques (bruit, éclairage…)", "La vie privée des salariés", "Les comptes de l’entreprise"], "Liste du cours."], ["qcm", "Que regarde-t-on à propos des communications ?", ["Les échanges verbaux ou gestuels et les coopérations", "Les mails personnels", "Les réseaux sociaux"], "Communications et coopérations."], ["qcm", "Que sont les « signes visibles de dysfonctionnement » ?", ["Mises au rebut, arrêts de production…", "Les sourires", "Les pauses"], "Liste du cours."], ["qcm", "Qu’est-ce qu’une récupération de dysfonctionnement ?", ["L’opérateur corrige un problème (ex. contrôle et rectification)", "Un congé", "Une sanction"], "Ex. : sortie d’un produit de la chaîne."], ["qcm", "Pourquoi observer les variations de l’activité dans le temps ?", ["Le travail change selon les urgences, interruptions, produits", "Pour minuter les pauses", "Pour fixer les primes"], "Variations à relever."], ["vf", "Vrai ou faux ? On observe aussi les espaces de circulation.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Les observations fournissent des données à analyser.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : on observe la situation de travail dans sa ______.", ["globalité", "seule partie visible", "version écrite"], "Approche globale."], ["cas", "Cas pratique : l’ergonome note qu’une infirmière est interrompue 12 fois en une heure. Qu’observe-t-il ?", ["Les variations de l’activité (interruptions)", "Les ambiances physiques", "Les outils"], "Variations dans le temps."], ["cas", "Cas pratique : l’ergonome relève un bruit constant de machines. Quelle catégorie ?", ["Les ambiances physiques", "Les communications", "L’organisation"], "Brui nder aux concurrents"], "Première étape."], ["qcm", "Que récapitule-t-on ?", ["Les dépenses et les recettes", "Les salaires", "Les absences"], "Deuxième étape."], ["qcm", "Que vérifie-t-on en définissant les ressources ?", ["L’équilibre dépenses/recettes", "Le nombre de réunions", "La couleur des affiches"], "Troisième étape."], ["qcm", "Lequel est une ressource possible ?", ["Le mécénat", "Le licenciement", "L’amende"], "Pense-bête."], ["qcm", "Lequel est un partenaire social financeur cité ?", ["Une mutuelle", "Un concurrent", "Un client"], "Mutuelles, SPST."], ["qcm", "Pourquoi récolter des devis ?", ["Pour chiffrer précisément les dépenses", "Pour comparer les salaires", "Pour remplacer le plan d’action"], "Évaluer les besoins."], ["trou", "Complète : on s’assure de l’______ dépenses/recettes.", ["équilibre", "écart", "oubli"], "Définir les ressources."], ["vf", "Vrai ou faux ? Le bénévolat peut être une ressource.", ["Vrai", "Faux"], "Vrai : pense-bête."], ["cas", "Cas pratique : les dépenses prévues dépassent les recettes de 5 000 €. Que faire ?", ["Cerner les priorités et chercher des partenaires ou cofinancements", "Abandonner", "Ignorer l’écart"], "Définir les ressources."], ["cas", "Cas pratique : le prix d’un lève-personne augmente en cours de projet. Le budget peut-il changer ?", ["Oui : il peut évoluer pendant le projet", "Non", "Seulement l’année suivante"], "Budget évolutif."], ["qcm", "Qu’est-ce que le cofinancement ?", ["Plusieurs financeurs pour un même projet", "Un seul financeur", "Un emprunt personnel"], "Ressource."], ["qcm", "Pourquoi « cerner les priorités » ?", ["Pour financer d’abord l’essentiel", "Pour dépenser plus", "Pour éviter les devis"], "Définir les ressources."], ["trou", "Complète : le budget sert aussi à la recherche de ______ financiers.", ["soutiens", "coupables", "clients"], "Définition."], ["vf", "Vrai ou faux ? Le suivi des actions figure dans le pense-bête du budget.", ["Vrai", "Faux"], "Vrai."], ["qcm", "Lequel n’est PAS une étape du budget ?", ["Recruter un comptable", "Évaluer les besoins", "Récapituler", "Définir les ressources"], "Les autres sont les étapes du cours."], ["qcm", "Les ventes peuvent-elles financer un projet ?", ["Oui, elles figurent dans le pense-bête", "Non, c’est interdit", "Seulement pour l’État"], "Pense-bête."], ["qcm", "Quel est le rang du budget dans les 10 étapes ?", ["9e", "2e", "5e"], "Cercle intérieur."], ["cas", "Cas pratique : en examen, « Quelles sont les étapes d’un budget de projet ? ». Réponse ?", ["Évaluer les besoins, récapituler, définir les ressources", "Recruter, former, licencier", "Diagnostic, objectifs, évaluation"], "Tableau du cours."]]}, {"id": "6.11", "title": "L’évaluation", "fiche": [["def", "L’évaluation permet de **conforter et améliorer** le projet ; elle **réajuste** les actions. Elle s’organise **tout au long du projet**."], ["t", [["Question", "Réponses"], ["Pourquoi ?", "Mesurer l’atteinte des objectifs, identifier les écueils, vérifier l’efficacité"], ["Quoi ?", "Résultats (indicateurs de départ), processus, pertinence, cohérence, efficience"], ["Qui ?", "Le porteur de projet soutenu par le COPIL, ou un évaluateur externe"], ["Quand ?", "Début (pertinence), en cours (bilan, réajustement), fin (efficacité, utilité, effets, impact)"], ["Outils", "Questionnaires, tableaux de bord, enquêtes, recueil de données"]]]], "qs": [["qcm", "À quoi sert l’évaluation ?", ["Conforter et améliorer le projet, réajuster les actions", "Sanctionner les acteurs", "Clore le budget"], "Définition."], ["qcm", "Quand évaluer ?", ["Au début, en cours et à la fin", "Seulement à la fin", "Jamais"], "Tout au long du projet."], ["qcm", "Qu’évalue-t-on au début ?", ["La pertinence des objectifs en lien avec les enjeux", "L’impact final", "Le compte rendu"], "Début."], ["qcm", "Que fait-on en cours de projet ?", ["Un bilan d’étape et un réajustement", "La conception", "Le recrutement"], "En cours."], ["qcm", "Que mesure-t-on à la fin ?", ["L’efficacité, l’utilité, les effets, l’impact", "La pertinence seule", "Les devis"], "À la fin."], ["qcm", "Qui évalue ?", ["Le porteur de projet soutenu par le COPIL, ou un évaluateur externe", "Les clients seuls", "Personne"], "Qui ?"], ["qcm", "Sur quoi s’appuie l’évaluation des résultats ?", ["Les indicateurs établis au départ", "Les impressions", "Le budget seul"], "Quoi ?"], ["qcm", "Lequel est un outil d’évaluation ?", ["Le tableau de bord", "Le contrat de travail", "La fiche de paie"], "Outils."], ["qcm", "Qu’est-ce que l’efficience ?", ["Le rapport entre les moyens utilisés et les résultats obtenus", "L’atteinte des objectifs seule", "La satisfaction"], "Notion d’évaluation."], ["vf", "Vrai ou faux ? On évalue aussi le processus, pas seulement les résultats.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : l’évaluation permet d’identifier les ______.", ["écueils", "salariés", "fournisseurs"], "Pourquoi ?"], ["cas", "Cas pratique : à mi-parcours, la formation n’attire personne. Que permet l’évaluation en cours ?", ["Réajuster l’action", "Attendre la fin", "Supprimer le projet sans analyse"], "Bilan d’étape."], ["cas", "Cas pratique : un an après, les arrêts pour lombalgie ont baissé de 30 %. Qu’évalue-t-on ?", ["L’efficacité et l’impact du projet", "La pertinence de départ", "Le budget"], "Évaluation finale."], ["cas", "Cas pratique : on fait appel à un cabinet extérieur pour évaluer le projet. Est-ce prévu ?", ["Oui : évaluateur externe possible", "Non, interdit", "Seulement pour l’État"], "Qui ?"], ["qcm", "Pourquoi fixer les indicateurs dès le départ ?", ["Pour pouvoir mesurer les résultats ensuite", "Pour faire joli", "Pour éviter l’évaluation"], "Quoi ?"], ["vf", "Vrai ou faux ? Les questionnaires et enquêtes sont des outils d’évaluation.", ["Vrai", "Faux"], "Vrai."], ["qcm", "Quel est le rang de l’évaluation dans les 10 étapes ?", ["10e", "1re", "4e"], "Cercle intérieur."], ["trou", "Complète : on vérifie la pertinence, la cohérence et l’______ entre besoins et résultats.", ["efficience", "absence", "illégalité"], "Quoi ?"], ["qcm", "« Mesurer l’atteinte des objectifs » répond à…", ["Pourquoi évaluer ?", "Qui évalue ?", "Quand évaluer ?"], "Pourquoi ?"], ["cas", "Cas pratique : en examen, « Quand et comment évaluer un projet ? ». Réponse ?", ["Début, en cours et fin, avec questionnaires, tableaux de bord, enquêtes", "Uniquement à la fin, oralement", "Jamais"], "Tableau du cours."]]}]}, {"n": 7, "title": "DUERP et PAPRIPACT", "unites": [{"id": "7.1", "title": "DUERP : définition et réglementation", "fiche": [["def", "**DUERP** (document unique d’évaluation des risques professionnels) : **obligatoire dès le 1er salarié** ; l’employeur y consigne les résultats de l’évaluation des risques."], ["t", [["Texte", "Contenu"], ["Loi du 31 décembre 1991", "Mesures pour protéger la santé des travailleurs"], ["Loi du 2 août 2021", "Renforce la prévention en santé au travail"], ["Décret du 18 mars 2022", "DUERP et formations santé-sécurité"], ["Art. L.4121-1, L.4121-2, L.4121-3", "Obligation de sécurité, 9 principes, évaluation et DUERP"]]], ["li", ["Responsabilité de la **direction** ; des **référents DUERP** peuvent être désignés, avec les professionnels et la CSSCT.", "Conservation des versions successives : **40 ans**.", "Absence de DUERP : **1 500 €** d’amende (7 500 € pour une personne morale).", "PAPRIPACT obligatoire dès **50 salariés** ; mise à jour annuelle du DUERP dès **11 salariés**."]], ["warn", "L’évaluation des risques est le **point de départ** de la prévention ; ses réponses ne sont pas uniquement « techniques »."]], "qs": [["qcm", "Que signifie DUERP ?", ["Document unique d’évaluation des risques professionnels", "Dossier unique d’embauche et de rémunération du personnel", "Document d’urgence en cas de risque public"], "Définition."], ["qcm", "À partir de quand le DUERP est-il obligatoire ?", ["Dès l’embauche du 1er salarié", "Dès 11 salariés", "Dès 50 salariés"], "Toutes les entreprises."], ["qcm", "Que consigne l’employeur PAPRIPACT", "DPAE", "PACEA"], "Réponse pour la sécurité et la santé."], ["cas", "Cas pratique : une micro-crèche de 4 salariés n’a pas de DUERP. Est-ce régulier ?", ["Non : obligatoire dès le 1er salarié", "Oui, en dessous de 11 salariés", "Oui, en dessous de 50 salariés"], "Obligation universelle."], ["cas", "Cas pratique : un EHPAD de 80 salariés n’a pas de PAPRIPACT. Est-ce régulier ?", ["Non : obligatoire dès 50 salariés", "Oui", "Seulement s’il y a eu un accident"], "Droit en vigueur depuis 2021."], ["cas", "Cas pratique : un directeur détruit l’ancien DUERP après chaque mise à jour. Que dire ?", ["Il doit conserver les versions successives 40 ans", "C’est conseillé", "C’est obligatoire"], "Obligation de conservation."], ["qcm", "Pourquoi parler de « boîte à outils » pour l’article L.4121-2 ?", ["Il fournit des principes pour guider la prévention", "Il liste les outils du poste", "Il fixe les sanctions"], "Principes généraux."]]}, {"id": "7.2", "title": "Les 9 principes généraux de prévention", "fiche": [["t", [["N°", "Principe"], ["1", "Éviter le risque"], ["2", "Évaluer le risque"], ["3", "Combattre le risque à la source"], ["4", "Adapter le travail à l’homme"], ["5", "Tenir compte de l’évolution technique"], ["6", "Remplacer ce qui est dangereux par ce qui l’est moins"], ["7", "Planifier la prévention"], ["8", "Priorité aux protections collectives"], ["9", "Donner les instructions appropriées"]]], ["def", "Issus de l’**article L.4121-2**, ils **hiérarchisent** les actions de prévention."]], "qs": [["qcm", "Combien y a-t-il de principes généraux de prévention ?", ["9", "5", "12"], "Art. L.4121-2."], ["qcm", "Quel est le 1er principe ?", ["Éviter le risque", "Évaluer le risque", "Former les salariés"], "Le plus efficace : supprimer le risque."], ["qcm", "Quel est le 2e principe ?", ["Évaluer les risques qui ne peuvent être évités", "Planifier la prévention", "Combattre à la source"], "Ordre du cours."], ["qcm", "Lequel est un principe ?", ["Adapter le travail à l’homme", "Adapter l’homme au travail", "Augmenter les cadences"], "4e principe."], ["qcm", "Quelle protection est prioritaire ?", ["La protection collective", "La protection individuelle", "Aucune"], "8e principe."], ["qcm", "Quel est le dernier principe ?", ["Donner les instructions appropriées aux salariés", "Éviter le risque", "Évaluer le risque"], "9e principe."], ["qcm", "« Remplacer ce qui est dangereux par ce qui l’est moins » est le…", ["6e principe", "1er principe", "9e principe"], "Ex. : produit moins toxique."], ["qcm", "De quel article sont-ils issus ?", ["L.4121-2", "L.4121-1", "L.1221-25"], "Code du travail."], ["vf", "Vrai ou faux ? Les principes servent à hiérarchiser les actions de prévention.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? La formation des salariés est le premier principe.", ["Faux", "Vrai"], "Faux : donner des instructions est le 9e."], ["trou", "Complète : combattre le risque à la ______.", ["source", "fin", "maison"], "3e principe."], ["cas", "Cas pratique : un hôpital installe des rails au plafond pour tous les transferts plutôt que des ceintures individuelles. Quel principe ?", ["Priorité aux protections collectives", "Donner des instructions", "Évaluer le risque"], "Collectif avant individuel."], ["cas", "Cas pratique : une crèche remplace un produit d’entretien toxique par un produit moins dangereux. Quel principe ?", ["Remplacer ce qui est dangereux par ce qui l’est moins", "Éviter le risque", "Planifier"], "6e principe."], ["cas", "Cas pratique : on supprime le port manuel des plateaux grâce à un chariot motorisé. Quel principe ?", ["Éviter le risque (ou le combattre à la source)", "Donner des instructions", "Évaluer le risque"], "On supprime l’exposition."], ["cas", "Cas pratique : on règle la hauteur des plans de travail à la taille des agents. Quel principe ?", ["Adapter le travail à l’homme", "Tenir compte de l’évolution technique", "Planifier la prévention"], "4e principe."], ["cas", "Cas pratique : un employe éfinition."], ["qcm", "Qu’est-ce que le risque résiduel ?", ["Le risque restant après les mesures de prévention", "Le risque initial", "Le risque d’un autre service"], "Définition."], ["qcm", "Que mesure le niveau de gravité (NG) ?", ["La sévérité du dommage possible", "La fréquence d’exposition", "L’efficacité des mesures"], "De la blessure légère au décès."], ["qcm", "Que mesure le niveau d’exposition (NE) ?", ["La fréquence et la durée d’exposition au danger", "La gravité", "Le coût"], "Répétitivité × durée par jour."], ["qcm", "Que mesure le niveau de maîtrise (NM) ?", ["L’efficacité des mesures de prévention existantes", "La gravité", "La fréquence"], "1, 0,1 ou 0,01."], ["qcm", "Quelle note NG pour un risque de décès ou de handicap irréversible ?", ["100", "10", "1"], "Grave."], ["qcm", "Quelle note NG pour un inconfort (bruit, odeur, éclairage) ?", ["1", "10", "100"], "Faible."], ["qcm", "Quelle note NM si aucune mesure n’existe ?", ["1", "0,1", "0,01"], "À redéfinir ou à mettre en place."], ["qcm", "Quelle note NM si la prévention est correcte (collective et individuelle) ?", ["0,01", "1", "0,1"], "Correct."], ["qcm", "Comment calcule-t-on le NRR ?", ["NG × NE × NM", "NG + NE + NM", "NG ÷ NE"], "Formule déduite de l’exemple du cours."], ["qcm", "Calcule : NG 10 × NE 7 × NM 0,1 = ?", ["7", "70", "0,7"], "Risque de heurt de l’exemple."], ["qcm", "Un NRR de 450 correspond à…", ["Priorité 1", "Priorité 2", "Priorité 3"], "400 et plus."], ["qcm", "Un NRR de 120 correspond à…", ["Priorité 2", "Priorité 1", "Priorité 3"], "70 à 399."], ["qcm", "Un NRR de 7 avec NG = 100 correspond à…", ["Priorité 1", "Priorité 3", "Priorité 2"], "NG = 100 → priorité 1 quel que soit le NRR."], ["qcm", "Un NRR de 7 avec NG = 10 correspond à…", ["Priorité 3", "Priorité 1", "Priorité 2"], "1 à 69."], ["qcm", "Quelle note NE pour une exposition quotidienne de plus de 4 h ?", ["10", "4", "1"], "Exposition maximale."], ["qcm", "Quelle note NE pour une exposition annuelle de moins de 15 mi const KEY = "l3-" + M.key + "-v2";
const $ = id => document.getElementById(id), app = $("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const shuffle = a => { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [r[i], r[j]] = [r[j], r[i]]; } return r; };
const TYPE = {qcm:"QCM", vf:"Vrai ou faux", trou:"Texte à trous", cas:"Cas pratique"};
let S = {u:{}, c:{}};
try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.u) S = v; } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const UNITS = [], CHAPS = [];
M.lecons.forEach(L => L.chapitres.forEach(C => { C.L = L; C.key = L.n + "-" + C.n; CHAPS.push(C); C.unites.forEach(U => { U.C = C; UNITS.push(U); }); }));
const ready = U => U.qs && U.qs.length;
const uById = id => UNITS.find(U => U.id === id);
let cur = null;

function setView(v, hint){ document.body.dataset.view = v; $("hint").textContent = hint || M.title; window.scrollTo(0,0); }

function home(){
  setView("home");
  const rd = UNITS.filter(ready), done = rd.filter(U => S.u[U.id] != null);
  const nq = rd.reduce((n,U) => n + U.qs.length, 0);
  let h = `<h1>${esc(M.title)}</h1><p class="lead">${esc(M.sub)}</p>
<div class="stats"><div class="stat"><b>${done.length}/${rd.length}</b><span>unités travaillées</span></div><div class="stat"><b>${nq}</b><span>questions</span></div><div class="stat"><b>${UNITS.length - rd.length}</b><span>unités à venir</span></div></div>`;
  M.lecons.forEach(L => {
    h += `<div class="lesson">Leçon ${L.n} · ${esc(L.title)}</div>`;
    L.chapitres.forEach(C => {
      const ok = C.unites.filter(ready).length, cb = S.c[C.key];
      h += `<section class="chap"><div class="chapbar"><h2>Chapitre ${C.n}. ${esc(C.title)}</h2>${ok ? `<button class="btn sm" data-exam="${C.key}">Examen du chapitre</button>` : ""}</div>${cb != null ? `<div class="meta">Meilleur examen : ${cb}/20</div>` : ""}<ul class="units">`;
      C.unites.forEach(U => {
        const b = S.u[U.id], r = ready(U);
        h += `<li class="unit${r ? "" : " soon"}${b != null && b >= 16 ? " done" : ""}"><span class="uid">${esc(U.id)}</span><div class="ub"><div class="ut">${esc(U.title)}</div><div class="um">${r ? `${U.qs.length} questions${b != null ? `, meilleur ${b}/${U.qs.length}` : ""}` : "À venir"}</div></div>${r ? `<div class="ua"><button class="btn sm" data-fiche="${esc(U.id)}">Fiche</button><button class="btn sm solid" data-quiz="${esc(U.id)}">Quiz</button></div>` : ""}</li>`;
      });
      h += `</ul></section>`;
    });
  });
  h += `<div class="toolbar"><button class="btn danger" data-reset>Effacer ma progression</button></div>`;
  app.innerHTML = h;
}

function block(b){
  switch(b[0]){
    case "def": return `<div class="def">${md(b[1])}</div>`;
    case "eg": return `<div class="eg">${md(b[1])}</div>`;
    case "warn": return `<p class="warn">⚠ ${md(b[1])}</p>`;
    case "p": return `<p>${md(b[1])}</p>`;
    case "li": return `<ul>${b[1].map(x => `<li>${md(x)}</li>`).join("")}</ul>`;
    case "t": return `<div class="tblw"><table><thead><tr>${b[1][0].map(x => `<th>${md(x)}</th>`).join("")}</tr></thead><tbody>${b[1].slice(1).map(r => `<tr>${r.map(x => `<td>${md(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  return "";
}
function fiche(U){
  setView("fiche", `Unité ${U.id}`);
  app.innerHTML = `<div class="fiche"><p class="meta">Leçon ${U.C.L.n} · Chapitre ${U.C.n} · Unité ${esc(U.id)}</p><h2>${esc(U.title)}</h2>
<div class="legend"><span class="lg d">à mémoriser</span><span class="lg e">exemple</span><span class="lg w">⚠ piège</span></div>
${U.fiche.map(block).join("")}</div><div class="toolbar"><button class="btn solid" data-quiz="${esc(U.id)}">S’entraîner : ${U.qs.length} questions</button></div>`;
}

function start(kind, ref, list){
  cur = {kind, ref, list, idx:0, res:[]};
  renderQ();
}
function quizUnit(U){ start("u", U.id, shuffle(U.qs.map((_,i) => [U.id, i]))); }
function examChap(C){ const pool = []; C.unites.filter(ready).forEach(U => U.qs.forEach((_,i) => pool.push([U.id, i]))); start("c", C.key, shuffle(pool).slice(0, 20)); }
function Q(it){ const q = uById(it[0]).qs[it[1]]; return {t:q[0], p:q[1], o:q[2], e:q[3]}; }
function renderQ(){
  const c = cur; if (c.idx >= c.list.length) return end();
  const q = Q(c.list[c.idx]);
  setView("quiz", c.kind === "u" ? `Unité ${c.ref}` : `Examen du chapitre`);
  const idx = q.o.map((_,i) => i), order = q.t === "vf" ? idx.sort((a,b) => q.o[a] === "Vrai" ? -1 : q.o[b] === "Vrai" ? 1 : 0) : shuffle(idx);
  app.innerHTML = `<div class="bar"><h1>${c.kind === "u" ? `Unité ${esc(c.ref)}` : "Examen du chapitre"}</h1><span class="meta">Question ${c.idx + 1} / ${c.list.length}</span></div>
<div class="prog"><i style="width:${c.idx / c.list.length * 100}%"></i></div>
<div class="q"><span class="tag${q.t === "cas" ? " cas" : ""}">${TYPE[q.t]}</span>${c.kind === "c" ? `<span class="tag">Unité ${esc(c.list[c.idx][0])}</span>` : ""}<div class="qtxt">${esc(q.p)}</div></div>
<div class="opts">${order.map(i => `<button class="opt" data-pick="${i}">${esc(q.o[i])}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div>`;
}
function pick(i){
  const c = cur, q = Q(c.list[c.idx]), ok = i === 0;
  app.querySelectorAll(".opt").forEach(b => { b.disabled = true; const k = +b.dataset.pick; if (k === 0) b.classList.add("ok"); else if (k === i) b.classList.add("ko"); });
  c.res.push({it:c.list[c.idx], ok, pick:i}); c.idx++;
  const last = c.idx >= c.list.length;
  $("fb").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}">${ok ? "Bonne réponse" : "Mauvaise réponse"}</div><div class="expl">${esc(q.e)}</div><div class="toolbar"><button class="btn solid" data-next>${last ? "Voir mon résultat" : "Question suivante"}</button></div>`;
}
let lastWrong = null;
function end(){
  const c = cur, n = c.res.length, ok = c.res.filter(r => r.ok).length, pct = Math.round(ok / n * 100);
  if (c.kind === "u" && !c.err) S.u[c.ref] = Math.max(S.u[c.ref] || 0, ok);
  if (c.kind === "c") S.c[c.ref] = Math.max(S.c[c.ref] || 0, ok);
  save();
  const wrong = c.res.filter(r => !r.ok); lastWrong = wrong.map(r => r.it);
  let nextU = null;
  if (c.kind === "u") { const i = UNITS.findIndex(U => U.id === c.ref); nextU = UNITS.slice(i + 1).find(ready); }
  setView("end", "Résultat");
  let h = `<div class="end"><p class="score">${ok}/${n}</p><p class="meta">${pct} % de bonnes réponses${pct >= 80 ? " : objectif atteint" : " : objectif 80 %"}</p>
<div class="toolbar">${wrong.length ? `<button class="btn solid" data-errs>Refaire mes ${wrong.length} erreur${wrong.length > 1 ? "s" : ""}</button>` : ""}<button class="btn" data-again>Recommencer</button>${nextU ? `<button class="btn" data-fiche="${esc(nextU.id)}">Unité suivante</button>` : ""}<button class="btn" data-home>Sommaire</button></div></div>`;
  if (wrong.length) {
    h += `<h2>Correction</h2>`;
    wrong.forEach(r => { const q = Q(r.it); h += `<div class="corr"><div class="qtxt">${esc(q.p)}</div><div class="cbad">Ta réponse : ${esc(q.o[r.pick])}</div><div class="cgood">Bonne réponse : ${esc(q.o[0])}</div><div class="expl">${esc(q.e)}</div></div>`; });
  }
  app.innerHTML = h;
  cur.done = true;
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.fiche) return fiche(uById(d.fiche));
  if (d.quiz) return quizUnit(uById(d.quiz));
  if (d.exam) return examChap(CHAPS.find(C => C.key === d.exam));
  if ("pick" in d) return pick(+d.pick);
  if ("next" in d) return renderQ();
  if ("errs" in d) { const k = cur.kind, r = cur.ref; start(k, r, shuffle(lastWrong)); cur.err = true; return; }
  if ("again" in d) { return cur.kind === "u" ? quizUnit(uById(cur.ref)) : examChap(CHAPS.find(C => C.key === cur.ref)); }
  if ("home" in d) return home();
  if ("reset" in d) {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirmer : tout effacer"; setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = "Effacer ma progression"; } }, 4000); return; }
    S = {u:{}, c:{}}; save(); return home();
  }
});
$("homeBtn").addEventListener("click", home);
home();
})();
</script>
</body>
</html>
