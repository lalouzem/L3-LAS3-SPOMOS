", "Quel est son nom ?"], "Exemple."], ["qcm", "Quelles variables décrivent le nouveau patient ?", ["78 ans, comorbidité élevée", "Poids, taille", "Sexe, ville"], "Exemple."], ["vf", "Vrai ou faux ? Le ML cherche à définir le futur plutôt qu’à regarder seulement le passé.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? On modélise sans regarder l’historique.", ["Faux", "Vrai"], "Faux."], ["trou", "Complète : observer, apprendre, ______.", ["estimer", "publier", "archiver"], "Tableau."], ["trou", "Complète : comprendre l’______ avant toute modélisation.", ["historique", "outil", "résultat"], "Cours."], ["cas", "Cas pratique : un nouveau patient de 78 ans à forte comorbidité. Que fait-on pour estimer sa durée de séjour ?", ["On applique la relation apprise sur les séjours passés", "On prend la moyenne générale", "On devine"], "Exemple."], ["cas", "Cas pratique : on construit une relation à partir de 10 000 séjours passés. Quelle étape ?", ["Apprendre", "Estimer", "Observer"], "Tableau."], ["cas", "Cas pratique : en examen, « Décrivez le passage de l’historique à l’estimation ». Réponse ?", ["Observer les données, apprendre une relation, estimer pour une nouvelle observation", "Collecter, nettoyer, publier", "Compter, trier, résumer"], "Tableau."], ["qcm", "Pourquoi regarder l’historique avant modélisation ?", ["Pour comprendre les catégories, distributions, évolutions et relations", "Pour économiser du temps", "Pour choisir le tarif"], "Cours."]]}, {"id": "15.3", "title": "Passer d’une question à des variables : les paradigmes d’apprentissage", "fiche": [["eg", "À partir d’une **même population** de patients opérés : « Quelle sera la **durée de séjour** ? » (une valeur) ; « **Quels profils** de patients existe-t-il ? » (pas de réponse connue)."], ["t", [["Paradigme", "Signal d’apprentissage"], ["**Supervisé**", "La **réponse est connue**"], ["**Non supervisé**", "Aucune réponse fournie : on cherche une **structure**"], ["**Par renforcement**", "Les **conséquences** (une récompense) guident l’apprentissage"], ["**Auto-supervisé**", "Le signal vient des **données elles-mêmes** (ex. prédire le mot suivant)"]]], ["warn", "Un **paradigme** définit la **nature du signal** utilisé pour apprendre. Une **famille de modèles** décrit la **forme du modèle** (modèles linéaires, arbres et boosting, k-NN et SVM, réseaux de neurones). **Un réseau de neurones est une famille de modèles, pas un troisième type d’apprentissage.**"]], "qs": [["qcm", "Que cherche « quelle sera la durée de séjour ? »", ["Une valeur à estimer", "Des profils", "Des groupes"], "Exemple."], ["qcm", "Que cherche « quels profils de patients existe-t-il ? »", ["Une structure sans réponse connue", "Une valeur", "Un tarif"], "Exemple."], ["qcm", "Combien de manières d’apprendre les notes citent-elles ?", ["3 (supervisé, non supervisé, renforcement)", "2", "5"], "Cours."], ["qcm", "Quand parle-t-on d’apprentissage supervisé ?", ["Quand la réponse est connue", "Quand aucune réponse n’est fournie", "Quand il y a une récompense"], "Tableau."], ["qcm", "Quand parle-t-on d’apprentissage non supervisé ?", ["Quand aucune réponse n’est fournie : on cherche une structure", "Quand la réponse est connue", "Quand il y a une récompense"], "Tableau."], ["qcm", "Quand parle-t-on d’apprentissage par renforcement ?", ["Quand les conséquences (récompense) guident l’apprentissage", "Quand la réponse est connue", "Quand on cherche une structure"], "Tableau."], ["qcm", "Qu’est-ce que l’auto-supervisé ?", ["Le signal vient des données elles-mêmes (ex. prédire le mot suivant)", "Une réponse connue", "Une récompense"], "Tableau."], ["qcm", "Qu’est-ce qu’un paradigme ?", ["La nature du signal utilisé pour apprendre", "La forme du modèle", "Le nombre de données"], "Explication."], ["qcm", "Qu’est-ce qu’une famille de modèles ?", ["La forme du modèle (linéaire, arbres, k-NN, réseaux…)", "Le signal", "L’algorithme"], "Explication."], ["qcm", "Un réseau de neurones est…", ["Une famille de modèles", "Un troisième type d’apprentissage", "Un paradigme"], "Explication."], ["qcm", "Quelles familles de modèles sont citées ?", ["Linéaires, arbres et boosting, k-NN et SVM, réseaux de neurones", "Seulement les arbres", "Seulement les réseaux"], "Explication."], ["vf", "Vrai ou faux ? Un réseau de neurones est un paradigme d’apprentissage.", ["Faux", "Vrai"], "Faux : une famille de modèles."], ["vf", "Vrai ou faux ? Le supervisé suppose une réponse connue.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : supervisé = la réponse est ______.", ["connue", "inconnue", "cachée"], "Tableau."], ["trou", "Complète : non supervisé = on cherche une ______.", ["structure", "réponse", "récompense"], "Tableau."], ["cas", "Cas pratique : prédire la durée de séjour à partir de séjours passés dont on connaît la durée. Quel paradigme ?", ["Supervisé", "Non supervisé", "Renforcement"], "Cours."], ["cas", "Cas pratique : regrouper des patients en profils sans réponse connue. Quel paradigme ?", ["Non supervisé", "Supervisé", "Renforcement"], "Cours."], ["cas", "Cas pratique : un agent apprend en recevant une récompense. Quel paradigme ?", ["Renforcement", "Supervisé", "Non supervisé"], "Cours."], ["cas", "Cas pratique : en examen, « Distinguez paradigme et famille de modèles ». Réponse ?", ["Paradigme : nature du signal ; famille : forme du modèle (ex. réseau de neurones)", "Aucune différence", "Le paradigme est une famille"], "Explication."], ["qcm", "Que retenir ?", ["Le paradigme dépend du signal d’apprentissage, la famille de la forme du modèle", "Tous les modèles sont supervisés", "Les réseaux sont un paradigme"], "Résumé."]]}]}, {"n": 16, "title": "Ce que signifie apprendre à partir des données", "unites": [{"id": "16.1", "title": "Ce que signifie apprendre à partir des données", "fiche": [["def", "Un modèle apprend à partir **d’exemples passés** pour obtenir **une relation réutilisable**. Il peut apprendre des relations **complexes** et **multidimensionnelles** qu’on ne peut plus représenter sur un graphique. L’apprentissage repose sur un **ensemble d’observations passées** : l’algorithme y cherche une **relation ou une structure** qu’il pourra réutiliser."], ["t", [["Phase", "Ce qui se passe"], ["**Apprentissage**", "Les **paramètres** du modèle sont **ajustés** à partir des données"], ["**Utilisation**", "Le modèle **ajusté** est appliqué à une **observation nouvelle** pour produire une **sortie**"]]], ["t", [["Modèle", "Objectif calculable"], ["Régression", "Erreur quadratique"], ["Arbre de décision", "Impureté (Gini)"], ["Réseau de neurones", "Fonction de perte (loss)"], ["Clustering (K-means)", "Inertie"]]], ["warn", "**Apprendre nécessite toujours un objectif calculable** : un algorithme doit pouvoir **mesurer** si une solution est meilleure ou moins bonne qu’une autre. Intuition → mesure → optimisation."]], "qs": [["qcm", "À partir de quoi un modèle apprend-il ?", ["D’exemples passés", "De règles écrites", "De rien"], "Cours."], ["qcm", "Que cherche l’algorithme dans les exemples ?", ["Une relation ou une structure réutilisable", "Des erreurs", "Des doublons"], "Cours."], ["qcm", "Combien de phases distingue-t-on ?", ["2 : apprentissage et utilisation", "3", "4"], "Tableau."], ["qcm", "Que se passe-t-il en phase d’apprentissage ?", ["Les paramètres du modèle sont ajustés", "Le modèle est appliqué", "Les données sont supprimées"], "Tableau."], ["qcm", "Que se passe-t-il en phase d’utilisation ?", ["Le modèle ajusté est appliqué à une observation nouvelle", "Les paramètres sont ajustés", "Les données sont collectées"], "Tableau."], ["qcm", "Que produit l’utilisation ?", ["Une sortie (estimation)", "Un paramètre", "Un exemple"], "Tableau."], ["qcm", "Pourquoi ne peut-on plus représenter ces relations sur un graphique ?", ["Elles sont multidimensionnelles", "Elles sont trop simples", "Elles sont fausses"], "Cours."], ["qcm", "Que faut-il toujours pour apprendre ?", ["Un objectif calculable", "Un tableau", "Un expert"], "Cours."], ["qcm", "Que doit pouvoir faire un algorithme ?", ["Mesurer si une solution est meilleure ou moins bonne", "Choisir au hasard", "Éviter les erreurs"], "Cours."], ["qcm", "Quel est l’objectif calculable d’un arbre de décision ?", ["L’impureté (Gini)", "La perte", "L’inertie"], "Tableau."], ["qcm", "Quel est l’objectif calculable d’un réseau de neurones ?", ["La fonction de perte (loss)", "L’impureté", "L’inertie"], "Tableau."], ["qcm", "Quel est l’objectif calculable du clustering K-means ?", ["L’inertie", "L’impureté", "La perte"], "Tableau."], ["qcm", "Quel est l’objectif calculable d’une régression ?", ["L’erreur quadratique", "L’inertie", "Gini"], "Tableau."], ["vf", "Vrai ou faux ? Apprentissage et utilisation sont deux moments différents.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Un algorithme peut apprendre sans objectif mesurable.", ["Faux", "Vrai"], "Faux."], ["trou", "Complète : intuition → ______ → optimisation.", ["mesure", "décision", "donnée"], "Cours."], ["cas", "Cas pratique : on ajuste les coefficients d’un modèle sur 10 000 séjours passés. Quelle phase ?", ["Apprentissage", "Utilisation", "Évaluation"], "Tableau."], ["cas", "Cas pratique : le modèle ajusté prédit la durée d’un nouveau patient. Quelle phase ?", ["Utilisation", "Apprentissage", "Collecte"], "Tableau."], ["cas", "Cas pratique : en examen, « Pourquoi faut-il un objectif calculable ? ». Réponse ?", ["Pour mesurer si une solution est meilleure qu’une autre et pouvoir l’optimiser", "Pour décorer", "Pour réduire les données"], "Cours."], ["cas", "Cas pratique : en examen, « Que retenir de la partie 15-16 ? ». Réponse ?", ["Le ML ajoute apprendre entre analyser et décider ; paradigmes ; 2 phases ; objectif calculable", "Les graphiques", "Le RGPD"], "À retenir."]]}]}, {"n": 17, "title": "L’apprentissage supervisé", "unites": [{"id": "17.1", "title": "Observation, variables et cible", "fiche": [["def", "En **supervisé**, on a des données dont **la réponse est connue** : chaque exemple historique contient des **variables d’entrée X** et une **réponse connue y (la cible)**. Le modèle **apprend une relation entre X et y** pour estimer la réponse ŷ d’une **nouvelle observation**."], ["t", [["Terme", "Définition"], ["**Observation**", "Une ligne : par exemple un patient ou un séjour"], ["**Variables d’entrée X**", "Les informations qui décrivent l’observation (âge, urgence, comorbidités…)"], ["**Cible y**", "La réponse connue que l’on cherche à prédire (ex. durée de séjour)"]]], ["eg", "Données d’entraînement : 55 ans, pas d’urgence, comorbidités faibles → **4 jours** ; 78 ans, urgence, comorbidités élevées → **12 jours** ; 66 ans, pas d’urgence, comorbidités moyennes → **7 jours**. Nouvelle observation (X seulement) : 70 ans, urgence, comorbidités moyennes → le modèle estime la durée."]], "qs": [["qcm", "Que contient chaque exemple en apprentissage supervisé ?", ["Des variables d’entrée X et une réponse connue y", "Seulement des variables X", "Seulement la cible"], "Cours."], ["qcm", "Que signifie X ?", ["Les variables d’entrée", "La cible", "Le modèle"], "Tableau."], ["qcm", "Que signifie y ?", ["La cible : la réponse connue à prédire", "Une variable d’entrée", "Une erreur"], "Tableau."], ["qcm", "Que signifie ŷ ?", ["La réponse estimée par le modèle pour une nouvelle observation", "La cible réelle", "Une moyenne"], "Cours."], ["qcm", "Qu’est-ce qu’une observation ?", ["Une ligne (un patient ou un séjour)", "Une colonne", "Une moyenne"], "Tableau."], ["qcm", "Quelles sont des variables d’entrée de l’exemple ?", ["Âge, urgence, comorbidités", "Durée de séjour", "Nom du patient"], "Exemple."], ["qcm", "Quelle est la cible de l’exemple ?", ["La durée de séjour", "L’âge", "Les comorbidités"], "Exemple."], ["qcm", "Que apprend le modèle ?", ["Une relation entre X et y", "Une relation entre y et ŷ", "Une liste"], "Cours."], ["qcm", "Combien de séjours d’entraînement dans l’exemple ?", ["3", "1", "10"], "Exemple."], ["qcm", "Que fournit-on pour la nouvelle observation ?", ["X uniquement", "X et y", "y uniquement"], "Exemple."], ["qcm", "Quelle durée correspond à 78 ans, urgence, comorbidités élevées ?", ["12 jours", "4 jours", "7 jours"], "Exemple."], ["vf", "Vrai ou faux ? En supervisé, la réponse est connue pour les exemples d’entraînement.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? On connaît la cible de la nouvelle observation.", ["Faux", "Vrai"], "Faux : c’est ce qu’on estime."], ["trou", "Complète : variables d’entrée ______ et cible y.", ["X", "Z", "ŷ"], "Cours."], ["cas", "Cas pratique : on veut prédire si un patient sera réhospitalisé à partir de son âge et de ses comorbidités. Quelle est la cible ?", ["La réhospitalisation (oui/non)", "L’âge", "Les comorbidités"], "Cours."], ["cas", "Cas pratique : on a 10 000 séjours avec leur durée connue. Quel type d’apprentissage ?", ["Supervisé", "Non supervisé", "Renforcement"], "Cours."], ["cas", "Cas pratique : 70 ans, urgence, comorbidités moyennes : quelle information manque ?", ["La durée de séjour, à estimer", "L’âge", "L’urgence"], "Exemple."], ["cas", "Cas pratique : en examen, « Définissez X et y ». Réponse ?", ["X : variables d’entrée décrivant l’observation ; y : réponse connue à prédire", "X : réponse ; y : entrée", "Deux cibles"], "Tableau."], ["qcm", "Pourquoi dit-on « supervisé » ?", ["Parce que la réponse connue guide l’apprentissage", "Parce qu’un humain contrôle", "Parce que c’est lent"], "Cours."], ["vf", "Vrai ou faux ? Le modèle utilise les exemples historiques pour estimer une nouvelle réponse.", ["Vrai", "Faux"], "Vrai."]]}, {"id": "17.2", "title": "Régression et classification", "fiche": [["def", "Il faut savoir si la **cible** est une **valeur** ou une **catégorie**."], ["t", [["Type de cible", "Type de problème", "Exemple"], ["**Valeur**", "**Régression** : estimer une quantité numérique", "Durée de séjour : 8,4 jours"], ["**Catégorie** (une ou plusieurs classes)", "**Classification** : estimer l’appartenance à une classe", "« séjour long » ou « séjour court »"]]], ["li", ["De nombreux classifieurs produisent d’abord un **score** ou une **probabilité d’appartenance** (une probabilité, jamais exactement 0 ou 1).", "**Le machine learning, c’est de la probabilité statistique.**"]]], "qs": [["qcm", "Que fait la régression ?", ["Estime une quantité numérique", "Estime l’appartenance à une classe", "Regroupe"], "Tableau."], ["qcm", "Que fait la classification ?", ["Estime l’appartenance à une ou plusieurs classes", "Estime une quantité", "Regroupe"], "Tableau."], ["qcm", "Quelle cible pour la régression ?", ["Une valeur numérique", "Une catégorie", "Aucune"], "Tableau."], ["qcm", "Quelle cible pour la classification ?", ["Une catégorie", "Une valeur numérique", "Aucune"], "Tableau."], ["qcm", "Quel est l’exemple de régression ?", ["Durée de séjour : 8,4 jours", "Séjour long ou court", "Diabétique ou non"], "Exemple."], ["qcm", "Quel est l’exemple de classification ?", ["Séjour long ou court", "Durée de 8,4 jours", "Coût du séjour"], "Exemple."], ["qcm", "Que produisent d’abord de nombreux classifieurs ?", ["Un score ou une probabilité d’appartenance", "Une classe", "Une valeur numérique"], "Cours."], ["qcm", "Une probabilité d’appartenance peut-elle être exactement 0 ou 1 ?", ["Non, jamais (selon le cours)", "Oui, souvent", "Toujours"], "Cours."], ["qcm", "Comment qualifie-t-on le machine learning ?", ["De la probabilité statistique", "De la magie", "De la logique pure"], "Explication."], ["qcm", "Que faut-il savoir pour choisir entre régression et classification ?", ["Si la cible est une valeur ou une catégorie", "Le nombre de variables", "La taille des données"], "Cours."], ["vf", "Vrai ou faux ? Prédire un nombre de jours est un problème de régression.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Prédire « séjour long » est un problème de régression.", ["Faux", "Vrai"], "Faux : classification."], ["trou", "Complète : régression = estimer une ______.", ["quantité", "classe", "probabilité"], "Tableau."], ["trou", "Complète : classification = estimer l’______ à une classe.", ["appartenance", "absence", "origine"], "Tableau."], ["cas", "Cas pratique : prédire le coût d’un séjour. Quel type de problème ?", ["Régression", "Classification", "Clustering"], "Cours."], ["cas", "Cas pratique : prédire si un accès au dossier est légitime ou non. Quel type ?", ["Classification", "Régression", "Clustering"], "Cours."], ["cas", "Cas pratique : prédire le risque de réhospitalisation en probabilité. Quel type ?", ["Classification (avec probabilité)", "Régression", "Clustering"], "Cours."], ["cas", "Cas pratique : en examen, « Distinguez régression et classification ». Réponse ?", ["Régression : valeur numérique ; classification : catégorie", "Régression : catégorie ; classification : valeur", "Aucune différence"], "Tableau."], ["qcm", "Que retenir ?", ["Le type de cible détermine le type de problème", "Tout est régression", "Tout est classification"], "Cours."], ["vf", "Vrai ou faux ? Une classification peut renvoyer une probabilité.", ["Vrai", "Faux"], "Vrai."]]}, {"id": "17.3", "title": "La régression linéaire", "fiche": [["def", "Trouver un **lien linéaire** entre deux variables : **résumer une tendance par une droite**. Pour une variable x, la prédiction s’écrit **ŷ = b₀ + b₁·x** (**b₀** : position de la droite, ordonnée à l’origine ; **b₁** : pente)."], ["li", ["**Résidu** : écart vertical **signé** entre la valeur observée et la valeur prédite par la droite. Parmi une infinité de droites, la meilleure est celle qui a l’**erreur la plus basse**.", "**Pourquoi mettre les erreurs au carré ?** (1) **éviter l’annulation** (+5 et −5 s’annulent) ; (2) **pénaliser les grands écarts** (une erreur de 3 donne 9, une erreur de 20 donne 400).", "**MSE** (*Mean Squared Error*, erreur quadratique moyenne) : moyenne des erreurs au carré sur tout le jeu d’apprentissage.", "**Moindres carrés** : chercher les paramètres (b₀, b₁) qui **minimisent la MSE** ; apprendre la droite = rechercher les paramètres où la **fonction de coût** est minimale."]]], "qs": [["qcm", "Que fait la régression linéaire ?", ["Résume une tendance par une droite", "Regroupe des patients", "Classe des séjours"], "Cours."], ["qcm", "Comment s’écrit la prédiction ?", ["ŷ = b₀ + b₁·x", "ŷ = x²", "ŷ = b₀ / x"], "Cours."], ["qcm", "Que représente b₀ ?", ["La position de la droite (ordonnée à l’origine)", "La pente", "L’erreur"], "Cours."], ["qcm", "Que représente b₁ ?", ["La pente", "L’ordonnée à l’origine", "La MSE"], "Cours."], ["qcm", "Qu’est-ce qu’un résidu ?", ["L’écart vertical signé entre valeur observée et valeur prédite", "La pente", "La moyenne"], "Cours."], ["qcm", "Quelle droite choisit-on ?", ["Celle qui a l’erreur la plus basse", "La plus pentue", "La plus courte"], "Cours."], ["qcm", "Pourquoi mettre les erreurs au carré ?", ["Éviter l’annulation et pénaliser les grands écarts", "Les rendre positives seulement", "Réduire les calculs"], "Cours."], ["qcm", "Que vaut (−5)² ?", ["25", "−25", "10"], "Cours."], ["qcm", "Que vaut l’erreur de 20 au carré ?", ["400", "40", "20"], "Cours."], ["qcm", "Que vaut l’erreur de 3 au carré ?", ["9", "6", "3"], "Cours."], ["qcm", "Que signifie MSE ?", ["Mean Squared Error (erreur quadratique moyenne)", "Mean Standard Error", "Modèle statistique élémentaire"], "Cours."], ["qcm", "Que cherchent les moindres carrés ?", ["Les paramètres qui minimisent la MSE", "Les paramètres qui maximisent la MSE", "La moyenne"], "Cours."], ["qcm", "Qu’est-ce que la fonction de coût ?", ["L’erreur à minimiser pour apprendre la droite", "Le prix du modèle", "La pente"], "Cours."], ["vf", "Vrai ou faux ? Des résidus +5 et −5 s’annulent s’ils ne sont pas élevés au carré.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Une grande erreur pèse plus après élévation au carré.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : ŷ = b₀ + b₁·______.", ["x", "y", "e"], "Cours."], ["cas", "Cas pratique : une droite prédit 8 jours, le séjour réel dure 11 jours. Quel est le résidu ?", ["+ 3 jours", "− 3 jours", "8 jours"], "Calcul : observé − prédit."], ["cas", "Cas pratique : deux droites ont des MSE de 12 et de 9. Laquelle choisit-on ?", ["Celle de MSE 9", "Celle de MSE 12", "Aucune"], "Cours."], ["cas", "Cas pratique : en examen, « Pourquoi élever les résidus au carré ? ». Réponse ?", ["Pour éviter que les erreurs positives et négatives s’annulent et pénaliser les grands écarts", "Pour les arrondir", "Pour les supprimer"], "Cours."], ["qcm", "Que retenir de la régression linéaire ?", ["On choisit la droite qui minimise la MSE", "On choisit la droite la plus simple", "On trace au hasard"], "Cours."]]}, {"id": "17.4", "title": "La régression logistique", "fiche": [["def", "**Pourquoi ne pas utiliser une droite pour prédire une probabilité ?** Une droite n’est **pas bornée** : elle peut produire une valeur < 0 ou > 1, alors qu’une **probabilité reste entre 0 et 1**. On transforme donc le score avec une fonction qui produit une probabilité valide."], ["t", [["Étape", "Contenu"], ["**1. Score z**", "z = b₀ + b₁x₁ + … : peut être négatif, nul ou positif ; ce n’est pas encore une probabilité"], ["**2. Fonction logistique**", "Transforme le score en **probabilité** ; fonction **croissante** qui ramène tout score réel **entre 0 et 1**"], ["**3. Décision par seuil**", "La probabilité est transformée en classe par un **seuil**"]]], ["eg", "Nouvelle observation X → score z → fonction logistique → **P(séjour long | X) = 0,78** → décision par seuil : **0,78 > 0,50 → séjour long**."], ["warn", "**Changer le seuil ne réentraîne pas le modèle** : seule la **règle de décision** change. En multiclasse, on utilise souvent la **classe de probabilité maximale**."]], "qs": [["qcm", "Pourquoi une droite ne convient-elle pas pour une probabilité ?", ["Elle n’est pas bornée entre 0 et 1", "Elle est trop simple", "Elle est trop lente"], "Cours."], ["qcm", "Entre quelles valeurs reste une probabilité ?", ["0 et 1", "−1 et 1", "0 et 100"], "Cours."], ["qcm", "Quelle fonction transforme le score en probabilité ?", ["La fonction logistique", "La fonction carrée", "La fonction linéaire"], "Cours."], ["qcm", "Que peut valoir le score z ?", ["Négatif, nul ou positif", "Seulement positif", "Entre 0 et 1"], "Cours."], ["qcm", "Le score z est-il une probabilité ?", ["Non, pas encore", "Oui", "Parfois"], "Cours."], ["qcm", "Que fait la fonction logistique d’un score réel ?", ["Le ramène entre 0 et 1", "Le multiplie par 2", "Le supprime"], "Cours."], ["qcm", "La fonction logistique est-elle croissante ?", ["Oui", "Non", "Seulement pour z > 0"], "Cours."], ["qcm", "Que produit le modèle en sortie ?", ["Une probabilité d’appartenance", "Une classe directement", "Un score brut"], "Cours."], ["qcm", "Comment passe-t-on de la probabilité à la classe ?", ["Par un seuil", "Par une moyenne", "Par un arbre"], "Cours."], ["qcm", "Quelle probabilité dans l’exemple ?", ["0,78", "0,50", "0,22"], "Exemple."], ["qcm", "Quel seuil dans l’exemple ?", ["0,50", "0,78", "0,10"], "Exemple."], ["qcm", "Que décide-t-on dans l’exemple ?", ["Séjour long (0,78 > 0,50)", "Séjour court", "Aucune décision"], "Exemple."], ["qcm", "Que se passe-t-il quand on change le seuil ?", ["Seule la règle de décision change, pas le modèle", "Le modèle est réentraîné", "Les données changent"], "Explication."], ["qcm", "Que choisit-on en multiclasse ?", ["Souvent la classe de probabilité maximale", "La plus petite classe", "Une classe au hasard"], "Explication."], ["vf", "Vrai ou faux ? La régression logistique est un modèle de classification.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Changer le seuil réentraîne le modèle.", ["Faux", "Vrai"], "Faux."], ["trou", "Complète : fonction ______ → probabilité entre 0 et 1.", ["logistique", "linéaire", "carrée"], "Cours."], ["cas", "Cas pratique : le modèle donne 0,35 avec un seuil à 0,50. Quelle décision ?", ["Séjour court (non long)", "Séjour long", "Aucune"], "Calcul."], ["cas", "Cas pratique : on veut détecter plus de cas à risque. On baisse le seuil à 0,30. Que se passe-t-il ?", ["Plus de cas classés positifs, sans réentraîner le modèle", "Le modèle change", "Les données changent"], "Explication."], ["cas", "Cas pratique : en examen, « Décrivez la régression logistique en trois étapes ». Réponse ?", ["Score z, fonction logistique en probabilité, décision par seuil", "Moyenne, médiane, écart", "Arbre, forêt, vote"], "Tableau."]]}, {"id": "17.5", "title": "L’arbre de décision", "fiche": [["def", "**Arbre de décision** : une **suite de questions**. Chaque chemin correspond à une **règle lisible** qui combine plusieurs informations. Dans chaque **feuille**, la **proportion de séjours longs** fournit une **probabilité estimée** (ex. feuille B : 20 % ; feuille C : 60 %)."], ["li", ["**Une bonne coupure rend les groupes plus homogènes** (avant : 20 séjours, 10 longs et 10 autres ; après : chaque branche regroupe surtout une même classe).", "**Indice de Gini** : mesure le **mélange des classes** (l’impureté) ; à deux classes il va de **0** (groupe pur 100 % / 0 %) à **0,50** (mélange maximal 50 % / 50 %).", "On **pondère** le Gini de chaque branche par sa taille. **Gain = Gini du parent − Gini pondéré après coupure** ; la meilleure coupure **diminue le plus l’impureté**."]], ["eg", "Nœud parent : 10 observations (6 longs, 4 autres) → Gini = 1 − (0,6² + 0,4²) = **0,48**. Trois coupures : Gini pondéré **0,40 ; 0,30 ; 0,45** → la meilleure est celle à **0,30**."], ["warn", "**Surapprentissage** : un arbre trop profond pose des règles très spécifiques qui **mémorisent** les exemples sans bien se généraliser. **Limiter la profondeur** aide à contrôler la complexité."]], "qs": [["qcm", "Qu’est-ce qu’un arbre de décision ?", ["Une suite de questions dont chaque chemin est une règle lisible", "Une droite", "Un regroupement"], "Définition."], ["qcm", "Que fournit une feuille ?", ["Une probabilité estimée (proportion de séjours longs)", "Une question", "Une règle globale"], "Cours."], ["qcm", "Quelle feuille contient 60 % de séjours longs ?", ["La feuille C", "La feuille B", "La feuille A"], "Exemple."], ["qcm", "Qu’est-ce qu’une bonne coupure ?", ["Elle rend les groupes plus homogènes", "Elle rend les groupes plus grands", "Elle double les données"], "Cours."], ["qcm", "Que mesure l’indice de Gini ?", ["Le mélange des classes (l’impureté)", "La profondeur", "La moyenne"], "Cours."], ["qcm", "Quel est le Gini d’un groupe pur ?", ["0", "0,5", "1"], "Cours."], ["qcm", "Quel est le Gini maximal à deux classes ?", ["0,50", "1", "0"], "Cours."], ["qcm", "Que vaut un groupe 50 % / 50 % ?", ["Mélange maximal", "Groupe pur", "Peu mélangé"], "Cours."], ["qcm", "Comment calcule-t-on le Gini après coupure ?", ["On pondère le Gini de chaque branche par sa taille", "On fait la moyenne simple", "On prend le maximum"], "Cours."], ["qcm", "Comment calcule-t-on le gain ?", ["Gini du parent − Gini pondéré après coupure", "Gini de la branche gauche", "Gini du parent × 2"], "Cours."], ["qcm", "Quelle est la meilleure coupure ?", ["Celle qui diminue le plus l’impureté", "Celle qui crée le plus de branches", "Celle qui garde le Gini"], "Cours."], ["qcm", "Parmi les Gini pondérés 0,40, 0,30 et 0,45, lequel est le meilleur ?", ["0,30", "0,40", "0,45"], "Exemple."], ["qcm", "Que risque un arbre trop profond ?", ["Le surapprentissage", "Un manque de précision", "Un manque de règles"], "Cours."], ["qcm", "Que fait un arbre trop profond sur de nouvelles données ?", ["Il généralise mal", "Il généralise mieux", "Il est inchangé"], "Cours."], ["qcm", "Que permet de limiter la profondeur ?", ["Contrôler la complexité", "Augmenter l’erreur", "Doubler les feuilles"], "Cours."], ["vf", "Vrai ou faux ? Les règles d’un arbre sont lisibles par un humain.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Un arbre très profond est toujours meilleur.", ["Faux", "Vrai"], "Faux."], ["trou", "Complète : meilleure coupure = celle qui diminue le plus l’______.", ["impureté", "arbre", "feuille"], "Cours."], ["cas", "Cas pratique : un parent contient 10 longs et 10 autres, une coupure donne deux branches presque pures. Que dire ?", ["La coupure est bonne : les groupes sont plus homogènes", "La coupure est mauvaise", "Il n’y a pas de changement"], "Cours."], ["cas", "Cas pratique : en examen, « Pourquoi limiter la profondeur d’un arbre ? ». Réponse ?", ["Pour éviter qu’il mémorise les exemples et pour garder des règles simples et générales", "Pour accélérer l’affichage", "Pour supprimer les feuilles"], "Cours."]]}, {"id": "17.6", "title": "La forêt aléatoire et les autres modèles", "fiche": [["def", "**Forêt aléatoire** : combiner de nombreux arbres, une sorte de **« démocratie »**. Un arbre peut dépendre fortement des exemples rencontrés ; la forêt construit de **nombreux arbres** à partir de **patients et de variables légèrement différents** (tirages de données et de variables). **Chaque arbre produit une estimation** ; le résultat final **combine** l’ensemble : en **classification**, on **agrège les votes ou probabilités** ; en **régression**, on **moyenne les prédictions**."], ["t", [["Modèle", "Principe"], ["**Régression**", "Calcule une probabilité à partir d’une relation globale entre les variables"], ["**Arbre de décision**", "Suit un enchaînement de règles simples"], ["**Forêt aléatoire**", "Combine les estimations de nombreux arbres"]]], ["li", ["Autres familles supervisées : en **régression** (régression multiple, Ridge et Lasso, forêts de régression, **gradient boosting**) ; en **classification** (**k plus proches voisins**, **SVM**, **Naive Bayes**, gradient boosting). Les **réseaux de neurones** peuvent aussi être entraînés en supervisé."]]], "qs": [["qcm", "Qu’est-ce qu’une forêt aléatoire ?", ["Une combinaison de nombreux arbres", "Un arbre très profond", "Une droite"], "Cours."], ["qcm", "Pourquoi combiner plusieurs arbres ?", ["Un arbre peut dépendre fortement de ses exemples", "Pour allonger les calculs", "Pour réduire les données"], "Cours."], ["qcm", "Comment chaque arbre est-il construit ?", ["Avec des tirages de patients et de variables légèrement différents", "Avec toutes les données", "Avec une seule variable"], "Cours."], ["qcm", "Que produit chaque arbre ?", ["Une estimation", "Une règle unique", "Un résidu"], "Cours."], ["qcm", "Comment combine-t-on en classification ?", ["En agrégeant les votes ou les probabilités", "En moyennant", "En prenant le premier arbre"], "Cours."], ["qcm", "Comment combine-t-on en régression ?", ["En moyennant les prédictions", "En votant", "En prenant le maximum"], "Cours."], ["qcm", "Pourquoi parle-t-on de « démocratie » ?", ["Le résultat combine les choix de nombreux arbres", "Les patients votent", "Les médecins votent"], "Cours."], ["qcm", "Quel principe de la régression est cité ?", ["Une relation globale entre les variables", "Des règles simples", "Une combinaison d’arbres"], "Tableau."], ["qcm", "Quel principe de l’arbre est cité ?", ["Un enchaînement de règles simples", "Une relation globale", "Un vote"], "Tableau."], ["qcm", "Quel principe de la forêt est cité ?", ["Combiner les estimations de nombreux arbres", "Une droite", "Une règle unique"], "Tableau."], ["qcm", "Quel modèle de classification est cité ?", ["k plus proches voisins", "K-means", "ACP"], "Cours."], ["qcm", "Quel autre modèle de classification est cité ?", ["SVM (machines à vecteurs de support)", "K-means", "DBSCAN"], "Cours."], ["qcm", "Quel modèle de régression est cité ?", ["Ridge et Lasso", "SVM", "Naive Bayes"], "Cours."], ["qcm", "Les réseaux de neurones peuvent-ils être supervisés ?", ["Oui", "Non", "Seulement non supervisés"], "Cours."], ["vf", "Vrai ou faux ? Le gradient boosting existe en régression et en classification.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Une forêt est composée d’un seul arbre.", ["Faux", "Vrai"], "Faux."], ["cas", "Cas pratique : 100 arbres votent « séjour long » 70 fois. Quelle probabilité estimée ?", ["0,70", "0,30", "1"], "Cours."], ["cas", "Cas pratique : 100 arbres prédisent en moyenne 8,5 jours. Quel type de problème ?", ["Régression (moyenne des prédictions)", "Classification", "Clustering"], "Cours."], ["cas", "Cas pratique : en examen, « Pourquoi une forêt est-elle plus stable qu’un arbre ? ». Réponse ?", ["Elle combine de nombreux arbres, donc dépend moins d’un seul jeu d’exemples", "Elle est plus petite", "Elle n’utilise pas de données"], "Cours."], ["qcm", "Que retenir de cette partie ?", ["Plusieurs familles de modèles supervisés existent : droites, arbres, forêts, autres", "Il n’existe qu’un seul modèle", "Seule la forêt est utile"], "Cours."]]}, {"id": "17.7", "title": "Évaluer un modèle supervisé : matrice de confusion et mesures", "fiche": [["def", "Un bon modèle doit fonctionner sur des données **qu’il n’a jamais vues**. De trop bons résultats à l’entraînement (99 %) peuvent traduire un **surapprentissage (overfitting)** : on garde une partie des données de côté (**jeu de test**) pour évaluer le modèle."], ["t", [["Matrice de confusion (accès non légitimes)", "Réel positif (non légitime)", "Réel négatif (légitime)", "Total"], ["**Prédit positif** (alerte suspecte)", "**VP = 16**", "**FP = 8**", "24"], ["**Prédit négatif** (pas d’alerte)", "**FN = 4**", "**VN = 72**", "76"]]], ["t", [["Mesure", "Question", "Formule", "Valeur"], ["**Accuracy**", "Quelle proportion de prédictions est correcte ?", "(VP + VN) / N", "(16 + 72) / 100 = **88 %**"], ["**Sensibilité**", "Parmi les positifs réels, combien détectés ?", "VP / (VP + FN)", "16 / 20 = **80 %**"], ["**Spécificité**", "Parmi les négatifs réels, combien correctement écartés ?", "VN / (VN + FP)", "72 / 80 = **90 %**"], ["**Précision (VPP)**", "Parmi les alertes, combien sont justes ?", "VP / (VP + FP)", "16 / 24"], ["**F1**", "Moyenne harmonique de sensibilité et précision", "—", "Pénalise une composante faible"]]], ["warn", "**95 % d’accuracy peut être un très mauvais résultat** : sur 1 000 accès (950 légitimes, 50 non légitimes), un modèle qui ne déclenche **jamais d’alerte** a raison 950 fois (95 %) mais détecte **0/50**. **Message clé** : une classe rare peut être totalement manquée malgré une accuracy élevée. Le **seuil** déplace le compromis entre les erreurs."]], "qs": [["qcm", "Sur quelles données un bon modèle doit-il fonctionner ?", ["Des données qu’il n’a jamais vues", "Les données d’entraînement", "Les données anciennes"], "Cours."], ["qcm", "Qu’est-ce que le surapprentissage ?", ["Un modèle excellent à l’entraînement mais qui généralise mal", "Un modèle trop simple", "Un modèle lent"], "Cours."], ["qcm", "À quoi sert le jeu de test ?", ["Évaluer le modèle sur des données non vues", "Entraîner le modèle", "Nettoyer les données"], "Cours."], ["qcm", "Que représente VP ?", ["Vrai positif : alerte justifiée", "Faux positif", "Vrai négatif"], "Matrice."], ["qcm", "Que représente FP ?", ["Faux positif : fausse alerte", "Faux négatif", "Vrai positif"], "Matrice."], ["qcm", "Que représente FN ?", ["Faux négatif : cas manqué", "Faux positif", "Vrai négatif"], "Matrice."], ["qcm", "Que représente VN ?", ["Vrai négatif : accès légitime écarté", "Faux négatif", "Faux positif"], "Matrice."], ["qcm", "Que valent VP, FP, FN et VN dans l’exemple ?", ["16, 8, 4, 72", "8, 16, 72, 4", "4, 72, 16, 8"], "Matrice."], ["qcm", "Comment calcule-t-on l’accuracy ?", ["(VP + VN) / N", "VP / (VP + FN)", "VN / (VN + FP)"], "Tableau."], ["qcm", "Quelle est l’accuracy de l’exemple ?", ["88 %", "80 %", "90 %"], "Calcul."], ["qcm", "Comment calcule-t-on la sensibilité ?", ["VP / (VP + FN)", "VN / (VN + FP)", "VP / (VP + FP)"], "Tableau."], ["qcm", "Quelle est la sensibilité de l’exemple ?", ["80 %", "88 %", "90 %"], "Calcul."], ["qcm", "Comment calcule-t-on la spécificité ?", ["VN / (VN + FP)", "VP / (VP + FN)", "VP / (VP + FP)"], "Tableau."], ["qcm", "Quelle est la spécificité de l’exemple ?", ["90 %", "80 %", "88 %"], "Calcul."], ["qcm", "Que mesure la précision (VPP) ?", ["Parmi les alertes, combien sont justes", "Parmi les positifs réels, combien détectés", "La proportion globale correcte"], "Tableau."], ["qcm", "Que signifie une sensibilité élevée ?", ["Peu d’accès non légitimes manqués", "Peu de fausses alertes", "Beaucoup d’alertes"], "Cours."], ["qcm", "Que signifie une spécificité élevée ?", ["Peu d’accès légitimes déclenchent une fausse alerte", "Peu d’accès non légitimes manqués", "Beaucoup d’alertes"], "Cours."], ["qcm", "Que fait le F1 ?", ["Équilibre sensibilité et précision", "Mesure la perte", "Mesure l’inertie"], "Cours."], ["cas", "Cas pratique : sur 1 000 accès (950 légitimes, 50 non légitimes), le modèle ne déclenche jamais d’alerte. Quelle est sa sensibilité ?", ["0/50 = 0 %", "95 %", "50 %"], "Cours."], ["cas", "Cas pratique : en examen, « Pourquoi ne pas se fier à l’accuracy seule ? ». Réponse ?", ["Une classe rare peut être totalement manquée malgré une accuracy élevée", "Elle est fausse", "Elle est trop longue à calculer"], "Message clé."]]}]}, {"n": 18, "title": "L’apprentissage non supervisé", "unites": [{"id": "18.1", "title": "Le clustering : rapprocher ce qui se ressemble", "fiche": [["def", "**Non supervisé** : explorer, regrouper et résumer des données **sans réponse connue**. Aucune étiquette n’indique la réponse : le modèle explore les **ressemblances** entre les observations ; on ne cherche pas à donner la réponse mais à **créer une structure** dans les données."], ["def", "Le **clustering** regroupe les observations qui présentent des **caractéristiques proches** : à partir d’un ensemble de données, on recrée des **groupes**."], ["li", ["Contraste avec le supervisé : le supervisé apprend **X → y** ; le non supervisé cherche une **structure** dans X."]]], "qs": [["qcm", "Que signifie « non supervisé » ?", ["Sans réponse connue : on cherche une structure", "Avec réponse connue", "Avec récompense"], "Cours."], ["qcm", "Qu’indique une étiquette en supervisé ?", ["La réponse", "Le groupe", "L’erreur"], "Cours."], ["qcm", "Que fait le modèle non supervisé ?", ["Il explore les ressemblances entre les observations", "Il prédit une réponse", "Il évalue un tarif"], "Cours."], ["qcm", "Que cherche-t-on à créer ?", ["Une structure dans les données", "Une réponse", "Une règle"], "Cours."], ["qcm", "Que fait le clustering ?", ["Il regroupe les observations proches", "Il prédit une valeur", "Il supprime les données"], "Cours."], ["qcm", "Que signifie « groupe » en clustering ?", ["Un ensemble d’observations proches", "Une catégorie connue", "Une étiquette"], "Cours."], ["qcm", "Existe-t-il une réponse connue en clustering ?", ["Non", "Oui", "Parfois"], "Cours."], ["qcm", "Quelle est la différence avec le supervisé ?", ["Le non supervisé n’a pas de cible y", "Le non supervisé a deux cibles", "Aucune"], "Cours."], ["vf", "Vrai ou faux ? Le clustering utilise une cible connue.", ["Faux", "Vrai"], "Faux."], ["vf", "Vrai ou faux ? Le clustering regroupe des observations qui se ressemblent.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : non supervisé = chercher une ______.", ["structure", "réponse", "probabilité"], "Cours."], ["trou", "Complète : le ______ regroupe les observations proches.", ["clustering", "modèle", "seuil"], "Cours."], ["cas", "Cas pratique : regrouper des patients en profils sans réponse connue. Quelle méthode ?", ["Le clustering", "La régression", "La classification"], "Cours."], ["cas", "Cas pratique : prédire la durée de séjour à partir de séjours passés. Est-ce du clustering ?", ["Non, c’est du supervisé", "Oui", "Parfois"], "Cours."], ["cas", "Cas pratique : en examen, « Que cherche le non supervisé ? ». Réponse ?", ["Une structure dans les données, sans réponse connue", "Une réponse précise", "Une récompense"], "Cours."], ["cas", "Cas pratique : un hôpital veut découvrir des profils de patients sans a priori. Quel paradigme ?", ["Non supervisé", "Supervisé", "Renforcement"], "Cours."], ["qcm", "Pourquoi dit-on « sans réponse connue » ?", ["Parce qu’aucune étiquette ne guide l’apprentissage", "Parce que les données sont secrètes", "Parce que le modèle est inconnu"], "Cours."], ["qcm", "Quel exemple d’usage est cité ?", ["Repérer des groupes de patients proches", "Prédire un tarif", "Chiffrer des données"], "Cours."], ["vf", "Vrai ou faux ? Le non supervisé explore les ressemblances.", ["Vrai", "Faux"], "Vrai."], ["qcm", "Que retenir ?", ["Sans réponse connue, on cherche une structure", "Le clustering prédit", "Le clustering est supervisé"], "Cours."]]}, {"id": "18.2", "title": "Un patient = plusieurs dimensions : les vecteurs", "fiche": [["def", "Quand on a des patients, on crée des **vecteurs** : **chaque colonne ajoute une dimension** au point, et le vecteur forme un **ensemble de coordonnées** qui permettent de **placer le point dans l’espace**."], ["eg", "**Âge**, **valorisation** et **durée de séjour** décrivent le **même patient** : trois dimensions."], ["warn", "Un patient est donc un **point** dans un espace à plusieurs dimensions ; comparer deux patients revient à comparer deux points."]], "qs": [["qcm", "Qu’est-ce qu’un vecteur ici ?", ["Un ensemble de coordonnées qui place le patient dans l’espace", "Une flèche", "Une moyenne"], "Cours."], ["qcm", "Que fait chaque colonne ?", ["Ajoute une dimension au point", "Supprime une dimension", "Mesure une erreur"], "Cours."], ["qcm", "Quelles dimensions décrivent le même patient dans l’exemple ?", ["Âge, valorisation, durée de séjour", "Nom, adresse", "Date, lieu"], "Exemple."], ["qcm", "Combien de dimensions pour âge + valorisation + durée ?", ["3", "1", "2"], "Exemple."], ["qcm", "Que devient un patient dans cet espace ?", ["Un point", "Une ligne", "Une surface"], "Cours."], ["qcm", "Que revient à comparer deux patients ?", ["Comparer deux points", "Comparer deux colonnes", "Comparer deux tables"], "Cours."], ["qcm", "Que permet le vecteur ?", ["Placer le point dans l’espace", "Chiffrer la donnée", "Ordonner les patients"], "Cours."], ["qcm", "Que se passe-t-il quand on ajoute une variable ?", ["On ajoute une dimension", "On supprime un patient", "Rien"], "Cours."], ["vf", "Vrai ou faux ? Chaque colonne ajoute une dimension.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Un patient est décrit par une seule dimension.", ["Faux", "Vrai"], "Faux."], ["trou", "Complète : chaque colonne ajoute une ______.", ["dimension", "ligne", "moyenne"], "Cours."], ["trou", "Complète : le vecteur = ensemble de ______.", ["coordonnées", "patients", "erreurs"], "Cours."], ["cas", "Cas pratique : un patient est décrit par 10 variables. Combien de dimensions ?", ["10", "1", "100"], "Cours."], ["cas", "Cas pratique : deux patients ont des coordonnées très proches. Que dire ?", ["Leurs profils se ressemblent", "Ils sont identiques", "Ils sont différents"], "Cours."], ["cas", "Cas pratique : en examen, « Pourquoi parler de vecteur pour un patient ? ». Réponse ?", ["Ses variables forment des coordonnées qui le placent dans un espace", "Il est un patient", "Il est un nombre"], "Cours."], ["cas", "Cas pratique : on ajoute le sexe et le poids aux variables. Que devient le patient ?", ["Un point avec deux dimensions de plus", "Un point inchangé", "Deux points"], "Cours."], ["qcm", "Quel est l’intérêt de représenter le patient par un vecteur ?", ["Pouvoir calculer des distances entre profils", "Rendre le patient anonyme", "Réduire le coût"], "Cours."], ["qcm", "Que dit-on de la valorisation dans l’exemple ?", ["C’est une dimension du patient", "C’est une cible", "C’est un groupe"], "Exemple."], ["vf", "Vrai ou faux ? On peut placer un patient dans un espace à plusieurs dimensions.", ["Vrai", "Faux"], "Vrai."], ["qcm", "Que retenir ?", ["Un patient = un point dans un espace de variables", "Un patient = une ligne de texte", "Un patient = une moyenne"], "Cours."]]}, {"id": "18.3", "title": "Les distances comparent les profils", "fiche": [["def", "On calcule la **distance entre les points** : **plus la distance est faible, plus les profils se ressemblent**. La **distance euclidienne** vient de **Pythagore** : en deux dimensions, les écarts horizontal et vertical forment un triangle ; chaque variable contribue à la distance finale."], ["def", "**d(A, B) = √(Δx² + Δy²)**. Exemple : le triangle **3-4-5** donne une distance de **5**."]], "qs": [["qcm", "Que signifie une faible distance ?", ["Les profils se ressemblent", "Les profils sont différents", "Les profils sont identiques"], "Cours."], ["qcm", "Quelle distance utilise-t-on ?", ["La distance euclidienne", "La distance de Manhattan", "La distance de Gower"], "Cours."], ["qcm", "D’où vient la distance euclidienne ?", ["De Pythagore", "De Newton", "De Gauss"], "Cours."], ["qcm", "Comment s’écrit la distance en 2D ?", ["d = √(Δx² + Δy²)", "d = Δx + Δy", "d = Δx × Δy"], "Formule."], ["qcm", "Que forment les écarts horizontal et vertical ?", ["Un triangle", "Un cercle", "Une droite"], "Cours."], ["qcm", "Que vaut la distance du triangle 3-4-5 ?", ["5", "7", "12"], "Exemple."], ["qcm", "Que vaut √(3² + 4²) ?", ["5", "7", "25"], "Calcul."], ["qcm", "Que contribue chaque variable ?", ["À la distance finale", "À la cible", "À l’erreur"], "Cours."], ["vf", "Vrai ou faux ? Plus la distance est grande, plus les profils se ressemblent.", ["Faux", "Vrai"], "Faux."], ["vf", "Vrai ou faux ? La distance euclidienne vient de Pythagore.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : d(A, B) = √(Δx² + Δy²) : distance ______.", ["euclidienne", "moyenne", "relative"], "Formule."], ["trou", "Complète : triangle 3-4-5 → distance ___.", ["5", "7", "12"], "Exemple."], ["cas", "Cas pratique : deux patients A (0 ; 0) et B (3 ; 4). Quelle distance ?", ["5", "7", "12"], "Calcul."], ["cas", "Cas pratique : deux patients A (1 ; 1) et B (1 ; 1). Quelle distance ?", ["0 : profils identiques", "1", "2"], "Calcul."], ["cas", "Cas pratique : A (0 ; 0), B (6 ; 8). Quelle distance ?", ["10", "14", "7"], "Calcul : √(36+64)."], ["cas", "Cas pratique : en examen, « Que mesure la distance euclidienne ? ». Réponse ?", ["La ressemblance entre deux profils : plus elle est faible, plus ils se ressemblent", "La taille d’un groupe", "Le nombre de variables"], "Cours."], ["qcm", "Pourquoi calcule-t-on des distances en clustering ?", ["Pour rapprocher les profils qui se ressemblent", "Pour mesurer une durée", "Pour trier"], "Cours."], ["qcm", "Que se passe-t-il en 3 dimensions ?", ["On ajoute (Δz)² sous la racine", "On change de formule", "On ne peut pas calculer"], "Extension."], ["vf", "Vrai ou faux ? Chaque variable participe à la distance.", ["Vrai", "Faux"], "Vrai."], ["qcm", "Que retenir ?", ["Distance faible = profils proches", "Distance faible = profils éloignés", "La distance est une probabilité"], "Cours."]]}, {"id": "18.4", "title": "Un problème : des variables comparables (standardisation)", "fiche": [["li", ["**K-means utilise des variables numériques** : la distance et la moyenne doivent avoir un sens. Un code postal, une couleur ou un service ne devient pas numérique parce qu’on lui donne un nombre.", "Il faut **comparer des choses comparables** : **+20 ans** (40 → 60) et **+2 000 €** (3 000 → 5 000) utilisent des **unités différentes** : sans transformation, la **valorisation domine** artificiellement la distance."]], ["def", "**Standardisation** : on **centre** chaque variable, puis on la **divise par son écart-type** : **z = (x − moyenne) / écart-type**. Les unités disparaissent : « +1 » a le même sens pour toutes les variables (on compare des écarts à la moyenne)."], ["warn", "La standardisation doit être **estimée uniquement sur les données d’apprentissage**."]], "qs": [["qcm", "Quel type de variables utilise K-means ?", ["Numériques", "Catégorielles", "Textuelles"], "Cours."], ["qcm", "Pourquoi un code postal n’est-il pas numérique ?", ["Un nombre donné à une catégorie n’a pas de sens de distance", "Il est trop long", "Il est confidentiel"], "Cours."], ["qcm", "Quel problème pose +20 ans et +2 000 € ?", ["Des unités différentes : la valorisation domine la distance", "Aucun", "Des erreurs de saisie"], "Cours."], ["qcm", "Quelle variable domine artificiellement la distance ?", ["La valorisation (grandes valeurs)", "L’âge", "La durée"], "Cours."], ["qcm", "Que fait la standardisation ?", ["Centre puis divise par l’écart-type", "Divise par la moyenne", "Arrondit"], "Cours."], ["qcm", "Quelle est la formule de z ?", ["(x − moyenne) / écart-type", "x / moyenne", "x × écart-type"], "Cours."], ["qcm", "Que deviennent les unités après standardisation ?", ["Elles disparaissent", "Elles doublent", "Elles restent"], "Cours."], ["qcm", "Que signifie « +1 » après standardisation ?", ["Un écart d’un écart-type à la moyenne", "Un an de plus", "Un euro de plus"], "Cours."], ["qcm", "Où doit-on estimer la standardisation ?", ["Uniquement sur les données d’apprentissage", "Sur toutes les données", "Sur le jeu de test"], "Cours."], ["qcm", "Que signifie « comparer des choses comparables » ?", ["Mettre les variables à la même échelle", "Utiliser la même unité", "Supprimer des variables"], "Cours."], ["vf", "Vrai ou faux ? Sans standardisation, une variable aux grandes unités domine la distance.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? On peut utiliser K-means sur des services codés 1, 2, 3 sans précaution.", ["Faux", "Vrai"], "Faux."], ["trou", "Complète : z = (x − ______) / écart-type.", ["moyenne", "médiane", "maximum"], "Cours."], ["trou", "Complète : centrer puis diviser par l’______.", ["écart-type", "effectif", "unité"], "Cours."], ["cas", "Cas pratique : l’âge varie de 20 à 90 et la valorisation de 500 à 60 000. Que faire avant K-means ?", ["Standardiser les variables", "Supprimer l’âge", "Ne rien faire"], "Cours."], ["cas", "Cas pratique : en examen, « Pourquoi standardiser avant K-means ? ». Réponse ?", ["Pour que chaque variable pèse de façon comparable dans la distance", "Pour réduire le nombre de patients", "Pour créer un groupe"], "Cours."], ["cas", "Cas pratique : une couleur est codée 1, 2, 3. Peut-on l’utiliser telle quelle dans K-means ?", ["Non : la distance n’a pas de sens", "Oui", "Seulement si grande"], "Cours."], ["cas", "Cas pratique : la moyenne de l’âge est 60, l’écart-type 10 ; un patient a 70 ans. Quelle valeur z ?", ["+ 1", "+ 10", "0"], "Calcul."], ["qcm", "Que retenir ?", ["Il faut des variables numériques et standardisées", "K-means accepte tout", "La standardisation est inutile"], "Cours."], ["vf", "Vrai ou faux ? La standardisation compare des écarts à la moyenne.", ["Vrai", "Faux"], "Vrai."]]}, {"id": "18.5", "title": "K-means : chercher K groupes compacts", "fiche": [["def", "**K-means** : on **fixe le nombre de groupes K avant l’apprentissage** ; chaque groupe s’organise autour d’un **centroïde** (centre moyen)."], ["t", [["Étape", "Ce qu’on fait"], ["**1. Placer K centres**", "Au début, on définit (ex.) 3 centres **au hasard** : leur position initiale est provisoire"], ["**2. Mesurer les distances**", "Pour affecter un point P, on mesure sa distance aux centroïdes"], ["**3. Affecter**", "Règle : un point rejoint le **centroïde le plus proche** (les centres restent fixes pendant cette étape)"], ["**4. Recalculer les centres**", "On déplace chaque centre au milieu de son groupe : **moyenne des coordonnées**"], ["**5. Réaffecter**", "Avec les nouvelles positions, on redéfinit les groupes (ex. 14 points changent de groupe)"], ["**6. Recommencer**", "Jusqu’à un résultat **stable** : les centres ne bougent plus"]]], ["eg", "P = (4 ; 3) est comparé aux trois centres : la plus petite distance est **2,24** → P rejoint le groupe A. Centre de trois points : c = **(4 ; 4)**, qui ne correspond à aucune observation et minimise la somme des distances au carré."]], "qs": [["qcm", "Que doit-on fixer avant l’apprentissage ?", ["Le nombre de groupes K", "La cible", "Le seuil"], "Cours."], ["qcm", "Qu’est-ce qu’un centroïde ?", ["Le centre moyen d’un groupe", "Un point isolé", "Une observation"], "Cours."], ["qcm", "Comment place-t-on les centres au départ ?", ["Au hasard", "Au milieu", "À la moyenne"], "Étape 1."], ["qcm", "Quelle règle affecte un point ?", ["Il rejoint le centroïde le plus proche", "Il rejoint le plus grand groupe", "Il rejoint un groupe au hasard"], "Étape 3."], ["qcm", "Que font les centres pendant l’affectation ?", ["Ils restent fixes", "Ils bougent", "Ils disparaissent"], "Étape 3."], ["qcm", "Que fait l’étape 4 ?", ["Recalcule chaque centre (moyenne des coordonnées)", "Place les centres", "Affecte les points"], "Étape 4."], ["qcm", "Que fait l’étape 5 ?", ["Réaffecte les points aux nouveaux centres", "Calcule l’inertie", "Standardise"], "Étape 5."], ["qcm", "Quand s’arrête-t-on ?", ["Quand les centres ne bougent plus", "Après 3 tours", "Quand l’inertie est nulle"], "Étape 6."], ["qcm", "Combien d’étapes compte K-means ?", ["6", "3", "10"], "Tableau."], ["qcm", "Quelle distance a P vers le groupe A dans l’exemple ?", ["2,24", "4", "5"], "Exemple."], ["qcm", "Quel centre est calculé pour A, B et C dans l’exemple ?", ["(4 ; 4)", "(0 ; 0)", "(3 ; 3)"], "Exemple."], ["qcm", "Un centroïde correspond-il toujours à une observation ?", ["Non", "Oui", "Seulement au début"], "Exemple."], ["vf", "Vrai ou faux ? K est fixé avant l’apprentissage.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Les positions initiales des centres sont définitives.", ["Faux", "Vrai"], "Faux : provisoires."], ["trou", "Complète : un point rejoint le centroïde le plus ______.", ["proche", "grand", "ancien"], "Étape 3."], ["trou", "Complète : on recommence jusqu’à un résultat ______.", ["stable", "parfait", "court"], "Étape 6."], ["cas", "Cas pratique : un point est à 2,2 du centre A, 4,0 du centre B et 5,1 du centre C. Où va-t-il ?", ["Groupe A", "Groupe B", "Groupe C"], "Règle."], ["cas", "Cas pratique : un groupe compte trois points (2 ; 2), (4 ; 4), (6 ; 6). Quel est son nouveau centre ?", ["(4 ; 4)", "(2 ; 2)", "(6 ; 6)"], "Calcul : moyenne."], ["cas", "Cas pratique : en examen, « Décrivez le cycle de K-means ». Réponse ?", ["Placer K centres, affecter au plus proche, recalculer les centres, réaffecter, recommencer jusqu’à stabilité", "Choisir une cible, calculer une MSE", "Tracer un arbre"], "Tableau."], ["qcm", "Que retenir ?", ["K-means cherche K groupes compacts autour de centroïdes", "K-means prédit une cible", "K-means est supervisé"], "Cours."]]}, {"id": "18.6", "title": "L’inertie : une même logique quadratique", "fiche": [["def", "De la même manière qu’on calcule l’erreur de la régression, on calcule l’**inertie** : régression et K-means **additionnent des écarts au carré** (écart vertical à la prédiction d’un côté, distance au centroïde de l’autre). **I = Σ d(xᵢ, cᵢ)²** : 1. mesurer la distance ; 2. la mettre au carré ; 3. additionner les points."], ["li", ["L’**inertie d’un groupe** additionne les distances au carré entre ses points et son propre centroïde ; l’**inertie totale** se calcule en refaisant ce calcul pour l’ensemble des groupes.", "**Chaque point contribue une seule fois**, avec le centroïde de son groupe : les distances vers les autres centres ne sont pas ajoutées.", "**Une chute d’inertie traduit des groupes plus compacts.** Avec trop de groupes, l’inertie baisse encore, mais le regroupement **ne résume plus rien**."]]], "qs": [["qcm", "Que calcule l’inertie ?", ["La somme des distances au carré entre points et centroïdes", "La moyenne des distances", "Le nombre de groupes"], "Cours."], ["qcm", "Quelle est la formule de l’inertie ?", ["I = Σ d(xᵢ, cᵢ)²", "I = Σ d(xᵢ, cᵢ)", "I = Π d(xᵢ, cᵢ)"], "Formule."], ["qcm", "Quelles sont les trois opérations ?", ["Mesurer la distance, la mettre au carré, additionner", "Moyenner, trier, couper", "Standardiser, centrer, diviser"], "Formule."], ["qcm", "À quelle mesure l’inertie ressemble-t-elle ?", ["À la MSE de la régression", "À l’accuracy", "Au Gini"], "Cours."], ["qcm", "Que contient l’inertie d’un groupe ?", ["Les points affectés à son centroïde", "Tous les points", "Les centres"], "Cours."], ["qcm", "Combien de fois chaque point contribue-t-il ?", ["Une seule fois", "Trois fois", "Deux fois"], "Cours."], ["qcm", "Avec quel centroïde un point contribue-t-il ?", ["Celui de son groupe", "Tous", "Le plus lointain"], "Cours."], ["qcm", "Que traduit une chute d’inertie ?", ["Des groupes plus compacts", "Des groupes plus dispersés", "Une erreur"], "Cours."], ["qcm", "Que se passe-t-il si K est très grand ?", ["L’inertie baisse mais le regroupement ne résume plus rien", "L’inertie monte", "Rien"], "Cours."], ["qcm", "Comment calcule-t-on l’inertie totale ?", ["En additionnant l’inertie de tous les groupes", "En prenant la plus grande", "En moyennant"], "Cours."], ["vf", "Vrai ou faux ? Régression et K-means additionnent des écarts au carré.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Les distances aux autres centres sont ajoutées à l’inertie.", ["Faux", "Vrai"], "Faux."], ["trou", "Complète : inertie = somme des distances au ______.", ["carré", "cube", "centre"], "Formule."], ["trou", "Complète : une ______ d’inertie = groupes plus compacts.", ["chute", "hausse", "stabilité"], "Cours."], ["cas", "Cas pratique : passer de K = 1 à K = 3 divise l’inertie par 5. Que conclure ?", ["Les groupes sont plus compacts", "Les groupes sont éclatés", "Il y a une erreur"], "Cours."], ["cas", "Cas pratique : on met un centre sur chaque patient : l’inertie est nulle. Que penser du regroupement ?", ["Il ne résume plus rien", "Il est parfait", "Il est standard"], "Cours."], ["cas", "Cas pratique : en examen, « Quel lien entre inertie et MSE ? ». Réponse ?", ["Même logique quadratique : des écarts au carré additionnés", "Aucun", "L’inertie est une probabilité"], "Cours."], ["cas", "Cas pratique : un point est à 2 de son centroïde et 5 d’un autre. Quelle contribution à l’inertie ?", ["2² = 4", "5² = 25", "4 + 25"], "Cours."], ["qcm", "Que retenir ?", ["L’inertie mesure la compacité des groupes en distances au carré", "L’inertie mesure la précision", "L’inertie mesure le seuil"], "Cours."], ["vf", "Vrai ou faux ? Chaque point contribue une seule fois à l’inertie.", ["Vrai", "Faux"], "Vrai."]]}, {"id": "18.7", "title": "Combien de groupes ? La méthode du coude", "fiche": [["def", "**Méthode du coude** : on teste **différents K** (3, puis 4, 5…) et pour chacun on calcule l’**inertie**. Au bout d’un moment, elle **se stabilise** : il n’est plus utile d’ajouter des groupes. **Quand la courbe fait un coude, on retient la valeur du coude.**"], ["li", ["**Avant le coude** : les distances diminuent **fortement** (une forte baisse **révèle une structure**).", "**Après le coude** : on subdivise surtout des groupes existants (les faibles gains **raffinent** le découpage).", "Dans l’exemple du cours : **coude à K = 3**."]], ["warn", "**Le coude marque un compromis** entre compacité des groupes et simplicité."]], "qs": [["qcm", "À quoi sert la méthode du coude ?", ["Choisir le nombre de groupes K", "Choisir la cible", "Choisir le seuil"], "Cours."], ["qcm", "Que teste-t-on ?", ["Différents nombres de groupes K", "Différentes variables", "Différents patients"], "Cours."], ["qcm", "Que calcule-t-on pour chaque K ?", ["L’inertie", "L’accuracy", "Le seuil"], "Cours."], ["qcm", "Que fait l’inertie quand K augmente ?", ["Elle baisse puis se stabilise", "Elle augmente", "Elle reste constante"], "Cours."], ["qcm", "Que retient-on ?", ["La valeur de K au coude", "La plus grande valeur de K", "La plus petite inertie"], "Cours."], ["qcm", "Que révèle une forte baisse d’inertie ?", ["Une structure dans les données", "Une erreur", "Un doublon"], "Cours."], ["qcm", "Que font les faibles gains après le coude ?", ["Ils raffinent le découpage", "Ils créent une structure", "Ils suppriment les groupes"], "Cours."], ["qcm", "Quel est le coude de l’exemple ?", ["K = 3", "K = 5", "K = 10"], "Exemple."], ["qcm", "Que marque le coude ?", ["Un compromis", "Une erreur", "Une fin"], "Cours."], ["qcm", "Pourquoi ne pas choisir K très grand ?", ["L’inertie baisse mais le regroupement ne résume plus rien", "L’inertie monte", "Le calcul est interdit"], "Cours."], ["vf", "Vrai ou faux ? On prend le K qui minimise l’inertie sans limite.", ["Faux", "Vrai"], "Faux : on prend le coude."], ["vf", "Vrai ou faux ? Le coude est le point où l’inertie se met à se stabiliser.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : méthode du ______.", ["coude", "genou", "poignet"], "Titre."], ["trou", "Complète : coude à K = ___ dans l’exemple.", ["3", "5", "10"], "Exemple."], ["cas", "Cas pratique : l’inertie chute fortement de K = 2 à K = 3 puis très peu ensuite. Quel K retenir ?", ["K = 3", "K = 2", "K = 10"], "Cours."], ["cas", "Cas pratique : en examen, « Comment choisir K ? ». Réponse ?", ["Tester plusieurs K, calculer l’inertie et retenir le coude", "Choisir K = 1", "Choisir au hasard"], "Cours."], ["cas", "Cas pratique : l’inertie continue de baisser fortement jusqu’à K = 10. Que penser ?", ["Il n’y a pas de coude net : on vérifie le sens métier", "K = 10 est forcément bon", "Il y a une erreur"], "Cours."], ["cas", "Cas pratique : en examen, « Que représentent les faibles gains après le coude ? ». Réponse ?", ["On subdivise des groupes existants (raffinement)", "Une nouvelle structure", "Une erreur"], "Cours."], ["qcm", "Que retenir ?", ["Le coude indique un bon nombre de groupes", "Le coude indique une erreur", "Le coude indique le seuil"], "Cours."], ["vf", "Vrai ou faux ? Une forte baisse d’inertie révèle une structure.", ["Vrai", "Faux"], "Vrai."]]}, {"id": "18.8", "title": "Sans cible connue, l’évaluation change : la silhouette", "fiche": [["t", [["Critère", "Question"], ["**Compacité et séparation**", "Les groupes sont-ils compacts et bien séparés ?"], ["**Stabilité**", "Retrouve-t-on des groupes proches si l’échantillon ou l’initialisation changent ?"], ["**Utilité métier**", "Le découpage aide-t-il à répondre à la question métier ?"], ["**Interprétabilité**", "Peut-on décrire chaque groupe avec des caractéristiques compréhensibles ?"]]], ["def", "**Silhouette** : savoir si un point est dans le **bon groupe**. **a(i)** : distance moyenne du point aux autres points de **son propre groupe** ; **b(i)** : plus petite distance moyenne vers **un autre groupe** (le groupe extérieur le plus proche). **s(i) = (b − a) / max(a, b)**, entre **−1 et +1**."], ["t", [["Valeur", "Situation", "Lecture"], ["Proche de **+1**", "a < b", "Point **bien placé** (très proche de son groupe)"], ["Proche de **0**", "a ≈ b", "Point **à la frontière**"], ["Proche de **−1**", "a > b", "Point **probablement mal affecté**"]]], ["warn", "**Message clé** : les scores ne suffisent pas : le **sens des groupes** doit être vérifié **dans le contexte**. Train / validation / test : pour une **exploration ponctuelle**, pas toujours nécessaire ; pour **affecter de nouvelles observations**, on apprend les centres sur un ensemble et on évalue sur des données tenues à l’écart."]], "qs": [["qcm", "Pourquoi l’évaluation change-t-elle sans cible ?", ["Il n’y a pas de réponse connue pour comparer", "Les données sont secrètes", "Le modèle est lent"], "Cours."], ["qcm", "Quels sont les critères d’évaluation d’un clustering ?", ["Compacité et séparation, stabilité, utilité métier, interprétabilité", "Accuracy, sensibilité", "MSE, Gini"], "Tableau."], ["qcm", "Que vérifie la stabilité ?", ["Si l’on retrouve des groupes proches quand l’échantillon ou l’initialisation change", "Si les groupes sont compacts", "Si les groupes sont utiles"], "Tableau."], ["qcm", "Que vérifie l’interprétabilité ?", ["Si chaque groupe est descriptible avec des caractéristiques compréhensibles", "Si les groupes sont stables", "Si les groupes sont compacts"], "Tableau."], ["qcm", "Que mesure la silhouette ?", ["Si un point est dans le bon groupe", "Le nombre de groupes", "L’inertie totale"], "Cours."], ["qcm", "Que représente a(i) ?", ["La distance moyenne aux autres points de son groupe", "La distance au groupe voisin", "La distance au centre"], "Cours."], ["qcm", "Que représente b(i) ?", ["La plus petite distance moyenne vers un autre groupe", "La distance moyenne dans son groupe", "La distance totale"], "Cours."], ["qcm", "Entre quelles valeurs varie la silhouette ?", ["−1 et +1", "0 et 1", "0 et 100"], "Cours."], ["qcm", "Que signifie une silhouette proche de +1 ?", ["Point bien placé", "Point à la frontière", "Point mal affecté"], "Tableau."], ["qcm", "Que signifie une silhouette proche de 0 ?", ["Point à la frontière", "Point bien placé", "Point mal affecté"], "Tableau."], ["qcm", "Que signifie une silhouette proche de −1 ?", ["Point probablement mal affecté", "Point bien placé", "Point central"], "Tableau."], ["qcm", "Que signifie a < b ?", ["Le point est plus proche de son groupe que du voisin", "Le point est mal placé", "Le point est isolé"], "Tableau."], ["qcm", "Que signifie le message clé ?", ["Le sens des groupes doit être vérifié dans le contexte", "Les scores suffisent", "Le contexte est inutile"], "Message clé."], ["vf", "Vrai ou faux ? Un score de silhouette élevé garantit des groupes utiles.", ["Faux", "Vrai"], "Faux."], ["vf", "Vrai ou faux ? Pour affecter de nouvelles observations, on apprend les centres sur un ensemble et on évalue ailleurs.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : silhouette entre −1 et ___.", ["+1", "0", "10"], "Cours."], ["trou", "Complète : a(i) = distance moyenne dans son propre ______.", ["groupe", "centre", "seuil"], "Cours."], ["cas", "Cas pratique : un point a a = 1 et b = 5. Que conclure ?", ["Il est bien placé (silhouette proche de +1)", "Il est mal placé", "Il est à la frontière"], "Calcul : (5−1)/5 = 0,8."], ["cas", "Cas pratique : un point a a = 5 et b = 1. Que conclure ?", ["Il est probablement mal affecté (silhouette proche de −1)", "Il est bien placé", "Il est central"], "Calcul : (1−5)/5 = −0,8."], ["cas", "Cas pratique : en examen, « Comment évaluer un clustering sans cible ? ». Réponse ?", ["Compacité/séparation (silhouette), stabilité, utilité métier, interprétabilité", "Accuracy et sensibilité", "MSE seulement"], "Tableau."]]}, {"id": "18.9", "title": "D’autres algorithmes et l’ACP", "fiche": [["t", [["Méthode", "Principe"], ["**K-means**", "K groupes autour de centroïdes (une possibilité parmi plusieurs)"], ["**CAH** (classification ascendante hiérarchique)", "**Fusionne progressivement** les groupes les plus proches"], ["**DBSCAN** (regroupement par densité)", "Suit les **zones denses** et peut isoler certains points comme **bruit**"], ["**ACP** (analyse en composantes principales)", "Résume **beaucoup de variables** : on les regroupe mathématiquement pour créer **2 axes**, puis on replace les patients sur ces axes"]]], ["t", [["À retenir — Chapitre 18"], ["Non supervisé = chercher une structure sans réponse connue ; patient = vecteur ; distance euclidienne (3-4-5)"], ["K-means : variables numériques et standardisées (z = (x − moyenne) / écart-type) ; cycle affecter → recalculer → stabilité"], ["Inertie I = Σ d(xᵢ, cᵢ)² (même logique quadratique que la MSE) ; méthode du coude pour choisir K ; silhouette de −1 à +1"], ["Autres méthodes : CAH, DBSCAN ; ACP pour résumer de nombreuses variables en 2 axes"]]]], "qs": [["qcm", "Que signifie CAH ?", ["Classification ascendante hiérarchique", "Classification automatique hospitalière", "Calcul d’analyse hiérarchique"], "Tableau."], ["qcm", "Que fait la CAH ?", ["Fusionne progressivement les groupes les plus proches", "Suit les zones denses", "Résume les variables"], "Tableau."], ["qcm", "Que signifie DBSCAN ?", ["Regroupement par densité", "Classification par distance", "Arbre de décision"], "Tableau."], ["qcm", "Que fait DBSCAN ?", ["Suit les zones denses et isole le bruit", "Fusionne les groupes", "Résume les variables"], "Tableau."], ["qcm", "Que signifie ACP ?", ["Analyse en composantes principales", "Algorithme de calcul probabiliste", "Association de classes"], "Tableau."], ["qcm", "À quoi sert l’ACP ?", ["Résumer beaucoup de variables en quelques axes", "Classer des patients", "Calculer l’inertie"], "Tableau."], ["qcm", "Combien d’axes crée-t-on : [{"id": "19.1", "title": "Réseaux de neurones et deep learning (hors programme)", "fiche": [["warn", "**HORS PROGRAMME** : partie indiquée « à ne pas apprendre » dans les notes ; conservée pour la compréhension."], ["li", ["Un réseau de neurones fonctionne bien sur les **données non structurées** (image, texte, son : pas dans un tableau). En entrée : **1 neurone par variable** ; en sortie, les observations sont placées par catégorie (ex. chat ou chien).", "Une **famille de modèles** : supervisé, auto-supervisé ou autre cadre ; sur les **données tabulaires**, arbres et boosting restent souvent très performants.", "**ReLU** = max(0, z) : les valeurs négatives deviennent nulles ; la non-linéarité permet de représenter des relations complexes.", "**Couches** : entrée, **couches cachées**, sortie ; chaque couche construit des caractéristiques de plus en plus **abstraites** (pixels → contrastes et bords → motifs → représentation → probabilités)."]], ["t", [["Apprendre : 4 étapes", "Contenu"], ["**1. Prédire**", "Le réseau produit une sortie"], ["**2. Mesurer**", "On calcule la **perte (loss)** entre prédiction et vérité"], ["**3. Rétropropager**", "On calcule les **gradients** de la perte"], ["**4. Corriger**", "On met à jour les **poids** : **descente de gradient**, le **learning rate** contrôle la taille du déplacement"]]], ["li", ["**Cross-entropy** : perte adaptée à la **classification** (pénalité d’autant plus forte que la bonne classe reçoit une faible probabilité). **Mini-batch** : petit groupe d’exemples (10 000 images avec des batches de 100 = 100 batches) ; **epoch** : un passage complet sur le jeu d’entraînement.", "**Généralisation** : si la **validation loss** remonte alors que la **train loss** baisse → **surapprentissage** ; **early stopping** : on garde les poids de la meilleure epoch de validation. **Loss ≠ métrique** : la loss sert à **optimiser**, les métriques métier (sensibilité, spécificité, F1) servent à **évaluer**.", "**Modèle de langage** : tokeniser → représenter chaque token par un vecteur (embedding) → prédire le token suivant."]]], "qs": [["qcm", "Sur quelles données un réseau de neurones excelle-t-il ?", ["Les données non structurées (image, texte, son)", "Les tableaux uniquement", "Les nombres uniquement"], "Cours."], ["qcm", "Combien de neurones en entrée ?", ["Un par variable", "Un seul", "Un par patient"], "Cours."], ["qcm", "Est-ce un paradigme ou une famille de modèles ?", ["Une famille de modèles", "Un paradigme", "Un type de données"], "Cours."], ["qcm", "Sur les données tabulaires, que reste-t-il souvent très performant ?", ["Les arbres et le boosting", "Les réseaux", "Le clustering"], "Cours."], ["qcm", "Que fait ReLU ?", ["max(0, z) : les valeurs négatives deviennent nulles", "z²", "1/z"], "Cours."], ["qcm", "Pourquoi la non-linéarité est-elle utile ?", ["Elle permet de représenter des relations complexes", "Elle accélère le calcul", "Elle réduit les données"], "Cours."], ["qcm", "Que construisent les couches successives ?", ["Des caractéristiques de plus en plus abstraites", "Des erreurs", "Des groupes"], "Cours."], ["qcm", "Quelles sont les quatre étapes d’apprentissage ?", ["Prédire, mesurer, rétropropager, corriger", "Observer, apprendre, estimer, publier", "Standardiser, grouper, évaluer, décider"], "Tableau."], ["qcm", "Que mesure-t-on à l’étape 2 ?", ["La perte (loss)", "L’accuracy", "L’inertie"], "Tableau."], ["qcm", "Que calcule la rétropropagation ?", ["Les gradients de la perte", "Les groupes", "Les seuils"], "Tableau."], ["qcm", "Que contrôle le learning rate ?", ["La taille du déplacement des poids", "Le nombre de couches", "Le nombre de données"], "Cours."], ["qcm", "Quelle perte est adaptée à la classification ?", ["La cross-entropy", "L’erreur quadratique", "L’inertie"], "Cours."], ["qcm", "Qu’est-ce qu’une epoch ?", ["Un passage complet sur le jeu d’entraînement", "Un batch", "Une couche"], "Cours."], ["qcm", "Combien de batches pour 10 000 images avec des batches de 100 ? vaise finalité", "Une mauvaise performance", "Un mauvais codage"], "Cours."], ["cas", "Cas pratique : en examen, « Pourquoi la performance ne suffit-elle pas ? ». Réponse ?", ["Parce qu’un modèle performant peut être mal utilisé, mal documenté ou mal finalisé", "Parce qu’elle est fausse", "Parce qu’elle est coûteuse"], "Cours."], ["cas", "Cas pratique : un modèle n’est jamais réévalué après déploiement. Quelle dimension est négligée ?", ["Le suivi", "Les données", "La finalité"], "Tableau."], ["qcm", "Que retenir ?", ["La gouvernance englobe données, finalité, sécurité, suivi et humain", "Seule la technique compte", "Seule la loi compte"], "Cours."], ["vf", "Vrai ou faux ? La sécurité fait partie de la gouvernance d’un modèle.", ["Vrai", "Faux"], "Vrai."]]}, {"id": "20.2", "title": "Les limites techniques deviennent des questions de gouvernance", "fiche": [["t", [["Limite technique", "Question de gouvernance"], ["**Fuite de données**", "Validité des résultats"], ["**Biais**", "Équité"], ["**Choix du seuil**", "Responsabilité"]]], ["warn", "**Message clé** : une limite technique **change de nature** lorsqu’elle influence **une décision, une personne ou une organisation**."]], "qs": [["qcm", "Que devient une fuite de données sur le plan de la gouvernance ?", ["Une question de validité des résultats", "Une question d’équité", "Une question de responsabilité"], "Tableau."], ["qcm", "Que devient un biais ?", ["Une question d’équité", "Une question de validité", "Une question de seuil"], "Tableau."], ["qcm", "Que devient le choix du seuil ?", ["Une question de responsabilité", "Une question d’équité", "Une question de validité"], "Tableau."], ["qcm", "Qu’est-ce qu’une fuite de données (au sens ML) ?", ["Des informations de test ou de la cible utilisées par erreur à l’apprentissage", "Une perte de fichiers", "Un piratage"], "Cours."], ["qcm", "Pourquoi une fuite de données pose-t-elle un problème de validité ?", ["Les résultats paraissent meilleurs qu’ils ne sont", "Les données sont perdues", "Le modèle est plus lent"], "Cours."], ["qcm", "Pourquoi un biais pose-t-il un problème d’équité ?", ["Il peut traiter différemment certains groupes", "Il ralentit le modèle", "Il change la loi"], "Cours."], ["qcm", "Pourquoi le seuil engage-t-il une responsabilité ?", ["Il détermine qui est alerté et quels risques d’erreur on accepte", "Il fixe le prix", "Il change les données"], "Cours."], ["qcm", "Quand une limite technique change-t-elle de nature ?", ["Quand elle influence une décision, une personne ou une organisation", "Quand elle est corrigée", "Quand elle est mesurée"], "Message clé."], ["vf", "Vrai ou faux ? Une limite technique reste purement technique quoi qu’il arrive.", ["Faux", "Vrai"], "Faux."], ["vf", "Vrai ou faux ? Le choix du seuil engage une responsabilité.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : fuite de données → ______ des résultats.", ["validité", "vitesse", "équité"], "Tableau."], ["trou", "Complète : biais → ______.", ["équité", "validité", "responsabilité"], "Tableau."], ["cas", "Cas pratique : un modèle donne 99 % car la cible était incluse dans les variables. Quelle question de gouvernance ?", ["La validité des résultats (fuite de données)", "L’équité", "La responsabilité"], "Cours."], ["cas", "Cas pratique : un modèle se trompe plus souvent sur un groupe de patients. Quelle question ?", ["L’équité", "La validité", "La vitesse"], "Cours."], ["cas", "Cas pratique : l’hôpital baisse le seuil d’alerte pour détecter davantage de cas, avec plus de fausses alertes. Quelle question ?", ["La responsabilité du choix", "La validité", "L’équité seule"], "Cours."], ["cas", "Cas pratique : en examen, « Citez trois limites techniques qui deviennent des questions de gouvernance ». Réponse ?", ["Fuite de données, biais, choix du seuil", "Accuracy, MSE, Gini", "Image, texte, son"], "Tableau."], ["qcm", "Que retenir ?", ["Les limites techniques engagent la gouvernance dès qu’elles influencent une décision", "Les limites techniques sont secondaires", "Les limites sont toujours corrigées"], "Message clé."], ["qcm", "Qui doit répondre de ces questions ?", ["L’organisation qui déploie le système", "Le modèle", "Le patient"], "Cours."], ["vf", "Vrai ou faux ? Un biais peut avoir un impact sur des personnes.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : choix du seuil → ______.", ["responsabilité", "validité", "équité"], "Tableau."]]}, {"id": "20.3", "title": "Le RGPD", "fiche": [["def", "**RGPD** = **règlement général sur la protection des données** (règlement européen). Il commence par une question simple : **pourquoi ces données ?** Le **choix des données doit être justifié avant le choix du modèle**."], ["t", [["Principe", "Contenu"], ["**Finalité**", "Pourquoi collecter et utiliser ces données ? Elles sont collectées pour un objectif"], ["**Minimisation**", "Sélectionner ce qui est **réellement nécessaire**"], ["**Transparence**", "Informer les personnes de l’usage fait de leurs données"], ["**Conservation**", "Ne garder les données que le **temps nécessaire** à la finalité"], ["**Sécurité**", "Protéger contre les accès non autorisés et les pertes"]]], ["li", ["**Données de santé** : vigilance renforcée : **confidentialité**, **habilitations** (accès selon les rôles et besoins), **traçabilité** (actions enregistrées et auditables), **sécurité**. Une donnée disponible n’est pas automatiquement une donnée **légitime** à utiliser."]], ["eg", "Sur **20 variables** disponibles, **6** sont conservées car nécessaires et proportionnées à l’usage. Une variable peut être **très prédictive** sans être **nécessaire ou proportionnée** : la sélection des variables a une dimension **juridique et éthique**."]], "qs": [["qcm", "Que signifie RGPD ?", ["Règlement général sur la protection des données", "Règle générale de partage des données", "Régime global des patients"], "Cours."], ["qcm", "Quelle est la première question du RGPD ?", ["Pourquoi ces données ?", "Combien de données ?", "Quel modèle
