const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const shuffle = a => { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [r[i], r[j]] = [r[j], r[i]]; } return r; };
const TYPE = {qcm:"QCM", vf:"Vrai ou faux", trou:"Texte à trous", cas:"Cas pratique"};
let S = {u:{}, c:{}};
try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.u) S = v; } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const UNITS = [], CHAPS = [];
M.lecons.forEach(L => L.chapitres.forEach(C => { C.L = L; C.key = L.n + "-" + C.n; CHAPS.push(C); C.unites.forEach(U => { U.C = C; UNITS.push(U); }); }));
const ready = U => U.qs && U.qs.length;
const uById = id => UNITS.find(U => U.id === id);
let cur = null;

function setView(v, hint){ document.body.dataset.view = v; $("hint").textContent = hint || M.title; window.scrollTo(0,0); }

function home(){
  setView("home");
  const rd = UNITS.filter(ready), done = rd.filter(U => S.u[U.id] != null);
  const nq = rd.reduce((n,U) => n + U.qs.length, 0);
  let h = `<h1>${esc(M.title)}</h1><p class="lead">${esc(M.sub)}</p>
<div class="stats"><div class="stat"><b>${done.length}/${rd.length}</b><span>unités travaillées</span></div><div class="stat"><b>${nq}</b><span>questions</span></div><div class="stat"><b>${UNITS.length - rd.length}</b><span>unités à venir</span></div></div>`;
  M.lecons.forEach(L => {
    h += `<div class="lesson">Leçon ${L.n} · ${esc(L.title)}</div>`;
    L.chapitres.forEach(C => {
      const ok = C.unites.filter(ready).length, cb = S.c[C.key];
      h += `<section class="chap"><div class="chapbar"><h2>Chapitre ${C.n}. ${esc(C.title)}</h2>${ok ? `<button class="btn sm" data-exam="${C.key}">Examen du chapitre</button>` : ""}</div>${cb != null ? `<div class="meta">Meilleur examen : ${cb}/20</div>` : ""}<ul class="units">`;
      C.unites.forEach(U => {
        const b = S.u[U.id], r = ready(U);
        h += `<li class="unit${r ? "" : " soon"}${b != null && b >= 16 ? " done" : ""}"><span class="uid">${esc(U.id)}</span><div class="ub"><div class="ut">${esc(U.title)}</div><div class="um">${r ? `${U.qs.length} questions${b != null ? `, meilleur ${b}/${U.qs.length}` : ""}` : "À venir"}</div></div>${r ? `<div class="ua"><button class="btn sm" data-fiche="${esc(U.id)}">Fiche</button><button class="btn sm solid" data-quiz="${esc(U.id)}">Quiz</button></div>` : ""}</li>`;
      });
      h += `</ul></section>`;
    });
  });
  h += `<div class="toolbar"><button class="btn danger" data-reset>Effacer ma progression</button></div>`;
  app.innerHTML = h;
}

function block(b){
  switch(b[0]){
    case "def": return `<div class="def">${md(b[1])}</div>`;
    case "eg": return `<div class="eg">${md(b[1])}</div>`;
    case "warn": return `<p class="warn">⚠ ${md(b[1])}</p>`;
    case "p": return `<p>${md(b[1])}</p>`;
    case "li": return `<ul>${b[1].map(x => `<li>${md(x)}</li>`).join("")}</ul>`;
    case "t": return `<div class="tblw"><table><thead><tr>${b[1][0].map(x => `<th>${md(x)}</th>`).join("")}</tr></thead><tbody>${b[1].slice(1).map(r => `<tr>${r.map(x => `<td>${md(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  return "";
}
function fiche(U){
  setView("fiche", `Unité ${U.id}`);
  app.innerHTML = `<div class="fiche"><p class="meta">Leçon ${U.C.L.n} · Chapitre ${U.C.n} · Unité ${esc(U.id)}</p><h2>${esc(U.title)}</h2>
<div class="legend"><span class="lg d">à mémoriser</span><span class="lg e">exemple</span><span class="lg w">⚠ piège</span></div>
${U.fiche.map(block).join("")}</div><div class="toolbar"><button class="btn solid" data-quiz="${esc(U.id)}">S’entraîner : ${U.qs.length} questions</button></div>`;
}

function start(kind, ref, list){
  cur = {kind, ref, list, idx:0, res:[]};
  renderQ();
}
function quizUnit(U){ start("u", U.id, shuffle(U.qs.map((_,i) => [U.id, i]))); }
function examChap(C){ const pool = []; C.unites.filter(ready).forEach(U => U.qs.forEach((_,i) => pool.push([U.id, i]))); start("c", C.key, shuffle(pool).slice(0, 20)); }
function Q(it){ const q = uById(it[0]).qs[it[1]]; return {t:q[0], p:q[1], o:q[2], e:q[3]}; }
function renderQ(){
  const c = cur; if (c.idx >= c.list.length) return end();
  const q = Q(c.list[c.idx]);
  setView("quiz", c.kind === "u" ? `Unité ${c.ref}` : `Examen du chapitre`);
  const idx = q.o.map((_,i) => i), order = q.t === "vf" ? idx.sort((a,b) => q.o[a] === "Vrai" ? -1 : q.o[b] === "Vrai" ? 1 : 0) : shuffle(idx);
  app.innerHTML = `<div class="bar"><h1>${c.kind === "u" ? `Unité ${esc(c.ref)}` : "Examen du chapitre"}</h1><span class="meta">Question ${c.idx + 1} / ${c.list.length}</span></div>
<div class="prog"><i style="width:${c.idx / c.list.length * 100}%"></i></div>
<div class="q"><span class="tag${q.t === "cas" ? " cas" : ""}">${TYPE[q.t]}</span>${c.kind === "c" ? `<span class="tag">Unité ${esc(c.list[c.idx][0])}</span>` : ""}<div class="qtxt">${esc(q.p)}</div></div>
<div class="opts">${order.map(i => `<button class="opt" data-pick="${i}">${esc(q.o[i])}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div>`;
}
function pick(i){
  const c = cur, q = Q(c.list[c.idx]), ok = i === 0;
  app.querySelectorAll(".opt").forEach(b => { b.disabled = true; const k = +b.dataset.pick; if (k === 0) b.classList.add("ok"); else if (k === i) b.classList.add("ko"); });
  c.res.push({it:c.list[c.idx], ok, pick:i}); c.idx++;
  const last = c.idx >= c.list.length;
  $("fb").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}">${ok ? "Bonne réponse" : "Mauvaise réponse"}</div><div class="expl">${esc(q.e)}</div><div class="toolbar"><button class="btn solid" data-next>${last ? "Voir mon résultat" : "Question suivante"}</button></div>`;
}
let lastWrong = null;
function end(){
  const c = cur, n = c.res.length, ok = c.res.filter(r => r.ok).length, pct = Math.round(ok / n * 100);
  if (c.kind === "u" && !c.err) S.u[c.ref] = Math.max(S.u[c.ref] || 0, ok);
  if (c.kind === "c") S.c[c.ref] = Math.max(S.c[c.ref] || 0, ok);
  save();
  const wrong = c.res.filter(r => !r.ok); lastWrong = wrong.map(r => r.it);
  let nextU = null;
  if (c.kind === "u") { const i = UNITS.findIndex(U => U.id === c.ref); nextU = UNITS.slice(i + 1).find(ready); }
  setView("end", "Résultat");
  let h = `<div class="end"><p class="score">${ok}/${n}</p><p class="meta">${pct} % de bonnes réponses${pct >= 80 ? " : objectif atteint" : " : objectif 80 %"}</p>
<div class="toolbar">${wrong.length ? `<button class="btn solid" data-errs>Refaire mes ${wrong.length} erreur${wrong.length > 1 ? "s" : ""}</button>` : ""}<button class="btn" data-again>Recommencer</button>${nextU ? `<button class="btn" data-fiche="${esc(nextU.id)}">Unité suivante</button>` : ""}<button class="btn" data-home>Sommaire</button></div></div>`;
  if (wrong.length) {
    h += `<h2>Correction</h2>`;
    wrong.forEach(r => { const q = Q(r.it); h += `<div class="corr"><div class="qtxt">${esc(q.p)}</div><div class="cbad">Ta réponse : ${esc(q.o[r.pick])}</div><div class="cgood">Bonne réponse : ${esc(q.o[0])}</div><div class="expl">${esc(q.e)}</div></div>`; });
  }
  app.innerHTML = h;
  cur.done = true;
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.fiche) return fiche(uById(d.fiche));
  if (d.quiz) return quizUnit(uById(d.quiz));
  if (d.exam) return examChap(CHAPS.find(C => C.key === d.exam));
  if ("pick" in d) return pick(+d.pick);
  if ("next" in d) return renderQ();
  if ("errs" in d) { const k = cur.kind, r = cur.ref; start(k, r, shuffle(lastWrong)); cur.err = true; return; }
  if ("again" in d) { return cur.kind === "u" ? quizUnit(uById(cur.ref)) : examChap(CHAPS.find(C => C.key === cur.ref)); }
  if ("home" in d) return home();
  if ("reset" in d) {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirmer : tout effacer"; setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = "Effacer ma progression"; } }, 4000); return; }
    S = {u:{}, c:{}}; save(); return home();
  }
});
$("homeBtn").addEventListener("click", home);
home();
})();
</script>
</body>
</html>
