<style>
:root{--paper:#F5F7FA;--card:#FFFFFF;--ink:#1E293B;--muted:#64748B;--line:#E2E8F0;--pri:#1E40AF;--pri-soft:#EFF6FF;--on-pri:#FFFFFF;

color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F172A;--card:#1E293B;--ink:#F1F5F9;--muted:#94A3B8;--line:#334155;--pri:#60A5FA;--pri-soft:#1E3A8A;--on-pri:#0F172A;--acc:#F59E0B;--acc-soft:#451A03;--ok:#4ADE80;--ok-soft:#14532D;--ko:#F87171;--ko-soft:#7F1D1D;--def:#7FE3EA;--def-bg:#123A40;--eg:#81C784;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F172A;--card:#1E293B;--ink:#F1F5F9;--muted:#94A3B8;--line:#334155;--pri:#60A5FA;--pri-soft:#1E3A8A;--on-pri:#0F172A;--acc:#F59E0B;--acc-soft:#451A03;--ok:#4ADE80;--ok-soft:#14532D;--ko:#F87171;--ko-soft:#7F1D1D;--def:#7FE3EA;--def-bg:#123A40;--eg:#81C784;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--la)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,.score{font-family:var(--ti)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.home{border:0;background:none;color:var(--pri);font-weight:700;padding:6px 0}
body[data-view="home"] .home{visibility:hidden}
.hint{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 64px}
h1{font-size:clamp(23px,5.5vw,30px);line-height:1.25;margin:4px 0 6px;color:var(--pri)}
.lead{color:var(--muted);margin:0 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--pri);background:transparent;color:var(--pri);font-weight:600;text-decoration:none}
.btn.solid{background:var(--pri);color:var(--on-pri)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px}
.btn.danger{border-color:var(--ko);color:var(--ko)}
.btn.danger.armed{background:var(--ko);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--ti);font-size:22px;color:var(--pri)}
.stat span{font-size:12px;color:var(--muted)}
.lesson{margin:22px 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.chap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.chap h2{font-size:17px;margin:0 0 4px}
.chapbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px}
.units{list-style:none;margin:0;padding:0}
.unit{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.uid{flex:none;min-width:38px;height:28px;padding:0 6px;border-radius:8px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:13px}
.unit.done .uid{background:var(--ok);color:var(--card)}
.unit.soon{opacity:.55}
.ub{flex:1;min-width:0}
.ut{font-weight:600;line-height:1.35}
.um{font-size:13px;color:var(--muted)}
.ua{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.meta{color:var(--muted);font-size:14px}
.fiche h2{font-size:20px;margin:0 0 10px}
.def{background:var(--def-bg);border-left:4px solid var(--def);border-radius:10px;padding:10px 12px;margin:10px 0}
.def::before{content:"À mémoriser";display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--def);margin-bottom:2px}
.eg{border-left:4px solid var(--eg);padding:6px 12px;margin:10px 0;color:var(--ink)}
.eg::before{content:"Exemple";display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--eg)}
.warn{background:var(--acc-soft);border-radius:10px;padding:8px 12px;margin:10px 0}
.fiche ul{margin:8px 0;padding-left:20px}.fiche li{margin:4px 0}
.tblw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--pri-soft);color:var(--pri)}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin:0 0 6px}
.lg{padding:2px 8px;border-radius:6px;font-weight:600}
.lg.d{background:var(--def-bg);color:var(--def)}.lg.e{border:1px solid var(--eg);color:var(--eg)}.lg.w{background:var(--acc-soft)}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.bar h1{font-size:20px;margin:0}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--pri-soft);color:var(--pri);margin:0 6px 8px 0}
.tag.cas{background:var(--acc-soft);color:var(--acc)}
.qtxt{font-size:17px;font-weight:600;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{min-height:50px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:15px;line-height:1.4;text-align:left}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ko{border-color:var(--ko);background:var(--ko-soft)}
.fb{margin-top:12px}
.verdict{font-weight:700;font-size:17px;font-family:var(--ti)}
.verdict.good{color:var(--ok)}.verdict.bad{color:var(--ko)}
.expl{margin-top:6px;font-size:15px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:10px 12px}
.end{text-align:center}
.score{font-size:52px;font-weight:700;color:var(--pri);margin:6px 0 0}
.corr{padding:12px 0;border-bottom:1px solid var(--line)}
.corr .qtxt{font-size:15px}
.cbad{color:var(--ko);font-size:14px}.cgood{color:var(--ok);font-size:14px}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>

 les lignes de deux tables via une clé commune", "Supprime une table", "Trie une table"], "Cours."], ["qcm", "Quelle clause précise la clé de jointure ?", ["ON", "SELECT", "WHERE"], "Tableau."], ["qcm", "Que sont les alias s et p ?", ["Des raccourcis pour séjour et patient", "Des colonnes", "Des clés"], "Cours."], ["qcm", "Quelle clé commune relie SEJOUR et PATIENT ?", ["id_patient", "no_sejour", "service"], "Cours."], ["qcm", "Que fait INNER JOIN ?", ["Conserve seulement les lignes présentes dans les deux tables", "Conserve toute la première table", "Conserve toutes les lignes"], "Cours."], ["qcm", "Que contient le résultat de l’exemple ?", ["Les séjours d’orthopédie avec le nom et la date de naissance du patient", "Tous les séjours", "Tous les patients"], "Exemple."], ["qcm", "Quels patients apparaissent pour l’orthopédie ?", ["Martin et Bernard", "Dupont et Lefebvre", "Martin et Dupont"], "Exemple."], ["qcm", "Un patient sans séjour apparaît-il avec INNER JOIN ?", ["Non", "Oui", "Seulement avec WHERE"], "Explication."], ["qcm", "Que fait la clause FROM + JOIN ?", ["Relie les tables avec la clé de jointure", "Filtre les lignes", "Choisit les colonnes"], "Tableau."], ["qcm", "Que représente « ON s.id_patient = p.id_patient » ?", ["La condition de jointure", "Un filtre", "Une colonne"], "Cours."], ["vf", "Vrai ou faux ? Les alias permettent de distinguer les colonnes des deux tables.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? La jointure additionne les colonnes sans condition.", ["Faux", "Vrai"], "Faux : elle combine les lignes à clé identique."], ["trou", "Complète : INNER JOIN ... ______ s.id_patient = p.id_patient.", ["ON", "WHERE", "FROM"], "Cours."], ["trou", "Complète : jointure interne = ______ JOIN.", ["INNER", "LEFT", "FULL"], "Cours."], ["cas", "Cas pratique : on veut le nom du patient pour chaque séjour. Que faut-il faire ?", ["Joindre SEJOUR et PATIENT sur id_patient", "Lire PATIENT seul", "Lire SEJOUR seul"], "Exemple."], ["cas", "Cas pratique les lignes des deux tables", "INNER : tout ; LEFT : rien ; FULL : peu", "Aucune différence"], "Message clé."], ["qcm", "Pourquoi le choix de la jointure dépend-il de la question ?", ["Chaque type conserve des lignes différentes", "Les types sont équivalents", "Seule la vitesse change"], "Message clé."], ["vf", "Vrai ou faux ? FULL JOIN peut produire des NULL des deux côtés.", ["Vrai", "Faux"], "Vrai."], ["qcm", "Dans l’exemple, quelle table est « la première » ?", ["PATIENT", "SEJOUR", "SERVICE"], "Tableau."]]}, {"id": "7.4", "title": "Une jointure peut multiplier les lignes", "fiche": [["def", "Si la table de droite contient **plusieurs lignes par clé**, chaque correspondance génère une ligne. Une jointure **ne fait pas une addition de colonnes** : elle combine les lignes ; une même ligne de la première table peut se **répéter**."], ["eg", "PATIENT (1 ligne par patient) et SEJOUR (plusieurs par patient : S001, S002, S003 pour P001 ; S004 pour P002 ; S005 pour P003). Relation **1 → N**. **P001 apparaît 3 fois** : c’est **normal**."], ["warn", "Ne pas chercher **diagnostics et actes** en même temps dans une requête : si un mouvement a **10 diagnostics** et **100 actes**, on obtient **10 × 100 = 1 000 lignes** répétées. **Bonne pratique** : vérifier le **nombre de lignes avant et après** la jointure ; comprendre la relation (1 → N, 1 – 1) ; vérifier les doublons.\n**À retenir — Chapitre 7** : SELECT/FROM/WHERE ; JOIN … ON ; INNER/LEFT/FULL ; 1 → N multiplie les lignes."]], "qs": [["qcm", "Pourquoi une jointure peut-elle multiplier les lignes ?", ["Une ligne de la première table s’associe à plusieurs lignes de la seconde", "Elle double toutes les lignes", "Elle copie la table"], "Cours."], ["qcm", "Combien de fois P001 apparaît-il dans l’exemple ?", ["3", "1", "5"], "Exemple."], ["qcm", "Pourquoi P001 apparaît-il 3 fois ?", ["Il a 3 séjours (S001, S002, S003)", "Il est dupliqué par erreur", "Il a 3 noms"], "Exemple."], ["qcm", "Quelle relation lie patient et séjour ?", iel s’arrête silencieusement. Quel indicateur le révèle ?", ["Les erreurs de flux et le volume de lignes", "Le nom", "L’âge"], "Tableau."], ["cas", "Cas pratique : en examen, « Que retenir du chapitre 8 ? ». Réponse ?", ["Les 8 étapes du besoin à la donnée exploitable, avec documentation, qualité, traçabilité, sécurité", "Les 5 modèles", "Le SQL"], "À retenir."], ["cas", "Cas pratique : en examen, « Que surveiller dans le temps ? ». Réponse ?", ["Valeurs manquantes, distributions, délais d’arrivée, erreurs de flux", "Les patients", "Les prix"], "Tableau."], ["vf", "Vrai ou faux ? Surveiller permet de repérer les dérives avant qu’elles ne biaisent les analyses.", ["Vrai", "Faux"], "Vrai."]]}]}, {"n": 9, "title": "La qualité des données", "unites": [{"id": "9.1", "title": "Qu’est-ce qu’une donnée de qualité ?", "fiche": [["def", "« Une donnée de qualité est une donnée qui possède les caractéristiques nécessaires pour **satisfaire des exigences d’usage données**. » (norme **ISO/IEC 25012:2008**). **Une donnée de qualité est une donnée adaptée à l’usage attendu.**"], ["t", [["Caractéristique", "Signification"], ["Adaptée à l’usage", "Pertinente et suffisamment précise pour répondre au besoin"], ["Fiable", "Correcte, complète, cohérente et à jour"], ["Compréhensible et réutilisable", "Bien documentée, traçable, interprétable dans son contexte"]]], ["li", ["La norme propose **15 caractéristiques**, regroupées en qualités **intrinsèques** à la donnée et qualités **dépendantes du système**."]], ["t", [["Usage (même jeu avec 5 % de données manquantes)", "Verdict"], ["Exploration", "Peut être acceptable"], ["Indicateur / reporting", "Peut être insuffisant"], ["Modèle prédictif", "À évaluer selon l’impact"], ["Décision clinique", "Probablement inacceptable"]]], ["warn", "**Message clé** : la qualité n’est pas une propriété absolue : c’est une **adéquation** entre la donnée, son contexte et l’objectif poursuivi."]], "qs": [["qcm", "Quelle norme définit la qualité des données da ** et l’**usage**."]], "qs": [["qcm", "Combien de dimensions le cours retient-il ?", ["6", "3", "15"], "Tableau."], ["qcm", "Que signifie exactitude ?", ["La donnée reflète correctement la réalité", "La donnée est présente", "La donnée est à jour"], "Tableau."], ["qcm", "Que signifie complétude ?", ["La donnée est présente, sans valeurs manquantes inattendues", "La donnée est logique", "La donnée est unique"], "Tableau."], ["qcm", "Que signifie cohérence ?", ["La donnée est logique et respecte les règles métier", "La donnée est exacte", "La donnée est unique"], "Tableau."], ["qcm", "Que signifie unicité ?", ["La donnée n’est pas dupliquée", "La donnée est à jour", "La donnée est cohérente"], "Tableau."], ["qcm", "Que signifie actualité ?", ["La donnée est à jour dans un délai compatible avec l’usage", "La donnée est exacte", "La donnée est unique"], "Tableau."], ["qcm", "Que signifie traçabilité ?", ["L’origine, les transformations et l’historique sont connus et documentés", "La donnée est unique", "La donnée est complète"], "Tableau."], ["qcm", "Exemple de complétude ?", ["98 % des séjours ont une date de sortie", "La date de sortie est après l’entrée", "Un séjour n’apparaît qu’une fois"], "Tableau."], ["qcm", "Exemple de cohérence ?", ["La date de sortie est postérieure à la date d’entrée", "Une mise à jour nocturne", "Un séjour unique"], "Tableau."], ["qcm", "Exemple d’unicité ?", ["Un même séjour n’apparaît qu’une seule fois", "98 % de dates renseignées", "Mise à jour chaque nuit"], "Tableau."], ["qcm", "Exemple d’actualité ?", ["Les données d’activité sont mises à jour chaque nuit", "La date de naissance est correcte", "Un séjour unique"], "Tableau."], ["vf", "Vrai ou faux ? Une donnée peut être parfaite sur toutes les dimensions.", ["Faux", "Vrai"], "Faux."], ["vf", "Vrai ou faux ? Ces dimensions s’inspirent d’ISO/IEC 25012.", ["Vrai", "Faux"], "Vrai."], ["cas", "Cas pratique : une date de sortie est antérieure à l’entrée. Quelle dimension est atteinte ?", ["L rition", "Mettre en place une règle, un contrôle ou une mise à jour"], ["7. Suivre dans le temps", "Vérifier si l’anomalie diminue"]]], ["li", ["**Origines possibles** : **réalité métier** (cas particulier), **saisie** (erreur, oubli), **logiciel** (bug, paramétrage), **flux / interopérabilité** (erreur d’interface), **transformation ETL** (mapping incorrect), **analyse / requête** (filtre inadapté)."]], ["warn", "**Message clé** : une anomalie n’est pas forcément une erreur de saisie. Une amélioration durable repose sur quatre éléments : **traçabilité, responsabilités claires, action corrective et suivi après correction**.\n**À retenir — Chapitre 9** : qualité = adéquation à l’usage (ISO/IEC 25012) ; dimensions ; documentation ; mesure avec cible ; gouvernance collective ; 7 étapes."]], "qs": [["qcm", "Détecter un écart suffit-il ?", ["Non : il faut comprendre la cause, agir, documenter et suivre", "Oui", "Seulement s’il est grand"], "Cours."], ["qcm", "Combien d’étapes de l’anomalie à l’amélioration ?", ["7", "4", "10"], "Tableau."], ["qcm", "Quelle est la première étape ?", ["Détecter l’anomalie", "Corriger", "Documenter"], "Tableau."], ["qcm", "Que fait « identifier la donnée concernée » ?", ["Précise la variable, la table, la période, la source", "Comprend la cause", "Corrige"], "Tableau."], ["qcm", "Que fait « qualifier la cause » ?", ["Comprend l’origine probable de l’écart", "Corrige la saisie", "Documente"], "Tableau."], ["qcm", "Que fait « corriger » ?", ["Ajuste la saisie, le flux, la règle ou le traitement", "Détecte", "Suit"], "Tableau."], ["qcm", "Que fait « documenter l’action » ?", ["Trace la cause, la décision et la correction", "Détecte l’écart", "Corrige"], "Tableau."], ["qcm", "Que fait « prévenir la réapparition » ?", ["Met en place une règle, un contrôle ou une mise à jour", "Détecte", "Documente"], "Tableau."], ["qcm", "Que fait « suivre dans le temps » ?", ["Vérifie si l’anomalie diminue et si la qualité s’améliore", "Qualifie la cause", "Cor aux ? Un EDS remplace tous les logiciels sources.", ["Faux", "Vrai"], "Faux."], ["trou", "Complète : EDS = ______ de données de santé.", ["entrepôt", "échange", "espace"], "Définition."], ["trou", "Complète : centraliser, ______, rapprocher, réutiliser.", ["historiser", "supprimer", "chiffrer"], "Définition."], ["cas", "Cas pratique : chaque projet de recherche refait sa propre extraction des données. Quel remède ?", ["Un EDS avec une intégration unique", "Plus d’extractions", "Un logiciel de plus"], "Cours."], ["cas", "Cas pratique : un chercheur veut croiser biologie, pharmacie et PMSI. Que lui apporte l’EDS ?", ["Des données déjà intégrées et rapprochées", "Rien", "Un nouveau codage"], "Cours."], ["cas", "Cas pratique : en examen, « Pourquoi construire un EDS ? ». Réponse ?", ["Centraliser et rapprocher les données pour de multiples usages sans refaire l’intégration", "Remplacer l’hôpital", "Réduire les soins"], "Message clé."], ["cas", "Cas pratique : l’EDS sécurise l’accès aux données. Quel bénéfice ?", ["Un accès contrôlé et gouverné", "Une perte de données", "Une suppression"], "Tableau."], ["qcm", "Quelle vision apporte l’EDS ?", ["Une vision plus complète du parcours patient", "Une vision partielle", "Une vision financière seulement"], "Tableau."], ["vf", "Vrai ou faux ? L’EDS est un investissement à long terme.", ["Vrai", "Faux"], "Vrai."]]}, {"id": "10.4", "title": "Un EDS n’est pas simplement une grosse base", "fiche": [["def", "Un EDS combine **intégration, qualité, documentation, gouvernance et accès sécurisé** pour rendre les données exploitables."], ["t", [["Brique", "Contenu"], ["Sources", "DPI, PMSI, biologie, pharmacie, imagerie, bloc"], ["Flux et interopérabilité", "Connecteurs, API, formats d’échange"], ["Transformations", "Nettoyage, harmonisation, rapprochement"], ["Référentiels", "CIM-10, CCAM, unités, identités"], ["Contrôles qualité", "Complétude, cohérence, unicité, traçabilité"], ["Documentation", "Dictionnaire, schéma, flux, data lineage"], ["Gouvernance et droits", "Rôles, accès, responsabilités, sécurité"], ["Mise à disposition", "Recherche, pilotage, qualité, analyse"]]], ["warn", "**Pas seulement stocker** : **organiser et fiabiliser** ; **pas seulement centraliser** : **documenter et gouverner** ; **pas seulement conserver** : **rendre réutilisable**. **Message clé** : un EDS n’est pas qu’un lieu de stockage : c’est un cadre d’intégration et de réutilisation."]], "qs": [["qcm", "Un EDS est-il seulement une grosse base ?", ["Non : un cadre d’intégration, de qualité et de gouvernance", "Oui", "Seulement un entrepôt de fichiers"], "Message clé."], ["qcm", "Combien de briques composent un EDS dans le cours ?", ["8", "3", "12"], "Tableau."], ["qcm", "Quelles sources alimentent l’EDS ?", ["DPI, PMSI, biologie, pharmacie, imagerie, bloc", "Seulement le DPI", "Seulement le PMSI"], "Tableau."], ["qcm", "Que contiennent flux et interopérabilité ?", ["Connecteurs, API, formats d’échange", "Nettoyage", "Droits"], "Tableau."], ["qcm", "Que contiennent les transformations ?", ["Nettoyage, harmonisation, rapprochement", "Connecteurs", "Rôles"], "Tableau."], ["qcm", "Que contiennent les référentiels ?", ["CIM-10, CCAM, unités, identités", "API", "Dictionnaire"], "Tableau."], ["qcm", "Que contiennent les contrôles qualité ?", ["Complétude, cohérence, unicité, traçabilité", "Connecteurs", "Droits"], "Tableau."], ["qcm", "Que contient la documentation ?", ["Dictionnaire, schéma, flux, data lineage", "Rôles", "Formats"], "Tableau."], ["qcm", "Que contient la gouvernance et droits ?", ["Rôles, accès, responsabilités, sécurité", "Dictionnaire", "Nettoyage"], "Tableau."], ["qcm", "Que contient la mise à disposition ?", ["Recherche, pilotage, qualité, analyse", "Sources", "Référentiels"], "Tableau."], ["qcm", "Que doit-on faire des données, pas seulement stocker ?", ["Les organiser et les fiabiliser", "Les chiffrer", "Les copier"], "Cours."], ["vf", "Vrai ou faux ? Un EDS doit être documenté et gouverné.", ["Vrai", " isionnel."]], "qs": [["qcm", "Que contient un tableau de suivi PMSI ?", ["N-1, prévisionnel, réalisé et écarts", "Seulement le réalisé", "Seulement le N-1"], "Cours."], ["qcm", "Que représente N-1 ?", ["Ce qui a été observé l’an dernier", "Ce qui est attendu", "Ce qui est réalisé"], "Tableau."], ["qcm", "Que représente le prévisionnel ?", ["Ce qui était attendu", "Ce qui a été observé l’an dernier", "Ce qui est réalisé"], "Tableau."], ["qcm", "Que représente le réalisé ?", ["Ce qui s’est réellement produit", "Ce qui est attendu", "Le N-1"], "Tableau."], ["qcm", "Comment calcule-t-on un écart ?", ["Réalisé moins référence", "Référence moins réalisé", "Somme"], "Cours."], ["qcm", "Quelle est la première lecture à faire ?", ["Comparer le total réalisé à N-1 et au prévisionnel", "Lire le détail", "Lire les services"], "Cours."], ["qcm", "Quel est le réalisé du CHU (total) ?", ["103 850 séjours", "102 360", "105 200"], "Tableau."], ["qcm", "Quel est l’écart du CHU vs N-1 ?", ["+ 1,5 %", "− 1,3 %", "+ 3,3 %"], "Tableau."], ["qcm", "Quel est l’écart du CHU vs prévisionnel ?", ["− 1,3 %", "+ 1,5 %", "− 6,7 %"], "Tableau."], ["qcm", "Que vaut l’écart du service M2 vs prévisionnel ?", ["− 6,7 %", "− 1,3 %", "+ 1,2 %"], "Tableau."], ["qcm", "Que dit le tableau du service M1 ?", ["Il progresse vs N-1 et dépasse le prévisionnel", "Il baisse", "Il est stable"], "Tableau."], ["qcm", "Qu’est-ce qui sont les « résultats observés » ?", ["L’activité et la valorisation", "N-1 et prévisionnel", "Les écarts"], "Message clé."], ["vf", "Vrai ou faux ? N-1 et prévisionnel sont des références.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Le tableau ne mesure que l’activité.", ["Faux", "Vrai"], "Faux : aussi la valorisation."], ["trou", "Complète : écart = réalisé − ______.", ["référence", "total", "N-1"], "Cours."], ["trou", "Complète : le tableau mélange mesures et ______.", ["références", "tarifs", "services"], "Message clé."], ["cas", "Cas pratique : réalisé 14 180, N-1 14 360. Qu classes** et montre la **fréquence** de chaque intervalle ; montre la **forme** de la distribution, repère les valeurs fréquentes, détecte une **asymétrie** ou quelques séjours longs. Exemple : moyenne **10 jours** ; **moyenne ± 1 écart type** (8 à 12 jours) contient environ **68 %** des valeurs."], ["t", [["Boxplot (durée de séjour)", "Définition", "Exemple"], ["**Médiane (Q2)**", "Partage la distribution en deux (50 % / 50 %)", "10 jours"], ["**Q1 (25 %)**", "Limite inférieure de la boîte", "5 jours"], ["**Q3 (75 %)**", "Limite supérieure de la boîte", "15 jours"], ["**IQR (Q3 − Q1)**", "Hauteur de la boîte : contient 50 % des valeurs", "10 jours"], ["**Moustaches**", "Jusqu’aux valeurs non atypiques", "—"], ["**Valeurs atypiques**", "Observations en dehors des moustaches", "32 et 34 jours"]]], ["warn", "**Message clé** : le boxplot met en évidence la **médiane**, la **dispersion (IQR)** et les **valeurs atypiques** ; très utile pour **comparer plusieurs groupes**."]], "qs": [["qcm", "Que décrit une variable numérique ?", ["Des valeurs quantitatives mesurables", "Des groupes", "Des lieux"], "Cours."], ["qcm", "Que regroupe un histogramme ?", ["Les valeurs en classes", "Les patients", "Les services"], "Cours."], ["qcm", "Que montre un histogramme ?", ["La forme de la distribution", "L’évolution temporelle", "La composition"], "Cours."], ["qcm", "Que peut détecter un histogramme ?", ["Une asymétrie ou quelques valeurs extrêmes", "Une corrélation", "Un lien causal"], "Cours."], ["qcm", "Quelle part des valeurs contient moyenne ± 1 écart type ?", ["Environ 68 %", "50 %", "95 %"], "Exemple."], ["qcm", "Quel intervalle correspond à moyenne 10 jours ± 2 ?", ["8 à 12 jours", "5 à 15 jours", "2 à 18 jours"], "Exemple."], ["qcm", "Que mesure l’écart type ?", ["L’étalement autour de la moyenne", "Le centre", "Le maximum"], "Cours."], ["qcm", "Quel résumé donne le boxplot ?", ["Médiane, dispersion et valeurs atypiques", "Moyenne seule", "Effectifs"], "Message clé."], ["qcm", s**. Exemples : âge et durée de séjour ; IMC et pression artérielle ; activité et valorisation."], ["t", [["Ce qu’on lit", "Question"], ["**Le sens**", "Quand X augmente, Y augmente-t-il, diminue-t-il, ou rien de clair ?"], ["**L’intensité**", "Les points sont-ils très proches ou dispersés ?"], ["**La forme**", "La relation semble-t-elle linéaire ou non ?"], ["**Les particularités**", "Groupes ou valeurs atypiques ?"]]], ["warn", "**Corrélation ≠ causalité.** Exemples : dépenses de santé et âge, **r = 0,72** (deux variables évoluent ensemble) ; même nuage avec un **point extrême**, **r = 0,32** (un seul point change la lecture) ; infections respiratoires et consommation de glaces (**variable cachée** : la saison). Toujours considérer le **contexte**, les **variables confondantes** et l’**expertise métier**."], ["def", "**Matrice de corrélations** : vue d’ensemble de plusieurs variables numériques, de **−1** (corrélation négative) à **+1** (positive) ; elle **ne remplace pas** le nuage de points pour vérifier la forme."]], "qs": [["qcm", "Quel graphique pour deux variables numériques ?", ["Un nuage de points", "Des barres", "Une courbe seule"], "Cours."], ["qcm", "Que représente un point ?", ["Une observation (X, Y)", "Un groupe", "Une moyenne"], "Cours."], ["qcm", "Que cherche-t-on dans un nuage ?", ["Une tendance générale, des groupes, des valeurs atypiques", "Un tarif", "Une médiane"], "Cours."], ["qcm", "Quel exemple est cité ?", ["Âge et durée de séjour", "Pôle et service", "Mois et année"], "Cours."], ["qcm", "Que lit-on avec « le sens » ?", ["Si Y augmente, diminue ou non quand X augmente", "La dispersion", "La forme"], "Tableau."], ["qcm", "Que lit-on avec « l’intensité » ?", ["Si les points sont proches ou dispersés", "Le sens", "Les groupes"], "Tableau."], ["qcm", "Que lit-on avec « la forme » ?", ["Si la relation est linéaire ou non", "Le sens", "L’intensité"], "Tableau."], ["qcm", "Que lit-on avec « les particularités » ?", ["Les groupes ou valeurs atypiques", "Le sens", "L’intensité"], "Tableau."], ["qcm", "Que signifie corrélation ≠ causalité ?", ["Une association ne prouve pas un lien de cause à effet", "La corrélation est fausse", "La causalité est inutile"], "Cours."], ["qcm", "Que vaut r dans l’exemple dépenses de santé et âge ?", ["0,72", "0,32", "−1"], "Exemple."], ["qcm", "Que devient r avec un point extrême ?", ["0,32", "0,72", "1"], "Exemple."], ["qcm", "Quelle est la variable cachée de l’exemple glaces / infections ?", ["La saison (froide ou chaude)", "L’âge", "Le sexe"], "Exemple."], ["qcm", "Entre quelles bornes varie la corrélation ?", ["−1 et +1", "0 et 100", "0 et 1"], "Matrice."], ["qcm", "Que ne remplace pas la matrice de corrélations ?", ["Le nuage de points", "Le tableau", "La carte"], "Matrice."], ["vf", "Vrai ou faux ? Une forte corrélation prouve un lien causal.", ["Faux", "Vrai"], "Faux."], ["vf", "Vrai ou faux ? Un seul point extrême peut modifier la lecture.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : corrélation ≠ ______.", ["causalité", "distribution", "dispersion"], "Cours."], ["cas", "Cas pratique : plus les ventes de glaces augmentent, plus les infections respiratoires baissent. Que conclure ?", ["Une variable cachée (la saison) explique l’association", "Les glaces protègent", "Les glaces rendent malade"], "Exemple."], ["cas", "Cas pratique : r = 0,95 entre deux variables. Peut-on parler de cause ?", ["Non : il faut étudier le contexte et les variables confondantes", "Oui", "Seulement si r > 0,99"], "Cours."], ["cas", "Cas pratique : en examen, « Que retenir du nuage de points ? ». Réponse ?", ["Sens, intensité, forme, particularités ; corrélation ≠ causalité", "Un nuage prouve une cause", "Un nuage donne les effectifs"], "Cours."]]}, {"id": "14.5", "title": "Une variable catégorielle : compter et comparer", "fiche": [["def", "Les variables **qualitatives** se résument par des **effectifs** et des **proportions**. Exemple : séjours par service : médecine **420 (42 %)**, chirurgie **280 (28 %)**, urgences **180 (18 %)**, réanimation **80 (8 %)**, autres **40 (4 %)** ; total **1 000**."], ["li", ["Le **barplot** (barres) est souvent le choix le plus **simple et efficace** : la **longueur des barres** se compare facilement ; on peut **trier** les barres du plus grand au plus petit ; il fonctionne avec **effectifs ou taux**.", "**Barres empilées** : ajoutent une **3e dimension** ; les totaux se lisent bien, la comparaison des segments est moins immédiate.", "**Composition (part d’un tout)** : barres empilées **à 100 %** : chaque barre = 100 %, on compare la **part** de chaque segment mais **plus les effectifs totaux**."]], ["warn", "**Conseil** : utiliser des **pourcentages** quand la question porte sur la **structure**, pas sur le **volume**."]], "qs": [["qcm", "Comment résume-t-on une variable qualitative ?", ["Par des effectifs et des proportions", "Par une moyenne", "Par une médiane"], "Cours."], ["qcm", "Quel graphique est souvent le plus simple et efficace pour comparer des catégories ?", ["Le barplot", "Le nuage de points", "Le Sankey"], "Cours."], ["qcm", "Que compare-t-on dans un barplot ?", ["La longueur des barres", "Les couleurs", "Les angles"], "Cours."], ["qcm", "Que conseille-t-on pour les barres ?", ["Les trier du plus grand au plus petit", "Les ranger au hasard", "Les colorer toutes"], "Cours."], ["qcm", "Avec quoi fonctionne un barplot ?", ["Effectifs ou taux", "Seulement des effectifs", "Seulement des moyennes"], "Cours."], ["qcm", "Que permettent les barres empilées ?", ["Ajouter une troisième dimension", "Simplifier", "Trier"], "Cours."], ["qcm", "Quelle limite ont les barres empilées ?", ["La comparaison des segments est moins immédiate", "Les totaux se lisent mal", "Elles sont fausses"], "Cours."], ["qcm", "Que représente chaque barre dans un empilé à 100 % ?", ["100 % d’une catégorie", "Un effectif", "Une moyenne"], "Cours."], ["qcm", "Que compare-t-on dans un empilé à 100 % ?", ["La part de chaque segment", "Les effectifs totaux", "Les durées"], "Cours."], ["qcm", "Quand utiliser des pourcentages ?", ["Quand la question porte sur la structure", "Quand la question porte sur le volume", "Toujours"], "Conseil."], ["qcm", "Quelle part représente la médecine (420 sur 1 000) ?", ["42 %", "28 %", "18 %"], "Exemple."], ["qcm", "Quelle part représente la réanimation (80 sur 1 000) ?", ["8 %", "18 %", "4 %"], "Exemple."], ["vf", "Vrai ou faux ? Dans un empilé à 100 %, on compare les effectifs totaux.", ["Faux", "Vrai"], "Faux."], ["vf", "Vrai ou faux ? Un barplot se lit facilement car on compare des longueurs.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : barres empilées à ___ % pour une composition.", ["100", "50", "10"], "Cours."], ["cas", "Cas pratique : on veut comparer le nombre de séjours par service. Quel graphique ?", ["Un barplot trié", "Un nuage de points", "Une carte"], "Cours."], ["cas", "Cas pratique : on veut comparer la structure des séjours entre deux hôpitaux de tailles différentes. Quel graphique ?", ["Des barres empilées à 100 %", "Des barres simples en effectifs", "Un nuage de points"], "Cours."], ["cas", "Cas pratique : en examen, « Quand préférer les pourcentages ? ». Réponse ?", ["Quand on s’intéresse à la structure, pas au volume", "Quand on s’intéresse au volume", "Jamais"], "Conseil."], ["cas", "Cas pratique : en examen, « Que retenir du barplot ? ». Réponse ?", ["Simple et efficace pour comparer des catégories ; l’empilé ajoute une dimension mais se lit moins bien", "Il est toujours trompeur", "Il remplace l’histogramme"], "À retenir."], ["qcm", "Quelle somme donnent 420 + 280 + 180 + 80 + 40 ?", ["1 000", "900", "1 100"], "Calcul."]]}, {"id": "14.6", "title": "Une mesure numérique selon des groupes", "fiche": [["def", "**Comparer une valeur quantitative entre plusieurs catégories** (ex. les durées de séjour sont-elles différentes selon le service : médecine, chirurgie, obstétrique ?)."], ["t", [["Graphique", "Niveau de détail"], ["**Boîtes à moustaches** (boxplots)", "Résumé"], ["**Violons**", "Forme de la distribution"], ["**Nuage de points (jitter)**", "Observations individuelles (le plus précis)"]]], ["warn", "On peut comparer le **centre**, la **dispersion**, la **forme** et les **valeurs atypiques**. Le choix du graphique dépend du **niveau de détail souhaité**."]], "qs": [["qcm", "Quelles données associe-t-on ici ?", ["Une variable numérique et une variable catégorielle", "Deux variables numériques", "Deux catégories"], "Cours."], ["qcm", "Quel est l’exemple cité ?", ["Durée de séjour selon le service", "Âge et poids", "Mois et activité"], "Cours."], ["qcm", "Quel graphique donne un résumé ?", ["La boîte à moustaches", "Le violon", "Le nuage de points"], "Tableau."], ["qcm", "Quel graphique montre la forme de la distribution ?", ["Le violon", "La boîte à moustaches", "La carte"], "Tableau."], ["qcm", "Quel graphique montre les observations individuelles ?", ["Le nuage de points (jitter)", "Le violon", "Le résumé"], "Tableau."], ["qcm", "Quel est le plus précis ?", ["Le nuage de points (jitter)", "La boîte à moustaches", "Le violon"], "Tableau."], ["qcm", "Que peut-on comparer entre groupes ?", ["Centre, dispersion, forme, valeurs atypiques", "Seulement la moyenne", "Seulement le total"], "Cours."], ["qcm", "De quoi dépend le choix du graphique ?", ["Du niveau de détail souhaité", "De la couleur", "De la taille"], "Cours."], ["qcm", "À quoi sert le jitter ?", ["À décaler légèrement les points pour éviter qu’ils se superposent", "À colorer", "À agréger"], "Cours."], ["qcm", "Combien de graphiques sont cités ?", ["3", "2", "5"], "Tableau."], ["vf", "Vrai ou faux ? Le violon montre la forme de la distribution.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Une boîte à moustaches montre chaque observation.", ["Faux", "Vrai"], "Faux : un résumé."], ["trou", "Complète : boîtes à moustaches, ______, nuage de points.", ["violons", "histogrammes", "cartes"], "Tableau."], ["trou", "Complète : nuage de points avec ______.", ["jitter", "filtre", "zoom"], "Tableau."], ["cas", "Cas pratique : on veut comparer la durée de séjour entre médecine, chirurgie et obstétrique. Quel graphique ?", ["Boxplots côte à côte", "Une carte", "Un Sankey"], "Cours."], ["cas", "Cas pratique : on veut voir la forme exacte de la distribution selon le service. Quel graphique ?", ["Un violon", "Un boxplot", "Un nuage de points"], "Tableau."], ["cas", "Cas pratique : on veut voir chaque séjour individuellement. Quel graphique ?", ["Un nuage de points (jitter)", "Un boxplot", "Un violon"], "Tableau."], ["cas", "Cas pratique : en examen, « Quels graphiques pour une mesure selon des groupes ? ». Réponse ?", ["Boîtes à moustaches, violons, nuage de points (jitter)", "Cartes, Sankey", "Barres, camemberts"], "Tableau."], ["qcm", "Quel est le point commun de ces graphiques ?", ["Comparer une variable numérique entre catégories", "Montrer le temps", "Montrer l’espace"], "Cours."], ["vf", "Vrai ou faux ? Le choix du graphique dépend du niveau de détail souhaité.", ["Vrai", "Faux"], "Vrai."]]}, {"id": "14.7", "title": "La heatmap : repérer une structure rapidement", "fiche": [["def", "La **heatmap** croise **deux catégories** et **une mesure numérique** ; l’ajout de la **couleur** résume une valeur numérique et fait apparaître des **zones fortes ou faibles**."], ["li", ["**Quand l’utiliser** : beaucoup de combinaisons à comparer ; un tableau difficile à lire ; repérer rapidement des zones fortes ou faibles.", "**Ce que l’on lit** : comparer une **ligne** (un service selon plusieurs catégories), une **colonne** (plusieurs services pour une même catégorie), repérer les **cellules extrêmes**, voir une **structure globale** avant d’aller dans le détail."]], ["t", [["Service", "Séances", "0 nuit", "1 nuit", "2 nuits et +"], ["Médecine", "450", "850", "1 450", "3 200"], ["Chirurgie", "700", "1 200", "2 300", "4 800"], ["Obstétrique", "600", "950", "1 800", "2 900"], ["Réanimation", "900", "1 500", "3 000", "6 500"], ["Urgences", "300", "700", "1 100", "2 100"]]], ["warn", "Mesure : **valorisation moyenne par séjour (€)**. La valorisation **augmente avec la complexité** du séjour, et elle est **particulièrement élevée en réanimation**. Les valeurs exactes restent dans le tableau."]], "qs": [["qcm", "Que croise une heatmap ?", ["Deux catégories et une mesure numérique", "Deux nombres", "Une date et un lieu"], "Cours."], ["qcm", "Que résume la couleur ?", ["Une valeur numérique", "Une catégorie", "Une date"], "Cours."], ["qcm", "Quand utiliser une heatmap ?", ["Quand il y a beaucoup de combinaisons à comparer", "Quand il y a une seule valeur", "Pour un seul groupe"], "Cours."], ["qcm", "Que fait apparaître la heatmap ?", ["Des zones fortes ou faibles", "Des tendances temporelles", "Des relations causales"], "Cours."], ["qcm", "Quelle est la mesure de l’exemple ?", ["Valorisation moyenne par séjour (€)", "Nombre de séjours", "Durée de séjour"], "Exemple."], ["qcm", "Quels sont les deux axes de l’exemple ?", ["Service et type de séjour", "Âge et sexe", "Mois et année"], "Exemple."], ["qcm", "Quelle cellule a la valeur la plus élevée ?", ["Réanimation, 2 nuits et + (6 500 €)", "Chirurgie, 2 nuits et + (4 800 €)", "Médecine, séances (450 €)"], "Tableau."], ["qcm", "Quelle cellule a la valeur la plus faible ?", ["Urgences, séances (300 €)", "Médecine, séances (450 €)", "Obstétrique, 0 nuit (950 €)"], "Tableau."], ["qcm", "Que constate-t-on quand la durée augmente ?", ["La valorisation augmente avec la complexité du séjour", "La valorisation baisse", "Aucun changement"], "Explication."], ["qcm", "Quel service est particulièrement élevé ?", ["La réanimation", "Les urgences", "La médecine"], "Explication."], ["qcm", "Que compare-t-on en lisant une ligne ?", ["Un service selon plusieurs catégories", "Plusieurs services", "Une seule valeur"], "Cours."], ["qcm", "Que compare-t-on en lisant une colonne ?", ["Plusieurs services pour une même catégorie", "Un service", "Une date"], "Cours."], ["vf", "Vrai ou faux ? La heatmap remplace le tableau de valeurs exactes.", ["Faux", "Vrai"], "Faux : les valeurs exactes restent dans le tableau."], ["vf", "Vrai ou faux ? La heatmap aide à repérer les cellules extrêmes.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : la ______ résume une valeur numérique.", ["couleur", "taille", "forme"], "Cours."], ["cas", "Cas pratique : un tableau de 5 services × 4 types de séjour est difficile à lire. Que faire ?", ["Utiliser une heatmap", "Le supprimer", "L’imprimer"], "Cours."], ["cas", "Cas pratique : en lisant la ligne « Réanimation », que observe-t-on ?", ["Des valeurs élevées dans toutes les catégories", "Des valeurs faibles", "Aucune valeur"], "Tableau."], ["cas", "Cas pratique : en examen, « Quand utiliser une heatmap ? ». Réponse ?", ["Beaucoup de combinaisons à comparer, tableau difficile à lire, repérage rapide de zones fortes ou faibles", "Pour une seule variable", "Pour suivre le temps"], "Cours."], ["cas", "Cas pratique : en examen, « Que lit-on sur la heatmap valorisation service × durée ? ». Réponse ?", ["La valorisation monte avec la complexité, surtout en réanimation", "La valorisation est constante", "La valorisation baisse avec la durée"], "Explication."], ["qcm", "Que retenir de la heatmap ?", ["Elle transforme un grand tableau en structure visuelle", "Elle chiffre précisément", "Elle remplace les graphiques"], "À retenir."]]}, {"id": "14.8", "title": "Le temps est une variable particulière", "fiche": [["def", "Les variables temporelles sont **ordonnées** : **l’ordre compte** (on ne peut pas permuter les dates sans changer l’information). **Échelles** : fine (jour, semaine), intermédiaire (mois, trimestre), longue (année). **Deux formes de représentation** : **temps calendaire** (dates réelles, ex. 12/03/2024) et **temps relatif** (J0 = événement de référence)."], ["li", ["**Courbe** : suivre l’évolution d’une mesure, comparer plusieurs périodes (séjours par mois, N vs N-1).", "**Éviter le « spaghetti »** : **3 à 5 courbes maximum**, ou **petits multiples** (une courbe par service) ; mettre en avant l’essentiel ; même échelle et même période pour comparer.", "**Composition dans le temps** : barres empilées **à 100 %** (part de chaque catégorie) ; **aire empilée** (volume total et contribution)."]], ["warn", "**Toxine botulique** : le **temps calendaire** montre l’**organisation réelle des venues** (la charge) ; le **temps relatif** (J0 = première injection) fait ressortir une **séquence commune**, les **délais** et les **cycles**. **Message clé** : les deux lectures sont **complémentaires**."]], "qs": [["qcm", "Pourquoi le temps est-il une variable particulière ?", ["C’est une variable ordonnée : l’ordre compte", "Il est toujours continu", "Il est toujours numérique"], "Cours."], ["qcm", "Que signifie « on ne peut pas permuter les dates » ?", ["Changer l’ordre change l’information", "Les dates sont fixes", "Les dates sont secrètes"], "Cours."], ["qcm", "Quelles sont les échelles du temps ?", ["Fine, intermédiaire, longue", "Passée, présente, future", "Courte, moyenne, haute"], "Cours."], ["qcm", "Quelles sont les deux formes de représentation ?", ["Temps calendaire et temps relatif", "Temps long et temps court", "Temps réel et temps virtuel"], "Cours."], ["qcm", "Que sont les dates réelles du calendrier ?", ["Le temps calendaire", "Le temps relatif", "Le temps absolu"], "Cours."], ["qcm", "Que signifie J0 ?", ["L’événement de référence (ex. première injection)", "Le premier jour de l’année", "La date de naissance"], "Cours."], ["qcm", "Quel graphique suit une mesure dans le temps ?", ["Une courbe", "Un histogramme", "Une carte"], "Cours."], ["qcm", "Qu’est-ce que le « spaghetti » ?", ["Un graphique avec trop de courbes superposées", "Un type de courbe", "Un graphique en 3D"], "Cours."], ["qcm", "Combien de courbes maximum sur un même graphique ?", ["3 à 5", "10", "20"], "Bonnes pratiques."], ["qcm", "Que sont les petits multiples ?", ["Une courbe par service, territoire ne learning", "chapitres": [{"n": 15, "title": "De l’analyse des données au machine learning", "unites": [{"id": "15.1", "title": "Une nouvelle question : apprendre pour traiter une situation nouvelle", "fiche": [["def", "Nous avons appris à **produire, structurer, analyser et visualiser** les données. Le **machine learning** ajoute une question : **peut-on apprendre à partir des données pour traiter une situation nouvelle ?**"], ["li", ["Le ML ajoute une étape **« apprendre »** entre **analyser** et **décider** : **estimer une valeur inconnue** pour une situation nouvelle, sous forme de **probabilité**."]]], "qs": [["qcm", "Quelle nouvelle question pose le machine learning ?", ["Peut-on apprendre à partir des données pour traiter une situation nouvelle ?", "Comment stocker les données ?", "Comment les visualiser ?"], "Cours."], ["qcm", "Qu’avons-nous appris avant le ML ?", ["Produire, structurer, analyser et visualiser les données", "Programmer", "Chiffrer"], "Cours."], ["qcm", "Où le ML ajoute-t-il une étape ?", ["Entre analyser et décider", "Entre collecter et stocker", "Entre visualiser et publier"], "Résumé."], ["qcm", "Quelle étape est ajoutée ?", ["Apprendre", "Archiver", "Supprimer"], "Résumé."], ["qcm", "Que fait cette étape ?", ["Estimer une valeur inconnue pour une situation nouvelle", "Compter", "Trier"], "Résumé."], ["qcm", "Sous quelle forme exprime-t-on l’estimation ?", ["Une probabilité", "Un certificat", "Un tableau"], "Résumé."], ["qcm", "Qu’est-ce qu’une situation nouvelle ?", ["Un cas non encore observé", "Un cas ancien", "Un cas fictif"], "Cours."], ["qcm", "Que différencie le ML de l’analyse classique ?", ["Il vise à traiter l’avenir ou l’inconnu, pas seulement décrire le passé", "Il est plus lent", "Il utilise moins de données"], "Cours."], ["vf", "Vrai ou faux ? Le ML vise à traiter une situation nouvelle.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Le ML remplace l’analyse et la visualisation.", ["Faux", "Vrai"], "Faux : il s’y ajou
