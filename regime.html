ffet"], ["Les **produits augmentent** mais les **charges augmentent encore plus**", "Hausse des matières premières, prix de vente stable ; résultat positif mais en baisse"], ["Les **produits diminuent** et les **charges augmentent**", "Perte de marché avec charges maintenues ou accrues ; résultat positif possible mais en diminution"], ["Les produits s’effondrent, les charges diminuent **moins vite** que le CA", "Décisions de gestion trop lentes : bénéfice mais moindre"], ["Mêmes hypothèses avec **résultat déficitaire**", "« En difficulté » : à mesurer avec le **bilan** (capitaux propres importants → contre-performance facile à absorber)"], ["**Forte difficulté**", "**Déficit avec capitaux propres restreints** = difficultés réelles"]]], ["eg", "De la croissance à la décroissance, cela peut aller **très vite** : **COVID**."]], "qs": [["qcm", "Comment définit-on la décroissance ?", ["La richesse générée n’augmente pas, voire diminue", "Un déficit", "Une fermeture"], "Définition."], ["qcm", "La décroissance est-elle synonyme de déficit ?", ["Non", "Oui", "Toujours"], "Définition."], ["qcm", "Que peut entraîner la décroissance ?", ["Une phase de difficulté, jusqu’à la mort de la structure", "Une fusion", "Une consolidation"], "Définition."], ["qcm", "Premier type : produits en hausse, charges en hausse encore plus. Quel effet ?", ["Résultat positif mais en baisse", "Résultat négatif certain", "Aucun effet"], "Tableau."], ["qcm", "Deuxième type : produits en baisse, charges en hausse. Quel effet ?", ["Résultat positif possible mais en diminution", "Résultat toujours négatif", "Résultat inchangé"], "Tableau."], ["qcm", "Troisième type : CA effondré, charges qui baissent moins vite. Quel effet ?", ["Bénéfice mais moindre", "Déficit certain", "Bénéfice accru"], "Tableau."], ["qcm", "Que signifie « en difficulté » ?", ["Résultat déficitaire à mesurer avec la situation de bilan", "Résultat nul", "Résultat très élevé"], "Tableau."], ["qcm", "Que mesure-t-on pour savoir si un déficit est absorbable ?", ["Les capitaux propres (bilan)", "Le CA", "L’effectif"], "Tableau."], ["qcm", "Quand parle-t-on de forte difficulté ?", ["Déficit avec capitaux propres restreints", "Déficit avec capitaux propres importants", "Bénéfice faible"], "Tableau."], ["qcm", "Quel exemple montre qu’on peut passer très vite à la décroissance ?", ["Le COVID", "La crise de 1929", "Les soldes"], "Exemple."], ["vf", "Vrai ou faux ? Une structure en décroissance peut encore avoir un résultat positif.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Un déficit avec de gros capitaux propres est une forte difficulté.", ["Faux", "Vrai"], "Faux : contre-performance absorbable."], ["trou", "Complète : déficit avec capitaux propres ______ = difficultés réelles.", ["restreints", "importants", "nuls"], "Tableau."], ["trou", "Complète : décroissance ≠ ______.", ["déficit", "consolidation", "croissance"], "Définition."], ["cas", "Cas pratique : les matières premières augmentent et le prix de vente reste stable. Quel type de décroissance ?", ["Produits en hausse, charges en hausse encore plus", "Produits en baisse", "Effondrement du CA"], "Tableau."], ["cas", "Cas pratique : une structure perd un marché mais garde ses charges. Quel type ?", ["Produits en baisse, charges en hausse", "Hausse des produits", "Aucun"], "Tableau."], ["cas", "Cas pratique : une société déficitaire a des capitaux propres importants. Quelle situation ?", ["Une contre-performance facile à absorber", "Une forte difficulté", "Une liquidation"], "Tableau."], ["cas", "Cas pratique : en examen, « Distinguez décroissance et difficulté ». Réponse ?", ["La décroissance n’est pas forcément une difficulté ; elle le devient si les produits ne couvrent plus les charges et si les capitaux propres sont faibles", "Elles sont identiques", "La difficulté précède toujours la décroissance"], "À retenir."], ["qcm", "Pourquoi regarder le bilan en plus du résultat ?", ["Pour mesurer la capacité à absorber un déficit", "Pour fixer l’impôt", "Pour déterminer le capital"], "Tableau."], ["vf", "Vrai ou faux ? La décroissance peut conduire à la mort de la structure.", ["Vrai", "Faux"], "Vrai."]]}, {"id": "6.2", "title": "Gérer la décroissance", "fiche": [["li", ["Les **paliers se franchissent à la baisse** : impact sur les taux de cotisation, les élections du CSE… On reste tenu de respecter les **fréquences et calendriers**.", "**Pas de loi particulière** à retenir : les enjeux sont les **effets de seuil** (ex. ETP sous 50 salariés ; CA passant au réel simplifié plutôt que normal ; seuils de bilan pour le commissaire aux comptes).", "**Leviers de redressement** : mutations technologiques et environnementales, nouvelles matières à moindre coût, nouveaux marchés (R&D), diminution des coûts, renouvellement des produits, capacité de création et de réaction, **écoute du public et du marché**.", "**Jouer sur les charges** : licenciements, train de vie moins important.", "Quand on redresse et que la croissance repart : **attention à nouveau aux seuils** pour ne pas refranchir ceux modifiés à la baisse."]]], "qs": [["qcm", "Que signifie « les paliers se franchissent à la baisse » ?", ["Les seuils (effectifs, CA…) sont franchis dans le sens descendant", "Les prix baissent", "Les impôts baissent"], "Cours."], ["qcm", "Quel impact des paliers à la baisse ?", ["Sur les taux de cotisation, les élections du CSE…", "Aucun", "Seulement sur la TVA"], "Cours."], ["qcm", "Reste-t-on tenu de respecter les calendriers ?", ["Oui", "Non", "Seulement les fiscaux"], "Cours."], ["qcm", "Existe-t-il une loi particulière sur la décroissance ?", ["Non : les enjeux sont les effets de seuil", "Oui", "Seulement le Code de commerce"], "Cours."], ["qcm", "Quel exemple d’effet de seuil à la baisse ?", ["ETP sous 50 salariés", "CA > 1 million €", "Capital de 37 000 €"], "Cours."], ["qcm", "Quel autre exemple ?", ["CA passant au réel simplifié plutôt que normal", "Capital passant à 1 €", "Création de filiales"], "Cours."], ["qcm", "Quel seuil de bilan est cité ?", ["Le seuil pour le commissaire aux comptes", "Le seuil de l’IS", "Le seuil de TVA"], "Cours."], ["qcm", "Quels leviers de redressement sont cités ?", ["Nouveaux marchés, réduction des coûts, renouvellement des produits, écoute du marché", "Seulement les licenciements", "Seulement la R&D"], "Cours."], ["qcm", "Comment peut-on jouer sur les charges ?", ["Licenciements, train de vie moins important", "Augmenter les prix", "Augmenter les stocks"], "Cours."], ["qcm", "À quoi faut-il faire attention quand la croissance repart ?", ["Aux seuils modifiés à la baisse qu’on pourrait refranchir", "Aux prix", "Aux concurrents"], "Cours."], ["vf", "Vrai ou faux ? Passer sous 50 salariés change certaines obligations.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Une structure en décroissance est dispensée de ses calendriers.", ["Faux", "Vrai"], "Faux."], ["vf", "Vrai ou faux ? La décroissance conduit toujours à des licenciements.", ["Faux", "Vrai"], "Faux : un levier parmi d’autres."], ["trou", "Complète : effets de ______ (ETP, CA, bilan).", ["seuil", "taux", "prix"], "Cours."], ["trou", "Complète : écoute du public et du ______.", ["marché", "dirigeant", "greffe"], "Cours."], ["cas", "Cas pratique : une association passe de 52 à 47 salariés. Que se passe-t-il ?", ["Elle repasse sous le seuil de 50 : certaines obligations changent", "Rien", "Elle est dissoute"], "Cours."], ["cas", "Cas pratique : une société réduit ses coûts en renégociant ses fournisseurs. Quel levier ?", ["Diminution des coûts / nouvelles matières à moindre coût", "Nouveaux marchés", "Licenciements"], "Cours."], ["cas", "Cas pratique : en examen, « Citez des leviers de redressement ». Réponse ?", ["Nouveaux marchés, innovation, diminution des coûts, renouvellement des produits, écoute du marché", "Fusion, scission, franchisage", "Seulement liquidation"], "Cours."], ["cas", "Cas pratique : une structure redressée dépasse de nouveau 50 salariés. Quelle vigilance ?", ["Les obligations liées au seuil reviennent", "Aucune", "Une exonération"], "Cours."], ["qcm", "Pourquoi parle-t-on d’« effets de seuil » ?", ["Le franchissement d’un seuil modifie les obligations", "Les seuils sont des prix", "Les seuils sont des lois"], "Cours."]]}, {"id": "6.3", "title": "Les grandes étapes jusqu’à la sauvegarde", "fiche": [["t", [["#", "Étape", "Contenu"], ["1", "**Gestion**", "Une bonne gestion permet de revenir à une phase de croissance"], ["2", "**Difficulté de paiement**", "Difficulté à répondre aux obligations (fournisseurs, URSSAF, fisc, emprunts) avec la liquidité disponible et ce que doivent les clients"], ["3", "**Procédure de sauvegarde**", "Demandée par le dirigeant, à la **seule condition de ne pas être en cessation de paiement**"], ["4", "**Cessation de paiement**", "—"], ["5", "**Redressement judiciaire**", "Si amélioration : retour à une structure classique ; sinon **liquidation judiciaire**"]]]], "qs": [["qcm", "Que permet une bonne gestion ?", ["Revenir à une phase de croissance", "Fermer la structure", "Fusionner"], "Tableau."], ["qcm", "Qu’est-ce qu’une difficulté de paiement ?", ["Difficulté à répondre aux obligations avec la liquidité disponible", "Un déficit comptable", "Une perte de clients"], "Tableau."], ["qcm", "Quelles obligations sont citées ?", ["Fournisseurs, URSSAF, fisc, emprunts", "Salaires seulement", "Impôts locaux"], "Tableau."], ["qcm", "Qui demande la procédure de sauvegarde ?", ["Le dirigeant", "Le fisc", "Les créanciers"], "Tableau."], ["qcm", "Quelle est la seule condition de la sauvegarde ?", ["Ne pas être en cessation de paiement", "Avoir un déficit", "Avoir moins de 50 salariés"], "Tableau."], ["qcm", "Quelle étape suit la sauvegarde si la situation empire ?", ["La cessation de paiement", "La consolidation", "La croissance"], "Tableau."], ["qcm", "Que suit la cessation de paiement ?", ["Le redressement judiciaire", "La croissance", "La fusion"], "Tableau."], ["qcm", "Que se passe-t-il si le redressement échoue ?", ["La liquidation judiciaire", "Un retour à la croissance", "Une fusion"], "Tableau."], ["qcm", "Que se passe-t-il si le redressement réussit ?", ["Retour à une structure classique", "Liquidation", "Sauvegarde"], "Tableau."], ["vf", "Vrai ou faux ? La sauvegarde est demandée par le dirigeant.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? La sauvegarde est possible en cessation de paiement.", ["Faux", "Vrai"], "Faux."], ["vf", "Vrai ou faux ? Le redressement judiciaire peut déboucher sur la liquidation.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : sauvegarde : seule condition : ne pas être en ______ de paiement.", ["cessation", "retard", "difficulté"], "Tableau."], ["trou", "Complète : gestion → difficulté → sauvegarde → cessation → ______.", ["redressement", "croissance", "vente"], "Tableau."], ["cas", "Cas pratique : une association n’arrive pas à payer l’URSSAF mais n’est pas en cessation de paiement. Que peut faire son dirigeant ?", ["Demander la procédure de sauvegarde", "Demander un redressement", "Se dissoudre"], "Tableau."], ["cas", "Cas pratique : une société ne peut plus payer ses dettes exigibles avec son actif disponible. À quelle étape ?", ["Cessation de paiement", "Sauvegarde", "Gestion"], "Tableau."], ["cas", "Cas pratique : en examen, « Placez dans l’ordre les étapes jusqu’à la liquidation ». Réponse ?", ["Gestion, difficulté de paiement, sauvegarde, cessation, redressement, liquidation", "Sauvegarde, gestion, redressement", "Liquidation, redressement, gestion"], "Tableau."], ["cas", "Cas pratique : en examen, « Que signifie cessation de paiement ? ». Réponse ?", ["Ne plus pouvoir faire face au passif exigible avec l’actif disponible", "Un déficit", "Une perte de clients"], "Partie 6.5."], ["qcm", "Pourquoi demander la sauvegarde avant la cessation de paiement ?", ["Pour anticiper les difficultés insurmontables", "Pour augmenter les dettes", "Pour éviter le tribunal"], "Cours."], ["vf", "Vrai ou faux ? Une bonne gestion peut faire sortir de la difficulté.", ["Vrai", "Faux"], "Vrai."]]}, {"id": "6.4", "title": "La loi PACTE : les effets de seuil", "fiche": [["def", "La **loi PACTE** prévoit un **temps de latence important** quand on **franchit un seuil à la hausse** et un **temps de réaction rapide à la baisse** : un seuil doit être franchi **pendant 5 années consécutives** pour déclencher les obligations ; **à la baisse, une seule année suffit** pour revenir sous le seuil. Si on repasse sous le seuil pendant une année, on **repart pour une période de 5 ans**."], ["eg", "On passe la barre des **50 salariés en 2020** → on attend jusqu’en **2025** pour être tenu d’appliquer toutes les obligations fiscales et sociales liées à ce seuil. Si on était à 50/51 salariés pendant 5–6 ans puis qu’on repasse sous 50 pendant une année, **on repart pour 5 ans**."]], "qs": [["qcm", "Que prévoit la loi PACTE pour un franchissement à la hausse ?", ["Un temps de latence important : 5 années consécutives", "Une application immédiate", "Une application après 1 an"], "Cours."], ["qcm", "Combien d’années consécutives pour déclencher les obligations ?", ["5", "1", "3"], "Cours."], ["qcm", "Que prévoit la loi PACTE à la baisse ?", ["Un temps de réaction rapide : une année suffit", "5 années", "3 années"], "Cours."], ["qcm", "Que se passe-t-il si on repasse sous le seuil une année ?", ["On repart pour une période de 5 ans", "On garde les obligations", "On est dissous"], "Cours."], ["qcm", "Dans l’exemple, quand passe-t-on la barre des 50 salariés ?", ["2020", "2018", "2025"], "Exemple."], ["qcm", "Dans l’exemple, à partir de quand les obligations s’appliquent-elles ?", ["2025", "2021", "2030"], "Exemple."], ["qcm", "Que signifie « temps de latence » ?", ["Le délai avant l’application des obligations", "Le délai de paiement", "Le délai de saisine"], "Cours."], ["qcm", "À quels seuils la loi PACTE s’applique-t-elle dans l’exemple ?", ["Les seuils d’effectifs (ex. 50 salariés)", "Les seuils de CA seulement", "Les seuils de capital"], "Exemple."], ["vf", "Vrai ou faux ? À la baisse, il faut 5 années pour sortir du seuil.", ["Faux", "Vrai"], "Faux : 1 an."], ["vf", "Vrai ou faux ? À la hausse, les obligations s’appliquent après 5 années consécutives.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Repasser sous le seuil une année remet le compteur à zéro.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : 5 années ______ pour déclencher les obligations.", ["consécutives", "cumulées", "fiscales"], "Cours."], ["trou", "Complète : à la baisse, ___ année suffit.", ["une", "trois", "cinq"], "Cours."], ["cas", "Cas pratique : une association atteint 51 salariés en 2021. Quand les obligations liées au seuil s’appliqueront-elles ?", ["Après 5 années consécutives (2026)", "Immédiatement", "En 2022"], "Cours."], ["cas", "Cas pratique : une société a eu 52 salariés pendant 5 ans puis 48 pendant 1 an. Que se passe-t-il ?", ["Elle repasse sous le seuil et repart pour 5 ans en cas de nouveau franchissement", "Elle garde les obligations", "Elle est dissoute"], "Cours."], ["cas", "Cas pratique : en examen, « Que prévoit la loi PACTE sur les effets de seuil ? ». Réponse ?", ["5 années consécutives à la hausse, 1 seule année à la baisse", "1 an à la hausse, 5 à la baisse", "Aucun délai"], "À retenir."], ["cas", "Cas pratique : en examen, « Pourquoi la loi PACTE avantage-t-elle les entreprises ? ». Réponse ?", ["Elle laisse du temps avant l’application des obligations liées aux seuils", "Elle supprime les seuils", "Elle double les cotisations"], "Cours."], ["qcm", "Qu’est-ce qu’un « temps de réaction rapide à la baisse » ?", ["Une seule année sous le seuil suffit pour être libéré des obligations", "Une obligation immédiate", "Une exonération permanente"], "Cours."], ["vf", "Vrai ou faux ? La loi PACTE concerne les effets de seuil.", ["Vrai", "Faux"], "Vrai."], ["qcm", "Que signifie « franchir un seuil pendant 5 années consécutives » ?", ["Rester au-dessus du seuil chaque année sans interruption", " ar les clients.", ["Vrai", "Faux"], "Vrai."]]}, {"id": "6.6", "title": "La procédure de sauvegarde", "fiche": [["li", ["Réservée aux **entreprises** (personnes physiques) et **associations** qui **ne sont pas en cessation de paiement**.", "**Demande du dirigeant** au **tribunal de commerce** (activité commerciale ou artisanale) ou **tribunal de grande instance** : analyse de situation, difficultés insurmontables pouvant conduire à la cessation de paiement ; impossibilité de faire face au **passif exigible** avec l’**actif disponible**.", "**Objectifs** : poursuivre l’activité, maintenir l’emploi, apurer le passif via une réorganisation et un plan fait par le tribunal.", "**Demande acceptée** : publicité ; **refusée** : redressement judiciaire.", "**Période d’observation (6 à 18 mois)** : établit un plan, avis sur la capacité à rebondir. À son issue : **plan de sauvegarde** (jusqu’à **10 ans**) ou redressement / liquidation.", "Dès l’accord du tribunal : **suspension des créances antérieures au jugement**, interruption des intérêts conventionnels, de retard et majorations. Les dettes sont **figées** pendant la période."]], ["warn", "**À retenir — Partie 6** : décroissance ≠ déficit ; gérer = ajuster seuils, calendriers, charges, marchés ; étapes : gestion → difficulté de paiement → sauvegarde → cessation → redressement → liquidation ; loi PACTE : 5 ans à la hausse, 1 an à la baisse ; sauvegarde : observation 6 à 18 mois, plan jusqu’à 10 ans, créances antérieures figées."]], "qs": [["qcm", "À qui est réservée la sauvegarde ?", ["Aux entreprises et associations qui ne sont pas en cessation de paiement", "À toutes les structures", "Aux seules sociétés"], "Cours."], ["qcm", "Qui demande la sauvegarde ?", ["Le dirigeant", "Le fisc", "Les salariés"], "Cours."], ["qcm", "À quel tribunal s’adresse-t-on pour une activité commerciale ou artisanale ?", ["Le tribunal de commerce", "Le tribunal administratif", "Le conseil de prud’hommes"], "Cours."], ["qcm", "Que signifie « passi  ». Réponse ?", ["Demande du dirigeant hors cessation de paiement, période d’observation 6 à 18 mois, plan jusqu’à 10 ans, créances figées", "Demande des créanciers en cessation de paiement, liquidation", "Fusion immédiate"], "Cours."], ["cas", "Cas pratique : en examen, « Que retenir de la partie 6 ? ». Réponse ?", ["Décroissance, gestion, étapes jusqu’à la sauvegarde, loi PACTE, difficultés passagères, sauvegarde", "Les seuils fiscaux", "Les calendriers"], "À retenir."], ["qcm", "Pourquoi la sauvegarde est-elle dite préventive ?", ["Elle intervient avant la cessation de paiement", "Elle intervient après la liquidation", "Elle remplace la gestion"], "Cours."]]}]}, {"n": 7, "title": "La fin de structure", "unites": [{"id": "7.1", "title": "« Happy end » et « tragédie » : les fins de structure", "fiche": [["def", "La fin de structure concerne le **public**, le **privé** et l’**associatif**. Elle peut intervenir en **haut de la vague** (la structure va bien : nouvelle opportunité ou raison d’arrêter) ou au **creux de la vague** (difficultés → liquidation)."], ["t", [["", "Fin heureuse", "Fin tragique"], ["**Public**", "**Privatisation** d’un établissement qui fonctionne bien (ex. loi PACTE : Aéroports de Paris, Française des jeux)", "Activité publique plus rentable qu’un privé → mise en privé peut la rendre rentable → privatisation"], ["**Association**", "Fin d’activité (objet éteint) ; décision des membres ; dispositions statutaires (durée éteinte) ; décroissance : arrêter avant de s’enfoncer → **dissolution**", "Grosses difficultés → **liquidation** (judiciaire)"], ["**Privé**", "Fin d’activité ; décision des actionnaires ; disposition statutaire ; opportunité (**vente**) ; décroissance → **dissolution amiable** ou vente", "Grosses difficultés → **liquidation judiciaire** (liquidateur judiciaire : payer le passif avec l’actif, licencier, voir s’il reste un reliquat)"]]], ["warn", "**Association** : dissolution = arrêt de l’association ; les actifs restants (dont le e, association créée sous couvert d’une structure privée à but lucratif)"], ["**Administrative**", "Dissolution **par décret** : discrimination, haine ou violence envers une personne ou un groupe"]]], ["li", ["Les **modalités** sont indiquées dans les **statuts**. Sinon (nomination du liquidateur, dévolution du patrimoine) : **assemblée générale extraordinaire (AGE)**, prévue lorsqu’on décide la dissolution (volontaire ou statutaire).", "**Décision judiciaire ou administrative** : le tribunal compétent prévoit toutes les dispositions et nomme un **liquidateur judiciaire**. **Volontaire ou statutaire** : le liquidateur est le **dirigeant**, sauf blocage (on peut alors demander un liquidateur judiciaire)."]]], "qs": [["qcm", "Combien de types de dissolution d’une association ?", ["4", "2", "3"], "Tableau."], ["qcm", "Quels sont ces types ?", ["Volontaire, statutaire, judiciaire, administrative", "Amiable, forcée, partielle, totale", "Civile, pénale, fiscale, commerciale"], "Tableau."], ["qcm", "Qu’est-ce qu’une dissolution volontaire ?", ["Les membres veulent cesser (manque de motivation, de bénévoles, de subventions)", "Une décision du tribunal", "Un décret"], "Tableau."], ["qcm", "Qu’est-ce qu’une dissolution statutaire ?", ["Une association à durée limitée ou dont la durée statutaire est dépassée", "Une dissolution par décret", "Une dissolution par vote"], "Tableau."], ["qcm", "Exemple de dissolution statutaire ?", ["Une association créée pour une manifestation", "Une association agréée", "Une association déclarée"], "Tableau."], ["qcm", "Qu’est-ce qu’une dissolution judiciaire ?", ["Une dissolution due à des difficultés financières, à l’inexécution d’obligations ou à la nullité", "Une dissolution volontaire", "Une dissolution par décret"], "Tableau."], ["qcm", "Que signifie nullité ?", ["Objet illicite ou association créée sous couvert d’une structure lucrative", "Absence de membres", "Absence de statuts"], "Tableau."], ["qcm", "Qu’est-ce qu’une dissolution administrative ?", ["Une dissolution par décret pour discrimination, haine ou violence", "Une dissolution par la préfecture", "Une dissolution volontaire"], "Tableau."], ["qcm", "Où sont indiquées les modalités de dissolution ?", ["Dans les statuts", "Dans la loi seulement", "Dans le règlement intérieur"], "Cours."], ["qcm", "Quelle assemblée prévoit nomination du liquidateur et dévolution du patrimoine à défaut de statuts ?", ["L’assemblée générale extraordinaire (AGE)", "L’AG ordinaire", "Le conseil d’administration"], "Cours."], ["qcm", "Qui nomme le liquidateur en décision judiciaire ou administrative ?", ["Le tribunal compétent (liquidateur judiciaire)", "Le président", "Les membres"], "Cours."], ["qcm", "Qui est le liquidateur en dissolution volontaire ou statutaire ?", ["Le dirigeant (sauf blocage)", "Un liquidateur judiciaire toujours", "Le préfet"], "Cours."], ["vf", "Vrai ou faux ? Une dissolution administrative se fait par décret.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? En cas de blocage, on peut demander un liquidateur judiciaire.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : dissolution ______ : par décret.", ["administrative", "statutaire", "volontaire"], "Tableau."], ["cas", "Cas pratique : une association de festival s’arrête après l’événement prévu. Quel type ?", ["Statutaire", "Judiciaire", "Administrative"], "Tableau."], ["cas", "Cas pratique : une association qui prône la haine est dissoute par décret. Quel type ?", ["Administrative", "Volontaire", "Statutaire"], "Tableau."], ["cas", "Cas pratique : des membres, faute de bénévoles, décident d’arrêter. Quel type ?", ["Volontaire", "Judiciaire", "Administrative"], "Tableau."], ["cas", "Cas pratique : en examen, « Citez les quatre types de dissolution et un exemple ». Réponse ?", ["Volontaire (manque de bénévoles), statutaire (durée dépassée), judiciaire (difficultés), administrative (décret)", "Amiable, forcée", "Totale, partielle"], "Tableau."], ["qcm", "Qui décide d’une dissolution ju const KEY = "l3-" + M.key + "-v2";
const $ = id => document.getElementById(id), app = $("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const shuffle = a => { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [r[i], r[j]] = [r[j], r[i]]; } return r; };
const TYPE = {qcm:"QCM", vf:"Vrai ou faux", trou:"Texte à trous", cas:"Cas pratique"};
let S = {u:{}, c:{}};
try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.u) S = v; } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const UNITS = [], CHAPS = [];
M.lecons.forEach(L => L.chapitres.forEach(C => { C.L = L; C.key = L.n + "-" + C.n; CHAPS.push(C); C.unites.forEach(U => { U.C = C; UNITS.push(U); }); }));
const ready = U => U.qs && U.qs.length;
const uById = id => UNITS.find(U => U.id === id);
let cur = null;

function setView(v, hint){ document.body.dataset.view = v; $("hint").textContent = hint || M.title; window.scrollTo(0,0); }

function home(){
  setView("home");
  const rd = UNITS.filter(ready), done = rd.filter(U => S.u[U.id] != null);
  const nq = rd.reduce((n,U) => n + U.qs.length, 0);
  let h = `<h1>${esc(M.title)}</h1><p class="lead">${esc(M.sub)}</p>
<div class="stats"><div class="stat"><b>${done.length}/${rd.length}</b><span>unités travaillées</span></div><div class="stat"><b>${nq}</b><span>questions</span></div><div class="stat"><b>${UNITS.length - rd.length}</b><span>unités à venir</span></div></div>`;
  M.lecons.forEach(L => {
    h += `<div class="lesson">Leçon ${L.n} · ${esc(L.title)}</div>`;
    L.chapitres.forEach(C => {
      const ok = C.unites.filter(ready).length, cb = S.c[C.key];
      h += `<section class="chap"><div class="chapbar"><h2>Chapitre ${C.n}. ${esc(C.title)}</h2>${ok ? `<button class="btn sm" data-exam="${C.key}">Examen du chapitre</button>` : ""}</div>${cb != null ? `<div class="meta">Meilleur examen : ${cb}/20</div>` : ""}<ul class="units">`;
      C.unites.forEach(U => {
        const b = S.u[U.id], r = ready(U);
        h += `<li class="unit${r ? "" : " soon"}${b != null && b >= 16 ? " done" : ""}"><span class="uid">${esc(U.id)}</span><div class="ub"><div class="ut">${esc(U.title)}</div><div class="um">${r ? `${U.qs.length} questions${b != null ? `, meilleur ${b}/${U.qs.length}` : ""}` : "À venir"}</div></div>${r ? `<div class="ua"><button class="btn sm" data-fiche="${esc(U.id)}">Fiche</button><button class="btn sm solid" data-quiz="${esc(U.id)}">Quiz</button></div>` : ""}</li>`;
      });
      h += `</ul></section>`;
    });
  });
  h += `<div class="toolbar"><button class="btn danger" data-reset>Effacer ma progression</button></div>`;
  app.innerHTML = h;
}

function block(b){
  switch(b[0]){
    case "def": return `<div class="def">${md(b[1])}</div>`;
    case "eg": return `<div class="eg">${md(b[1])}</div>`;
    case "warn": return `<p class="warn">⚠ ${md(b[1])}</p>`;
    case "p": return `<p>${md(b[1])}</p>`;
    case "li": return `<ul>${b[1].map(x => `<li>${md(x)}</li>`).join("")}</ul>`;
    case "t": return `<div class="tblw"><table><thead><tr>${b[1][0].map(x => `<th>${md(x)}</th>`).join("")}</tr></thead><tbody>${b[1].slice(1).map(r => `<tr>${r.map(x => `<td>${md(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  return "";
}
function fiche(U){
  setView("fiche", `Unité ${U.id}`);
  app.innerHTML = `<div class="fiche"><p class="meta">Leçon ${U.C.L.n} · Chapitre ${U.C.n} · Unité ${esc(U.id)}</p><h2>${esc(U.title)}</h2>
<div class="legend"><span class="lg d">à mémoriser</span><span class="lg e">exemple</span><span class="lg w">⚠ piège</span></div>
${U.fiche.map(block).join("")}</div><div class="toolbar"><button class="btn solid" data-quiz="${esc(U.id)}">S’entraîner : ${U.qs.length} questions</button></div>`;
}

function start(kind, ref, list){
  cur = {kind, ref, list, idx:0, res:[]};
  renderQ();
}
function quizUnit(U){ start("u", U.id, shuffle(U.qs.map((_,i) => [U.id, i]))); }
function examChap(C){ const pool = []; C.unites.filter(ready).forEach(U => U.qs.forEach((_,i) => pool.push([U.id, i]))); start("c", C.key, shuffle(pool).slice(0, 20)); }
function Q(it){ const q = uById(it[0]).qs[it[1]]; return {t:q[0], p:q[1], o:q[2], e:q[3]}; }
function renderQ(){
  const c = cur; if (c.idx >= c.list.length) return end();
  const q = Q(c.list[c.idx]);
  setView("quiz", c.kind === "u" ? `Unité ${c.ref}` : `Examen du chapitre`);
  const idx = q.o.map((_,i) => i), order = q.t === "vf" ? idx.sort((a,b) => q.o[a] === "Vrai" ? -1 : q.o[b] === "Vrai" ? 1 : 0) : shuffle(idx);
  app.innerHTML = `<div class="bar"><h1>${c.kind === "u" ? `Unité ${esc(c.ref)}` : "Examen du chapitre"}</h1><span class="meta">Question ${c.idx + 1} / ${c.list.length}</span></div>
<div class="prog"><i style="width:${c.idx / c.list.length * 100}%"></i></div>
<div class="q"><span class="tag${q.t === "cas" ? " cas" : ""}">${TYPE[q.t]}</span>${c.kind === "c" ? `<span class="tag">Unité ${esc(c.list[c.idx][0])}</span>` : ""}<div class="qtxt">${esc(q.p)}</div></div>
<div class="opts">${order.map(i => `<button class="opt" data-pick="${i}">${esc(q.o[i])}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div>`;
}
function pick(i){
  const c = cur, q = Q(c.list[c.idx]), ok = i === 0;
  app.querySelectorAll(".opt").forEach(b => { b.disabled = true; const k = +b.dataset.pick; if (k === 0) b.classList.add("ok"); else if (k === i) b.classList.add("ko"); });
  c.res.push({it:c.list[c.idx], ok, pick:i}); c.idx++;
  const last = c.idx >= c.list.length;
  $("fb").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}">${ok ? "Bonne réponse" : "Mauvaise réponse"}</div><div class="expl">${esc(q.e)}</div><div class="toolbar"><button class="btn solid" data-next>${last ? "Voir mon résultat" : "Question suivante"}</button></div>`;
}
let lastWrong = null;
function end(){
  const c = cur, n = c.res.length, ok = c.res.filter(r => r.ok).length, pct = Math.round(ok / n * 100);
  if (c.kind === "u" && !c.err) S.u[c.ref] = Math.max(S.u[c.ref] || 0, ok);
  if (c.kind === "c") S.c[c.ref] = Math.max(S.c[c.ref] || 0, ok);
  save();
  const wrong = c.res.filter(r => !r.ok); lastWrong = wrong.map(r => r.it);
  let nextU = null;
  if (c.kind === "u") { const i = UNITS.findIndex(U => U.id === c.ref); nextU = UNITS.slice(i + 1).find(ready); }
  setView("end", "Résultat");
  let h = `<div class="end"><p class="score">${ok}/${n}</p><p class="meta">${pct} % de bonnes réponses${pct >= 80 ? " : objectif atteint" : " : objectif 80 %"}</p>
<div class="toolbar">${wrong.length ? `<button class="btn solid" data-errs>Refaire mes ${wrong.length} erreur${wrong.length > 1 ? "s" : ""}</button>` : ""}<button class="btn" data-again>Recommencer</button>${nextU ? `<button class="btn" data-fiche="${esc(nextU.id)}">Unité suivante</button>` : ""}<button class="btn" data-home>Sommaire</button></div></div>`;
  if (wrong.length) {
    h += `<h2>Correction</h2>`;
    wrong.forEach(r => { const q = Q(r.it); h += `<div class="corr"><div class="qtxt">${esc(q.p)}</div><div class="cbad">Ta réponse : ${esc(q.o[r.pick])}</div><div class="cgood">Bonne réponse : ${esc(q.o[0])}</div><div class="expl">${esc(q.e)}</div></div>`; });
  }
  app.innerHTML = h;
  cur.done = true;
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.fiche) return fiche(uById(d.fiche));
  if (d.quiz) return quizUnit(uById(d.quiz));
  if (d.exam) return examChap(CHAPS.find(C => C.key === d.exam));
  if ("pick" in d) return pick(+d.pick);
  if ("next" in d) return renderQ();
  if ("errs" in d) { const k = cur.kind, r = cur.ref; start(k, r, shuffle(lastWrong)); cur.err = true; return; }
  if ("again" in d) { return cur.kind === "u" ? quizUnit(uById(cur.ref)) : examChap(CHAPS.find(C => C.key === cur.ref)); }
  if ("home" in d) return home();
  if ("reset" in d) {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirmer : tout effacer"; setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = "Effacer ma progression"; } }, 4000); return; }
    S = {u:{}, c:{}}; save(); return home();
  }
});
$("homeBtn").addEventListener("click", home);
home();
})();
</script>
