<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Régime juridique des structures — Révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Open+Sans:wght@400;600;700&display=swap">
<style>
:root{--paper:#F5F7FA;--card:#FFFFFF;--ink:#1E293B;--muted:#64748B;--line:#E2E8F0;--pri:#1E40AF;--pri-soft:#EFF6FF;--on-pri:#FFFFFF;
--acc:#D97706;--acc-soft:#FEF3C7;--ok:#15803D;--ok-soft:#DCFCE7;--ko:#B91C1C;--ko-soft:#FEE2E2;--def:#0B6E79;--def-bg:#E0F5F7;--eg:#2E7D32;
--la:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ti:"Comfortaa","Open Sans",system-ui,sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F172A;--card:#1E293B;--ink:#F1F5F9;--muted:#94A3B8;--line:#334155;--pri:#60A5FA;--pri-soft:#1E3A8A;--on-pri:#0F172A;--acc:#F59E0B;--acc-soft:#451A03;--ok:#4ADE80;--ok-soft:#14532D;--ko:#F87171;--ko-soft:#7F1D1D;--def:#7FE3EA;--def-bg:#123A40;--eg:#81C784;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F172A;--card:#1E293B;--ink:#F1F5F9;--muted:#94A3B8;--line:#334155;--pri:#60A5FA;--pri-soft:#1E3A8A;--on-pri:#0F172A;--acc:#F59E0B;--acc-soft:#451A03;--ok:#4ADE80;--ok-soft:#14532D;--ko:#F87171;--ko-soft:#7F1D1D;--def:#7FE3EA;--def-bg:#123A40;--eg:#81C784;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--la)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,.score{font-family:var(--ti)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.home{border:0;background:none;color:var(--pri);font-weight:700;padding:6px 0}
body[data-view="home"] .home{visibility:hidden}
.hint{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 64px}
h1{font-size:clamp(23px,5.5vw,30px);line-height:1.25;margin:4px 0 6px;color:var(--pri)}
.lead{color:var(--muted);margin:0 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--pri);background:transparent;color:var(--pri);font-weight:600;text-decoration:none}
.btn.solid{background:var(--pri);color:var(--on-pri)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px}
.btn.danger{border-color:var(--ko);color:var(--ko)}
.btn.danger.armed{background:var(--ko);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--ti);font-size:22px;color:var(--pri)}
.stat span{font-size:12px;color:var(--muted)}
.lesson{margin:22px 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.chap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.chap h2{font-size:17px;margin:0 0 4px}
.chapbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px}
.units{list-style:none;margin:0;padding:0}
.unit{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.uid{flex:none;min-width:38px;height:28px;padding:0 6px;border-radius:8px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:13px}
.unit.done .uid{background:var(--ok);color:var(--card)}
.unit.soon{opacity:.55}
.ub{flex:1;min-width:0}
.ut{font-weight:600;line-height:1.35}
.um{font-size:13px;color:var(--muted)}
.ua{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.meta{color:var(--muted);font-size:14px}
.fiche h2{font-size:20px;margin:0 0 10px}
.def{background:var(--def-bg);border-left:4px solid var(--def);border-radius:10px;padding:10px 12px;margin:10px 0}
.def::before{content:"À mémoriser";display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--def);margin-bottom:2px}
.eg{border-left:4px solid var(--eg);padding:6px 12px;margin:10px 0;color:var(--ink)}
.eg::before{content:"Exemple";display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--eg)}
.warn{background:var(--acc-soft);border-radius:10px;padding:8px 12px;margin:10px 0}
.fiche ul{margin:8px 0;padding-left:20px}.fiche li{margin:4px 0}
.tblw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--pri-soft);color:var(--pri)}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin:0 0 6px}
.lg{padding:2px 8px;border-radius:6px;font-weight:600}
.lg.d{background:var(--def-bg);color:var(--def)}.lg.e{border:1px solid var(--eg);color:var(--eg)}.lg.w{background:var(--acc-soft)}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.bar h1{font-size:20px;margin:0}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--pri-soft);color:var(--pri);margin:0 6px 8px 0}
.tag.cas{background:var(--acc-soft);color:var(--acc)}
.qtxt{font-size:17px;font-weight:600;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{min-height:50px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:15px;line-height:1.4;text-align:left}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ko{border-color:var(--ko);background:var(--ko-soft)}
.fb{margin-top:12px}
.verdict{font-weight:700;font-size:17px;font-family:var(--ti)}
.verdict.good{color:var(--ok)}.verdict.bad{color:var(--ko)}
.expl{margin-top:6px;font-size:15px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:10px 12px}
.end{text-align:center}
.score{font-size:52px;font-weight:700;color:var(--pri);margin:6px 0 0}
.corr{padding:12px 0;border-bottom:1px solid var(--line)}
.corr .qtxt{font-size:15px}
.cbad{color:var(--ko);font-size:14px}.cgood{color:var(--ok);font-size:14px}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>

n"], "Cours."], ["qcm", "Comment appelle-t-on l’acquisition d’une association ?", ["Une reprise", "Une fusion-absorption", "Une cession"], "Cours."], ["qcm", "Quelles structures ne sont pas traitées ?", ["Les structures publiques", "Les sociétés", "Les associations"], "Cours."], ["qcm", "Qui crée les structures publiques ?", ["L’administration publique", "Les associés", "Les clients"], "Cours."], ["qcm", "Combien d’actes principaux au début d’activité ?", ["2", "3", "1"], "Cours."], ["qcm", "Que précède toujours le début d’activité ?", ["Une phase d’étude", "Une liquidation", "Une consolidation"], "Cours."], ["qcm", "Une structure suit-elle toujours les phases dans le même ordre ?", ["Non : elle peut alterner les cycles", "Oui", "Seulement en société"], "Cours."], ["qcm", "Que vient après le début d’activité ?", ["La phase de vie (réalisation de l’activité)", "La liquidation", "La décroissance"], "Cours."], ["vf", "Vrai ou faux ? Le cours traite de la création des structures publiques.", ["Faux", "Vrai"], "Faux."], ["vf", "Vrai ou faux ? On parle de reprise pour une association.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Il y a toujours une phase d’étude en amont.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : création ou ______ / reprise.", ["acquisition", "fusion", "liquidation"], "Cours."], ["trou", "Complète : les structures ______ ne sont créées que par l’administration.", ["publiques", "privées", "associatives"], "Cours."], ["cas", "Cas pratique : des amis rachètent une association existante. Quel terme utilise-t-on ?", ["Une reprise", "Une création", "Une scission"], "Cours."], ["cas", "Cas pratique : un ministère crée un établissement public. Est-il dans le périmètre du cours ?", ["Non : les structures publiques ne sont pas traitées", "Oui", "Seulement si elle est rentable"], "Cours."], ["cas", "Cas pratique : en examen, « Quels sont les deux actes du début d’activité ? ». Réponse ?", ["La création et l’acquisition / reprise", "La croissance et ptabilité, analyse financière, benchmarking, RH, partenariats, engagements", "Seulement la comptabilité", "Seulement les RH"], "Tableau."], ["qcm", "À quoi sert l’étude d’une acquisition ?", ["À valoriser au mieux le prix d’acquisition ou les modalités de reprise", "À créer un logo", "À choisir un nom"], "Tableau."], ["qcm", "Que comprend l’étude d’une création ?", ["Étude marketing, concurrentielle, besoin de la population", "Seulement l’étude des prix", "Seulement le choix du nom"], "Tableau."], ["qcm", "Que doit-on vérifier sur la population ?", ["Est-elle suffisante pour l’activité ?", "Est-elle âgée ?", "Est-elle riche ?"], "Tableau."], ["qcm", "Par quel document sanctionne-t-on l’étude de marché ?", ["Un business plan", "Un contrat de travail", "Un bail"], "Tableau."], ["qcm", "Que contient un business plan ?", ["Projection du CA et des bénéfices, besoins d’investissement et de financement, trésorerie", "Seulement le CA", "Seulement les statuts"], "Définition."], ["qcm", "Qu’est-ce que le benchmarking ?", ["Analyser les concurrents et se positionner", "Rédiger les statuts", "Publier au JAL"], "Tableau."], ["qcm", "Quel exemple de frein est cité pour une charpente ?", ["Au moins une personne doit avoir le certificat professionnel en charpente", "Un capital de 37 000 €", "Un commissaire aux comptes"], "Exemple."], ["qcm", "Quel exemple de frein pour un taxi ?", ["Il faut avoir le permis taxi", "Il faut un bail commercial", "Il faut un site internet"], "Exemple."], ["qcm", "Par quoi l’étude peut-elle être remplacée dans le monde associatif ?", ["Un appel à projet", "Un business plan", "Un audit"], "Cours."], ["qcm", "Que permet l’appel à projet ?", ["Obtenir des subventions pour créer l’association et exploiter l’activité", "Avoir un statut commercial", "Recruter des salariés"], "Cours."], ["vf", "Vrai ou faux ? L’étude d’une reprise est « très globale ».", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Le business plan projette la trésorerie.", ["Vrai", "Fau ucture privée. Est-ce possible ?", ["Oui : une seule entité suffit", "Non, il faut deux associés", "Non, il faut une association"], "Tableau."], ["cas", "Cas pratique : en examen, « Quel est le nombre minimum d’entités pour créer une association, une structure privée ? ». Réponse ?", ["2 pour une association ; 1 pour une structure privée", "1 et 1", "3 et 2"], "Tableau."], ["qcm", "Pourquoi interdire 100 % de détention publique ?", ["Pour éviter que l’État décide seul de la stratégie d’une structure privée", "Pour réduire les impôts", "Pour simplifier les statuts"], "Cours."], ["vf", "Vrai ou faux ? Une association + une personne physique peuvent constituer une association.", ["Vrai", "Faux"], "Vrai."], ["qcm", "Que peuvent détenir des personnes physiques ?", ["Une structure privée, seules ou avec d’autres", "Seulement une association", "Seulement une société publique"], "Cours."], ["qcm", "Quelle place pour la partie publique dans une société privée ?", ["En retrait, sans pouvoir de décision exclusif", "Dominante", "Interdite en tout cas"], "Cours."]]}, {"id": "2.5", "title": "La création d’une société (création simple)", "fiche": [["def", "La complexité dépend du **nombre et du type de personnes**, de l’**activité** (attestation particulière…), du **capital** : **apport en numéraire** (facile) ou **apport en industrie** (validation d’un **commissaire aux apports**). **Capital** : somme à apporter, libérée en totalité, par quart, par moitié ou selon les statuts."], ["t", [["#", "Étape (processus classique)", "Détail"], ["1", "**Pré-création**", "Pré-statuts (contrat de société) : capital, libération"], ["2", "**Compte bancaire bloqué**", "RIB donné aux futurs associés"], ["3", "**Libération du capital**", "Versement sur le compte bloqué → attestation de blocage des fonds"], ["4", "**Publication**", "Annonce dans un **JAL** → certificat de publication"], ["5", "**Signature des statuts**", "Avec le certificat de publication et l’attestation de blocage"], ["6", "**Dépôt au greffe**", "Greffe du tribunal de commerce"], ["7", "**Étude du greffe**", "Peut demander des pièces ; durée variable"], ["8", "**Obtention du K bis**", "Qui vous êtes, où, objet social, capital, gestionnaire"], ["9", "**Libération du compte bloqué**", "Grâce au K bis, démarrage de l’activité"]]]], "qs": [["qcm", "Qu’est-ce qu’un apport en numéraire ?", ["Une somme d’argent", "Un bien ou du matériel", "Un travail"], "Cours."], ["qcm", "Qu’est-ce qui nécessite un commissaire aux apports ?", ["Un apport en industrie", "Un apport en numéraire", "Un apport en capital libéré"], "Cours."], ["qcm", "Comment le capital peut-il être libéré ?", ["En totalité, par quart, par moitié ou selon les statuts", "Seulement en totalité", "Seulement par moitié"], "Définition."], ["qcm", "Quelle est la première étape de la création simple ?", ["La pré-création (pré-statuts)", "Le dépôt au greffe", "La publication"], "Tableau."], ["qcm", "Que contiennent les pré-statuts ?", ["Le contrat de société, le capital et les modalités de libération", "Le K bis", "Le RIB"], "Tableau."], ["qcm", "Quelle est la deuxième étape ?", ["Compte bancaire bloqué", "Libération du capital", "Publication"], "Tableau."], ["qcm", "Quel document certifie le blocage des fonds ?", ["L’attestation de blocage", "Le certificat de publication", "Le K bis"], "Tableau."], ["qcm", "Où publie-t-on l’annonce de création ?", ["Dans un journal d’annonces légales (JAL)", "Au greffe", "À la préfecture"], "Tableau."], ["qcm", "Que doit-on avoir pour signer les statuts ?", ["Le certificat de publication et l’attestation de blocage", "Le K bis", "Un commissaire aux comptes"], "Tableau."], ["qcm", "Où dépose-t-on les statuts ?", ["Au greffe du tribunal de commerce", "À la préfecture", "À l’URSSAF"], "Tableau."], ["qcm", "Que peut demander le greffe ?", ["Des documents manquants ou des précisions", "Un capital plus élevé", "Un nouveau nom"], "Tableau."], ["qcm", "Que contient le K bis ?", ["Qui vous êtes, où, objet social, capi  € pour les SA)"], ["**Objet social** (activité réalisée)", "Activité commerciale ; raison sociale ; régime fiscal"]]], ["li", ["Souvent, on est **contraint** sur la gouvernance, les entrées/sorties et les décisions.", "**Exception : SAS / SASU** → **grande liberté** de constitution des statuts.", "Les statuts précisent aussi : actionnaires, organe de direction et de contrôle, pouvoirs du président, durée et lieu de l’activité, clauses liées aux actions (droits de préférence), **commissaire aux comptes** (obligatoire à partir d’un certain plafond)."]]], "qs": [["qcm", "Que signifie « opposables aux tiers » ?", ["N’importe qui peut les obtenir et s’en prévaloir", "Ils sont secrets", "Ils sont réservés aux associés"], "Définition."], ["qcm", "Où peut-on obtenir les statuts ?", ["Sur Infogreffe", "À la préfecture", "À l’INPI"], "Définition."], ["qcm", "Que comprennent les statuts pour les associés ?", ["Gouvernance, entrées/sorties, décisions des AG, objet social", "Seulement le nom", "Seulement le siège"], "Tableau."], ["qcm", "Que comprennent les statuts pour les tiers ?", ["Dénomination, siège, capital social, activité, régime fiscal", "Les salaires", "Les prix"], "Tableau."], ["qcm", "Que signifie AG ?", ["Assemblée générale", "Association générale", "Autorité de gestion"], "Tableau."], ["qcm", "Que signifie « objet social » ?", ["L’activité réalisée par la société", "Le capital", "Le siège"], "Tableau."], ["qcm", "Quelle forme bénéficie d’une grande liberté statutaire ?", ["SAS / SASU", "SA", "SNC"], "Cours."], ["qcm", "Que fixent librement les associés d’une SAS ?", ["Gouvernance, modalités d’entrée, décisions", "Le capital minimum", "La dénomination légale"], "Cours."], ["qcm", "Quand un commissaire aux comptes est-il obligatoire ?", ["À partir d’un certain plafond", "Toujours", "Jamais"], "Cours."], ["qcm", "Que précisent aussi les statuts ?", ["Actionnaires, organe de direction, pouvoirs du président, durée, clauses sur les actions", "Seulement la durée", "Seu  les membres)", "—"]]], ["li", ["**IR** : le bénéfice est affecté à la personne physique ; **IS** : taux entre 15 et 33 % selon CA et résultat.", "**TVA** : pas de TVA pour activités ou opérations non imposables (médical, assurance, enseignement ; export) ou sous le **plafond de franchise** (chiffres du cours : **34 400 €** services, **85 800 €** biens ; mention « TVA non applicable, art. 293 B du CGI »). **Régimes** : réel simplifié / réel normal.", "**Dirigeant** : associé rémunéré = **TNS** (sauf SAS) ; non associé rémunéré = régime salarié sans chômage (mandataire social).", "**Premier salarié** : **DPAE** avant l’arrivée ; **DUERP** dès le 1er salarié ; **CSE** à > 11 salariés ; **règlement intérieur** à > 50 salariés.", "**Commercial** : bail commercial, CGA, **CGV** (B to B facultatives ; **B to C obligatoires**).", "**Propriété intellectuelle** (3 niveaux) : dénomination / marque (recherche à l’**INPI**) ; site et communication ; **brevets** et R&D."]], ["warn", "**Veille importante** : seuils, taux et plafonds **varient d’une année à l’autre** (les chiffres du cours sont à vérifier chaque année)."]], "qs": [["qcm", "Quelle est l’imposition par défaut d’une SARL ?", ["L’impôt sur les sociétés (IS)", "L’impôt sur le revenu (IR)", "Aucune"], "Tableau."], ["qcm", "Quelle est l’imposition par défaut d’une entreprise individuelle ?", ["L’IR", "L’IS", "Aucune"], "Tableau."], ["qcm", "Quelle est l’imposition par défaut d’une SAS ?", ["L’IS", "L’IR", "Aucune"], "Tableau."], ["qcm", "Quelle est l’imposition par défaut d’une SNC ?", ["L’IR", "L’IS", "Aucune"], "Tableau."], ["qcm", "Comment un GIE est-il imposé ?", ["Il n’est pas imposé lui-même : le résultat est imposé chez les membres", "À l’IS", "À l’IR"], "Tableau."], ["qcm", "Que signifie IR ?", ["Impôt sur le revenu : le bénéfice est affecté à la personne physique", "Impôt sur les sociétés", "Impôt régional"], "Cours."], ["qcm", "Entre quels taux se situe l’IS selon le cours ?", ["15 % et 33 %", "5 % et 10 %", "40 % et 60 %"], "Cours."], ["qcm", "Quel plafond de franchise de TVA pour les prestations de services (selon le cours) ?", ["34 400 €", "85 800 €", "100 000 €"], "Cours."], ["qcm", "Quel plafond de franchise de TVA pour les ventes de biens (selon le cours) ?", ["85 800 €", "34 400 €", "10 000 €"], "Cours."], ["qcm", "Quelle mention figure sur les factures en franchise de TVA ?", ["« TVA non applicable, art. 293 B du CGI »", "« TVA incluse »", "« Exonéré de tout impôt »"], "Cours."], ["qcm", "Quel est le régime d’un dirigeant associé et rémunéré (hors SAS) ?", ["TNS (travailleur non salarié)", "Salarié", "Sans régime"], "Cours."], ["qcm", "Que doit-on faire avant l’arrivée de chaque salarié ?", ["Une DPAE", "Un contrat de société", "Un audit"], "Cours."], ["qcm", "Dès quand le DUERP est-il obligatoire ?", ["Dès le 1er salarié", "Dès 11 salariés", "Dès 50 salariés"], "Cours."], ["qcm", "À partir de combien de salariés élit-on un CSE ?", ["Plus de 11", "Plus de 50", "Plus de 5"], "Cours."], ["qcm", "À partir de combien de salariés le règlement intérieur est-il obligatoire ?", ["Plus de 50", "Plus de 11", "Dès le 1er"], "Cours."], ["qcm", "Les CGV sont-elles obligatoires en B to C ?", ["Oui", "Non", "Seulement en ligne"], "Cours."], ["qcm", "Qui consulter pour vérifier qu’un nom n’est pas déjà une marque ?", ["L’INPI", "L’INSEE", "Le greffe"], "Cours."], ["vf", "Vrai ou faux ? Les seuils et taux fiscaux ne varient jamais.", ["Faux", "Vrai"], "Faux : veille importante."], ["vf", "Vrai ou faux ? Les CGV sont facultatives en B to B mais fournies si le client le demande.", ["Vrai", "Faux"], "Vrai."], ["cas", "Cas pratique : en examen, « Que retenir de la partie 2 ? ». Réponse ?", ["Création ou reprise précédée d’une étude, création simple (pré-statuts → K bis), formes de sociétés, statuts opposables, fiscalité, travail, commercial, acquisition", "Les phases de vie", "Les seuils d’effectifs"], "À retenir."]]}, {"id": "2.10", "title": "L’acquisition d’une société et la continuité des droits", "fiche": [["t", [["Type", "Principe"], ["**Acquisition simple**", "Société A rachetée par une ou plusieurs personnes, sous une autre entité / forme → devient la société B"], ["**Poursuite**", "On rachète **l’ensemble des parts** (pas le fonds de commerce) : A maintient son activité mais change d’**actionnaire**"], ["**Fusion**", "Une, deux ou plusieurs sociétés fusionnent pour créer une **nouvelle entité** (A + B → C)"], ["**Fusion-absorption**", "A est absorbée par B dans l’ensemble de ses activités (**pas de nouvelle entité**)"], ["**Scission**", "Une activité de A est scindée en plusieurs parties : création de nouvelles sociétés (B, C, D) ou rachat"], ["**Cession partielle**", "A enlève une partie de son activité pour la vendre (ou créer une autre société) et poursuit avec le reste"]]], ["li", ["Seuls l’**acquisition simple**, la **fusion** et la **scission** ont une activité de **création de structure**.", "**Continuité des droits** : en acquisition, les engagements pris auprès des partenaires se **poursuivent de plein droit** : contrats commerciaux, contrats de travail, règlement des taxes (TVA, IS), enregistrement comptable."]], ["t", [["Les 3 droits prépondérants", "Rôle"], ["**Comptable et fiscal**", "Valoriser le **prix d’achat / vente** : analyse financière pour connaître le juste prix"], ["**Commerce**", "Baux commerciaux (**3, 6, 9**), contrats de 12, 24, 36 mois, crédits-bails : ils perdurent dans la nouvelle entité (négociations)"], ["**Pénal**", "Si la société est acquise à un mauvais prix (prix surévalué, comptes maquillés) : **escroquerie, usage de faux, abus de biens sociaux**"]]]], "qs": [["qcm", "Qu’est-ce qu’une fusion ?", ["Plusieurs sociétés fusionnent pour créer une nouvelle entité (A + B → C)", "A est absorbée par B", "A est scindée"], "Tableau."], ["qcm", "Qu’est-ce qu’une fusion-absorption ?", ["A est absorbée par B, sans nouvelle entité", "A et B créent C", "A vend une partie"], "Tableau."], ["qcm", "Qu’est-ce qu’une scission ?", ["Une activité de A est scindée en plusieurs parties (nouvelles sociétés ou rachat)", "A et B fusionnent", "A rachète B"], "Tableau."], ["qcm", "Qu’est-ce qu’une cession partielle ?", ["A vend une partie de son activité et poursuit avec le reste", "A vend toute son activité", "A fusionne"], "Tableau."], ["qcm", "Qu’est-ce que la poursuite ?", ["On rachète l’ensemble des parts : A continue mais change d’actionnaire", "On rachète le fonds de commerce", "On crée une société"], "Tableau."], ["qcm", "Quelles opérations créent une nouvelle structure ?", ["Acquisition simple, fusion, scission", "Fusion-absorption, cession partielle", "Poursuite seulement"], "Cours."], ["qcm", "Que se passe-t-il pour les contrats en cas d’acquisition ?", ["Ils se poursuivent de plein droit", "Ils sont annulés", "Ils sont renégociés obligatoirement"], "Cours."], ["qcm", "Quels droits se poursuivent ?", ["Contrats commerciaux et de travail, taxes (TVA, IS), enregistrement comptable", "Seulement les contrats de travail", "Seulement la comptabilité"], "Cours."], ["qcm", "Quel est le rôle du droit comptable et fiscal dans une acquisition ?", ["Valoriser le prix d’achat / vente par une analyse financière", "Protéger la marque", "Rédiger les statuts"], "Tableau."], ["qcm", "Que désigne un bail « 3, 6, 9 » ?", ["Un bail commercial perdurant dans la nouvelle entité", "Un contrat de travail", "Un crédit-bail"], "Tableau."], ["qcm", "Quel droit s’applique si les comptes sont maquillés ?", ["Le droit pénal", "Le droit fiscal", "Le droit du travail"], "Tableau."], ["qcm", "Quelles infractions sont citées ?", ["Escroquerie, usage de faux, abus de biens sociaux", "Vol, recel, fraude", "Diffamation, harcèlement"], "Tableau."], ["vf", "Vrai ou faux ? En fusion-absorption, une nouvelle entité est créée.", ["Faux", "Vrai"], "Faux."], ["vf", "Vrai ou faux ? En acquisition, les contrats de travail existants continuent de plein droit.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Les anciens dirigeants peuvent être poursuivis si le prix a été surévalué par des comptes maquillés.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : fusion : A + B → ______.", ["C", "A", "B"], "Tableau."], ["cas", "Cas pratique : une société rachète toutes les parts d’une autre mais celle-ci garde son activité. De quoi s’agit-il ?", ["D’une poursuite (changement d’actionnaire)", "D’une fusion", "D’une scission"], "Tableau."], ["cas", "Cas pratique : une société vend sa branche « formation » et continue avec le reste. De quoi s’agit-il ?", ["D’une cession partielle", "D’une fusion", "D’une poursuite"], "Tableau."], ["cas", "Cas pratique : un acquéreur découvre que les comptes étaient truqués. Quel droit invoque-t-il ?", ["Le droit pénal", "Le droit de la consommation", "Le droit civil seulement"], "Tableau."], ["cas", "Cas pratique : en examen, « Pourquoi la continuité des droits est-elle importante en acquisition ? ». Réponse ?", ["Les engagements (contrats, travail, taxes, comptabilité) se poursuivent de plein droit", "Tous les contrats disparaissent", "Les salariés sont licenciés"], "Cours."]]}]}, {"n": 3, "title": "Genèse d’une association", "unites": [{"id": "3.1", "title": "Cadre juridique et conditions de création d’une association", "fiche": [["li", ["Le **droit des associations** est une branche du **droit privé**, régi par le **Code civil** et la **loi du 1er juillet 1901**. En l’absence d’information dans la loi, on se réfère au droit du travail, au droit fiscal, à la jurisprudence…", "Une association est **obligatoirement créée par 2 personnes minimum** (morale, physique, participation de l’État). Les personnes physiques doivent avoir **au moins 16 ans révolus**.", "**Alsace-Moselle** : il faut **7 personnes** pour créer une association.", "Organisation plutôt libre : la rédaction des statuts n’impose que **3 informations obligatoires** : le **titre**, l’**objet** et le **siège social**."]]], "qs": [["qcm", "Quelle loi régit les associations ?", ["La loi du 1er juillet 1901", "La loi de 1905", "La loi Hamon"], "Cours."], ["qcm", "De quel droit relève le droit des associations ?", ["Du droit privé", "Du droit public", "Du droit communautaire"], "Cours."], ["qcm", "Quel code régit aussi les associations ?", ["Le Code civil", "Le Code pénal", "Le Code du commerce"], "Cours."], ["qcm", "Combien de personnes minimum pour créer une association ?", ["2", "1", "3"], "Cours."], ["qcm", "Quel âge minimum pour une personne physique ?", ["16 ans révolus", "18 ans", "14 ans"], "Cours."], ["qcm", "Combien de personnes en Alsace-Moselle ?", ["7", "2", "3"], "Cours."], ["qcm", "Combien de mentions obligatoires dans les statuts ?", ["3", "5", "1"], "Cours."], ["qcm", "Quelles sont les trois mentions obligatoires ?", ["Titre, objet, siège social", "Titre, capital, siège", "Objet, capital, durée"], "Cours."], ["qcm", "Vers quoi se référer en l’absence d’information dans la loi de 1901 ?", ["Droit du travail, droit fiscal, jurisprudence, autres textes", "Le règlement intérieur", "La Constitution"], "Cours."], ["qcm", "Qui peut créer une association ?", ["Des personnes morales, physiques, ou avec participation de l’État", "Seulement des personnes physiques", "Seulement des entreprises"], "Cours."], ["vf", "Vrai ou faux ? Une association peut être créée par une seule personne.", ["Faux", "Vrai"], "Faux : 2 minimum."], ["vf", "Vrai ou faux ? En Alsace-Moselle, il faut 7 personnes.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Les statuts d’une association imposent un capital minimum.", ["Faux", "Vrai"], "Faux."], ["trou", "Complète : loi du 1er juillet ______.", ["1901", "1905", "1884"], "Cours."], ["trou", "Complète : titre, objet et ______ social.", ["siège", "capital", "nom"], "Cours."], ["cas", "Cas pratique : deux amis de 17 ans veulent créer une association. Est-ce possible ?", ["Oui : au moins 2 personnes de 16 ans révolus", "Non", "Seulement avec un adulte"], "Cours."], ["cas", "Cas pratique : trois personnes veulent créer une association en Alsace-Moselle. Est-ce suffisant ?", ["Non : il en faut 7", "Oui", "Seulement avec un notaire"], "Cours."], ["cas", "Cas pratique : en examen, « Citez les informations obligatoires dans les statuts d’une association ». Réponse ?", ["Le titre, l’objet et le siège social", "Le capital, le titre et la durée", "L’objet et le nom du président"], "Cours."], ["cas", "Cas pratique : une association hésite sur une règle absente de la loi de 1901. Où chercher ?", ["Dans le droit du travail, fiscal, la jurisprudence", "Dans les statuts d’une société", "Dans la presse"], "Cours."], ["qcm", "Pourquoi dit-on que l’organisation est « plutôt libre » ?", ["Peu de mentions obligatoires dans les statuts", "Pas de règles du tout", "Pas de contrôle"], "Cours."]]}, {"id": "3.2", "title": "Les phases de création : non déclarée, déclarée, déclarée « ++ »", "fiche": [["def", "**Association non déclarée (de fait)** : rédige des statuts (titre, objet, siège), au minimum 2 personnes, mais les membres décident de **ne pas réaliser les formalités**. **Conséquence** : subvention, embauche, compte bancaire, activité commerçante **impossibles** (existence **entre ses membres** seulement)."], ["t", [["#", "Étape (association déclarée)", "Détail"], ["1", "**Statuts et AG constitutive (AGC)**", "L’AGC est un PV de la réunion de l’ensemble des membres ; PV signé par tous"], ["2", "**Formalités administratives**", "Statuts, PV, **CERFA 13973*03** (déclaration) et **CERFA 13971*03** (dirigeants) ; envoi à la préfecture ou en ligne"], ["3", "**Dépôt à la préfecture**", "Avis (souvent favorable) ; peut revenir si non conforme à la loi de 1901"], ["4", "**Récépissé avec n° RNA**", "Répertoire national des associations"], ["5", "**Publication au JOAFE**", "Journal officiel des associations et fondations d’entreprise ; facturée (~50 €)"], ["6", "**Ouverture d’un compte bancaire**", "Seule possibilité nouvelle ; subvention, embauche, activité commerçante restent impossibles"]]], ["def", "**Association déclarée « ++ »** : après l’ouverture du compte, **enregistrement au greffe du tribunal de commerce** pour obtenir un **K bis** : permet l’**embauche**, certaines activités (régime fiscal), la **demande de subventions**."]], "qs": [["qcm", "Qu’est-ce qu’une association non déclarée ?", ["Une association de fait qui ne fait pas les formalités administratives", "Une association agréée", "Une association sans statuts"], "Cours."], ["qcm", "Que ne peut pas faire une association de fait ?", ["Obtenir une subvention, embaucher, ouvrir un compte, exercer une activité commerçante", "Se réunir", "Rédiger des statuts"], "Cours."], ["qcm", "Entre qui l’association non déclarée existe-t-elle ?", ["Entre ses membres seulement", "Vis-à-vis des tiers", "Vis-à-vis de l’État"], "Cours."], ["qcm", "Quelle est la première étape d’une association déclarée ?", ["Les statuts et l’assemblée générale constitutive", "Le dépôt à la préfecture", "L’ouverture du compte"], "Tableau."], ["qcm", "Qu’est-ce que l’AGC ?", ["Un PV de la réunion de l’ensemble des membres, signé par tous", "Un contrat de société", "Une déclaration fiscale"], "Tableau."], ["qcm", "Quel CERFA déclare l’association ?", ["13973*03", "13971*03", "1901*01"], "Tableau."], ["qcm", "Quel CERFA concerne les dirigeants ?", ["13971*03", "13973*03", "13969*01"], "Tableau."], ["qcm", "Où dépose-t-on le dossier ?", ["À la préfecture (ou en ligne)", "Au greffe", "À l’URSSAF"], "Tableau."], ["qcm", "Que reçoit-on de la préfecture ?", ["Un récépissé avec un n° RNA", "Un K bis", "Un SIREN"], "Tableau."], ["qcm", "Que signifie RNA ?", ["Répertoire national des associations", "Registre national des affaires", "Réseau national d’association"], "Tableau."], ["qcm", "Que signifie JOAFE ?", ["Journal officiel des associations et des fondations d’entreprise", "Journal officiel des activités financières", "Journal des organismes agréés"], "Tableau."], ["qcm", "Combien coûte environ la publication au JOAFE ?", ["~50 €", "~500 €", "Gratuite"], "Tableau."], ["qcm", "Que permet l’ouverture d’un compte bancaire ?", ["C’est la seule possibilité nouvelle de l’association déclarée", "L’embauche", "Les subventions"], "Tableau."], ["qcm", "Que doit-on faire pour être « ++ » ?", ["S’enregistrer au greffe pour obtenir un K bis", "Déposer en préfecture", "Publier au JOAFE"], "Cours."], ["qcm", "Que permet le K bis pour une association ?", ["Embaucher, exercer certaines activités, demander des subventions", "Ouvrir un compte", "Se déclarer"], "Cours."], ["vf", "Vrai ou faux ? Une association déclarée peut embaucher sans K bis.", ["Faux", "Vrai"], "Faux."], ["vf", "Vrai ou faux ? Le PV d’AG constitutive est signé par tous.", ["Vrai", "Faux"], "Vrai."], ["cas", "Cas pratique : une association déclarée veut recruter son premier salarié. Que doit-elle obtenir ?", ["Un K bis (association « ++ »)", "Un SIREN seulement", "Un récépissé"], "Cours."], ["cas", "Cas pratique : une association de fait demande une subvention. Que se passe-t-il ?", ["Impossible : elle n’a pas d’existence légale", "Elle l’obtient", "Elle l’obtient avec un SIRET"], "Cours."], ["cas", "Cas pratique : en examen, « Placez dans l’ordre : récépissé RNA, AGC, publication JOAFE, dépôt préfecture ». Réponse ?", ["AGC, dépôt préfecture, récépissé RNA, publication JOAFE", "Dépôt, AGC, JOAFE, RNA", "RNA, AGC, dépôt, JOAFE"], "Tableau."]]}, {"id": "3.3", "title": "Les 4 types d’associations", "fiche": [["t", [["Type", "Caractéristiques"], ["**Association de fait**", "Non déclarée ; pouvoir uniquement entre les membres signataires ; **aucune existence légale** : ne peut être engagée, ni poursuivie ni poursuivre en justice"], ["**Association loi 1901**", "**Déclarée** : peut ouvrir un compte bancaire, demander des subventions, embaucher, avoir des activités donnant lieu à facturation"], ["**Association agréée**", "Dès la création ou après avoir créé une association loi 1901 ; activité **réglementée** : **agrément ministériel** (jeunesse, sport, environnement, chasse, s", "Non", "Seulement à 50"], "Cours."], ["cas", "Cas pratique : une association exerce une activité commerciale et loue un local. Que doit-elle respecter ?", ["Le Code du commerce : bail commercial, CGA, CGV", "Rien", "Seulement la loi de 1901"], "Cours."], ["cas", "Cas pratique : une association souhaite protéger son nom. Quel droit ?", ["La propriété intellectuelle", "Le droit comptable", "Le droit des assurances"], "Cours."], ["cas", "Cas pratique : en examen, « Que retenir de la partie 3 ? ». Réponse ?", ["2 personnes mini, 3 mentions, 4 types, fiscalité, dirigeants, fusion", "Les seuils d’effectifs", "Les calendriers fiscaux"], "À retenir."], ["qcm", "Pourquoi un règlement intérieur dès la création en association ?", ["Pour organiser l’opérationnel même avec peu de salariés", "Parce que la loi l’impose", "Parce que la préfecture l’exige"], "Cours."]]}, {"id": "3.9", "title": "L’« acquisition » d’une association : la fusion", "fiche": [["def", "Une personne, une société ou une association **ne peut pas acheter une association** : il n’y a **pas de valeur à partager** (but non lucratif, les **boni** ne peuvent être partagés entre membres). **L’acquisition n’existe pas** → on parle de **fusion** d’association."], ["t", [["Type", "Principe"], ["**Fusion**", "Deux associations en fondent **une seule** : perte de la dénomination et de l’objet social de A et B"], ["**Fusion-absorption**", "Plus fréquente : B récupère l’ensemble des activités de A, ses usagers, ses contrats de travail"], ["**Scission**", "Une association A qui possède plusieurs activités ou établissements se sépare en plusieurs plus petites (B, C, D)"], ["**Transfert partiel**", "**À titre gratuit**, transfert d’une partie de l’activité vers une autre association existante (≠ cession partielle du droit privé)"]]], ["li", ["Quelle que soit la fusion, **continuité de plein droit** de l’ensemble des droits : droit commercial (bail 3-6-9 : dénoncer **6 mois avant** l’anniversaire triennal), droit du travail, droit fiscal, droit comptable, propriétés transférées.", "Les **membres** d’une association peuvent être : personne physique, personne morale, association, parfois des participations publiques."]], ["warn", "**À retenir — Partie 3** : 2 personnes mini (16 ans ; 7 en Alsace-Moselle) ; 3 mentions : titre, objet, siège ; non déclarée → rien ; déclarée → compte ; « ++ » (SIRET + K bis) → embauche, activité, subventions ; 4 types ; fiscalité ; dirigeants ; fusion."]], "qs": [["qcm", "Peut-on acheter une association ?", ["Non : il n’y a pas de valeur à partager", "Oui", "Seulement une association agréée"], "Cours."], ["qcm", "Pourquoi n’y a-t-il pas de valeur à partager ?", ["But non lucratif : les boni ne sont pas partagés entre membres", "Les associations sont gratuites", "Elles n’ont pas de biens"], "Cours."], ["qcm", "Quel terme remplace l’acquisition pour une association ?", ["La fusion", "La cession", "La reprise"], "Cours."], ["qcm", "Qu’est-ce qu’une fusion d’associations ?", ["Deux associations en fondent une seule : perte de leur dénomination et objet", "Une association en absorbe une autre", "Une association se scinde"], "Tableau."], ["qcm", "Qu’est-ce qu’une fusion-absorption ?", ["B récupère l’ensemble des activités, usagers et contrats de A", "A et B créent C", "A est vendue"], "Tableau."], ["qcm", "Quelle fusion est la plus fréquente ?", ["La fusion-absorption", "La fusion", "La scission"], "Tableau."], ["qcm", "Qu’est-ce qu’une scission ?", ["Une association se sépare en plusieurs plus petites", "Deux associations fusionnent", "Une association est absorbée"], "Tableau."], ["qcm", "Qu’est-ce qu’un transfert partiel ?", ["Le transfert, à titre gratuit, d’une partie de l’activité vers une autre association", "Une vente partielle", "Une scission"], "Tableau."], ["qcm", "En quoi le transfert partiel diffère-t-il de la cession partielle ?", ["Il est à titre gratuit", "Il est payant", "Il est fiscal"], "Tableau."], ["qcm", "Que se passe-t-il pour les droits lors d’une fusion ?", ["Continuité de plein droit", "Rupture de tous les contrats", "Annulation des droits"], "Cours."], ["qcm", "Quelle règle pour un bail 3-6-9 ?", ["Dénoncer 6 mois avant l’anniversaire triennal", "Dénoncer 1 mois avant", "Dénoncer 1 an avant"], "Explication."], ["qcm", "Qui peut être membre d’une association ?", ["Personne physique, morale, association, parfois participations publiques", "Seulement des personnes physiques", "Seulement des entreprises"], "Cours."], ["vf", "Vrai ou faux ? Une association peut être vendue à un tiers.", ["Faux", "Vrai"], "Faux."], ["vf", "Vrai ou faux ? Lors d’une fusion-absorption, les contrats de travail de A sont repris par B.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : on ne parle pas d’acquisition mais de ______.", ["fusion", "reprise", "vente"], "Cours."], ["cas", "Cas pratique : deux associations d’aide à domicile n’en forment plus qu’une seule, sous un nouveau nom. De quoi s’agit-il ?", ["D’une fusion", "D’une scission", "D’un transfert partiel"], "Tableau."], ["cas", "Cas pratique : une grande association se divise en trois associations locales. De quoi s’agit-il ?", ["D’une scission", "D’une fusion", "D’une absorption"], "Tableau."], ["cas", "Cas pratique : une association transfère gratuitement son activité de loisirs à une autre. De quoi s’agit-il ?", ["D’un transfert partiel", "D’une cession partielle", "D’une fusion"], "Tableau."], ["cas", "Cas pratique : en examen, « Pourquoi ne peut-on pas acheter une association ? ». Réponse ?", ["Parce qu’elle n’a pas de valeur à partager entre membres (but non lucratif)", "Parce que c’est interdit par le Code pénal", "Parce qu’elle est publique"], "Cours."], ["qcm", "Que signifie « boni » ?", ["Les excédents (bénéfices) de liquidation", "Les dettes", "Les cotisations"], "Cours."]]}]}, {"n": 4, "title": "La croissance", "unites": [{"id": "4.1", "title": "La croissance : définition et vigilance", "fiche": [["def", "Après la création / acquisition, on peut enchaîner plusieurs phases de **croissance**, de **consolidation**, ou plusieurs cycles **croissance – consolidation – décroissance**."], ["def", "**Croissance d’une structure** : **développement quantitatif durable** de celle-ci → à un moment ou un autre, **changement de taille** (financier, RH, poids sur le marché) → **obligations évolutives** au regard des différents droits → **vigilance particulière** du gestionnaire."], ["warn", "La croissance est aussi une phase d’**euphorie** : on se développe fortement et on peut **manquer de vigilance**. On peut se mettre « hors la loi » (non au sens correctionnel, mais **pas à jour de ses obligations** au regard des différents droits)."]], "qs": [["qcm", "Que peut-on enchaîner après la création ?", ["Plusieurs phases de croissance, de consolidation ou des cycles croissance-consolidation-décroissance", "Seulement une croissance", "Seulement une liquidation"], "Cours."], ["qcm", "Comment définit-on la croissance d’une structure ?", ["Un développement quantitatif durable", "Un bénéfice ponctuel", "Un changement de nom"], "Définition."], ["qcm", "Que provoque la croissance à un moment ou à un autre ?", ["Un changement de taille (financier, RH, poids sur le marché)", "Une fusion", "Une dissolution"], "Définition."], ["qcm", "Qu’entraîne le changement de taille ?", ["Des obligations évolutives au regard des droits", "Aucune obligation", "Une exonération d’impôt"], "Définition."], ["qcm", "Que doit avoir le gestionnaire pendant la croissance ?", ["Une vigilance particulière", "Une fusion", "Un prêt"], "Définition."], ["qcm", "Pourquoi la croissance est-elle dite phase d’euphorie ?", ["Tout semble bien aller et on peut manquer de vigilance", "Elle est très courte", "Elle est interdite"], "Explication."], ["qcm", "Que signifie « hors la loi » dans ce contexte ?", ["Pas à jour de ses obligations (pas au sens pénal)", "Condamné", "Dissous"], "Explication."], ["vf", "Vrai ou faux ? La croissance peut rendre une structure non conforme sans qu’elle s’en rende compte.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? La croissance ne modifie jamais les obligations juridiques.", ["Faux", "Vrai"], "Faux."], ["vf", "Vrai ou faux ? La croissance est un développement quantitatif durable.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : développement ______ durable.", ["quantitatif", "qualitatif", "ponctuel"], "Définition."], ["trou", "Complète : phase d’______ : on peut manquer de vigilance.", ["euphorie", "étude", "crise"], "Explication."], ["cas", "Cas pratique : une association passe de 8 à 25 salariés. Que doit faire le gestionnaire ?", ["Vérifier les nouveaux seuils et obligations (vigilance)", "Rien", "Dissoudre l’association"], "Cours."], ["cas", "Cas pratique : une société augmente son chiffre d’affaires et ne change rien à sa déclaration. Quel risque ?", ["Ne plus être à jour de ses obligations", "Aucun", "Être exonérée"], "Cours."], ["cas", "Cas pratique : en examen, « Pourquoi la croissance appelle-t-elle une vigilance ? ». Réponse ?", ["Le changement de taille entraîne de nouvelles obligations juridiques", "Elle réduit les droits", "Elle supprime les impôts"], "Définition."], ["cas", "Cas pratique : en examen, « Que signifie un changement de taille ? ». Réponse ?", ["Un changement financier, RH ou de poids sur le marché", "Un changement de siège", "Un changement de dirigeant"], "Définition."], ["qcm", "Quels types de changement de taille sont cités ?", ["Financier, RH, poids sur le marché", "Juridique, fiscal, pénal", "Local, national, européen"], "Définition."], ["qcm", "Pourquoi parle-t-on de cycles ?", ["Une structure peut alterner croissance, consolidation et décroissance", "La croissance est cyclique par nature", "Les phases sont fixes"], "Cours."], ["vf", "Vrai ou faux ? Une structure peut avoir plusieurs phases de croissance successives.", ["Vrai", "Faux"], "Vrai."], ["qcm", "Que doit surveiller le gestionnaire lors de la croissance ?", ["Les franchissements de seuils", "Les prix des concurrents", "Le nombre de clients seulement"], "Cours."]]}, {"id": "4.2", "title": "Les types de croissance : intensive, extensive, diversification", "fiche": [["t", [["Type", "Principe", "Exemple"], ["**Croissance intensive**", "Marché délimité, part initiale (ex. 20 %). On cherche des **parts de marché supplémentaires au sein du même marché** : en multipliant les produits ou en développant des innovations au sein du besoin", "—"], ["**Croissance extensive**", "**Même part originelle** ; on développe ou ajuste les produits, ou on cherche un **marché supplémentaire** (nouveau marché pour nous)", "Société avec 20 % du marché départemental : mêmes produits sur un autre département ou sur la région"], ["**Croissance en diversification**", "Marché initial, mais on va chercher un **marché différent avec des produits différents** : on sort de la zone de confort", "Produits ne correspondant pas à ceux réalisés habituellement"]]], ["warn", "La notion de **marché** peut s’entendre en termes de produits, services, **localisation**, territoire."]], "qs": [["qcm", "Combien de types de croissance ?", ["3", "2", "4"], "Tableau."], ["qcm", "Quels sont les trois types ?", ["Intensive, extensive, diversification", "Interne, externe, mixte", "Rapide, lente, régulière"], "Tableau."], ["qcm", "Que cherche la croissance intensive ?", ["Des parts de marché supplémentaires au sein du même marché", "Un nouveau marché", "Des produits différents"], "Tableau."], ["qcm", "Que cherche la croissance extensive ?", ["Un marché supplémentaire avec les mêmes produits ou ajustés", "Plus de parts sur le même marché", "Des produits sans lien"], "Tableau."], ["qcm", "Que cherche la croissance en diversification ?", ["Un marché différent avec des produits différents", "Plus de parts de marché", "Un nouveau territoire seulement"], "Tableau."], ["qcm", "Comment gagner des parts de marché en croissance intensive ?", ["En multipliant les produits ou en innovant dans le besoin du marché", "En changeant de territoire", "En changeant de métier"], "Tableau."], ["qcm", "Exemple de croissance extensive ?", ["Mêmes produits sur un autre département ou sur la région", "Lancer un produit nouveau sur le même marché", "Changer d’activité complètement"], "Exemple."], ["qcm", "Que signifie « sortir de la zone de confort » ?", ["Aller vers un marché et des produits différents", "Réduire l’activité", "Fermer un établissement"], "Tableau."], ["qcm", "Comment peut-on entendre la notion de marché ?", ["En produits, services, localisation, territoire", "Seulement en produits", "Seulement en prix"], "Tableau."], ["vf", "Vrai ou faux ? La croissance intensive se fait au sein du même marché.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? La diversification conserve les mêmes produits sur le même marché.", ["Faux", "Vrai"], "Faux."], ["vf", "Vrai ou faux ? L’extensive peut consister à vendre ailleurs les mêmes produits.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : croissance ______ : même marché, plus de parts.", ["intensive", "extensive", "externe"], "Tableau."], ["trou", "Complète : croissance ______ : nouveau marché, mêmes produits.", ["extensive", "intensive", "interne"], "Tableau."], ["cas", "Cas pratique : une boulangerie lance trois nouvelles recettes pour gagner des clients dans sa ville. Quel type ?", ["Intensive", "Extensive", "Diversification"], "Tableau."], ["cas", "Cas pratique : une association d’aide à domicile ouvre le même service dans une commune voisine. Quel type ?", ["Extensive", "Intensive", "Diversification"], "Tableau."], ["cas", "Cas pratique : une société de transport lance une activité de restauration. Quel type ?", ["Diversification", "Intensive", "Extensive"], "Tableau."], ["cas", "Cas pratique : en examen, « Distinguez intensive, extensive, diversification ». Réponse ?", ["Même marché / nouveau marché / nouveau marché et nouveaux produits", "Interne / externe / mixte", "Rapide / lente / régulière"], "Tableau."], ["qcm", "Pourquoi s’intéresser au type de croissance ?", ["Il détermine les droits impactés et les obligations à anticiper", "Il fixe le tarif", "Il fixe le capital"], "Cours."], ["qcm", "Quelle part de marché prend-on en exemple ?", ["20 %", "2 %", "80 %"], "Tableau."]]}, {"id": "4.3", "title": "Les stratégies de croissance : interne et externe", "fiche": [["t", [["Croissance interne", "Croissance externe"], ["**Investissements**", "**Acquisitions, fusions** (absorption, scission, cession partielle)"], ["**Développements (R&D)**", "**Franchisage**"], ["**Communication**", "**Prise de participation**"]]], ["eg", "**Investissement** : changer l’appareil de production (immobilisations) pour produire plus à coût plus avantageux. **Développement** : innover pour séduire plus. **Communication** : site avec **click and collect** qui élargit un marché très local."], ["li", ["**Franchisage** : on détient la marque, on apporte procédure, process, publicité, communication, image de marque ; d’autres investisseurs, sous votre nom commercial, déploient et développent différents produits.", "**Prise de participation** : pas d’acquisition à 100 % ; on détient un **pourcentage des actions**, ce qui donne un **impact sur les décisions stratégiques**."]]], "qs": [["qcm", "Quelles sont les deux grandes stratégies de croissance ?", ["Interne et externe", "Intensive et extensive", "Locale et nationale"], "Tableau."], ["qcm", "Que comprend la croissance interne ?", ["Investissements, développements (R&D), communication", "Acquisitions, franchisage, participations", "Fusions seulement"], "Tableau."], ["qcm", "Que comprend la croissance externe ?", ["Acquisitions, fusions, franchisage, prise de participation", "Investissements, R&D", "Communication seulement"], "Tableau."], ["qcm", "Exemple d’investissement ?", ["Changer l’appareil de production pour produire plus à moindre coût", "Lancer une publicité", "Fusionner"], "Exemple."], ["qcm", "Exemple de développement ?", ["Innover pour séduire plus et gagner des parts de marché", "Racheter un concurrent", "Ouvrir une franchise"], "Exemple."], ["qcm", "Exemple de communication ?", ["Un site internet avec click and collect", "Une fusion", "Un investissement"], "Exemple."], ["qcm", "Qu’est-ce que le franchisage ?", ["Détenir la marque et apporter procédure, publicité, image ; d’autres investisseurs la déploient", "Acheter 100 % d’une société", "Prêter des salariés"], "Cours."], ["qcm", "Que fait le franchiseur ?", ["Apporte marque, process, publicité, image de marque", "Apporte le capital", "Apporte les salariés"], "Cours."], ["qcm", "Qu’est-ce qu’une prise de participation ?", ["Détenir un pourcentage des actions sans acquérir 100 %", "Racheter toute la société", "Fusionner"], "Cours."], ["qcm", "Quel effet a une prise de participation ?", ["Un impact sur les décisions stratégiques", "Aucun", "Un contrôle total"], "Cours."], ["vf", "Vrai ou faux ? Le franchisage est une stratégie de croissance externe.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? La R&D relève de la croissance externe.", ["Faux", "Vrai"], "Faux : interne."], ["vf", "Vrai ou faux ? Une prise de participation implique d’acquérir 100 % du capital.", ["Faux", "Vrai"], "Faux."], ["trou", "Complète : franchisage : on détient la ______.", ["marque", "société", "clientèle"], "Cours."], ["trou", "Complète : click and ______.", ["collect", "check", "click"], "Exemple."], ["cas", "Cas pratique : une société rachète 30 % des actions d’une autre. De quoi s’agit-il ?", ["D’une prise de participation (externe)", "D’une fusion", "D’un franchisage"], "Cours."], ["cas", "Cas pratique : une enseigne laisse des investisseurs ouvrir des magasins sous son nom. De quoi s’agit-il ?", ["D’un franchisage", "D’une prise de participation", "D’une scission"], "Cours."], ["cas", "Cas pratique : une entreprise investit dans une nouvelle machine. Quelle stratégie ?", ["Croissance interne (investissement)", "Croissance externe", "Diversification"], "Exemple."], ["cas", "Cas pratique : en examen, « Citez deux stratégies internes et deux externes ». Réponse ?", ["Interne : investissement, R&D ; externe : acquisition, franchisage", "Interne : fusion, franchisage ; externe : R&D, communication", "Interne : scission ; externe : investissement"], "Tableau."], ["qcm", "Que signifie « immobilisations » dans l’exemple ?", ["Des équipements durables achetés par l’entreprise", "Des loyers", "Des stocks"], "Exemple."]]}, {"id": "4.4", "title": "Croissance et droit du travail : les seuils d’effectifs", "fiche": [["def", "Plus on a d’activité, plus on a besoin de collaborateurs (CDI / CDD). Selon le nombre de salariés, on atteint des **seuils** qui génèrent des **obligations** ou des **contraintes** supplémentaires."], ["t", [["Seuil", "Dispositifs (obligations)", "Cotisations / taux"], ["**1 à 10**", "**DUERP** ; **DPAE** (même pour un CDD de quelques jours, auprès de l’URSSAF) ; **DETH** mensuelle (travailleurs handicapés, via la DSN)", "**FNAL 0,10 %** ; **PCPF 0,55 %**"], ["**11 à 19**", "+ **CSE** (remplace délégués du personnel et comité d’entreprise)", "FNAL 0,10 % ; **PCPF 1,00 %** ; prévoyance complémentaire ; **versement mobilité**"], ["**20 à 49**", "+ **déclaration annuelle** de l’emploi des personnes handicapées", "Identiques"], ["**50 à 199**", "+ **règlement intérieur** obligatoire ; **salle de restauration** ; **PEEC**", "**FNAL 0,50 %** ; PCPF 1 %"], ["**200 et +**", "+ **local syndical** pour l’ensemble des syndicats", "Mêmes cotisations que 50-199"]]], ["warn", "Le tableau du cours indique « PEEC 1,00 % » ; le focus PEEC donne **0,45 %** de la masse salariale (ou **2 %** à défaut). Les taux sont calculés sur les salaires **bruts imposables**."]], "qs": [["qcm", "Que génèrent les seuils d’effectifs ?", ["Des obligations ou contraintes supplémentaires", "Des exonérations", "Des fusions"], "Cours."], ["qcm", "Quelles obligations de 1 à 10 salariés ?", ["DUERP, DPAE, DETH", "CSE", "Règlement intérieur"], "Tableau."], ["qcm", "Que signifie DPAE ?", ["Déclaration préalable à l’embauche", "Dossier de protection des agents d’entreprise", "Dispositif de prévention des accidents"], "Tableau."], ["qcm", "Auprès de qui fait-on la DPAE ?", ["De l’URSSAF", "De la préfecture", "Du greffe"], "Tableau."], ["qcm", "Que signifie DETH ?", ["Déclaration des emplois des travailleurs handicapés", "Droit de l’emploi et du temps de travail", "Déclaration des effectifs et des heures"], "Tableau."], ["qcm", "Quel taux de FNAL pour moins de 50 salariés ?", ["0,10 %", "0,50 %", "1 %"], "Tableau."], ["qcm", "Quel taux de PCPF pour 1 à 10 salariés ?", ["0,55 %", "1,00 %", "0,10 %"], "Tableau."], ["qcm", "Quel taux de PCPF à partir de 11 salariés ?", ["1,00 %", "0,55 %", "0,10 %"], "Tableau."], ["qcm", "Que s’ajoute à 11 salariés ?", ["Le CSE", "Le règlement intérieur", "Le local syndical"], "Tableau."], ["qcm", "Que remplace le CSE ?", ["Délégués du personnel et comité d’entreprise", "Le conseil d’administration", "L’AG"], "Tableau."], ["qcm", "Que s’ajoute à 20 salariés ?", ["La déclaration annuelle de l’emploi des personnes handicapées", "Le CSE", "Le règlement intérieur"], "Tableau."], ["qcm", "Que s’ajoute à 50 salariés ?", ["Règlement intérieur, salle de restauration, PEEC", "Local syndical", "DUERP"], "Tableau."], ["qcm", "Quel taux de FNAL à partir de 50 salariés ?", ["0,50 %", "0,10 %", "1 %"], "Tableau."], ["qcm", "Que s’ajoute à 200 salariés ?", ["Un local syndical", "Un CSE", "Un règlement intérieur"], "Tableau."], ["qcm", "Sur quelle base calcule-t-on les taux de cotisation ?", ["Sur les salaires bruts imposables", "Sur le chiffre d’affaires", "Sur le bénéfice"], "Note."], ["vf", "Vrai ou faux ? Le règlement intérieur est obligatoire à partir de 50 salariés.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? En association, le règlement intérieur est souvent fait dès le 1er salarié.", ["Vrai", "Faux"], "Vrai."], ["cas", "Cas pratique : une association passe de 10 à 12 salariés. Quelle obligation s’ajoute ?", ["Le CSE (seuil de 11) èlement obligatoire ?", ["Oui", "Non", "Seulement si CSE"], "Cours."], ["cas", "Cas pratique : une entreprise de 120 salariés a-t-elle un référent handicap obligatoire ?", ["Non : facultatif avant 250", "Oui", "Seulement en association"], "Cours."], ["cas", "Cas pratique : une entreprise franchit 50 salariés. Quel effet pour l’effort de construction la 1re année ?", ["Rien à payer pendant 3 ans", "100 % de la cotisation", "25 %"], "Explication."], ["cas", "Cas pratique : en examen, « Citez deux seuils des 250 salariés ». Réponse ?", ["Référent harcèlement et référent handicap", "CSE et règlement intérieur", "DUERP et DPAE"], "Cours."]]}, {"id": "4.6", "title": "Focus : le DUERP", "fiche": [["def", "**DUERP** = document unique d’évaluation des risques professionnels. **Obligatoire dès le 1er salarié**. **Articles L4121-2 et L4121-3 du Code du travail**."], ["li", ["Il oblige à **lister et hiérarchiser** les risques existants ou pouvant nuire à la sécurité ; **préconiser des actions** pour réduire voire supprimer ces risques ; **réactualisation au moins 1 fois par an**.", "**Réalisé par le dirigeant** ou délégué à un collaborateur. Tout manquement de présentation (instances du travail, salariés, syndicats, administrations) → **contravention**."]], ["eg", "Risques liés à l’**électricité** ; **travaux en hauteur** ; **utilisation prolongée d’ordinateurs et d’écrans** (risques plus administratifs)."]], "qs": [["qcm", "Que signifie DUERP ?", ["Document unique d’évaluation des risques professionnels", "Dossier unique d’emploi et de rémunération", "Déclaration unique des employeurs"], "Cours."], ["qcm", "À partir de quand le DUERP est-il obligatoire ?", ["Dès le 1er salarié", "Dès 11 salariés", "Dès 50 salariés"], "Cours."], ["qcm", "Quels articles du Code du travail le prévoient ?", ["L4121-2 et L4121-3", "L3322-2", "L1221-9"], "Cours."], ["qcm", "Que doit-on faire des risques ?", ["Les lister et les hiérarchiser", "Les ignorer", "Les assurer"], "Cours."], ["qcm", "Que doit préconiser le DUERP ?", ["Des actions pour réduire voire supprimer les risques", "Des sanctions", "Des primes"], "Cours."], ["qcm", "À quelle fréquence réactualiser le DUERP ?", ["Au moins 1 fois par an", "Tous les 5 ans", "Jamais"], "Cours."], ["qcm", "Qui réalise le DUERP ?", ["Le dirigeant ou un collaborateur délégué", "Le préfet", "Les salariés seuls"], "Cours."], ["qcm", "Que risque-t-on en cas de manquement de présentation ?", ["Une contravention", "Une dissolution", "Un licenciement"], "Cours."], ["qcm", "Exemple de risque cité ?", ["Électricité, travaux en hauteur, écrans prolongés", "Concurrence", "Inflation"], "Exemple."], ["qcm", "Quel risque est « plus administratif » ?", ["L’utilisation prolongée d’ordinateurs et d’écrans", "Les travaux en hauteur", "L’électricité"], "Exemple."], ["vf", "Vrai ou faux ? Le DUERP n’est obligatoire qu’à partir de 11 salariés.", ["Faux", "Vrai"], "Faux : dès le 1er."], ["vf", "Vrai ou faux ? Le DUERP doit être mis à jour au moins une fois par an.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Le dirigeant peut déléguer la réalisation du DUERP.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : réactualisation au moins ___ fois par an.", ["1", "2", "5"], "Cours."], ["trou", "Complète : DUERP dès le ______ salarié.", ["1er", "11e", "50e"], "Cours."], ["cas", "Cas pratique : une association embauche sa première salariée de bureau. Que doit-elle établir ?", ["Un DUERP", "Un CSE", "Un règlement intérieur"], "Cours."], ["cas", "Cas pratique : un DUERP date de trois ans sans mise à jour. Que dire ?", ["Il doit être réactualisé au moins une fois par an", "Il est conforme", "Il est valable 5 ans"], "Cours."], ["cas", "Cas pratique : un dirigeant n’a pas présenté son DUERP aux instances. Que risque-t-il ?", ["Une contravention", "Une exonération", "Une dissolution"], "Cours."], ["cas", "Cas pratique : en examen, « Que contient un DUERP ? ». Réponse ?", ["La liste hiérarchisée des risques et les actions pour les réduire", "La liste des salariés", "Le bilan comptable"], "Cours."], ["qcm", "Quel est l’objectif du DUERP ?", ["Prévenir les risques pour la sécurité des salariés", "Contrôler les salariés", "Réduire les impôts"], "Cours."]]}, {"id": "4.7", "title": "Focus : la participation des salariés", "fiche": [["li", ["**Participation aux résultats** : **obligatoire à partir de 50 salariés** (art. **L3322-2**) ; **volontaire** en dessous de 50 salariés via un **accord de participation** (art. **L3323-6**).", "Formule (**à ne pas retenir**) : ½ × (bénéfice distribuable − 5 % des capitaux propres) × (masse salariale / valeur ajoutée).", "Une **négociation collective** définit la distribution : selon le **temps de présence**, le **salaire** ou **uniforme**.", "Somme **bloquée 5 ans** (plan d’épargne entreprise, PERCO, intéressement, actions si cotée). **Déblocage dans les 3 ans** → exemption à hauteur de **50 %** seulement ; **à 5 ans** → ni charges sociales ni impôt sur le revenu."]], ["warn", "**Vrai outil de fidélisation**, surtout quand on a **moins de 50 salariés**."]], "qs": [["qcm", "À partir de quel effectif la participation est-elle obligatoire ?", ["50 salariés", "11 salariés", "250 salariés"], "Cours."], ["qcm", "Quel article la rend obligatoire ?", ["L3322-2", "L3323-6", "L4121-3"], "Cours."], ["qcm", "Comment la mettre en place en dessous de 50 salariés ?", ["Via un accord de participation (volontaire)", "Par la loi", "Par arrêté"], "Cours."], ["qcm", "Quel article prévoit l’accord volontaire ?", ["L3323-6", "L3322-2", "L4121-2"], "Cours."], ["qcm", "Faut-il retenir la formule de calcul ?", ["Non, elle est donnée à titre indicatif", "Oui", "Seulement le facteur ½"], "Cours."], ["qcm", "Comment définit-on la distribution ?", ["Par une négociation collective", "Par le dirigeant seul", "Par la préfecture"], "Cours."], ["qcm", "Quels critères de répartition sont possibles ?", ["Temps de présence, salaire ou uniforme", "Âge", "Ancienneté seulement"], "Cours."], ["qcm", "Pendant combien de temps la somme est-elle bloquée ?", ["5 ans", "1 an", "10 ans"], "Cours."], ["qcm", "Où place-t-on les sommes bloquées ?", ["Plan d’épargne entreprise, PERCO, intéressement, actions si cotée", "Compte courant", "Livret A"], "Cours."], ["qcm", "Que se passe-t-il en cas de déblocage dans les 3 ans ?", ["Exemption à hauteur de 50 % seulement", "Exemption totale", "Aucune exemption"], "Cours."], ["qcm", "Que se passe-t-il à 5 ans ?", ["Ni charges sociales ni impôt sur le revenu", "Impôt à 50 %", "Charges totales"], "Cours."], ["qcm", "Pour quelle structure la participation est-elle un vrai outil de fidélisation ?", ["Les structures de moins de 50 salariés", "Les grandes entreprises", "Les associations"], "Cours."], ["vf", "Vrai ou faux ? Une entreprise de 30 salariés peut mettre en place la participation.", ["Vrai", "Faux"], "Vrai : volontaire."], ["vf", "Vrai ou faux ? Les associations ont une participation des salariés obligatoire.", ["Faux", "Vrai"], "Faux : structure associative."], ["trou", "Complète : participation obligatoire à partir de ___ salariés.", ["50", "11", "250"], "Cours."], ["trou", "Complète : somme bloquée ___ ans.", ["5", "3", "10"], "Cours."], ["cas", "Cas pratique : une société de 60 salariés ne verse aucune participation. Que dire ?", ["Elle manque à une obligation (≥ 50)", "Elle est conforme", "C’est facultatif"], "Cours."], ["cas", "Cas pratique : un salarié débloque sa participation à 2 ans. Quel avantage conserve-t-il ?", ["Une exemption à 50 %", "Une exemption totale", "Aucun"], "Cours."], ["cas", "Cas pratique : en examen, « Pourquoi la participation fidélise-t-elle ? ». Réponse ?", ["Elle associe les salariés aux résultats et bloque les sommes 5 ans avec avantages", "Elle augmente les salaires", "Elle réduit les impôts de la société"], "Cours."], ["qcm", "Que désigne le « bénéfice distribuable » ?", ["Le résultat avant IS, après retrait de certaines plus-values et moins-values", "Le chiffre d’affaires", "Le capital"], "Cours."]]}, {"id": "4.8", "title": "Croissance et droit fiscal : régimes micro, réel simplifié, réel normal", "fiche": [["def", "Comme en droit du travail, la croissance répond au **franchissement de seuils**. En droit du travail les seuils sont axés sur les **ETP** ; en droit fiscal ils dépendent du **chiffre d’affaires**, des ETP ou de la **taxe elle-même**. Le cours rappelle **4 types de paliers** : chiffre d’affaires, valeur de bilan, résultat, ETP."], ["t", [["Activité", "Régime micro", "Réel simplifié", "Réel normal"], ["**Biens (vente)**", "CA < 170 000 € HT", "170 000 à 818 000 €", "> 818 000 €"], ["**Services**", "CA < 70 000 € HT", "70 000 à 247 000 €", "> 247 000 €"]]], ["warn", "Différence : information plus détaillée en réel simplifié, **encore plus** en réel normal. Les **modalités de déclaration (calendrier)** restent les mêmes quel que soit le régime. Chiffres du cours : **à vérifier chaque année**."]], "qs": [["qcm", "Sur quoi les seuils fiscaux se fondent-ils ?", ["Le chiffre d’affaires, les ETP ou la taxe elle-même", "Seulement les ETP", "Seulement le bilan"], "Cours."], ["qcm", "Combien de types de paliers le cours rappelle-t-il ?", ["4", "2", "6"], "Cours."], ["qcm", "Quels sont ces paliers ?", ["Chiffre d’affaires, valeur de bilan, résultat, ETP", "Capital, siège, objet, durée", "TVA, IS, CFE, CVAE"], "Cours."], ["qcm", "Quel est le seuil du régime micro pour les ventes (selon le cours) ?", ["CA < 170 000 € HT", "CA < 70 000 € HT", "CA < 818 000 €"], "Tableau."], ["qcm", "Quel est le seuil du régime micro pour les services (selon le cours) ?", ["CA < 70 000 € HT", "CA < 170 000 € HT", "CA < 247 000 €"], "Tableau."], ["qcm", "Quel est l’intervalle du réel simplifié pour les biens ?", ["170 000 à 818 000 €", "70 000 à 247 000 €", "818 000 € et plus"], "Tableau."], ["qcm", "Quel est l’intervalle du réel simplifié pour les services ?", ["70 000 à 247 000 €", "170 000 à 818 000 €", "247 000 € et plus"], "Tableau."], ["qcm", "À partir de quel CA le réel normal pour les biens ?", ["Plus de 818 000 €", "Plus de 170 000 €", "Plus de 247 000 €"], "Tableau."], ["qcm", "À partir de quel CA le réel normal pour les services ?", ["Plus de 247 000 €", "Plus de 70 000 €", "Plus de 818 000 €"], "Tableau."], ["qcm", "En quoi diffèrent micro, réel simplifié et réel normal ?", ["Le niveau de détail de l’information déclarée", "Le calendrier", "L’impôt"], "Cours."], ["qcm", "Le calendrier de déclaration change-t-il selon le régime ?", ["Non, les modalités restent les mêmes", "Oui", "Seulement pour le réel normal"], "Cours."], ["vf", "Vrai ou faux ? Le réel normal demande des informations plus détaillées que le réel simplifié.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Les seuils fiscaux sont identiques pour les biens et les services.", ["Faux", "Vrai"], "Faux."], ["vf", "Vrai ou faux ? Les seuils du cours sont à vérifier chaque année.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : micro ; réel ______ ; réel normal.", ["simplifié", "réduit", "complet"], "Tableau."], ["trou", "Complète : micro biens : CA < ______ € HT.", ["170 000", "70 000", "818 000"], "Tableau."], ["cas", "Cas pratique : une société de services réalise 100 000 € de CA. Quel régime (selon le cours) ?", ["Réel simplifié", "Micro", "Réel normal"], "Tableau."], ["cas", "Cas pratique : un commerce de biens réalise 900 000 € de CA. Quel régime ?", ["Réel normal", "Réel simplifié", "Micro"], "Tableau."], ["cas", "Cas pratique : un prestataire réalise 60 000 € de CA. Quel régime ?", ["Micro", "Réel simplifié", "Réel normal"], "Tableau."], ["cas", "Cas pratique : en examen, « En quoi la croissance modifie-t-elle le régime fiscal ? ». Réponse ?", ["Le franchissement de seuils de CA change le régime de déclaration", "Elle supprime les impôts", "Elle fixe le capital"], "Cours."]]}, {"id": "4.9", "title": "L’impôt sur les sociétés (IS) : taux et conditions du taux réduit", "fiche": [["def", "Les modalités dépendent (1) du **montant du résultat imposé** à la société et (2) base**, chaque facture doit porter : « **TVA non applicable — article 293 B du CGI** ».", "**Réel simplifié** : **acomptes** + **déclaration annuelle** (rectificative). **Réel normal** : déclaration de TVA **tous les mois**, en fonction des sommes perçues ou des factures émises."]], ["warn", "**Attention** : le cours donne deux versions pour le réel simplifié (3 acomptes — un par trimestre — en partie « Croissance » ; 2 acomptes, 15 juillet et 15 décembre, en partie « Consolidation »). **À vérifier auprès de l’enseignant.**"]], "qs": [["qcm", "Quel plafond de franchise de base pour les biens (selon le cours) ?", ["85 800 €", "34 400 €", "818 000 €"], "Tableau."], ["qcm", "Quel plafond de franchise de base pour les services (selon le cours) ?", ["34 400 €", "85 800 €", "247 000 €"], "Tableau."], ["qcm", "Quel intervalle du réel simplifié pour les biens ?", ["85 800 € à 818 000 €", "34 400 € à 247 000 €", "818 000 € et plus"], "Tableau."], ["qcm", "Quel intervalle du réel simplifié pour les services ?", ["34 400 € à 247 000 €", "85 800 € à 818 000 €", "247 000 € et plus"], "Tableau."], ["qcm", "À partir de quel CA le réel normal pour les biens ?", ["Plus de 818 000 €", "Plus de 85 800 €", "Plus de 247 000 €"], "Tableau."], ["qcm", "À partir de quel CA le réel normal pour les services ?", ["Plus de 247 000 €", "Plus de 34 400 €", "Plus de 818 000 €"], "Tableau."], ["qcm", "Quelle mention figure sur les factures en franchise ?", ["« TVA non applicable — article 293 B du CGI »", "« TVA 20 % incluse »", "« Exonéré »"], "Cours."], ["qcm", "Que comprend le réel simplifié ?", ["Des acomptes et une déclaration annuelle", "Une déclaration mensuelle", "Aucune déclaration"], "Cours."], ["qcm", "Que comprend le réel normal ?", ["Une déclaration de TVA tous les mois", "Une déclaration annuelle seulement", "Des acomptes seulement"], "Cours."], ["qcm", "En fonction de quoi déclare-t-on au réel normal ?", ["Des sommes perçues ou des factures émises", "Du bénéfice", "Du capital"], "Cours."], ["qcm", "Combien d’acomptes de TVA dans la version « Croissance » ?", ["3 (un par trimestre)", "2", "12"], "Attention."], ["qcm", "Combien d’acomptes dans la version « Consolidation » ?", ["2 (15 juillet et 15 décembre)", "3", "4"], "Attention."], ["vf", "Vrai ou faux ? Le cours donne deux versions des acomptes en réel simplifié.", ["Vrai", "Faux"], "Vrai : à vérifier."], ["trou", "Complète : TVA non applicable — article ______ B du CGI.", ["293", "300", "120"], "Cours."], ["trou", "Complète : réel normal : déclaration ______.", ["mensuelle", "annuelle", "trimestrielle"], "Cours."], ["cas", "Cas pratique : un prestataire de services réalise 30 000 € de CA. Que facture-t-il ?", ["Sans TVA, avec la mention art. 293 B", "Avec TVA", "En TVA mensuelle"], "Tableau."], ["cas", "Cas pratique : un vendeur de biens réalise 500 000 € de CA. Quel régime de TVA ?", ["Réel simplifié", "Franchise", "Réel normal"], "Tableau."], ["cas", "Cas pratique : un commerçant dépasse 818 000 € de CA. Quel régime de TVA ?", ["Réel normal", "Réel simplifié", "Franchise"], "Tableau."], ["cas", "Cas pratique : en examen, « Que faut-il vérifier pour les acomptes de TVA du réel simplifié ? ». Réponse ?", ["Le cours donne deux versions : à vérifier auprès de l’enseignant", "Le chiffre est fixe", "Il n’y a pas d’acompte"], "Attention."], ["qcm", "Quelle différence de fréquence entre réel simplifié et réel normal ?", ["Annuelle avec acomptes contre mensuelle", "Mensuelle contre annuelle", "Aucune"], "Cours."]]}, {"id": "4.11", "title": "La taxe sur les salaires et les autres impôts : CFE, CVAE, taxe d’apprentissage", "fiche": [["def", "**Taxe sur les salaires** : due par l’essentiel des sociétés **non soumises à TVA** ; les seuils dépendent du **montant de la taxe calculée**."], ["t", [["Taxe sur les salaires calculée", "Obligation"], ["**< 1 200 €**", "**Franchise** : rien à déclarer, rien à payer"], ["**1 200 € à 4 000 €**", "Déclaration annuelle et paiement annuel"], ["**4 000 € à 10 000 €* ue territoriale (CFE + CVAE)", "Contribution à l’effort de travail", "Cotisation d’entreprise totale"], "Tableau."], ["qcm", "À partir de quand la taxe d’apprentissage est-elle due ?", ["Dès le 1er salarié", "Dès 11 salariés", "Dès 50 salariés"], "Tableau."], ["qcm", "Quel taux de taxe d’apprentissage (selon le cours) ?", ["0,68 % de la masse salariale", "1 %", "0,45 %"], "Tableau."], ["qcm", "Dans quel cas la TA n’est-elle pas payée ?", ["Embauche d’apprentis et masse salariale ≤ 6 SMIC annuels (≈ 108 000 €)", "Moins de 50 salariés", "Association"], "Tableau."], ["vf", "Vrai ou faux ? La taxe sur les salaires concerne les sociétés soumises à TVA.", ["Faux", "Vrai"], "Faux."], ["vf", "Vrai ou faux ? CFE + CVAE = CET.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : taxe d’apprentissage : ___ % de la masse salariale.", ["0,68", "0,45", "2"], "Tableau."], ["cas", "Cas pratique : une association paie 800 € de taxe sur les salaires calculée. Que doit-elle faire ?", ["Rien : franchise", "Une déclaration annuelle", "3 provisions"], "Tableau."], ["cas", "Cas pratique : une association paie 6 000 € de taxe sur les salaires. Quelles obligations ?", ["3 provisions + régularisation annuelle", "Franchise", "11 provisions"], "Tableau."], ["cas", "Cas pratique : en examen, « Citez les composantes de la CET ». Réponse ?", ["CFE et CVAE", "TVA et IS", "TA et PEEC"], "Tableau."]]}, {"id": "4.12", "title": "Focus : l’effort de construction (PEEC)", "fiche": [["def", "**PEEC** = participation des employeurs à l’**effort de construction**. Dû **aussi bien par les associations que par le privé** ; modifié par la **loi PACTE** ; obligatoire **au-delà de 50 salariés** ; régi par le CGI, le code rural et le code de la construction."], ["li", ["**Obligation** : **0,45 % de la masse salariale** soit **en direct** (réalisation, aménagement, entretien de logements mis à disposition des salariés), soit en **prêtant de l’argent aux salariés** pour acquérir leur résidence principale, soit en **versant les 0,45 % à un organisme spécifique**.", "Si non tenu ou fait en moindre mesure : paiement de **2 % de la masse salariale** directement aux impôts."]], ["warn", "**À retenir — Partie 4** : croissance = développement quantitatif durable → nouvelles obligations ; 3 types × 2 stratégies ; seuils sociaux (1–10, 11 CSE, 20, 50, 200, 250) ; seuils fiscaux (micro, réel simplifié, franchise TVA, CFE, CVAE, taxe sur les salaires) ; IS 15 % jusqu’à 38 120 € puis convergence vers 25 %."]], "qs": [["qcm", "Que signifie PEEC ?", ["Participation des employeurs à l’effort de construction", "Plan d’épargne entreprise collectif", "Participation à l’emploi et à l’égalité"], "Cours."], ["qcm", "Qui est concerné par la PEEC ?", ["Les associations comme le privé", "Seulement le privé", "Seulement les associations"], "Cours."], ["qcm", "Quelle loi a modifié la PEEC ?", ["La loi PACTE", "La loi Hamon", "La loi Évin"], "Cours."], ["qcm", "À partir de quel effectif la PEEC est-elle obligatoire ?", ["Au-delà de 50 salariés", "Dès 11 salariés", "Dès 250 salariés"], "Cours."], ["qcm", "Quel est le taux de l’obligation ?", ["0,45 % de la masse salariale", "2 %", "0,68 %"], "Cours."], ["qcm", "Comment peut-on s’acquitter de l’obligation en direct ?", ["Réalisation, aménagement, entretien de logements mis à disposition des salariés", "Versement à l’État", "Achat d’actions"], "Cours."], ["qcm", "Quelle autre modalité est possible ?", ["Prêter de l’argent aux salariés pour acquérir leur résidence principale", "Offrir un bonus", "Verser une prime"], "Cours."], ["qcm", "Quelle troisième modalité ?", ["Verser les 0,45 % à un organisme spécifique", "Verser 2 % aux impôts", "Verser au CSE"], "Cours."], ["qcm", "Que se passe-t-il si l’obligation n’est pas tenue ?", ["Paiement de 2 % de la masse salariale aux impôts", "Aucune sanction", "Une amende de 500 €"], "Cours."], ["qcm", "Quels textes régissent la PEEC ?", ["CGI, code rural, code de la construction", "Code civil seulement", "Code du trava
