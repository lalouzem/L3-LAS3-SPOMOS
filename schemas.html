<style>

.home{border:0;background:none;color:var(--pri);font-weight:700;padding:6px 0}

.ub{flex:1;min-width:0}
.ut{font-weight:600;line-height:1.35}
.um{font-size:13px;color:var(--muted)}
.ua{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.meta{color:var(--muted);font-size:14px}

.eg{border-left:4px solid var(--eg);padding:6px 12px;margin:10px 0;color:var(--ink)}

.fb{margin-top:12px}

.cbad{color:var(--ko);font-size:14px}.cgood{color:var(--ok);font-size:14px}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

, "Selon le cours."], ["qcm", "Quel est le premier objectif du schéma ?", ["Adapter l’offre de soins aux besoins de santé de la population", "Augmenter les tarifs", "Réduire le personnel"], "Objectifs."], ["qcm", "Quel objectif concerne les acteurs ?", ["Leur permettre de mieux coopérer", "Les mettre en concurrence", "Les sanctionner"], "Objectifs."], ["qcm", "Quel objectif concerne les usagers et professionnels ?", ["Rendre l’offre lisible", "La rendre complexe", "La rendre payante"], "Objectifs."], ["qcm", "Quel principe fonde tout le schéma ?", ["Les politiques de santé répondent aux besoins de santé", "L’offre crée la demande", "La demande suit l’offre"], "Principe central."], ["vf", "Vrai ou faux ? L’offre doit suivre les besoins, et non l’inverse.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Le schéma régional de santé est un outil de planification territoriale.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Le schéma est mis en œuvre par les mairies.", ["Faux", "Vrai"], "Faux : par les ARS."], ["trou", "Complète : le schéma recommande un ______ territorial.", ["maillage", "découpage", "classement"], "Selon le cours."], ["trou", "Complète : les politiques de santé répondent aux ______ de santé.", ["besoins", "demandes", "moyens"], "Principe."], ["cas", "Cas pratique : une région ouvre de nombreux services de chirurgie du genou sans étudier les besoins. Quel principe est violé ?", ["L’offre doit suivre les besoins", "L’offre doit précéder les besoins", "La concurrence doit primer"], "Principe fondateur."], ["cas", "Cas pratique : des habitants d’un territoire n’ont aucun médecin à moins de 40 km. Quel objectif du schéma est en jeu ?", ["Le maillage territorial et l’accès rapide aux soins pour tous", "La tarification", "La recherche"], "Selon le cours."], ["cas", "Cas pratique : en examen, « À quoi sert un schéma régional de santé ? ». Réponse ?", ["À adapter l’offre aux besoins, faire coopérer les acteurs et rendre l’offre lisible", "À fixer les prix", "À contrôler les patients"], "Objectifs."], ["qcm", "Quelle est la différence entre offre et demande de soins ?", ["L’offre : établissements et professionnels disponibles ; la demande : besoins de la population", "Aucune", "L’offre est la demande"], "Notions de base."], ["qcm", "Que signifie ARS ?", ["Agence régionale de santé", "Association régionale de soins", "Autorité de régulation sanitaire"], "Sigle."], ["trou", "Complète : rendre l’offre ______ pour les usagers comme pour les professionnels.", ["lisible", "payante", "privée"], "Objectifs."]]}, {"id": "1.2", "title": "L’objectif central : répondre aux besoins de la population", "fiche": [["li", ["**Analyser l’offre existante** : type d’établissements, services, professionnels présents.", "**Identifier la demande** : besoins réels et ressentis, pathologies dominantes, disparités territoriales, attentes sociales.", "Offre et demande **ne se rencontrent pas spontanément** : il faut un cadre structuré avec une vision **court, moyen et long terme**.", "Penser les **parcours** (prévention → réinsertion) et **coordonner les acteurs** pour éviter les ruptures."]]], "qs": [["qcm", "Que faut-il analyser côté offre ?", ["Les établissements, services et professionnels présents", "Les attentes sociales", "Les pathologies"], "Offre de soins existante."], ["qcm", "Que faut-il identifier côté demande ?", ["Besoins réels et ressentis, pathologies dominantes, disparités, attentes sociales", "Les établissements", "Les budgets"], "Demande."], ["qcm", "Pourquoi faut-il un cadre structuré ?", ["L’offre et la demande ne se rencontrent pas spontanément", "Pour compliquer", "Pour réduire le personnel"], "Selon le cours."], ["qcm", "Sur quelle durée le cadre articule-t-il offre et demande ?", ["Court, moyen et long terme", "Un an", "Un mandat électoral"], "Vision à plusieurs horizons."], ["qcm", "Que signifie « penser les parcours de santé » ?", ["De la prévention à la réinsertion, en passant par le soin et l’accompagnement médic )", "Imaginaires", "Supprimés"], "Besoins réels et ressentis."], ["qcm", "À quoi sert une vision à court, moyen et long terme ?", ["Articuler l’offre et la demande dans le temps", "Gagner du temps", "Éviter les évaluations"], "Cadre structuré."], ["vf", "Vrai ou faux ? La coordination des acteurs vise à éviter les ruptures de prise en charge.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : de la prévention à la ______.", ["réinsertion", "hospitalisation", "retraite"], "Parcours."], ["qcm", "Quel élément est une « attente sociale » ?", ["Ce que la société attend du système de santé", "Un budget", "Une norme"], "Demande."]]}, {"id": "1.3", "title": "Une logique de parcours", "fiche": [["t", [["Étape du parcours", "Contenu"], ["Prévention", "Éviter la maladie (« Fumer tue »)"], ["Soins", "Ambulatoires et hospitaliers"], ["Accompagnement médico-social", "Établissements et services pour personnes âgées, handicapées…"], ["Réadaptation et réinsertion", "Soins de suite, post-cure, retour à la vie sociale"]]], ["def", "Le parcours suppose **continuité** et **coordination** : **avant, pendant et après l’hôpital**."], ["eg", "Après une crise cardiaque ou un AVC, le service social prépare le retour (domicile, enfants, établissement) ; à domicile, suivi par le médecin généraliste et une équipe de soignants de secteur."]], "qs": [["qcm", "Quelles sont les 4 étapes du parcours ?", ["Prévention, soins, accompagnement médico-social, réadaptation et réinsertion", "Diagnostic, soin, sortie, oubli", "Hôpital, ville, domicile, école"], "Tableau du cours."], ["qcm", "Que relève de la prévention ?", ["Éviter la maladie (« Fumer tue »)", "Les soins hospitaliers", "La réinsertion"], "Première étape."], ["qcm", "Que comprennent les soins ?", ["Ambulatoires et hospitaliers", "Uniquement hospitaliers", "Uniquement à domicile"], "Deuxième étape."], ["qcm", "Que comprend l’accompagnement médico-social ?", ["Établissements et services pour personnes âgées, handicapées…", "Les urgences", "Le bl m", "Que signifie « opposable » ?", ["Il s’impose comme règle aux établissements, y compris juridiquement", "Il est contestable", "Il est facultatif"], "Cours."], ["qcm", "Que faut-il vérifier pour créer un EHPAD ?", ["Qu’il est prévu dans le schéma", "Que la mairie est d’accord", "Qu’un médecin le demande"], "Cours."], ["qcm", "Quelles procédures impliquent le schéma ?", ["Autorisation, habilitation, agrément", "Déclaration", "Notification"], "Cours."], ["qcm", "Quelle est la durée des autorisations selon le cours ?", ["5 à 10 ans", "1 an", "30 ans"], "Cours."], ["qcm", "Que fait-on après la période d’autorisation ?", ["On réautorise après avoir regardé ce qui se passe", "On reconduit sans contrôle", "On ferme"], "Cours."], ["qcm", "Le SROS est-il diffusé au grand public ?", ["Non, il éclaire les décisions des ARS", "Oui, en ligne", "Oui, par affichage"], "Cours."], ["qcm", "Quelle est la première étape de construction ?", ["L’analyse démographique et environnementale", "La décision", "L’évaluation"], "Cours."], ["qcm", "Comment le SROS est-il construit ?", ["Par pathologie et par territoire", "Par établissement", "Par métier"], "Cours."], ["qcm", "Que signifie « approche populationnelle » ?", ["Analyser l’offre et la demande dans chaque territoire : « Comment ça se passe chez vous ? »", "Compter les habitants", "Classer les patients"], "Cours."], ["qcm", "Qui finance l’allocation de ressources et les transformations ?", ["L’ARS", "La mairie", "Les patients"], "Cours."], ["qcm", "Quelle règle à suivre s’est imposée pour les contrats ?", ["Le CPOM", "Le SROS", "Le PMSI"], "Cours."], ["qcm", "Quels acteurs forment la gouvernance collective ?", ["État, région, élus locaux", "État seul", "Hôpitaux seuls"], "Cours."], ["vf", "Vrai ou faux ? Le SROS est un outil de régulation et de prospective.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? Un établissement peut ignorer le SROS.", ["Faux", "Vrai"], "Faux : opposable."], ["trou", "Complète : le SROS est ______ : il       const ok = C.unites.filter(ready).length, cb = S.c[C.key];
      h += `<section class="chap"><div class="chapbar"><h2>Chapitre ${C.n}. ${esc(C.title)}</h2>${ok ? `<button class="btn sm" data-exam="${C.key}">Examen du chapitre</button>` : ""}</div>${cb != null ? `<div class="meta">Meilleur examen : ${cb}/20</div>` : ""}<ul class="units">`;
      C.unites.forEach(U => {
        const b = S.u[U.id], r = ready(U);
        h += `<li class="unit${r ? "" : " soon"}${b != null && b >= 16 ? " done" : ""}"><span class="uid">${esc(U.id)}</span><div class="ub"><div class="ut">${esc(U.title)}</div><div class="um">${r ? `${U.qs.length} questions${b != null ? `, meilleur ${b}/${U.qs.length}` : ""}` : "À venir"}</div></div>${r ? `<div class="ua"><button class="btn sm" data-fiche="${esc(U.id)}">Fiche</button><button class="btn sm solid" data-quiz="${esc(U.id)}">Quiz</button></div>` : ""}</li>`;
      });
      h += `</ul></section>`;
    });
  });
  h += `<div class="toolbar"><button class="btn danger" data-reset>Effacer ma progression</button></div>`;
  app.innerHTML = h;
}

function block(b){
  switch(b[0]){
    case "def": return `<div class="def">${md(b[1])}</div>`;
    case "eg": return `<div class="eg">${md(b[1])}</div>`;
    case "warn": return `<p class="warn">⚠ ${md(b[1])}</p>`;
    case "p": return `<p>${md(b[1])}</p>`;
    case "li": return `<ul>${b[1].map(x => `<li>${md(x)}</li>`).join("")}</ul>`;
    case "t": return `<div class="tblw"><table><thead><tr>${b[1][0].map(x => `<th>${md(x)}</th>`).join("")}</tr></thead><tbody>${b[1].slice(1).map(r => `<tr>${r.map(x => `<td>${md(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  return "";
}
function fiche(U){
  setView("fiche", `Unité ${U.id}`);
  app.innerHTML = `<div class="fiche"><p class="meta">Leçon ${U.C.L.n} · Chapitre ${U.C.n} · Unité ${esc(U.id)}</p><h2>${esc(U.title)}</h2>
<div class="legend"><span class="lg d">à mémoriser</span><span class="lg e">exemple</span><span class="lg w">⚠ piège</span></div>
${U.fiche.map(block).join("")}</div><div class="toolbar"><button class="btn solid" data-quiz="${esc(U.id)}">S’entraîner : ${U.qs.length} questions</button></div>`;
}

function start(kind, ref, list){
  cur = {kind, ref, list, idx:0, res:[]};
  renderQ();
}
function quizUnit(U){ start("u", U.id, shuffle(U.qs.map((_,i) => [U.id, i]))); }
function examChap(C){ const pool = []; C.unites.filter(ready).forEach(U => U.qs.forEach((_,i) => pool.push([U.id, i]))); start("c", C.key, shuffle(pool).slice(0, 20)); }
function Q(it){ const q = uById(it[0]).qs[it[1]]; return {t:q[0], p:q[1], o:q[2], e:q[3]}; }
function renderQ(){
  const c = cur; if (c.idx >= c.list.length) return end();
  const q = Q(c.list[c.idx]);
  setView("quiz", c.kind === "u" ? `Unité ${c.ref}` : `Examen du chapitre`);
  const idx = q.o.map((_,i) => i), order = q.t === "vf" ? idx.sort((a,b) => q.o[a] === "Vrai" ? -1 : q.o[b] === "Vrai" ? 1 : 0) : shuffle(idx);
  app.innerHTML = `<div class="bar"><h1>${c.kind === "u" ? `Unité ${esc(c.ref)}` : "Examen du chapitre"}</h1><span class="meta">Question ${c.idx + 1} / ${c.list.length}</span></div>
<div class="prog"><i style="width:${c.idx / c.list.length * 100}%"></i></div>
<div class="q"><span class="tag${q.t === "cas" ? " cas" : ""}">${TYPE[q.t]}</span>${c.kind === "c" ? `<span class="tag">Unité ${esc(c.list[c.idx][0])}</span>` : ""}<div class="qtxt">${esc(q.p)}</div></div>
<div class="opts">${order.map(i => `<button class="opt" data-pick="${i}">${esc(q.o[i])}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div>`;
}
function pick(i){
  const c = cur, q = Q(c.list[c.idx]), ok = i === 0;
  app.querySelectorAll(".opt").forEach(b => { b.disabled = true; const k = +b.dataset.pick; if (k === 0) b.classList.add("ok"); else if (k === i) b.classList.add("ko"); });
  c.res.push({it:c.list[c.idx], ok, pick:i}); c.idx++;
  const last = c.idx >= c.list.length;
  $("fb").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}">${ok ? "Bonne réponse" : "Mauvaise réponse"}</div><div class="expl">${esc(q.e)}</div><div class="toolbar"><button class="btn solid" data-next>${last ? "Voir mon résultat" : "Question suivante"}</button></div>`;
}
let lastWrong = null;
function end(){
  const c = cur, n = c.res.length, ok = c.res.filter(r => r.ok).length, pct = Math.round(ok / n * 100);
  if (c.kind === "u" && !c.err) S.u[c.ref] = Math.max(S.u[c.ref] || 0, ok);
  if (c.kind === "c") S.c[c.ref] = Math.max(S.c[c.ref] || 0, ok);
  save();
  const wrong = c.res.filter(r => !r.ok); lastWrong = wrong.map(r => r.it);
  let nextU = null;
  if (c.kind === "u") { const i = UNITS.findIndex(U => U.id === c.ref); nextU = UNITS.slice(i + 1).find(ready); }
  setView("end", "Résultat");
  let h = `<div class="end"><p class="score">${ok}/${n}</p><p class="meta">${pct} % de bonnes réponses${pct >= 80 ? " : objectif atteint" : " : objectif 80 %"}</p>
<div class="toolbar">${wrong.length ? `<button class="btn solid" data-errs>Refaire mes ${wrong.length} erreur${wrong.length > 1 ? "s" : ""}</button>` : ""}<button class="btn" data-again>Recommencer</button>${nextU ? `<button class="btn" data-fiche="${esc(nextU.id)}">Unité suivante</button>` : ""}<button class="btn" data-home>Sommaire</button></div></div>`;
  if (wrong.length) {
    h += `<h2>Correction</h2>`;
    wrong.forEach(r => { const q = Q(r.it); h += `<div class="corr"><div class="qtxt">${esc(q.p)}</div><div class="cbad">Ta réponse : ${esc(q.o[r.pick])}</div><div class="cgood">Bonne réponse : ${esc(q.o[0])}</div><div class="expl">${esc(q.e)}</div></div>`; });
  }
  app.innerHTML = h;
  cur.done = true;
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.fiche) return fiche(uById(d.fiche));
  if (d.quiz) return quizUnit(uById(d.quiz));
  if (d.exam) return examChap(CHAPS.find(C => C.key === d.exam));
  if ("pick" in d) return pick(+d.pick);
  if ("next" in d) return renderQ();
  if ("errs" in d) { const k = cur.kind, r = cur.ref; start(k, r, shuffle(lastWrong)); cur.err = true; return; }
  if ("again" in d) { return cur.kind === "u" ? quizUnit(uById(cur.ref)) : examChap(CHAPS.find(C => C.key === cur.ref)); }
  if ("home" in d) return home();
  if ("reset" in d) {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirmer : tout effacer"; setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = "Effacer ma progression"; } }, 4000); return; }
    S = {u:{}, c:{}}; save(); return home();
  }
});
$("homeBtn").addEventListener("click", home);
home();
})();
</script>
</body>
</html>
