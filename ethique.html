<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Éthique et déontologie — Révision</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--paper:#F5F7FA;--card:#FFFFFF;--ink:#1E293B;--muted:#64748B;--line:#E2E8F0;--pri:#1E40AF;--pri-soft:#EFF6FF;--on-pri:#FFFFFF;
--acc:#D97706;--acc-soft:#FEF3C7;--ok:#15803D;--ok-soft:#DCFCE7;--ko:#B91C1C;--ko-soft:#FEE2E2;--def:#0B6E79;--def-bg:#E0F5F7;--eg:#2E7D32;
--la:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ti:"Comfortaa","Open Sans",system-ui,sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F172A;--card:#1E293B;--ink:#F1F5F9;--muted:#94A3B8;--line:#334155;--pri:#60A5FA;--pri-soft:#1E3A8A;--on-pri:#0F172A;--acc:#F59E0B;--acc-soft:#451A03;--ok:#4ADE80;--ok-soft:#14532D;--ko:#F87171;--ko-soft:#7F1D1D;--def:#7FE3EA;--def-bg:#123A40;--eg:#81C784;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F172A;--card:#1E293B;--ink:#F1F5F9;--muted:#94A3B8;--line:#334155;--pri:#60A5FA;--pri-soft:#1E3A8A;--on-pri:#0F172A;--acc:#F59E0B;--acc-soft:#451A03;--ok:#4ADE80;--ok-soft:#14532D;--ko:#F87171;--ko-soft:#7F1D1D;--def:#7FE3EA;--def-bg:#123A40;--eg:#81C784;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--la)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,.score{font-family:var(--ti)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.home{border:0;background:none;color:var(--pri);font-weight:700;padding:6px 0}
body[data-view="home"] .home{visibility:hidden}
.hint{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 64px}
h1{font-size:clamp(23px,5.5vw,30px);line-height:1.25;margin:4px 0 6px;color:var(--pri)}
.lead{color:var(--muted);margin:0 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--pri);background:transparent;color:var(--pri);font-weight:600;text-decoration:none}
.btn.solid{background:var(--pri);color:var(--on-pri)}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px}
.btn.danger{border-color:var(--ko);color:var(--ko)}
.btn.danger.armed{background:var(--ko);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--ti);font-size:22px;color:var(--pri)}
.stat span{font-size:12px;color:var(--muted)}
.lesson{margin:22px 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.chap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.chap h2{font-size:17px;margin:0 0 4px}
.chapbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px}
.units{list-style:none;margin:0;padding:0}
.unit{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.uid{flex:none;min-width:38px;height:28px;padding:0 6px;border-radius:8px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:13px}
.unit.done .uid{background:var(--ok);color:var(--card)}
.unit.soon{opacity:.55}
.ub{flex:1;min-width:0}
.ut{font-weight:600;line-height:1.35}
.um{font-size:13px;color:var(--muted)}
.ua{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.meta{color:var(--muted);font-size:14px}
.fiche h2{font-size:20px;margin:0 0 10px}
.def{background:var(--def-bg);border-left:4px solid var(--def);border-radius:10px;padding:10px 12px;margin:10px 0}
.def::before{content:"À mémoriser";display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--def);margin-bottom:2px}
.eg{border-left:4px solid var(--eg);padding:6px 12px;margin:10px 0;color:var(--ink)}
.eg::before{content:"Exemple";display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--eg)}
.warn{background:var(--acc-soft);border-radius:10px;padding:8px 12px;margin:10px 0}
.fiche ul{margin:8px 0;padding-left:20px}.fiche li{margin:4px 0}
.tblw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--pri-soft);color:var(--pri)}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin:0 0 6px}
.lg{padding:2px 8px;border-radius:6px;font-weight:600}
.lg.d{background:var(--def-bg);color:var(--def)}.lg.e{border:1px solid var(--eg);color:var(--eg)}.lg.w{background:var(--acc-soft)}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.bar h1{font-size:20px;margin:0}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--pri-soft);color:var(--pri);margin:0 6px 8px 0}
.tag.cas{background:var(--acc-soft);color:var(--acc)}
.qtxt{font-size:17px;font-weight:600;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{min-height:50px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:15px;line-height:1.4;text-align:left}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ko{border-color:var(--ko);background:var(--ko-soft)}
.fb{margin-top:12px}
.verdict{font-weight:700;font-size:17px;font-family:var(--ti)}
.verdict.good{color:var(--ok)}.verdict.bad{color:var(--ko)}
.expl{margin-top:6px;font-size:15px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:10px 12px}
.end{text-align:center}
.score{font-size:52px;font-weight:700;color:var(--pri);margin:6px 0 0}
.corr{padding:12px 0;border-bottom:1px solid var(--line)}
.corr .qtxt{font-size:15px}
.cbad{color:var(--ko);font-size:14px}.cgood{color:var(--ok);font-size:14px}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>

ue l’intégrité ?", ["Probité, honnêteté, refus de la corruption", "Neutralité", "Rapidité"], "Définition."], ["qcm", "Qu’est-ce que l’impartialité ?", ["Être neutre, indépendant, objectif", "Être honnête", "Être efficace"], "Définition."], ["qcm", "Qu’est-ce que l’efficacité ?", ["Bien remplir sa mission et rendre des comptes", "Gagner de l’argent", "Aller vite"], "Définition."], ["qcm", "À qui l’impôt collecté était-il destiné ?", ["Au roi, pas aux agents", "Aux agents", "Aux habitants"], "Selon le cours."], ["qcm", "Que décide l’ordonnance de 1303 (Philippe le Bel) ?", ["Aucun bailli ou sénéchal ne doit exercer dans son lieu de naissance", "Tous doivent habiter Paris", "Les baillis sont élus"], "Impartialité."], ["qcm", "Pourquoi interdire d’exercer dans sa ville natale ?", ["On ne peut pas être impartial chez soi", "Pour voyager", "Pour les impôts"], "Lien avec l’impartialité."], ["qcm", "Pourquoi obliger à résider dans sa circonscription ?", ["Pour être sur place, au service des gens", "Pour payer moins", "Pour éviter les voyages"], "1303."], ["qcm", "Pourquoi rappeler régulièrement ces règles ?", ["Les gens oublient, transgressent, agissent par égoïsme", "Parce qu’elles changent", "Pour les sanctionner"], "Selon le cours."], ["qcm", "Pourquoi sanctionner est-il difficile ?", ["À cause des preuves", "Par manque de lois", "Par manque de juges"], "On reste sur du incitatif."], ["qcm", "Quelle est une valeur clé du service public de santé ?", ["L’accès de tous", "La rentabilité", "La rapidité"], "Explication."], ["vf", "Vrai ou faux ? L’intégrité est le refus de la corruption.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? On peut privilégier un proche si on est efficace.", ["Faux", "Vrai"], "Faux : impartialité."], ["trou", "Complète : la grande ordonnance de ______ date de Louis IX.", ["1254", "1303", "1789"], "Saint Louis."], ["trou", "Complète : l’ordonnance de 1303 est due à Philippe le ______.", ["Bel", "Hardi", "Long"], "Roi capétien."], ["cas", "Cas pratique : un agent accepte un cadeau pour accélérer un dossier. Quelle valeur est atteinte ?", ["L’intégrité", "L’efficacité", "L’impartialité seulement"], "Dessous-de-table."], ["cas", "Cas pratique : une directrice recrute sa cousine sans appel à candidatures. Quelle valeur est atteinte ?", ["L’impartialité", "L’efficacité", "L’intégrité uniquement"], "Privilégier un proche."], ["cas", "Cas pratique : un responsable ne rend jamais compte de ses résultats. Quelle valeur est atteinte ?", ["L’efficacité (redevabilité)", "L’impartialité", "L’intégrité"], "Rendre des comptes."], ["qcm", "Cette histoire est rappelée en lien avec…", ["La centralisation et la décentralisation de la France (cours Schémas)", "La Révolution", "Le droit du travail"], "Renvoi à Mitterrand."]]}, {"id": "2.6", "title": "La Révolution française : un changement d’« économie psychique »", "fiche": [["def", "La **DDHC de 1789** affirme l’**égalité** (des hommes, pas encore des femmes) : « je ne t’appelle plus Monsieur, je t’appelle citoyen ». Elle consacre la **redevabilité** : « **dire ce que je fais, faire ce que je dis** »."], ["t", [["Avant 1789", "Après 1789"], ["Lecture religieuse du monde (« il y a le paradis »)", "Lecture républicaine"], ["Trois ordres : clergé, noblesse, tiers état", "Citoyenneté, droits, égalité"], ["Bourgeoisie qui veut une place", "Changement de paradigme, continuités et ruptures"]]], ["li", ["Elle inspire la Déclaration universelle des droits de l’homme et d’autres pays (États-Unis, avec l’influence de **John Locke**)."]]], "qs": [["qcm", "Quelle déclaration affirme l’égalité en 1789 ?", ["La DDHC", "La Déclaration d’indépendance", "La Charte de 1814"], "Déclaration des droits de l’homme et du citoyen."], ["qcm", "Que remplace le mot « Monsieur » ?", ["« Citoyen »", "« Camarade »", "« Sujet »"], "Égalité nouvelle."], ["qcm", "La déclaration de 1789 affirme-t-elle déjà l’égalité des femmes ?", ["Non", "Oui", "Seulement pour les nobles"], "Égalité des hommes seulement."], ["qcm", "Qu’est-ce que la redevabilité ?", ["Rendre compte quand on agit dans l’intérêt général", "Payer ses dettes", "Obéir au roi"], "Notion de la Révolution."], ["qcm", "Quelle formule résume la redevabilité en qualité ?", ["« Dire ce que je fais, faire ce que je dis »", "« Tout pour le roi »", "« Chacun pour soi »"], "Cours."], ["qcm", "Quels étaient les trois ordres avant 1789 ?", ["Clergé, noblesse, tiers état", "Roi, noblesse, peuple", "Clergé, armée, bourgeoisie"], "Ancien Régime."], ["qcm", "Quelle lecture du monde dominait avant 1789 ?", ["Une lecture religieuse", "Une lecture scientifique", "Une lecture économique"], "« Vous souffrez, mais il y a le paradis »."], ["qcm", "Quelle lecture s’impose après 1789 ?", ["Une lecture républicaine", "Une lecture féodale", "Une lecture monarchique absolue"], "Encore un peu religieuse : culte de l’Être suprême."], ["qcm", "Quelle classe émerge et veut sa place ?", ["La bourgeoisie", "La noblesse", "Le clergé"], "Noblesse de robe, justice, métiers honorables."], ["qcm", "Quel pays est influencé par la Révolution et par John Locke ?", ["Les États-Unis", "Le Japon", "La Russie"], "Selon le cours."], ["vf", "Vrai ou faux ? La DDHC inspire la Déclaration universelle des droits de l’homme.", ["Vrai", "Faux"], "Vrai."], ["vf", "Vrai ou faux ? La Révolution ne marque que des ruptures, sans continuités.", ["Faux", "Vrai"], "Faux : continuités et ruptures."], ["trou", "Complète : la DDHC date de ______.", ["1789", "1254", "1848"], "Révolution française."], ["trou", "Complète : changement d’« économie ______ ».", ["psychique", "politique", "sociale"], "Titre de l’unité."], ["cas", "Cas pratique : un responsable de la qualité dit « on fait ce qu’on écrit et on écrit ce qu’on fait ». Quelle idée de 1789 ?", ["La redevabilité", "L’impartialité", "Le télos"], "Dire ce que je fais, faire ce que je dis."], ["cas", "Cas pratique : un établissement affirme que chaque usager a les mêmes droits quel que soit son statut. Quelle idée ?", ["L’égalité (citoyenneté, droits)", "La hiérarchie des ordres", "La charité"], "Héritage de 1789."], ["qcm", "Quel changement résume le passage de l’Ancien Régime à la République ?", ["De sujets soumis à des ordres à citoyens égaux en droits", "De la république à la monarchie", "Du droit à la morale"], "Changement de paradigme."], ["qcm", "Qui est John Locke ?", ["Un philosophe anglais qui a influencé les États-Unis", "Un roi de France", "Un général"], "Influence anglaise."], ["vf", "Vrai ou faux ? La taille est un impôt de l’Ancien Régime.", ["Vrai", "Faux"], "Vrai : cité dans le cours."], ["qcm", "Pourquoi « économie psychique » ?", ["La façon de se représenter soi-même et les autres change profondément", "On parle de monnaie", "On compte les impôts"], "Titre de l’unité."]]}, {"id": "2.7", "title": "La philosophie moderne et contemporaine", "fiche": [["li", ["**Rousseau** : **perfectibilité** (l’homme s’améliore en se connaissant), *Confessions* (écho à saint Augustin), **Contrat social** ; apparition de la justice et de l’équité.", "**Philosophes du soupçon** : Marx, Nietzsche, Freud (et Heidegger) : rupture avec la philosophie médiévale, liberté individuelle, critique des institutions (puis Foucault)."]], ["t", [["Philosophe", "Apport cité"], ["Karl Marx", "Critique de l’économie capitaliste : quand le patron asservit l’ouvrier, le travail n’est plus libération"], ["Martin Heidegger", "Réflexion sur la mort"], ["Sigmund Freud", "L’inconscient : nous ne sommes pas si libres"], ["Michel Foucault", "Critique des institutions"]]], ["warn", "Si une part de nous échappe à la conscience, « qu’est-ce que je dois faire ? » demande **temps, discernement, humilité, sens critique, pas de côté**."]], "qs": [["qcm", "Que signifie la perfectibilité chez Rousseau ?", ["L’homme peut s’améliorer en se connaissant", "L’homme est parfait", "L’homme ne change pas"], "Notion rousseauiste."], ["qcm", "Quel ouvrage de Rousseau fait écho à saint Augustin ?", ["Les Confessions", "Le Contrat social", "L’Émile"], "Selon le cours."], ["qcm", "Que contient le Contrat social ?", ["Des accords pour bien organiser la vie en société", "Des lois romaines", "Des préceptes religieux"], "Selon le cours."], ["qcm", "Quelles notions apparaissent avec Rousseau ?", ["La justice et l’équité", "La charité", "Le télos"], "Selon le cours."], ["qcm", "Qui sont les philosophes du soupçon ?", ["Marx, Nietzsche, Freud", "Socrate, Platon, Aristote", "Locke, Rousseau, Voltaire"], "Selon le cours."], ["qcm", "Que remettent en cause les philosophes du soupçon ?", ["Les institutions et la philosophie médiévale", "La science", "La poésie"], "Rupture."], ["qcm", "Quel apport est attribué à Marx ?", ["La critique de l’économie capitaliste", "La psychanalyse", "La mort"], "Quand le patron asservit l’ouvrier."], ["qcm", "Quel apport est attribué à Freud ?", ["L’inconscient", "La critique des institutions", "Le contrat social"], "Rêves et lapsus."], ["qcm", "Quel apport est attribué à Heidegger ?", ["Une réflexion sur la mort", "La perfectibilité", "Le travail"], "Selon le cours."], ["qcm", "Quel apport est attribué à Foucault ?", ["La critique des institutions", "L’inconscient", "Le télos"], "Selon le cours."], ["qcm", "Que signifie que nous ne sommes « pas si libres » ?", ["Une part de nous échappe à la conscience", "Nous sommes esclaves", "La loi nous contraint"], "Freud."], ["qcm", "Que demande alors la question « qu’est-ce que je dois faire ? »", ["Temps, discernement, humilité, sens critique, recul", "Une réponse immédiate", "Une loi"], "Explication."], ["vf", "Vrai ou faux ? Le travail devient libération quand le patron asservit l’ouvrier.", ["Faux", "Vrai"], "Faux : il n’est plus libération (Marx)."], ["vf", "Vrai ou faux ? Les philosophes du soupçon promeuvent la liberté individuelle.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : Rousseau parle de ______ de l’homme.", ["perfectibilité", "faiblesse", "passivité"], "Notion."], ["trou", "Complète : Freud met en avant l’______.", ["inconscient", "conscient", "institution"], "Apport cité."], ["cas", "Cas pratique : un soignant se rend compte que ses réactions à un patient viennent de son histoire personnelle. Quel philosophe cela évoque-t-il ?", ["Freud", "Marx", "Rousseau"], "Part qui échappe à la conscience."], ["cas", "Cas pratique : une employée a le sentiment que son travail l’épuise au lieu de l’épanouir, au profit de son patron. Quel philosophe ?", ["Marx", "Freud", "Heidegger"], "Le travail n’est plus libération."], ["cas", "Cas pratique : on critique le fonctionnement d’une institution totale. Quel philosophe ?", ["Foucault", "Aristote", "Rousseau"], "Critique des institutions."], ["qcm", "Quel pas faut-il faire avant de répondre à une question éthique complexe ?", ["Un « pas de côté »", "Un pas en avant", "Un pas en arrière uniquement"], "Prise de recul."]]}, {"id": "2.8", "title": "Aujourd’hui : l’IA et la liberté", "fiche": [["li", ["Ce qu’on peut perdre avec l’IA : **la réflexion, le sens critique, la capacité à penser**, l’occasion de chercher et de se tromper.", "Les écoles disent : **relisez, ne déléguez pas une décision à la machine, anonymisez**. La machine dit ce que vous avez envie d’entendre selon votre profil.", "**Trop d’information tue l’information.**"]], ["def", "L’éthique, c’est **mettre le désir à distance** : ne pas vouloir répondre trop vite, surtout sur des questions fondamentales."]], "qs": [["qcm", "Que peut-on perdre avec l’IA ?", ["La réflexion, le sens critique, la capacité à penser", "Le temps libre", "Les données"], "Selon le cours."], ["qcm", "Que disent les écoles à propos de l’IA ?", ["Relisez, ne déléguez pas une décision à la machine, anonymisez", "Utilisez-la sans limite", "Interdisez-la"], "Consignes."], ["qcm", "Pourquoi se méfier de la réponse de la machine ?", ["Elle dit ce qu’on a envie d’entendre selon son profil", "Elle est lente", "Elle est toujours fausse"], "Selon le cours."], ["qcm", "Que signifie « trop d’information tue l’information » ?", ["La surabondance empêche de discerner", "L’information est dangereuse", "Il faut tout lire"], "Selon le cours."], ["qcm", "Que signifie « mettre le désir à distance » ?", ["Ne pas répondre trop vite, surtout sur des questions fondamentales", "Supprimer ses envies", "Ne jamais agir"], "Définition de l’éthique ici."], ["qcm", "Que perd-on en déléguant à une machine ?", ["L’occasion de chercher et de se tromper", "De l’argent", "Du matériel"], "Selon le cours."], ["qcm", "Pourquoi anonymiser ?", ["Pour protéger les personnes quand on utilise un outil d’IA", "Pour aller plus vite", "Pour tromper l’IA"], "Consigne des écoles."], ["vf", "Vrai ou faux ? Il est conseillé de déléguer une décision éthique à l’IA.", ["Faux", "Vrai"], "Faux : ne déléguez pas une décision à la machine."], ["vf", "Vrai ou faux ? L’IA peut renforcer ce que l’on a déjà envie d’entendre.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : « Relisez, ne ______ pas une décision à la machine. »", ["déléguez", "posez", "cachez"], "Consigne."], ["cas", "Cas pratique : un cadre demande à une IA de trancher un dilemme de licenciement et applique la réponse. Qu’en dire ?", ["Il délègue une décision éthique à la machine, ce qu’il faut éviter", "C’est une méthode fiable", "Il a bien fait d’anonymiser"], "Message de l’unité."], ["cas", "Cas pratique : une soignante utilise une IA pour rédiger un compte rendu et le relit avec attention. Qu’en dire ?", ["C’est conforme : elle relit et garde la décision", "Il faut tout supprimer", "C’est interdit"], "Relire."], ["cas", "Cas pratique : un étudiant colle des données de patients dans un outil d’IA sans les anonymiser. Problème ?", ["Oui : il faut anonymiser", "Non", "Seulement pour les médecins"], "Consigne."], ["qcm", "Quel risque l’IA fait-elle courir à la liberté ?", ["Perdre l’habitude de penser par soi-même", "Perdre son mot de passe", "Perdre de l’argent"], "Selon le cours."], ["qcm", "Pourquoi l’éthique demande-t-elle du temps ?", ["Pour ne pas rép ociétés »."], ["qcm", "Quel Code est à l’origine du droit français propre ?", ["Le Code civil de Napoléon (1804)", "Le Code du travail", "Le Code de commerce"], "Protéger la société, la propriété, la famille."], ["qcm", "Le droit est-il juste ou injuste ?", ["Ni l’un ni l’autre : c’est un réducteur d’incertitude", "Toujours juste", "Toujours injuste"], "Il dit ce qui peut et ne peut pas être fait."], ["qcm", "Que signifie « réducteur d’incertitude » ?", ["Il dit ce qui peut et ne peut pas être fait", "Il supprime les lois", "Il rend la loi incertaine"], "Définition du cours."], ["qcm", "Quel est l’ordre de la hiérarchie des normes ?", ["Constitution, loi, décret, circulaire/directive, arrêté", "Arrêté, décret, loi, Constitution", "Loi, Constitution, arrêté, décret"], "Du plus haut au plus bas."], ["qcm", "Pourquoi le droit évolue-t-il ?", ["Parce que la société évolue", "Parce que les juges changent", "Parce qu’il est imparfait"], "Droits des hommes, femmes, enfants, entreprises."], ["qcm", "Que dit Freud à propos de la loi ?", ["On a besoin de la loi, de l’autorité", "La loi est inutile", "La loi est injuste"], "« Loi du père »."], ["qcm", "Qu’est-ce que l’inflation juridique ?", ["De plus en plus de lois et de normes", "La hausse des prix", "La baisse du droit"], "Tout semble balisé."], ["qcm", "Quel paradoxe accompagne l’inflation juridique ?", ["On réinterroge de plus en plus les normes", "On les respecte davantage", "On les supprime"], "Selon le cours."], ["qcm", "Que détruit la réflexion binaire « pour ou contre » ?", ["La subtilité du droit, qui s’interprète au cas par cas", "La Constitution", "Le Parlement"], "Influence de l’opinion et des médias."], ["qcm", "Quelle question pose l’exemple de dirigeants disant « puisque je suis élu, je peux tout faire » ?", ["Est-ce au peuple ou à la Constitution et à la loi de dire ce qu’il faut faire ?", "Qui paie les impôts ?", "Qui juge ?"], "État de droit."], ["vf", "Vrai ou faux ? Le droit est ni juste ni injuste.", [" r à bout ?", ["Le souci de l’autre, l’altruisme", "L’égalité", "L’autonomie"], "Valeurs citées."], ["cas", "Cas pratique : en examen, « Citez trois valeurs de l’éthique et justifiez ». Exemple valable ?", ["Respect (règle d’or), responsabilité, dialogue (Habermas)", "Argent, pouvoir, gloire", "Sanction, peur, obéissance"], "Valeurs du cours."], ["qcm", "Pourquoi connaître ses valeurs ?", ["Pour s’ouvrir aux autres", "Pour juger les autres", "Pour éviter de décider"], "Explication."], ["trou", "Complète : valeur : faire le bien (______).", ["bienfaisance", "bienveillance", "benevolat"], "Valeurs citées."], ["qcm", "Que signifie « tolérance » ?", ["Accepter d’autres points de vue", "Tout accepter", "Ne rien dire"], "Égalité, tolérance."]]}, {"id": "5.8", "title": "La démarche éthique en établissement", "fiche": [["li", ["**Loi du 2 janvier 2002** : la personne est **au centre** du projet de service et d’établissement (projet individuel).", "Les **ESSMS** sont invités à organiser une **réflexion éthique** (qualité de la prise en charge, y compris relationnelle). **HAS** : qualité, prévention de la maltraitance, bientraitance, sens du travail ; réflexion distanciée, collégiale, régulière."]], ["t", [["Étape", "Contenu"], ["1. Décrire la situation", "Les faits, sans jugement"], ["2. Croiser les regards", "Équipe pluridisciplinaire"], ["3. Identifier les tensions", "Quelles valeurs s’opposent ?"], ["4. Rechercher des solutions", "En pensant aux conséquences"], ["5. Décider", "Au regard de tout cela"], ["6. Expliquer à la personne", "Elle peut participer"], ["7. Évaluer", "Observer les effets, réajuster"]]], ["t", [["Tension", "Illustration"], ["Liberté ↔ sécurité", "Résidente qui veut sortir seule"], ["Autonomie ↔ protection", "Contention, chambres capitonnées"], ["Choix individuel ↔ contrainte collective", "Organisation du service, horaires"], ["Confidentialité ↔ partage", "Ce qu’on transmet à l’équipe et à la famille"]]], ["li", ["**Instances** : référent éthique ou déo ous, mais à une profession (code de déontologie médicale…)."], ["li", ["Professions concernées : notaires, experts-comptables, médecins, commissaires aux comptes, architectes, avocats, policiers…", "Au XXe siècle, elles ont écrit leurs valeurs communes pour dire au client ou au patient : « **ne vous inquiétez pas** ». Enjeu : la **confiance**."]], ["eg", "On se confie à un médecin car il a une obligation de **secret professionnel**. Il ne doit pas nuire, ni divulguer, ni publier sur les réseaux sociaux ; sinon le **Conseil de l’Ordre** peut le **radier**."]], "qs": [["qcm", "Que signifie « science des devoirs » ?", ["La déontologie", "Le droit", "L’axiologie"], "Définition."], ["qcm", "À qui s’applique la déontologie ?", ["À une profession", "À tous les citoyens", "Aux mineurs"], "Droit souple."], ["qcm", "Quel exemple de code est cité ?", ["Le code de déontologie médicale", "Le Code civil", "Le Code pénal"], "Selon le cours."], ["qcm", "Quelle profession est dotée d’une déontologie ?", ["Les avocats", "Les agriculteurs", "Les étudiants"], "Liste du cours."], ["qcm", "Lequel n’est PAS cité parmi les professions dotées d’une déontologie ?", ["Les boulangers", "Les notaires", "Les architectes", "Les experts-comptables"], "Les autres sont cités."], ["qcm", "Pourquoi ces professions ont-elles écrit leurs valeurs au XXe siècle ?", ["Pour rassurer les clients et patients", "Pour punir", "Pour gagner plus"], "Confiance."], ["qcm", "Quel est l’enjeu de la déontologie ?", ["La confiance", "Le profit", "Le contrôle"], "Selon le cours."], ["qcm", "Pourquoi peut-on se confier à un médecin ?", ["Il a une obligation de secret professionnel", "Il est riche", "Il est gentil"], "Exemple du cours."], ["qcm", "Qui peut radier un médecin ?", ["Le Conseil de l’Ordre", "Le Parlement", "Le ministre"], "Sanction disciplinaire."], ["qcm", "Que ne doit pas faire un médecin ?", ["Nuire, divulguer, publier sur les réseaux sociaux", "Informer", "Soigner"], "Obligations du médecin."], ["vf", "Vr ct d’un mensonge ou d’un non-mensonge est plus grand que la petite « bêtise », réviser sa façon d’agir)."], ["warn", "**Kant** est un **moraliste** (*Métaphysique des mœurs*) : morale universelle, idéale."]], "qs": [["qcm", "Combien de postures le cours présente-t-il ?", ["3", "2", "5"], "Déontologisme, conséquentialisme, éthique des vertus."], ["qcm", "Que dit le déontologisme ?", ["Respecter le devoir, la règle, quelles que soient les conséquences", "Juger par les conséquences", "Agir selon ses qualités"], "Définition."], ["qcm", "Que dit le conséquentialisme ?", ["Juger l’acte par ses conséquences", "Respecter la règle à la lettre", "Cultiver les vertus"], "Définition."], ["qcm", "Que dit l’éthique des vertus ?", ["Agir selon les qualités morales de la personne", "Respecter la règle", "Juger par les conséquences"], "Aristote."], ["qcm", "À quel philosophe rattache-t-on l’éthique des vertus ?", ["Aristote", "Kant", "Bentham"], "Cours."], ["qcm", "Quel philosophe est un moraliste, selon le cours ?", ["Kant", "Aristote", "Habermas"], "Métaphysique des mœurs."], ["qcm", "Quelle œuvre de Kant est citée ?", ["Métaphysique des mœurs", "Contrat social", "Éthique à Nicomaque"], "Morale universelle, idéale."], ["qcm", "Quel autre nom pour l’éthique des vertus ?", ["Le vertuisme", "Le déontologisme", "Le conséquentialisme"], "Cours."], ["qcm", "Dans l’exemple du mensonge, que dit le déontologisme ?", ["« On me demande de ne pas mentir »", "« Je mens si c’est utile »", "« Je mens toujours »"], "Cours."], ["qcm", "Dans l’exemple du mensonge, que dit le conséquentialisme ?", ["Si l’impact d’un mensonge est plus grand que la « bêtise », réviser sa façon d’agir", "Ne jamais mentir", "Mentir toujours"], "Cours."], ["vf", "Vrai ou faux ? Le déontologisme tient compte avant tout des conséquences.", ["Faux", "Vrai"], "Faux : de la règle."], ["vf", "Vrai ou faux ? Le conséquentialisme juge l’acte par ses conséquences.", ["Vrai", "Faux"], "Vrai."], ["trou", "Complète : éthique des ______ (Aristote).", ["vertus", "valeurs", "vices"], "Posture."], ["trou", "Complète : ______ : respecter la règle quelles que soient les conséquences.", ["déontologisme", "conséquentialisme", "vertuisme"], "Posture."], ["cas", "Cas pratique : un soignant refuse de mentir à un patient même si cela le fera souffrir, car « c’est la règle ». Quelle posture ?", ["Le déontologisme", "Le conséquentialisme", "L’éthique des vertus"], "Règle quelles que soient les conséquences."], ["cas", "Cas pratique : un soignant choisit de taire une information pour éviter un mal plus grave. Quelle posture ?", ["Le conséquentialisme", "Le déontologisme", "L’éthique des vertus"], "Conséquences."], ["cas", "Cas pratique : un cadre agit toujours avec honnêteté, courage et justice, car c’est la personne qu’il veut être. Quelle posture ?", ["L’éthique des vertus", "Le déontologisme", "Le conséquentialisme"], "Qualités morales."], ["cas", "Cas pratique : en examen, « Citez trois postures éthiques et illustrez-les ». Réponse ?", ["Déontologisme, conséquentialisme, éthique des vertus, avec l’exemple du mensonge", "Droit, morale, éthique", "Care, cure, axiologie"], "Cours."], ["qcm", "Que retenir de la partie 6 ?", ["Déontologie préventive, régulation entre pairs, conflit d’intérêts, lanceurs d’alerte, compliance, trois postures", "Le droit seul", "La morale seule"], "À retenir."], ["qcm", "Quel est le point commun des trois postures ?", ["Elles proposent trois façons de justifier un choix", "Elles sont des lois", "Elles sont des institutions"], "Synthèse."]]}]}]}]};
const KEY = "l3-" + M.key + "-v2";
const $ = id => document.getElementById(id), app = $("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const shuffle = a => { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [r[i], r[j]] = [r[j], r[i]]; } return r; };
const TYPE = {qcm:"QCM", vf:"Vrai ou faux", trou:"Texte à trous", cas:"Cas pratique"};
let S = {u:{}, c:{}};
try { const v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v && v.u) S = v; } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const UNITS = [], CHAPS = [];
M.lecons.forEach(L => L.chapitres.forEach(C => { C.L = L; C.key = L.n + "-" + C.n; CHAPS.push(C); C.unites.forEach(U => { U.C = C; UNITS.push(U); }); }));
const ready = U => U.qs && U.qs.length;
const uById = id => UNITS.find(U => U.id === id);
let cur = null;

function setView(v, hint){ document.body.dataset.view = v; $("hint").textContent = hint || M.title; window.scrollTo(0,0); }

function home(){
  setView("home");
  const rd = UNITS.filter(ready), done = rd.filter(U => S.u[U.id] != null);
  const nq = rd.reduce((n,U) => n + U.qs.length, 0);
  let h = `<h1>${esc(M.title)}</h1><p class="lead">${esc(M.sub)}</p>
<div class="stats"><div class="stat"><b>${done.length}/${rd.length}</b><span>unités travaillées</span></div><div class="stat"><b>${nq}</b><span>questions</span></div><div class="stat"><b>${UNITS.length - rd.length}</b><span>unités à venir</span></div></div>`;
  M.lecons.forEach(L => {
    h += `<div class="lesson">Leçon ${L.n} · ${esc(L.title)}</div>`;
    L.chapitres.forEach(C => {
      const ok = C.unites.filter(ready).length, cb = S.c[C.key];
      h += `<section class="chap"><div class="chapbar"><h2>Chapitre ${C.n}. ${esc(C.title)}</h2>${ok ? `<button class="btn sm" data-exam="${C.key}">Examen du chapitre</button>` : ""}</div>${cb != null ? `<div class="meta">Meilleur examen : ${cb}/20</div>` : ""}<ul class="units">`;
      C.unites.forEach(U => {
        const b = S.u[U.id], r = ready(U);
        h += `<li class="unit${r ? "" : " soon"}${b != null && b >= 16 ? " done" : ""}"><span class="uid">${esc(U.id)}</span><div class="ub"><div class="ut">${esc(U.title)}</div><div class="um">${r ? `${U.qs.length} questions${b != null ? `, meilleur ${b}/${U.qs.length}` : ""}` : "À venir"}</div></div>${r ? `<div class="ua"><button class="btn sm" data-fiche="${esc(U.id)}">Fiche</button><button class="btn sm solid" data-quiz="${esc(U.id)}">Quiz</button></div>` : ""}</li>`;
      });
      h += `</ul></section>`;
    });
  });
  h += `<div class="toolbar"><button class="btn danger" data-reset>Effacer ma progression</button></div>`;
  app.innerHTML = h;
}

function block(b){
  switch(b[0]){
    case "def": return `<div class="def">${md(b[1])}</div>`;
    case "eg": return `<div class="eg">${md(b[1])}</div>`;
    case "warn": return `<p class="warn">⚠ ${md(b[1])}</p>`;
    case "p": return `<p>${md(b[1])}</p>`;
    case "li": return `<ul>${b[1].map(x => `<li>${md(x)}</li>`).join("")}</ul>`;
    case "t": return `<div class="tblw"><table><thead><tr>${b[1][0].map(x => `<th>${md(x)}</th>`).join("")}</tr></thead><tbody>${b[1].slice(1).map(r => `<tr>${r.map(x => `<td>${md(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  return "";
}
function fiche(U){
  setView("fiche", `Unité ${U.id}`);
  app.innerHTML = `<div class="fiche"><p class="meta">Leçon ${U.C.L.n} · Chapitre ${U.C.n} · Unité ${esc(U.id)}</p><h2>${esc(U.title)}</h2>
<div class="legend"><span class="lg d">à mémoriser</span><span class="lg e">exemple</span><span class="lg w">⚠ piège</span></div>
${U.fiche.map(block).join("")}</div><div class="toolbar"><button class="btn solid" data-quiz="${esc(U.id)}">S’entraîner : ${U.qs.length} questions</button></div>`;
}

function start(kind, ref, list){
  cur = {kind, ref, list, idx:0, res:[]};
  renderQ();
}
function quizUnit(U){ start("u", U.id, shuffle(U.qs.map((_,i) => [U.id, i]))); }
function examChap(C){ const pool = []; C.unites.filter(ready).forEach(U => U.qs.forEach((_,i) => pool.push([U.id, i]))); start("c", C.key, shuffle(pool).slice(0, 20)); }
function Q(it){ const q = uById(it[0]).qs[it[1]]; return {t:q[0], p:q[1], o:q[2], e:q[3]}; }
function renderQ(){
  const c = cur; if (c.idx >= c.list.length) return end();
  const q = Q(c.list[c.idx]);
  setView("quiz", c.kind === "u" ? `Unité ${c.ref}` : `Examen du chapitre`);
  const idx = q.o.map((_,i) => i), order = q.t === "vf" ? idx.sort((a,b) => q.o[a] === "Vrai" ? -1 : q.o[b] === "Vrai" ? 1 : 0) : shuffle(idx);
  app.innerHTML = `<div class="bar"><h1>${c.kind === "u" ? `Unité ${esc(c.ref)}` : "Examen du chapitre"}</h1><span class="meta">Question ${c.idx + 1} / ${c.list.length}</span></div>
<div class="prog"><i style="width:${c.idx / c.list.length * 100}%"></i></div>
<div class="q"><span class="tag${q.t === "cas" ? " cas" : ""}">${TYPE[q.t]}</span>${c.kind === "c" ? `<span class="tag">Unité ${esc(c.list[c.idx][0])}</span>` : ""}<div class="qtxt">${esc(q.p)}</div></div>
<div class="opts">${order.map(i => `<button class="opt" data-pick="${i}">${esc(q.o[i])}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div>`;
}
function pick(i){
  const c = cur, q = Q(c.list[c.idx]), ok = i === 0;
  app.querySelectorAll(".opt").forEach(b => { b.disabled = true; const k = +b.dataset.pick; if (k === 0) b.classList.add("ok"); else if (k === i) b.classList.add("ko"); });
  c.res.push({it:c.list[c.idx], ok, pick:i}); c.idx++;
  const last = c.idx >= c.list.length;
  $("fb").innerHTML = `<div class="verdict ${ok ? "good" : "bad"}">${ok ? "Bonne réponse" : "Mauvaise réponse"}</div><div class="expl">${esc(q.e)}</div><div class="toolbar"><button class="btn solid" data-next>${last ? "Voir mon résultat" : "Question suivante"}</button></div>`;
}
let lastWrong = null;
function end(){
  const c = cur, n = c.res.length, ok = c.res.filter(r => r.ok).length, pct = Math.round(ok / n * 100);
  if (c.kind === "u" && !c.err) S.u[c.ref] = Math.max(S.u[c.ref] || 0, ok);
  if (c.kind === "c") S.c[c.ref] = Math.max(S.c[c.ref] || 0, ok);
  save();
  const wrong = c.res.filter(r => !r.ok); lastWrong = wrong.map(r => r.it);
  let nextU = null;
  if (c.kind === "u") { const i = UNITS.findIndex(U => U.id === c.ref); nextU = UNITS.slice(i + 1).find(ready); }
  setView("end", "Résultat");
  let h = `<div class="end"><p class="score">${ok}/${n}</p><p class="meta">${pct} % de bonnes réponses${pct >= 80 ? " : objectif atteint" : " : objectif 80 %"}</p>
<div class="toolbar">${wrong.length ? `<button class="btn solid" data-errs>Refaire mes ${wrong.length} erreur${wrong.length > 1 ? "s" : ""}</button>` : ""}<button class="btn" data-again>Recommencer</button>${nextU ? `<button class="btn" data-fiche="${esc(nextU.id)}">Unité suivante</button>` : ""}<button class="btn" data-home>Sommaire</button></div></div>`;
  if (wrong.length) {
    h += `<h2>Correction</h2>`;
    wrong.forEach(r => { const q = Q(r.it); h += `<div class="corr"><div class="qtxt">${esc(q.p)}</div><div class="cbad">Ta réponse : ${esc(q.o[r.pick])}</div><div class="cgood">Bonne réponse : ${esc(q.o[0])}</div><div class="expl">${esc(q.e)}</div></div>`; });
  }
  app.innerHTML = h;
  cur.done = true;
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.fiche) return fiche(uById(d.fiche));
  if (d.quiz) return quizUnit(uById(d.quiz));
  if (d.exam) return examChap(CHAPS.find(C => C.key === d.exam));
  if ("pick" in d) return pick(+d.pick);
  if ("next" in d) return renderQ();
  if ("errs" in d) { const k = cur.kind, r = cur.ref; start(k, r, shuffle(lastWrong)); cur.err = true; return; }
  if ("again" in d) { return cur.kind === "u" ? quizUnit(uById(cur.ref)) : examChap(CHAPS.find(C => C.key === cur.ref)); }
  if ("home" in d) return home();
  if ("reset" in d) {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirmer : tout effacer"; setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = "Effacer ma progression"; } }, 4000); return; }
    S = {u:{}, c:{}}; save(); return home();
  }
});
$("homeBtn").addEventListener("click", home);
home();
})();
</script>
